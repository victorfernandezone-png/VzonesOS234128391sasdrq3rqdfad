lid var(--b2);\n        display:flex;align-items:center;justify-content:center;\n        cursor:grab;font-size:14px;color:var(--tx2);letter-spacing:1px;\n        box-shadow:0 2px 8px rgba(0,0,0,.12);user-select:none;z-index:10;\n        transition:background .12s,color .12s,box-shadow .12s;\n      }\n      .vs-multi-handle:hover{background:var(--accent,#4757e0);color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(45,91,227,.35);cursor:grab}\n      .vs-multi-handle:active{cursor:grabbing;transform:translateY(-50%) scale(.95)}\n    `;\n    document.head.appendChild(st);\n  }\n\n  // Lasso rect in body (fixed positioning — no scroll offset issues)\n  let lassoRect = document.getElementById('vsLassoRect');\n  if(!lassoRect){\n    lassoRect = document.createElement('div');\n    lassoRect.id = 'vsLassoRect';\n    document.body.appendChild(lassoRect);\n  }\n\n  scroll.addEventListener('mousedown', e=>{\n    // Skip if clicking ON a block element or button\n    if(e.button !== 0) return;\n    const onBlock    = e.target.closest('.vs-section');\n    const onToolbar  = e.target.closest('.vs-sidetb');\n    const onCover    = e.target.closest('.vs-cover');\n    const onTitle    = e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON';\n    if(onBlock || onToolbar || onCover || onTitle) return;\n\n    // Block ALL native browser selection during lasso drag\n    e.preventDefault();\n    scroll.style.userSelect = 'none';\n    scroll.style.webkitUserSelect = 'none';\n    _vsClearMultiSelect();\n\n    // Use fixed (viewport) coords for the rect — simplest approach\n    let startX = e.clientX;\n    let startY = e.clientY;\n    _vsLasso.active = true;\n\n    lassoRect.style.cssText = `display:block;left:${startX}px;top:${startY}px;width:0;height:0`;\n\n    const mm = ev=>{\n      if(!_vsLasso.active) return;\n      const x = Math.min(startX, ev.clientX);\n      const y = Math.min(startY, ev.clientY);\n      const w = Math.abs(ev.clientX - startX);\n      const h = Math.abs(ev.clientY - startY);\n      lassoRect.style.left  = x + 'px';\n      lassoRect.style.top   = y + 'px';\n      lassoRect.style.width = w + 'px';\n      lassoRect.style.height= h + 'px';\n\n      if(w > 6 || h > 6){\n        _vsMultiSelected.clear();\n        document.querySelectorAll('.vs-section').forEach(sec=>{\n          // All coords in viewport space — no conversion needed\n          const sr = sec.getBoundingClientRect();\n          const hit = x < sr.right && x+w > sr.left && y < sr.bottom && y+h > sr.top;\n          sec.classList.toggle('vs-multi-sel', hit);\n          if(hit) _vsMultiSelected.add(sec.dataset.sid);\n        });\n      }\n    };\n\n    const mu = ()=>{\n      document.removeEventListener('mousemove', mm);\n      document.removeEventListener('mouseup', mu);\n      lassoRect.style.display = 'none';\n      _vsLasso.active = false;\n      // Restore selection capability\n      scroll.style.userSelect = '';\n      scroll.style.webkitUserSelect = '';\n      if(_vsMultiSelected.size > 0) _vsShowMultiToolbar();\n    };\n    document.addEventListener('mousemove', mm);\n    document.addEventListener('mouseup', mu);\n  });\n}\n\nfunction _vsClearMultiSelect(){\n  document.querySelectorAll('.vs-multi-handle').forEach(h=>h.remove());\n  document.querySelectorAll('.vs-multi-sel').forEach(el=>el.classList.remove('vs-multi-sel'));\n  _vsMultiSelected.clear();\n  _vsHideMultiToolbar();\n}\n\nfunction _vsShowMultiToolbar(){\n  _vsHideMultiToolbar();\n\n  // Single drag handle on the FIRST selected block only\n  const container = document.getElementById('vsSections');\n  if(container){\n    const allSecs = [...container.querySelectorAll('.vs-section')];\n    const firstSel = allSecs.find(el=>_vsMultiSelected.has(el.dataset.sid));\n    if(firstSel && !firstSel.querySelector('.vs-multi-handle')){\n      const h = document.createElement('div');\n      h.className = 'vs-multi-handle';\n      h.innerHTML = '⠿';\n      h.title = 'Arrastrar bloques seleccionados';\n      h.addEventListener('mousedown', e=>vsMultiDrag(e));\n      firstSel.appendChild(h);\n    }\n  }\n\n  // Bottom toolbar\n  const tb = document.createElement('div');\n  tb.className = 'vs-multi-sel-toolbar';\n  tb.id = 'vsMultiTb';\n  tb.innerHTML = `\n    <span style=\"opacity:.7\">${_vsMultiSelected.size} bloque${_vsMultiSelected.size!==1?'s':''}<\u002Fspan>\n    <button class=\"danger\" onclick=\"vsDeleteMultiSelected()\">🗑 Eliminar<\u002Fbutton>\n    <button onclick=\"_vsClearMultiSelect()\">✕<\u002Fbutton>`;\n  document.body.appendChild(tb);\n}\n\nfunction _vsHideMultiToolbar(){\n  document.getElementById('vsMultiTb')?.remove();\n}\n\nfunction vsMultiDrag(e){\n  e.preventDefault();\n  const sids = [..._vsMultiSelected];\n  if(!sids.length) return;\n\n  // Collect DOM elements in current order\n  const container = document.getElementById('vsSections');\n  if(!container) return;\n\n  // Snapshot: list of {el, clone} in current DOM order\n  const allSecs = [...container.querySelectorAll('.vs-section')];\n  const selEls = allSecs.filter(el=>sids.includes(el.dataset.sid));\n  if(!selEls.length) return;\n\n  // Create a single ghost that represents the group\n  const firstRect = selEls[0].getBoundingClientRect();\n  const ghost = document.createElement('div');\n  ghost.style.cssText = `position:fixed;left:${e.clientX+12}px;top:${e.clientY-14}px;\n    min-width:160px;background:var(--surface);border:.5px solid var(--b2);\n    border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.22);opacity:.9;pointer-events:none;\n    z-index:900;padding:8px 14px;font-size:12px;color:var(--tx2);font-family:var(--font);\n    display:flex;align-items:center;gap:8px`;\n  ghost.innerHTML = `<span style=\"font-size:15px;opacity:.5\">⠿<\u002Fspan><span>${selEls.length} bloque${selEls.length!==1?'s':''} seleccionado${selEls.length!==1?'s':''}<\u002Fspan>`;\n  document.body.appendChild(ghost);\n\n  // Dim selected blocks\n  selEls.forEach(el=>el.style.opacity='.28');\n\n  const scroll = document.getElementById('vsScroll');\n  const startY = e.clientY;\n  let _dropLine = null;\n  let _targetEl = null;\n  let _insertAfter = false;\n\n  const mm = ev=>{\n    ghost.style.top = (ev.clientY - 14) + 'px';\n    ghost.style.left = (ev.clientX + 12) + 'px';\n\n    if(_dropLine){ _dropLine.remove(); _dropLine=null; }\n\n    // Find target section under cursor (not one of selected)\n    ghost.style.display='none';\n    const under = document.elementFromPoint(ev.clientX, ev.clientY);\n    ghost.style.display='';\n    const tgt = under?.closest?.('.vs-section');\n    if(tgt && !sids.includes(tgt.dataset.sid)){\n      _targetEl = tgt;\n      const tr = tgt.getBoundingClientRect();\n      _insertAfter = ev.clientY > tr.top + tr.height * 0.5;\n      _dropLine = document.createElement('div');\n      _dropLine.style.cssText='height:2.5px;border-radius:2px;background:var(--accent,#4757e0);margin:2px 0;pointer-events:none;';\n      if(_insertAfter) tgt.after(_dropLine);\n      else tgt.before(_dropLine);\n    } else {\n      _targetEl = null;\n    }\n  };\n\n  const mu = ()=>{\n    document.removeEventListener('mousemove', mm);\n    document.removeEventListener('mouseup', mu);\n    ghost.remove();\n    if(_dropLine){ _dropLine.remove(); _dropLine=null; }\n    selEls.forEach(el=>el.style.opacity='');\n\n    if(_targetEl){\n      const tgtId = _targetEl.dataset.sid;\n      const arr = vsData.sections;\n\n      // Get ordered list of sids to move (in DOM order)\n      const sidsSet = new Set(sids);\n      const orderedSids = allSecs.filter(el=>sidsSet.has(el.dataset.sid)).map(el=>el.dataset.sid);\n      // Remove them from arr\n      const moved = orderedSids.map(sid=>arr.find(s=>s.id===sid)).filter(Boolean);\n      const remaining = arr.filter(s=>!sidsSet.has(s.id));\n      // Find insert position\n      const tgtIdx = remaining.findIndex(s=>s.id===tgtId);\n      const insertAt = _insertAfter ? tgtIdx+1 : tgtIdx;\n      remaining.splice(insertAt, 0, ...moved);\n      vsData.sections = remaining;\n      saveVision();\n\n      // Re-render\n      container.innerHTML = vsData.sections.map((s,i)=>vsRenderSection(s,i)).join('');\n      container.querySelectorAll('textarea').forEach(t=>autoR(t));\n      vsBindDrag();\n      _vsTrackFocus();\n\n      // Re-apply selection highlight\n      _vsMultiSelected.forEach(sid=>{\n        const el = document.getElementById('vssec-'+sid);\n        if(el) el.classList.add('vs-multi-sel');\n      });\n      _vsHideMultiToolbar();\n      _vsShowMultiToolbar();\n    }\n  };\n\n  document.addEventListener('mousemove', mm);\n  document.addEventListener('mouseup', mu);\n}\n\nfunction vsDeleteMultiSelected(){\n  if(!_vsMultiSelected.size) return;\n  vsData.sections = vsData.sections.filter(s=>!_vsMultiSelected.has(s.id));\n  saveVision();\n  _vsMultiSelected.forEach(sid=>{\n    document.getElementById('vssec-'+sid)?.remove();\n  });\n  _vsClearMultiSelect();\n  showToast(`Eliminados ${_vsMultiSelected.size} bloques`);\n}\n\n// Extend existing key handler to also handle multi-select delete\n// (will be patched into _vsKeyHandler below)\n\n// ── DRAG & DROP — mouse-based for reliability ────────\nlet _vsDrag={active:false,sid:null,ghost:null,overEl:null,startY:0,startX:0};\n\nfunction vsBindDrag(){\n  document.querySelectorAll('.vs-section').forEach(el=>{\n    el.removeEventListener('dragstart',_vsDragStart);\n    el.removeAttribute('draggable');\n  });\n  _vsInitLasso();\n  _vsTrackFocus();\n}\n\n// Called from handle's onmousedown\nfunction vsStartDrag(e,sid){\n  e.preventDefault();\n  e.stopPropagation();\n  // Also select the block\n  vsSelectBlock(sid);\n\n  const srcEl=document.getElementById('vssec-'+sid);\n  if(!srcEl) return;\n\n  // Create a floating ghost copy\n  const rect=srcEl.getBoundingClientRect();\n  const ghost=srcEl.cloneNode(true);\n  ghost.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;\n    opacity:.75;pointer-events:none;z-index:800;border-radius:8px;\n    box-shadow:0 8px 32px rgba(0,0,0,.25);background:var(--surface);\n    border:.5px solid var(--b2);transform:scale(1.02);transition:transform .1s`;\n  document.body.appendChild(ghost);\n\n  srcEl.classList.add('vs-drag-ghost');\n\n  _vsDrag={active:true,sid,ghost,srcEl,overEl:null,\n    startY:e.clientY,startX:e.clientX,\n    offsetY:e.clientY-rect.top,offsetX:e.clientX-rect.left};\n\n  let _autoScrollFrame=null;\n  const SCROLL_ZONE=80;   // px from edge that triggers scroll\n  const SCROLL_SPEED=14;  // px per frame\n\n  function _autoScroll(clientY){\n    const scroll=document.getElementById('vsScroll');\n    if(!scroll){_autoScrollFrame=null;return;}\n    const rect=scroll.getBoundingClientRect();\n    const distTop=clientY-rect.top;\n    const distBot=rect.bottom-clientY;\n    let delta=0;\n    if(distTop<SCROLL_ZONE) delta=-Math.round(SCROLL_SPEED*(1-distTop/SCROLL_ZONE));\n    else if(distBot<SCROLL_ZONE) delta=Math.round(SCROLL_SPEED*(1-distBot/SCROLL_ZONE));\n    if(delta!==0){\n      scroll.scrollTop+=delta;\n      _autoScrollFrame=requestAnimationFrame(()=>_autoScroll(_vsDrag._lastY||clientY));\n    } else {\n      _autoScrollFrame=null;\n    }\n  }\n\n  const _mm=ev=>{\n    if(!_vsDrag.active) return;\n    _vsDrag._lastY=ev.clientY;\n    // Move ghost\n    ghost.style.left=(ev.clientX-_vsDrag.offsetX)+'px';\n    ghost.style.top=(ev.clientY-_vsDrag.offsetY)+'px';\n\n    // Auto-scroll: trigger near top/bottom of scroll container\n    if(!_autoScrollFrame) _autoScroll(ev.clientY);\n\n    // Find target section under cursor (ignore ghost)\n    ghost.style.display='none';\n    const under=document.elementFromPoint(ev.clientX,ev.clientY);\n    ghost.style.display='';\n    const targetSec=under?.closest?.('.vs-section');\n\n    // Clear old indicators\n    document.querySelectorAll('.vs-drag-over-line').forEach(l=>l.remove());\n\n    if(targetSec&&targetSec!==srcEl){\n      _vsDrag.overEl=targetSec;\n      const tr=targetSec.getBoundingClientRect();\n      const isTop=ev.clientY<tr.top+tr.height/2;\n      const line=document.createElement('div');\n      line.className='vs-drag-over-line vis';\n      if(isTop) targetSec.before(line);\n      else targetSec.after(line);\n      _vsDrag.isTop=isTop;\n    } else {\n      _vsDrag.overEl=null;\n    }\n  };\n\n  const _mu=ev=>{\n    document.removeEventListener('mousemove',_mm);\n    document.removeEventListener('mouseup',_mu);\n    if(_autoScrollFrame){cancelAnimationFrame(_autoScrollFrame);_autoScrollFrame=null;}\n    ghost.remove();\n    document.querySelectorAll('.vs-drag-over-line').forEach(l=>l.remove());\n    srcEl.classList.remove('vs-drag-ghost');\n\n    if(_vsDrag.overEl&&_vsDrag.overEl!==srcEl){\n      const tgtId=_vsDrag.overEl.dataset.sid;\n      const arr=vsData.sections;\n      const srcIdx=arr.findIndex(s=>s.id===_vsDrag.sid);\n      const tgtIdx=arr.findIndex(s=>s.id===tgtId);\n      if(srcIdx>=0&&tgtIdx>=0){\n        const [moved]=arr.splice(srcIdx,1);\n        const newTgtIdx=arr.findIndex(s=>s.id===tgtId);\n        arr.splice(_vsDrag.isTop?newTgtIdx:newTgtIdx+1,0,moved);\n        saveVision();\n        const container=document.getElementById('vsSections');\n        if(container){\n          container.innerHTML=vsData.sections.map((s,i)=>vsRenderSection(s,i)).join('');\n          container.querySelectorAll('textarea').forEach(t=>autoR(t));\n          vsBindDrag();\n        }\n      }\n    }\n    _vsDrag={active:false,sid:null,ghost:null,overEl:null};\n  };\n\n  document.addEventListener('mousemove',_mm);\n  document.addEventListener('mouseup',_mu);\n}\n\n// Old HTML5 stubs — kept empty so no errors if called\nfunction _vsDragStart(){}\nfunction _vsDragOver(e){e.preventDefault();}\nfunction _vsDragLeave(){}\nfunction _vsDrop(e){e.preventDefault();}\nfunction _vsDragEnd(){}\n\n// Bullets\nfunction vsSaveBullet(sid,bi,val){\n  const s=vsData.sections.find(x=>x.id===sid);\n  if(s&&s.items) s.items[bi]=val;saveVision();\n}\nfunction vsAddBullet(sid){\n  const s=vsData.sections.find(x=>x.id===sid);\n  if(!s){return;}\n  if(!s.items) s.items=[];\n  s.items.push('');saveVision();\n  _vsRefreshSection(sid);\n  setTimeout(()=>{\n    const ne=document.getElementById(`vssec-${sid}`);\n    if(ne){const inputs=ne.querySelectorAll('.vs-bullet-inp');if(inputs.length)inputs[inputs.length-1].focus();}\n  },30);\n}\nfunction vsDelBullet(sid,bi){\n  const s=vsData.sections.find(x=>x.id===sid);\n  if(!s||!s.items) return;\n  s.items.splice(bi,1);saveVision();_vsRefreshSection(sid);\n}\nfunction vsBulletKey(e,sid,bi){\n  if(e.key==='Enter'){\n    e.preventDefault();\n    const s=vsData.sections.find(x=>x.id===sid);\n    if(!s) return;\n    s.items.splice(bi+1,0,'');saveVision();\n    _vsRefreshSection(sid);\n    setTimeout(()=>{\n      const ne=document.getElementById(`vssec-${sid}`);\n      if(ne){const inputs=ne.querySelectorAll('.vs-bullet-inp');if(inputs[bi+1])inputs[bi+1].focus();}\n    },30);\n  }\n}\nfunction _vsRefreshSection(sid){\n  const s=vsData.sections.find(x=>x.id===sid);\n  if(!s) return;\n  const el=document.getElementById(`vssec-${sid}`);\n  if(!el) return;\n  const tmp=document.createElement('div');\n  tmp.innerHTML=vsRenderSection(s,vsData.sections.indexOf(s));\n  el.replaceWith(tmp.firstChild);\n  document.querySelectorAll('#vsSections textarea').forEach(t=>autoR(t));\n  vsBindDrag();\n}\n\n// Media\nfunction vsPickMedia(sid,mi){document.getElementById(`vsmf-${sid}-${mi}`)?.click();}\nfunction vsMediaLoad(e,sid,mi){\n  const file=e.target.files[0];if(!file) return;\n  const isVid=file.type.startsWith('video/');\n  const reader=new FileReader();\n  reader.onload=ev=>{\n    const s=vsData.sections.find(x=>x.id===sid);if(!s) return;\n    if(!s.media) s.media=[];\n    const item={src:ev.target.result,type:isVid?'video':'image',caption:''};\n    if(mi>=s.media.length) s.media.push(item);else s.media[mi]=item;\n    saveVision();_vsRefreshSection(sid);\n  };\n  reader.readAsDataURL(file);e.target.value='';\n}\nfunction vsDelMedia(sid,mi){\n  const s=vsData.sections.find(x=>x.id===sid);\n  if(!s||!s.media) return;\n  s.media.splice(mi,1);saveVision();_vsRefreshSection(sid);\n}\nfunction vsMediaCaption(sid,mi,val){\n  const s=vsData.sections.find(x=>x.id===sid);\n  if(s&&s.media&&s.media[mi]) s.media[mi].caption=val;saveVision();\n}\nfunction vsCoverUpload(){document.getElementById('vsCoverInp')?.click();}\nfunction vsCoverLoad(e){\n  const f=e.target.files[0];if(!f) return;\n  const r=new FileReader();\n  r.onload=ev=>{vsData.cover=ev.target.result;vsData._coverPos=50;saveVision();renderVision();};\n  r.readAsDataURL(f);e.target.value='';\n}\nfunction vsCoverRemove(){\n  vsData.cover='';vsData._coverPos=50;saveVision();renderVision();\n}\n\n// ── COVER REPOSITION (drag up/down to move image) ────\nlet _vsCoverDrag={active:false,startY:0,startPos:0};\nfunction vsCoverBindDrag(){\n  const cover=document.getElementById('vsCover');\n  if(!cover||!vsData.cover) return;\n  cover.addEventListener('mousedown',_vsCoverMD);\n}\nfunction vsCoverReposition(){\n  const cover=document.getElementById('vsCover');\n  const btn=document.getElementById('vsCoverReposBtn');\n  if(!cover) return;\n  // Toggle reposition mode hint\n  const isActive=cover.dataset.reposMode==='1';\n  if(isActive){\n    cover.dataset.reposMode='0';\n    if(btn) btn.textContent='✋ Reposicionar';\n    cover.style.cursor='';\n  } else {\n    cover.dataset.reposMode='1';\n    if(btn) btn.textContent='✓ Listo';\n    cover.style.cursor='ns-resize';\n    showToast('Arrastra la portada arriba/abajo para reposicionarla');\n  }\n}\nfunction _vsCoverMD(e){\n  const cover=document.getElementById('vsCover');\n  if(!cover||cover.dataset.reposMode!=='1') return;\n  if(e.target.closest('.vs-cover-controls')) return;\n  e.preventDefault();\n  const img=document.getElementById('vsCoverImg');\n  const pos=vsData._coverPos||50;\n  _vsCoverDrag={active:true,startY:e.clientY,startPos:pos};\n  cover.classList.add('dragging');\n\n  const _mm=ev=>{\n    if(!_vsCoverDrag.active) return;\n    const dy=ev.clientY-_vsCoverDrag.startY;\n    // Map drag distance to % position (dragging down = shows more top = lower %)\n    const coverH=cover.offsetHeight;\n    const imgEl=document.getElementById('vsCoverImg');\n    if(!imgEl) return;\n    // sensitivity: full height drag = ~60% shift\n    const newPos=Math.max(0,Math.min(100,_vsCoverDrag.startPos - (dy/coverH)*100));\n    vsData._coverPos=Math.round(newPos);\n    imgEl.style.objectPosition=`center ${vsData._coverPos}%`;\n  };\n  const _mu=()=>{\n    document.removeEventListener('mousemove',_mm);\n    document.removeEventListener('mouseup',_mu);\n    _vsCoverDrag.active=false;\n    cover.classList.remove('dragging');\n    saveVision();\n  };\n  document.addEventListener('mousemove',_mm);\n  document.addEventListener('mouseup',_mu);\n}\n\n// ── PAGE WIDTH TOGGLE ────────────────────────────────\nfunction vsToggleWidth(){\n  vsData._fullWidth=!vsData._fullWidth;\n  saveVision();\n  // Toggle class on page element without full re-render\n  const page=document.getElementById('vsPage');\n  const btn=document.getElementById('vsWidthBtn');\n  if(page){\n    page.classList.toggle('full-width',!!vsData._fullWidth);\n  }\n  if(btn){\n    btn.className=`vs-width-btn${vsData._fullWidth?' full':''}`;\n    btn.innerHTML=`<svg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" viewBox=\"0 0 14 14\"><path d=\"M1 7h12M1 4h3M10 4h3M1 10h3M10 10h3\"/><\u002Fsvg>\n      ${vsData._fullWidth?'Ancho completo ✓':'Ancho normal'}`;\n  }\n}\nfunction vsPickCalloutIcon(sid){\n  const s=vsData.sections.find(x=>x.id===sid);if(!s) return;\n  const em=prompt('Emoji:',s.icon||'💡');\n  if(em!==null){s.icon=em||'💡';saveVision();\n    const el=document.querySelector(`#vssec-${sid} .vs-callout-icon`);\n    if(el) el.textContent=s.icon;\n  }\n}\n\n// ── LIGHTBOX ──────────────────────────────────────────\nfunction vsLbOpen(sid,mi){\n  const s=vsData.sections.find(x=>x.id===sid);\n  if(!s||!s.media||!s.media[mi]) return;\n  _vsLbItems=s.media;\n  _vsLbIdx=mi;\n  vsLbShow();\n  document.getElementById('vsLightbox').classList.add('open');\n}\nfunction vsLbShow(){\n  const m=_vsLbItems[_vsLbIdx];if(!m) return;\n  const cont=document.getElementById('vsLbContent');\n  if(m.type==='video'){\n    cont.innerHTML=`<video src=\"${m.src}\" controls autoplay style=\"max-width:90vw;max-height:88vh;border-radius:8px\"><\u002Fvideo>`;\n  } else {\n    cont.innerHTML=`<img src=\"${m.src}\" alt=\"${esc(m.caption||'')}\">`;\n  }\n}\nfunction vsLbClose(){document.getElementById('vsLightbox').classList.remove('open');const cont=document.getElementById('vsLbContent');if(cont)cont.innerHTML='';}\nfunction vsLbNav(dir){\n  _vsLbIdx=(_vsLbIdx+dir+_vsLbItems.length)%_vsLbItems.length;\n  vsLbShow();\n}\ndocument.addEventListener('keydown',e=>{\n  const lb=document.getElementById('vsLightbox');\n  if(lb&&lb.classList.contains('open')){\n    if(e.key==='ArrowRight') vsLbNav(1);\n    else if(e.key==='ArrowLeft') vsLbNav(-1);\n    else if(e.key==='Escape') vsLbClose();\n  }\n});\n\n\n// ══════════════════════════════════════════════════════\n// DOCUMENTOS — Gallery + Block editor (Notion-style)\n// ══════════════════════════════════════════════════════\nconst DOCS_IDB_KEY = 'sp6_docs';\nlet docsData = []; // [{id, title, emoji, color, tags, blocks, created, updated}]\nlet _docsPageId = null; // currently open page id\nlet _docsFilterTag = 'all';\nlet _docsSearch = '';\nlet _docsLoaded = false;\nlet _docsView = 'grid'; // 'grid' | 'list' | 'calendar'\n\nconst DOCS_COVER_COLORS = [\n  '#4757e0','#8b7cf6','var(--red)','#43a873','var(--gold)','#5a93d4',\n  '#e2786e','#4fb0ac','#8b7cf6','#c2a23a','#43a873','#3d3a35'\n];\n\nasync function docsLoad(){\n  const saved = await idbRead(DOCS_IDB_KEY, []);\n  docsData = Array.isArray(saved) ? saved : [];\n  _docsLoaded = true;\n}\nfunction docsSave(){\n  idbWrite(DOCS_IDB_KEY, docsData).catch(e=>console.error('[VictorOS] docsSave',e));\n}\nfunction docsNid(){\n  return 'doc'+Date.now()+Math.random().toString(36).slice(2,5);\n}\n\n// ── RENDER GALLERY ───────────────────────────────────\nconst DOCS_DEFAULT_TEMPLATES=[\n  {id:'tpl-llamada',icon:'📞',label:'Nota de llamada',tags:['llamada'],blocks:[\n    {id:'t1',type:'h1',content:'Nota de llamada'},{id:'t2',type:'text',content:''},\n    {id:'t3',type:'h2',content:'Participantes'},{id:'t4',type:'bullets',items:['']},\n    {id:'t5',type:'h2',content:'Temas tratados'},{id:'t6',type:'bullets',items:['']},\n    {id:'t7',type:'h2',content:'Próximos pasos'},{id:'t8',type:'bullets',items:['']}\n  ]},\n  {id:'tpl-reunion',icon:'🤝',label:'Reunión',tags:['reunión'],blocks:[\n    {id:'t1',type:'h1',content:'Reunión'},{id:'t2',type:'text',content:''},\n    {id:'t3',type:'h2',content:'Agenda'},{id:'t4',type:'bullets',items:['']},\n    {id:'t5',type:'h2',content:'Decisiones'},{id:'t6',type:'bullets',items:['']},\n    {id:'t7',type:'h2',content:'Acciones'},{id:'t8',type:'bullets',items:['']}\n  ]},\n  {id:'tpl-mentoria',icon:'🧠',label:'Mentoría',tags:['mentoría'],blocks:[\n    {id:'t1',type:'h1',content:'Mentoría'},{id:'t2',type:'text',content:''},\n    {id:'t3',type:'h2',content:'Aprendizajes'},{id:'t4',type:'bullets',items:['']},\n    {id:'t5',type:'h2',content:'Acciones'},{id:'t6',type:'bullets',items:['']}\n  ]}\n];\nconst DOCS_TEMPLATES_KEY='sp6_doc_templates';\nlet DOCS_TEMPLATES=JSON.parse(JSON.stringify(DOCS_DEFAULT_TEMPLATES));\nasync function docsLoadTemplates(){\n  try{const saved=await idbRead(DOCS_TEMPLATES_KEY,null);\n    if(saved&&Array.isArray(saved)&&saved.length>0)DOCS_TEMPLATES=saved;\n    else{DOCS_TEMPLATES=JSON.parse(JSON.stringify(DOCS_DEFAULT_TEMPLATES));docsTemplatesSave();}\n  }catch(e){DOCS_TEMPLATES=JSON.parse(JSON.stringify(DOCS_DEFAULT_TEMPLATES));}\n}\nfunction docsTemplatesSave(){\n  idbWrite(DOCS_TEMPLATES_KEY,DOCS_TEMPLATES).catch(()=>{});\n}\n\n\nasync function renderDocsView(){\n  if(!_docsLoaded) await docsLoad().then(()=>docsLoadTemplates());\n  const c = document.getElementById('mainContent');\n\n  // Collect all unique tags\n  const allTags = [...new Set(docsData.flatMap(d=>d.tags||[]))].sort();\n\n  // Filter docs\n  let filtered = docsData;\n  if(_docsFilterTag !== 'all') filtered = filtered.filter(d=>(d.tags||[]).includes(_docsFilterTag));\n  if(_docsSearch.trim()) {\n    const q = _docsSearch.trim().toLowerCase();\n    filtered = filtered.filter(d=>d.title.toLowerCase().includes(q)||(d.tags||[]).some(t=>t.toLowerCase().includes(q)));\n  }\n  // Sort by updated desc\n  filtered = [...filtered].sort((a,b)=>(b.updated||0)-(a.updated||0));\n\n  const tagsHtml = ['all',...allTags].map(tag=>{\n    const active = _docsFilterTag===tag;\n    return `<div class=\"docs-tag-chip${active?' active':''}\" onclick=\"docsSetTag('${esc(tag)}')\">${tag==='all'?'Todos':esc(tag)}<\u002Fdiv>`;\n  }).join('');\n\n  // View toggle icons — thin, minimal SVG\n  const gridIcon=`<svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"1\" width=\"4\" height=\"4\" rx=\".8\"/><rect x=\"7\" y=\"1\" width=\"4\" height=\"4\" rx=\".8\"/><rect x=\"1\" y=\"7\" width=\"4\" height=\"4\" rx=\".8\"/><rect x=\"7\" y=\"7\" width=\"4\" height=\"4\" rx=\".8\"/><\u002Fsvg>`;\n  const listIcon=`<svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\"><line x1=\"1\" y1=\"3.5\" x2=\"11\" y2=\"3.5\"/><line x1=\"1\" y1=\"6\" x2=\"11\" y2=\"6\"/><line x1=\"1\" y1=\"8.5\" x2=\"11\" y2=\"8.5\"/><\u002Fsvg>`;\n  const calIcon=`<svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"2\" width=\"10\" height=\"9\" rx=\"1.2\"/><line x1=\"1\" y1=\"5\" x2=\"11\" y2=\"5\"/><line x1=\"4\" y1=\"1\" x2=\"4\" y2=\"3\"/><line x1=\"8\" y1=\"1\" x2=\"8\" y2=\"3\"/><\u002Fsvg>`;\n\n  // Templates bar\n  const tplHtml=DOCS_TEMPLATES.map((t,i)=>'<div class=\"docs-tpl-chip-wrap\">'+'<div class=\"docs-tpl-chip\" onclick=\"docsNewFromTemplatePick('+i+')\">'+'<span class=\"docs-tpl-icon\">'+esc(t.icon||'📄')+'<\u002Fspan>'+esc(t.label||'Plantilla')+'<\u002Fdiv>'+'<button class=\"docs-tpl-edit-btn\" onclick=\"event.stopPropagation();docsEditTemplate('+i+')\">✎<\u002Fbutton>'+'<\u002Fdiv>').join('')+'<div class=\"docs-tpl-chip docs-tpl-add\" onclick=\"docsNewTemplate()\"><span class=\"docs-tpl-icon\">+<\u002Fspan>Nueva plantilla<\u002Fdiv>';\n\n  // Build content based on view\n  let contentHtml = '';\n  if(_docsView === 'grid'){\n    contentHtml = _docsRenderGridView(filtered);\n  } else if(_docsView === 'list'){\n    contentHtml = _docsRenderListView(filtered);\n  } else if(_docsView === 'calendar'){\n    contentHtml = _docsRenderCalView(filtered);\n  }\n\n  c.innerHTML = `<div class=\"docs-wrap\">\n    <div class=\"docs-topbar\">\n      <div class=\"docs-search-wrap\">\n        <svg width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" viewBox=\"0 0 14 14\"><circle cx=\"6\" cy=\"6\" r=\"4\"/><path d=\"M9.5 9.5L13 13\"/><\u002Fsvg>\n        <input class=\"docs-search-inp\" placeholder=\"Buscar documentos...\" value=\"${esc(_docsSearch)}\"\n          oninput=\"_docsSearch=this.value;renderDocsView()\">\n      <\u002Fdiv>\n      <div class=\"docs-tags-row\">${tagsHtml}<\u002Fdiv>\n      <div class=\"docs-view-toggle\">\n        <button class=\"docs-vt-btn${_docsView==='grid'?' active':''}\" onclick=\"_docsView='grid';renderDocsView()\" title=\"Vista cuadrícula\">${gridIcon}<\u002Fbutton>\n        <button class=\"docs-vt-btn${_docsView==='list'?' active':''}\" onclick=\"_docsView='list';renderDocsView()\" title=\"Vista lista\">${listIcon}<\u002Fbutton>\n        <button class=\"docs-vt-btn${_docsView==='calendar'?' active':''}\" onclick=\"_docsView='calendar';renderDocsView()\" title=\"Vista calendario\">${calIcon}<\u002Fbutton>\n      <\u002Fdiv>\n      <button class=\"docs-add-btn\" onclick=\"docsNewDoc()\">\n        <svg width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" viewBox=\"0 0 12 12\"><line x1=\"6\" y1=\"1\" x2=\"6\" y2=\"11\"/><line x1=\"1\" y1=\"6\" x2=\"11\" y2=\"6\"/><\u002Fsvg>\n        Nuevo\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"docs-templates-row\">${tplHtml}<\u002Fdiv>\n    ${contentHtml}\n  <\u002Fdiv>`;\n}\n\nfunction _docsRenderGridView(filtered){\n  if(filtered.length===0){\n    return `<div class=\"docs-gallery\"><div class=\"docs-empty\">\n      <div class=\"docs-empty-icon\">📄<\u002Fdiv>\n      <div class=\"docs-empty-ttl\">${_docsSearch||_docsFilterTag!=='all'?'Sin resultados':'Sin documentos aún'}<\u002Fdiv>\n      <div class=\"docs-empty-sub\">${_docsSearch||_docsFilterTag!=='all'?'Prueba con otra búsqueda o etiqueta':'Crea tu primer documento pulsando el botón + Nuevo'}<\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>`;\n  }\n  let h = '<div class=\"docs-gallery\"><div class=\"docs-grid\">';\n  filtered.forEach(doc=>{\n    const emoji = doc.emoji||'📄';\n    const cover = doc.color||DOCS_COVER_COLORS[0];\n    const tagsHtmlCard = (doc.tags||[]).slice(0,3).map(t=>`<span class=\"docs-pill-tag\" style=\"background:${cover}22;color:${cover}\">${esc(t)}<\u002Fspan>`).join('');\n    const preview = _docsGetPreview(doc);\n    const dateStr = doc.updated ? new Date(doc.updated).toLocaleDateString('es-ES',{day:'numeric',month:'short'}) : '';\n    h += `<div class=\"docs-card\" onclick=\"docsOpenPage('${doc.id}')\">\n      <div class=\"docs-card-cover\" style=\"background:${cover}22\">\n        <span style=\"font-size:40px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.08))\">${emoji}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"docs-card-body\">\n        <div class=\"docs-card-title\">${esc(doc.title)||'Sin título'}<\u002Fdiv>\n        <div class=\"docs-card-preview\">${esc(preview)}<\u002Fdiv>\n        <div class=\"docs-card-foot\">\n          <span class=\"docs-card-date\">${dateStr}<\u002Fspan>\n          <div class=\"docs-card-tags\">${tagsHtmlCard}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  });\n  h += '<\u002Fdiv><\u002Fdiv>';\n  return h;\n}\n\nfunction _docsRenderListView(filtered){\n  if(filtered.length===0){\n    return `<div class=\"docs-list-view\"><div class=\"docs-empty\">\n      <div class=\"docs-empty-icon\">📄<\u002Fdiv>\n      <div class=\"docs-empty-ttl\">${_docsSearch||_docsFilterTag!=='all'?'Sin resultados':'Sin documentos aún'}<\u002Fdiv>\n      <div class=\"docs-empty-sub\">${_docsSearch||_docsFilterTag!=='all'?'Prueba con otra búsqueda o etiqueta':'Usa las plantillas de arriba o crea tu primer documento'}<\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>`;\n  }\n  // Group by month\n  const groups = new Map();\n  filtered.forEach(doc=>{\n    const d = new Date(doc.updated||doc.created||Date.now());\n    const key = `${d.getFullYear()}-${d.getMonth()}`;\n    const label = MO[d.getMonth()].toUpperCase() + ' DE ' + d.getFullYear();\n    if(!groups.has(key)) groups.set(key, {label, docs:[]});\n    groups.get(key).docs.push(doc);\n  });\n\n  let h = '<div class=\"docs-list-view\">';\n  groups.forEach(({label, docs})=>{\n    h += `<div class=\"docs-month-group\">\n      <div class=\"docs-month-label\">\n        <span class=\"docs-month-label-text\">${label}<\u002Fspan>\n        <span class=\"docs-month-count\">${docs.length} nota${docs.length!==1?'s':''}<\u002Fspan>\n      <\u002Fdiv>`;\n    docs.forEach(doc=>{\n      const d = new Date(doc.updated||doc.created||Date.now());\n      const cover = doc.color||DOCS_COVER_COLORS[0];\n      const preview = _docsGetPreview(doc);\n      const tagsHtmlRow = (doc.tags||[]).slice(0,4).map(t=>`<span class=\"docs-pill-tag\" style=\"background:${cover}22;color:${cover}\">${esc(t)}<\u002Fspan>`).join('');\n      const dayStr = d.getDate().toString().padStart(2,'0');\n      const moStr = MO[d.getMonth()].slice(0,3).toUpperCase();\n      h += `<div class=\"docs-list-row\" onclick=\"docsOpenPage('${doc.id}')\">\n        <div class=\"docs-list-date-block\">\n          <div class=\"docs-list-date-day\">${dayStr}<\u002Fdiv>\n          <div class=\"docs-list-date-mo\">${moStr}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"docs-list-emoji-wrap\" style=\"background:${cover}18\">${doc.emoji||'📄'}<\u002Fdiv>\n        <div class=\"docs-list-content\">\n          <div class=\"docs-list-title\">${esc(doc.title)||'Sin título'}<\u002Fdiv>\n          ${preview?`<div class=\"docs-list-preview\">${esc(preview)}<\u002Fdiv>`:''}\n          ${tagsHtmlRow?`<div class=\"docs-list-tags\">${tagsHtmlRow}<\u002Fdiv>`:''}\n        <\u002Fdiv>\n        <button class=\"docs-list-row-del\" onclick=\"event.stopPropagation();docsDeleteDoc('${doc.id}')\" title=\"Eliminar\">✕<\u002Fbutton>\n      <\u002Fdiv>`;\n    });\n    h += '<\u002Fdiv>';\n  });\n  h += '<\u002Fdiv>';\n  return h;\n}\n\nfunction _docsRenderCalView(filtered){\n  const now = new Date();\n  // Show last 3 months + current\n  const months = [];\n  for(let i=2;i>=0;i--){\n    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);\n    months.push({year:d.getFullYear(), month:d.getMonth()});\n  }\n  // Build lookup: dateKey -> docs[]\n  const byDay = new Map();\n  filtered.forEach(doc=>{\n    const d = new Date(doc.updated||doc.created||Date.now());\n    const key = dk(d);\n    if(!byDay.has(key)) byDay.set(key, []);\n    byDay.get(key).push(doc);\n  });\n\n  const todayKey = dk(new Date());\n  const DOW = ['L','M','X','J','V','S','D'];\n\n  let h = '<div class=\"docs-cal-view\">';\n  months.forEach(({year,month})=>{\n    const monthName = MO[month] + ' ' + year;\n    const firstDay = new Date(year,month,1);\n    const lastDay = new Date(year,month+1,0);\n    const offset = (firstDay.getDay()+6)%7; // Mon=0\n    const total = lastDay.getDate();\n\n    h += `<div class=\"docs-cal-month\"><div class=\"docs-cal-month-hdr\">${monthName}<\u002Fdiv>\n      <div class=\"docs-cal-grid\">`;\n    // Day labels\n    DOW.forEach(d=>{ h+=`<div class=\"docs-cal-dow\">${d}<\u002Fdiv>`; });\n    // Empty cells\n    for(let i=0;i<offset;i++) h+=`<div class=\"docs-cal-day empty\"><\u002Fdiv>`;\n    // Days\n    for(let d=1;d<=total;d++){\n      const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;\n      const isToday = key===todayKey;\n      const dayDocs = byDay.get(key)||[];\n      const cls = `docs-cal-day${isToday?' docs-cal-today':''}${dayDocs.length?' has-docs':''}`;\n      h += `<div class=\"${cls}\">\n        <div class=\"docs-cal-day-num\">${d}<\u002Fdiv>`;\n      dayDocs.slice(0,3).forEach(doc=>{\n        const cover = doc.color||DOCS_COVER_COLORS[0];\n        h += `<div class=\"docs-cal-doc-item\" style=\"background:${cover}22;color:${cover}\" onclick=\"event.stopPropagation();docsOpenPage('${doc.id}')\">${doc.emoji||'📄'} ${esc(doc.title||'Sin título')}<\u002Fdiv>`;\n      });\n      if(dayDocs.length>3) h+=`<div style=\"font-size:9px;color:var(--tx3);padding:0 3px\">+${dayDocs.length-3} más<\u002Fdiv>`;\n      h += `<\u002Fdiv>`;\n    }\n    h += '<\u002Fdiv><\u002Fdiv>';\n  });\n  h += '<\u002Fdiv>';\n  return h;\n}\n\nfunction _docsGetPreview(doc){\n  if(!doc.blocks||!doc.blocks.length) return '';\n  for(const blk of doc.blocks){\n    if(blk.type==='text'||blk.type==='h1'||blk.type==='h2'||blk.type==='h3'||blk.type==='quote'){\n      const txt=(blk.content||'').replace(/<[^>]+>/g,'').trim();\n      if(txt) return txt.slice(0,120);\n    }\n    if(blk.type==='bullets'&&blk.items&&blk.items.length){\n      const txt=(blk.items[0]||'').replace(/<[^>]+>/g,'').trim();\n      if(txt) return txt.slice(0,120);\n    }\n    if(blk.type==='callout'&&blk.content){\n      const txt=(blk.content||'').replace(/<[^>]+>/g,'').trim();\n      if(txt) return txt.slice(0,120);\n    }\n  }\n  return '';\n}\n\nfunction docsSetTag(tag){ _docsFilterTag=tag; renderDocsView(); }\n\nfunction docsNewFromTemplate(tplIdx,dateStr){\n  const tpl=DOCS_TEMPLATES[tplIdx];if(!tpl)return;\n  const ci=Math.floor(Math.random()*DOCS_COVER_COLORS.length);\n  const ts=dateStr?(new Date(dateStr+'T12:00').getTime()||Date.now()):Date.now();\n  const doc={id:docsNid(),title:tpl.label,emoji:tpl.icon,color:DOCS_COVER_COLORS[ci],\n    tags:[...(tpl.tags||[])],\n    blocks:(tpl.blocks||[]).map(b=>({...b,id:'b'+Date.now()+Math.random().toString(36).slice(2,5),items:b.items?[...b.items]:undefined})),\n    created:ts,updated:ts};\n  docsData.unshift(doc);docsSave();docsOpenPage(doc.id);\n}\nfunction docsNewFromTemplatePick(i){\n  const t=DOCS_TEMPLATES[i];if(!t)return;\n  document.getElementById('docsDatePickOv')?.remove();\n  const ov=document.createElement('div');\n  ov.id='docsDatePickOv';\n  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:600';\n  ov.innerHTML='<div style=\"background:var(--surface);border-radius:13px;padding:22px 24px;width:290px;box-shadow:var(--shadow)\">'\n    +'<div style=\"font-size:14px;font-weight:500;margin-bottom:14px\">'+esc(t.icon)+' '+esc(t.label)+'<\u002Fdiv>'\n    +'<div style=\"font-size:10px;font-weight:600;color:var(--tx3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px\">Fecha del documento<\u002Fdiv>'\n    +'<input type=\"date\" id=\"docsTplDateInp\" value=\"'+dk(new Date())+'\" style=\"width:100%;padding:8px 10px;border-radius:7px;border:.5px solid var(--b2);font-family:var(--font);font-size:13px;background:var(--s2);color:var(--tx);outline:none;margin-bottom:14px\">'\n    +'<div style=\"display:flex;gap:7px\">'\n    +'<button onclick=\"document.getElementById(\\'docsDatePickOv\\').remove()\" style=\"flex:1;padding:9px;border-radius:7px;font-family:var(--font);font-size:13px;background:var(--s2);color:var(--tx2);border:.5px solid var(--b2);cursor:pointer\">Cancelar<\u002Fbutton>'\n    +'<button onclick=\"_docsTplCreate('+i+')\" style=\"flex:1;padding:9px;border-radius:7px;font-family:var(--font);font-size:13px;font-weight:500;background:var(--tx);color:var(--surface);border:none;cursor:pointer\">Crear<\u002Fbutton>'\n    +'<\u002Fdiv><\u002Fdiv>';\n  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});\n  document.body.appendChild(ov);\n  setTimeout(()=>document.getElementById('docsTplDateInp')?.focus(),80);\n}\nfunction _docsTplCreate(i){\n  const d=document.getElementById('docsTplDateInp')?.value||null;\n  document.getElementById('docsDatePickOv')?.remove();\n  docsNewFromTemplate(i,d);\n}\nfunction docsNewTemplate(){\n  const t={id:'tpl-'+Date.now(),icon:'📄',label:'Nueva plantilla',tags:[],\n    blocks:[{id:'tb'+Date.now(),type:'h1',content:'Nueva plantilla'}]};\n  DOCS_TEMPLATES.push(t);docsTemplatesSave();docsEditTemplate(DOCS_TEMPLATES.length-1);\n}\n\nfunction docsNewDoc(){\n  const colors = DOCS_COVER_COLORS;\n  const ci = Math.floor(Math.random()*colors.length);\n  const emojis = ['📄','📝','📋','📊','🗒️','💡','🎯','📌','🔖','✨','🚀','📚'];\n  const emoji = emojis[Math.floor(Math.random()*emojis.length)];\n  const doc = {\n    id: docsNid(),\n    title: '',\n    emoji,\n    color: colors[ci],\n    tags: [],\n    blocks: [{id:'b'+Date.now(),type:'text',content:''}],\n    created: Date.now(),\n    updated: Date.now()\n  };\n  docsData.unshift(doc);\n  docsSave();\n  docsOpenPage(doc.id);\n}\n\n// ── TEMPLATE EDITOR ──────────────────────────────────\nfunction docsEditTemplate(ti){\n  const t=DOCS_TEMPLATES[ti];if(!t)return;\n  const ct=document.getElementById('mainContent');\n  ct.style.cssText='padding:0;overflow:hidden;height:calc(100vh - 52px);display:flex;flex-direction:column';\n  const sw=DOCS_COVER_COLORS.map(col=>'<div class=\"docs-cover-sw'+((t.color||'')===col?' sel':'')+'\" style=\"background:'+col+'\" onclick=\"docsTplSetColor('+ti+',\\''+col+'\\')\" ><\u002Fdiv>').join('');\n  const bh=(t.blocks||[]).map((b,i)=>_docsTplBlock(ti,b)).join('');\n  ct.innerHTML='<div class=\"docs-page-overlay\">'\n    +'<div class=\"docs-page-topbar\">'\n    +'<button class=\"docs-page-back\" onclick=\"renderDocsView()\"><svg width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" viewBox=\"0 0 12 12\"><path d=\"M8 1L3 6l5 5\"/><\u002Fsvg>Plantillas<\u002Fbutton>'\n    +'<div class=\"docs-page-title-bar\"><span style=\"font-size:11px;color:var(--tx3)\">&rsaquo;<\u002Fspan><span id=\"docsTplName\">'+esc(t.label||'Sin nombre')+'<\u002Fspan>'\n    +'<span style=\"font-size:10px;color:var(--accent);margin-left:8px;font-weight:700\">PLANTILLA<\u002Fspan><\u002Fdiv>'\n    +'<div class=\"docs-page-actions\"><button class=\"docs-page-btn danger\" onclick=\"docsDeleteTemplate('+ti+')\">Eliminar<\u002Fbutton><\u002Fdiv>'\n    +'<\u002Fdiv>'\n    +'<div class=\"docs-blk-toolbar\">'\n    +'<button class=\"docs-tb-btn\" onclick=\"docsTplAddBlock('+ti+',\\'h1\\')\">H1<\u002Fbutton>'\n    +'<button class=\"docs-tb-btn\" onclick=\"docsTplAddBlock('+ti+',\\'h2\\')\">H2<\u002Fbutton>'\n    +'<button class=\"docs-tb-btn\" onclick=\"docsTplAddBlock('+ti+',\\'h3\\')\">H3<\u002Fbutton>'\n    +'<div class=\"docs-tb-sep\"><\u002Fdiv>'\n    +'<button class=\"docs-tb-btn\" onclick=\"docsTplAddBlock('+ti+',\\'text\\')\">Texto<\u002Fbutton>'\n    +'<button class=\"docs-tb-btn\" onclick=\"docsTplAddBlock('+ti+',\\'bullets\\')\">Lista<\u002Fbutton>'\n    +'<button class=\"docs-tb-btn\" onclick=\"docsTplAddBlock('+ti+',\\'callout\\')\">Nota<\u002Fbutton>'\n    +'<button class=\"docs-tb-btn\" onclick=\"docsTplAddBlock('+ti+',\\'divider\\')\">Divisor<\u002Fbutton>'\n    +'<div class=\"docs-tb-sep\"><\u002Fdiv><span style=\"font-size:11px;color:var(--tx3);padding:0 4px\">Color:<\u002Fspan>'+sw\n    +'<\u002Fdiv>'\n    +'<div class=\"docs-page-scroll\"><div class=\"docs-page-inner\">'\n    +'<div class=\"docs-page-emoji-row\"><span class=\"docs-page-emoji\" id=\"docs et-inp\" rows=\"1\" placeholder=\"\" oninput=\"autoR(this);docsTplBulletSave('+ti+',\\''+b.id+'\\','+ii+',this.value)\">'+esc(it)+'<\u002Ftextarea><\u002Fdiv>').join('');}\n  return '<div class=\"docs-block-section\" id=\"'+id+'\"><div style=\"flex:1;min-width:0\">'+inn+'<\u002Fdiv><button class=\"docs-blk-del\" onclick=\"docsTplDelBlock('+ti+',\\''+b.id+'\\')\">×<\u002Fbutton><\u002Fdiv>';\n}\n\nfunction docsTplBlockSave(ti,bid,v){const t=DOCS_TEMPLATES[ti];if(!t)return;const b=(t.blocks||[]).find(x=>x.id===bid);if(b)b.content=v;docsTemplatesSave();}\nfunction docsTplBulletSave(ti,bid,ii,v){const t=DOCS_TEMPLATES[ti];if(!t)return;const b=(t.blocks||[]).find(x=>x.id===bid);if(b&&b.items)b.items[ii]=v;docsTemplatesSave();}\nfunction docsTplSaveTitle(ti,v){const t=DOCS_TEMPLATES[ti];if(!t)return;t.label=v;docsTemplatesSave();const n=document.getElementById('docsTplName');if(n)n.textContent=v||'Sin nombre';}\nfunction docsTplPickEmoji(ti){const t=DOCS_TEMPLATES[ti];if(!t)return;const e=prompt('Emoji:',t.icon||'📄');if(e!==null){t.icon=e||'📄';docsTemplatesSave();const el=document.getElementById('docsTplEmoji');if(el)el.textContent=t.icon;}}\nfunction docsTplSetColor(ti,col){const t=DOCS_TEMPLATES[ti];if(!t)return;t.color=col;docsTemplatesSave();document.querySelectorAll('.docs-cover-sw').forEach(s=>s.classList.toggle('sel',s.style.background===col||s.style.backgroundColor===col));}\nfunction docsTplAddBlock(ti,type){\n  const t=DOCS_TEMPLATES[ti];if(!t)return;if(!t.blocks)t.blocks=[];\n  const b={id:'tb'+Date.now()+Math.random().toString(36).slice(2,5),type,content:'',items:type==='bullets'?['']:undefined};\n  t.blocks.push(b);docsTemplatesSave();\n  const area=document.getElementById('docsTplArea');\n  if(area){const tmp=document.createElement('div');tmp.innerHTML=_docsTplBlock(ti,b);const el=tmp.firstElementChild;area.appendChild(el);area.querySelectorAll('textarea').forEach(ta=>autoR(ta));}\n}\nfunction docsTplDelBlock(ti,bid){const t=DOCS_TEMPLATES[ti];if(!t)return;t.blocks=(t.blocks||[]).filter(b=>b.id!==bid);docsTemplatesSave();document.getElementById('dtb-'+ti+'-'+bid)?.remove();}\nfunction docsDeleteTemplate(ti){if(!confirm('¿Eliminar esta plantilla?'))return;DOCS_TEMPLATES.splice(ti,1);docsTemplatesSave();renderDocsView();showToast('Plantilla eliminada');}\n\n// ── PAGE EDITOR ──────────────────────────────────────\nfunction docsOpenPage(id){\n  _docsPageId = id;\n  _renderDocsPage();\n}\n\nfunction _renderDocsPage(){\n  const doc = docsData.find(d=>d.id===_docsPageId);\n  if(!doc){_docsPageId=null;renderDocsView();return;}\n\n  const c = document.getElementById('mainContent');\n  c.style.cssText = 'padding:0;overflow:hidden;height:calc(100vh - 52px);display:flex;flex-direction:column';\n\n  // Build tags edit HTML\n  const tagsEditHtml = _docsPageTagsHtml(doc);\n\n  // Build blocks HTML\n  const blocksHtml = _docsRenderBlocks(doc);\n\n  // Color swatches\n  const swatchesHtml = DOCS_COVER_COLORS.map(col=>`<div class=\"docs-cover-sw${doc.color===col?' sel':''}\" style=\"background:${col}\" onclick=\"docsSetColor('${doc.id}','${col}')\"><\u002Fdiv>`).join('');\n\n  c.innerHTML = `<div class=\"docs-page-overlay\">\n    <div class=\"docs-page-topbar\">\n      <button class=\"docs-page-back\" onclick=\"_docsPageId=null;renderDocsView()\">\n        <svg width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" viewBox=\"0 0 12 12\"><path d=\"M8 1L3 6l5 5\"/><\u002Fsvg>\n        Documentos\n      <\u002Fbutton>\n      <div class=\"docs-page-title-bar\">\n        <span style=\"font-size:11px;color:var(--tx3)\">›<\u002Fspan>\n        <span class=\"docs-page-name\">${esc(doc.title)||'Sin título'}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"docs-page-actions\">\n        <button class=\"docs-page-btn danger\" onclick=\"docsDeleteDoc('${doc.id}')\">Eliminar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"docs-blk-toolbar\">\n      <button class=\"docs-tb-btn ocId);\n  if(!doc) return;\n  if(!(doc.tags||[]).includes(tag)){ doc.tags = [...(doc.tags||[]),tag]; }\n  doc.updated = Date.now();\n  docsSave();\n  const el = document.getElementById('docsTagsEdit');\n  if(el) el.innerHTML = _docsPageTagsHtml(doc);\n  _docsBindTagInput(docId);\n}\n\nfunction docsRemoveTag(docId, tag){\n  const doc = docsData.find(d=>d.id===docId);\n  if(!doc) return;\n  doc.tags = (doc.tags||[]).filter(t=>t!==tag);\n  doc.updated = Date.now();\n  docsSave();\n  const el = document.getElementById('docsTagsEdit');\n  if(el) el.innerHTML = _docsPageTagsHtml(doc);\n  _docsBindTagInput(docId);\n  // Also update gallery title\n  const nameEl = document.querySelector('.docs-page-name');\n  if(nameEl) nameEl.textContent = doc.title||'Sin título';\n}\n\nfunction docsSaveTitle(docId, val){\n  const doc = docsData.find(d=>d.id===docId);\n  if(!doc) return;\n  doc.title = val;\n  doc.updated = Date.now();\n  docsSave();\n  const nameEl = document.querySelector('.docs-page-name');\n  if(nameEl) nameEl.textContent = val||'Sin título';\n}\n\nfunction docsPickEmoji(docId){\n  const doc = docsData.find(d=>d.id===docId);\n  if(!doc) return;\n  const em = prompt('Emoji del documento:', doc.emoji||'📄');\n  if(em!==null){\n    doc.emoji = em||'📄';\n    doc.updated = Date.now();\n    docsSave();\n    const el = document.getElementById('docsEmoji');\n    if(el) el.textContent = doc.emoji;\n  }\n}\n\nfunction docsSetColor(docId, color){\n  const doc = docsData.find(d=>d.id===docId);\n  if(!doc) return;\n  doc.color = color;\n  doc.updated = Date.now();\n  docsSave();\n  // Update swatches UI\n  document.querySelectorAll('.docs-cover-sw').forEach(sw=>{\n    sw.classList.toggle('sel', sw.style.background===color||sw.style.backgroundColor===color);\n  });\n}\n\nfunction docsDeleteDoc(docId){\n  if(!confirm('¿Eliminar este documento? Esta acción no se puede deshacer.')) return;\n  docsData = docsData.filter(d=>d.id!==docId);\n  docsSave();\n  _docsPageId = null;\n  renderDocsView();\n  showToast('Documento eliminado');\n}\n\n// ── BLOCK SYSTEM ─────────────────────────────────────\nfunction _docsRenderBlocks(doc){\n  if(!doc.blocks||!doc.blocks.length) return '';\n  return doc.blocks.map((blk,bi)=>_docsRenderBlock(doc.id, blk, bi)).join('');\n}\n\nfunction _docsRenderBlock(docId, blk, bi){\n  const sid = `docssec-${docId}-${blk.id}`;\n  let inner = '';\n  const si = `oninput=\"autoR(this);docsBlockSave('${docId}','${blk.id}','content',this.value)\"`;\n  const ki = `onkeydown=\"docsBlockKey(event,'${docId}','${blk.id}')\"`;\n  const ph = `placeholder=\"\"`;\n\n  if(blk.type==='h1'){\n    inner=`<textarea class=\"docs-blk-h1\" rows=\"1\" ${si} ${ki} ${ph}>${esc(blk.content||'')}<\u002Ftextarea>`;\n  } else if(blk.type==='h2'){\n    inner=`<textarea class=\"docs-blk-h2\" rows=\"1\" ${si} ${ki} ${ph}>${esc(blk.content||'')}<\u002Ftextarea>`;\n  } else if(blk.type==='h3'){\n    inner=`<textarea class=\"docs-blk-h3\" rows=\"1\" ${si} ${ki} ${ph}>${esc(blk.content||'')}<\u002Ftextarea>`;\n  } else if(blk.type==='text'){\n    inner=`<textarea class=\"docs-blk-text\" rows=\"1\" ${si} ${ki} ${ph}>${esc(blk.content||'')}<\u002Ftextarea>`;\n  } else if(blk.type==='quote'){\n    inner=`<textarea class=\"docs-blk-quote\" rows=\"1\" ${si} ${ki} ${ph}>${esc(blk.content||'')}<\u002Ftextarea>`;\n  } else if(blk.type==='callout'){\n    inner=`<div class=\"docs-blk-callout\">\n      <span class=\"docs-blk-callout-icon\" onclick=\"docsPickCalloutIcon('${docId}','${blk.id}')\">${esc(blk.icon||'💡')}<\u002Fspan>\n      <textarea class=\"docs-blk-callout-text\" rows=\"1\" ${si} ${ki} ${ph}>${esc(blk.content||'')}<\u002Ftextarea>\n    <\u002Fdiv>`;\n  } else if(blk.type==='divider'){\n    inner=`<hr class=\"docs-blk-hr\">`;\n  } else if(blk.type==='gallery'){\n    const cols=blk.cols||3;\n    const media=blk.media||[];\n    const slots=[...media,null];\n    const cells=slots.map((m,mi)=>{\n      if(!m) return `<div class=\"vs-media-cell\" onclick=\"docsPickGalleryMedia('${docId}','${blk.id}',${mi})\">\n        <div class=\"vs-media-empty\">\n          <svg width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\" fill=\"currentColor\"/><path d=\"M21 15l-5-5L5 21\"/><\u002Fsvg>\n          <span>Foto / Vídeo<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"file\" class=\"vs-file-inp\" id=\"dgmf-${docId}-${blk.id}-${mi}\" accept=\"image/*,video/*\" onchange=\"docsGalleryLoad(event,'${docId}','${blk.id}',${mi})\">\n      <\u002Fdiv>`;\n      const isVid=m.type==='video';\n      return `<div class=\"vs-media-cell\" onclick=\"docsGalleryLbOpen('${docId}','${blk.id}',${mi})\">\n        ${isVid?`<video src=\"${m.src}\" muted playsinline preload=\"metadata\"><\u002Fvideo>`:`<img src=\"${m.src}\" loading=\"lazy\" alt=\"${esc(m.caption||'')}\">` }\n        <button class=\"vs-media-del\" onclick=\"event.stopPropagation();docsGalleryDel('${docId}','${blk.id}',${mi})\">✕<\u002Fbutton>\n        <input class=\"vs-media-caption\" placeholder=\"Descripción…\" value=\"${esc(m.caption||'')}\" onclick=\"event.stopPropagation()\" onchange=\"docsGalleryCaption('${docId}','${blk.id}',${mi},this.value)\">\n      <\u002Fdiv>`;\n    }).join('');\n    inner=`<div class=\"vs-gallery-hdr\">\n      <span class=\"vs-gallery-lbl\">Galería<\u002Fspan>\n      <div style=\"display:flex;gap:3px\">\n        ${[2,3,4].map(n=>`<button class=\"vs-col-opt${cols===n?' sel':''}\" onclick=\"docsGalleryCols('${docId}','${blk.id}',${n})\">${n}<\u002Fbutton>`).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"vs-gallery cols-${cols}\" id=\"dgal-${docId}-${blk.id}\">${cells}<\u002Fdiv>`;\n  } else if(blk.type==='bullets'){\n    const items = blk.items||[''];\n    inner = items.map((it,ii)=>`<div class=\"docs-blk-bullet-row\">\n      <div class=\"docs-blk-bullet-dot\"><\u002Fdiv>\n      <textarea class=\"docs-blk-bullet-inp\" rows=\"1\" placeholder=\"\"\n        oninput=\"autoR(this);docsBulletSave('${docId}','${blk.id}',${ii},this.value)\"\n        onkeydown=\"docsBulletKey(event,'${docId}','${blk.id}',${ii})\">${esc(it)}<\u002Ftextarea>\n    <\u002Fdiv>`).join('');\n  }\n\n  return `<div class=\"docs-block-section\" id=\"${sid}\" data-docid=\"${docId}\" data-bid=\"${blk.id}\">\n    <div class=\"docs-blk-handle\" onmousedown=\"docsStartDrag(event,'${docId}','${blk.id}')\" title=\"Arrastrar para mover\">⠿<\u002Fdiv>\n    <button class=\"docs-blk-add-here\" onclick=\"docsAddAfterInline(event,'${docId}','${blk.id}')\" title=\"Añadir bloque aquí\">＋<\u002Fbutton>\n    <div style=\"flex:1;min-width:0;position:relative\">${inner}<\u002Fdiv>\n    <button class=\"docs-blk-del\" onclick=\"docsDelBlock('${docId}','${blk.id}')\">✕<\u002Fbutton>\n  <\u002Fdiv>`;\n}\n\n// Track focused block in docs\nlet _docsFocused = {docId:null, bid:null};\n\nfunction _docsTrackFocus(){\n  document.querySelectorAll('.docs-block-section textarea, .docs-block-section input').forEach(el=>{\n    if(el._dftracked) return;\n    el._dftracked = true;\n    el.addEventListener('focus', ()=>{\n      const sec = el.closest('.docs-block-section');\n      if(sec) _docsFocused = {docId: sec.dataset.docid, bid: sec.dataset.bid};\n    });\n  });\n}\n\nfunction docsAddBlock(docId, type){\n  const doc = docsData.find(d=>d.id===docId);\n  if(!doc) return;\n\n  // If a block of this doc is focused and EMPTY → convert it instead of adding new\n  if(_docsFocused.docId === docId && _docsFocused.bid){\n    const focBlk = (doc.blocks||[]).find(b=>b.id===_docsFocused.bid);\n    const isEmpty = focBlk && (\n      (focBlk.type!=='bullets' && !(focBlk.content||'').trim()) ||\n      (focBlk.type==='bullets' && focBlk.items && focBlk.items.length===1 && !focBlk.items[0].trim())\n    );\n    if(focBlk && isEmpty && focBlk.type !== 'gallery' && focBlk.type !== 'divider'){\n      // CONVERT in place\n      docsConvertBlock(docId, focBlk.id, type);\n      return;\n    }\n    // Has content → insert after focused block\n    if(focBlk){\n      docsAddBlockAfter(docId, focBlk.id, type);\n      return;\n    }\n  }\n\n  // Fallback: append to end\n  const blk = {id:'b'+Date.now()+Math.random().toString(36).slice(2,5), type, content:'',\n    items:type==='bullets'?['']:undefined, icon:type==='callout'?'💡':undefined};\n  if(!doc.blocks) doc.blocks=[];\n  doc.blocks.push(blk);\n  doc.updated=Date.now();\n  docsSave();\n  const area = document.getElementById('docsBlocksArea');\n  if(area){\n    const div = document.createElement('div');\n    div.innerHTML = _docsRenderBlock(docId, blk, doc.blocks.length-1);\n    const newEl = div.firstElementChild;\n    area.appendChild(newEl);\n    _docsTrackFocus();\n    setTimeout(()=>{\n      const ta = newEl.querySelector('textarea');\n      if(ta){autoR(ta);ta.focus();}\n    },30);\n  }\n}\n\nfunction docsConvertBlock(docId, bid, newType){\n  const doc = docsData.find(d=>d.id===docId);\n  if(!doc) return;\n  const blk = (doc.blocks||[]).find(b=>b.id===bid);\n  if(!blk) return;\n  blk.type = newType;\n  if(newType==='bullets'){ blk.items = blk.content?[blk.content]:[''];  delete blk.content; }\n  else { blk.content = (blk.items&&blk.items[0])||blk.content||''; delete blk.items; }\n  if(newType==='callout') blk.icon = blk.icon||'💡';\n  doc.updated=Date.now();\n  docsSave();\n  // Re-render just this block in DOM\n  const sec = document.getElementById(`docssec-${docId}-${bid}`);\n  if(sec){\n    const tmp = document.createElement('div');\n    tmp.innerHTML = _docsRenderBlock(docId, blk, 0);\n    sec.replaceWith(tmp.firstElementChild);\n    _docsTrackFocus();\n    setTimeout(()=>{\n      const newSec = document.getElementById(`docssec-${docId}-${bid}`);\n      if(newSec){\n        const ta = newSec.querySelector('textarea');\n        if(ta){ autoR(ta); ta.focus(); ta.selectionStart=ta.selectionEnd=(ta.value||'').length; }\n      }\n    },30);\n  }\n}\n\nfunction docsDelBlock(docId, bid){\n  const doc = docsData.find(d=>d.id===docId);\n  if(!doc) return;\n  doc.blocks = (doc.blocks||[]).filter(b=>b.id!==bid);\n  doc.updated=Date.now();\n  docsSave();\n  const el = document.getElementById(`docssec-${docId}-${bid}`);\n  if(el) el.remove();\n}\n\nfunction docsBlockSave(docId, bid, field, val){\n  const doc = docsData.find(d=>d.id===docId);\n  if(!doc) return;\n  const blk = (doc.blocks||[]).find(b=>b.id===bid);\n  if(blk){ blk[field]=val; doc.updated=Date.now(); docsSave(); }\n}\n\nfunction docsBulletSave(docId, bid, ii, val){\n  const doc = docsData.find(d=>d.id===docId);\n  if(!doc) return;\n  const blk = (doc.blocks||[]).find(b=>b.id===bid);\n  if(blk&&blk.items){ blk.items[ii]=val; doc.updated=Date.now(); docsSave(); }\n}\n\nfunction docsBulletKey(e, docId, bid, ii){\n  if(e.key==='Enter'){\n    e.preventDefault();\n    const doc = docsData.find(d=>d.id===docId);\n    if(!doc) return;\n    const blk = (doc.blocks||[]).find(b=>b.id===bid);\n    if(blk&&blk.items){\n      blk.items.splice(ii+1,0,'');\n      doc.updated=Date.now();\n      docsSave();\n      // Re-render just this block\n      const sec = document.getElementById(`docssec-${docId}-${blk.id}`);\n      if(sec){\n        const newHtml = _docsRenderBlock(docId, blk, 0);\n        const tmp = document.createElement('div');\n        tmp.innerHTML = newHtml;\n        sec.replaceWith(tmp.firstElementChild);\n        setTimeout(()=>{\n          const newSec = document.getElementById(`docssec-${docId}-${blk.id}`);\n          const rows = newSec?newSec.querySelectorAll('.docs-blk-bullet-inp'):[];\n          if(rows[ii+1]){autoR(rows[ii+1]);rows[ii+1].focus();}\n        },30);\n      }\n    }\n  }\n}\n\nfunction docsPickCalloutIcon(docId, bid){\n  const doc = docsData.find(d=>d.id===docId);\n  if(!doc) return;\n  const blk = (doc.blocks||[]).find(b=>b.id===bid);\n  if(!blk) return;\n  const em = prompt('Emoji:', blk.icon||'💡');\n  if(em!==null){\n    blk.icon=em||'💡';\n    doc.updated=Date.now();\n    docsSave();\n    const sec = document.getElementById(`docssec-${docId}-${bid}`);\n    if(sec){\n      const ic=sec.querySelector('.docs-blk-callout-icon');\n      if(ic) ic.textContent=blk.icon;\n    }\n  }\n}\n\n// ── BLOCK DRAG-AND-DROP ──────────────────────────────\nlet _docsDrag={active:false,docId:null,bid:null,ghost:null,overEl:null,isTop:false};\nlet _docsDragDropLine=null;\n\n// ── DOCS LASSO MULTI-SELECT ──────────────────────────\nlet _docsMultiSelected = new Set(); // Set of bids\nlet _docsLassoActive = false;\nlet _docsMultiDocId = null;\n\nfunction _docsInitLasso(docId){\n  const scroll = document.getElementById('docsPageScroll');\n  if(!scroll || scroll._dlassoInited) return;\n  scroll._dlassoInited = true;\n  _docsMultiDocId = docId;\n\n  // Inject CSS once\n  if(!document.getElementById('_docsLassoStyle')){\n    const st = document.createElement('style');\n    st.id = '_docsLassoStyle';\n    st.textContent = `\n      #docsLassoRect{\n        position:fixed;border:1px solid rgba(45,91,227,.3);\n        background:rgba(45,91,227,.05);border-radius:3px;\n        pointer-events:none;z-index:800;display:none;\n      }\n      .docs-block-section.docs-multi-sel{\n        outline:.5px solid rgba(45,91,227,.14);outline-offset:1px;border-radius:5px;\n        background:rgba(45,91,227,.018);\n      }\n      .docs-multi-toolbar{\n        position:fixed;bottom:24px;left:50%;transform:translateX(-50%);\n        background:var(--tx);color:var(--surface);border-radius:10px;padding:9px 18px;\n        display:flex;align-items:center;gap:14px;font-size:12.5px;font-weight:500;\n        box-shadow:0 8px 32px rgba(0,0,0,.28);z-index:900;white-space:nowrap;\n      }\n      .docs-multi-toolbar button{\n        background:rgba(255,255,255,.14);border:none;border-radius:7px;\n        color:inherit;font-size:12px;font-weight:500;padding:5px 12px;\n        cursor:pointer;font-family:var(--font);transition:background .12s;\n      }\n      .docs-multi-toolbar button:hover{background:rgba(255,255,255,.26)}\n      .docs-multi-toolbar button.danger:hover{background:var(--red)}\n      .docs-multi-handle{\n        position:absolute;left:-30px;top:50%;transform:translateY(-50%);\n        width:24px;height:36px;border-radius:6px;\n        background:var(--surface);border:.5px solid var(--b2);\n        display:flex;align-items:center;justify-content:center;\n        cursor:grab;font-size:14px;color:var(--tx2);letter-spacing:1px;\n        box-shadow:0 2px 8px rgba(0,0,0,.12);user-select:none;z-index:10;\n        transition:background .12s,color .12s,box-shadow .12s;\n      }\n      .docs-multi-handle:hover{background:#4757e0;color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(45,91,227,.35);cursor:grab}\n      .docs-multi-handle:active{cursor:grabbing;transform:translateY(-50%) scale(.95)}\n    `;\n    document.head.appendChild(st);\n  }\n\n  let lassoRect = document.getElementById('docsLassoRect');\n  if(!lassoRect){\n    lassoRect = document.createElement('div');\n    lassoRect.id = 'docsLassoRect';\n    document.body.appendChild(lassoRect);\n  }\n\n  scroll.addEventListener('mousedown', e=>{\n    if(e.button !== 0) return;\n    const onBlock = e.target.closest('.docs-block-section');\n    const onToolbar = e.target.closest('.docs-blk-toolbar, .docs-page-topbar');\n    const onTitle = e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON';\n    if(onBlock || onToolbar || onTitle) return;\n\n    e.preventDefault();\n    scroll.style.userSelect='none'; scroll.style.webkitUserSelect='none';\n    _docsClearMultiSelect();\n\n    let startX = e.clientX, startY = e.clientY;\n    _docsLassoActive = true;\n    lassoRect.style.cssText = `display:block;left:${startX}px;top:${startY}px;width:0;height:0`;\n\n    const mm = ev=>{\n      if(!_docsLassoActive) return;\n      const x=Math.min(startX,ev.clientX), y=Math.min(startY,ev.clientY);\n      const w=Math.abs(ev.clientX-startX), h=Math.abs(ev.clientY-startY);\n      lassoRect.style.left=x+'px'; lassoRect.style.top=y+'px';\n      lassoRect.style.width=w+'px'; lassoRect.style.height=h+'px';\n      if(w>6||h>6){\n        _docsMultiSelected.clear();\n        document.querySelectorAll('.docs-block-section').forEach(sec=>{\n          const sr=sec.getBoundingClientRect();\n          const hit=x<sr.right&&x+w>sr.left&&y<sr.bottom&&y+h>sr.top;\n          sec.classList.toggle('docs-multi-sel',hit);\n          if(hit) _docsMultiSelected.add(sec.dataset.bid);\n        });\n      }\n    };\n    const mu=()=>{\n      document.removeEventListener('mousemove',mm);\n      document.removeEventListener('mouseup',mu);\n      lassoRect.style.display='none';\n      _docsLassoActive=false;\n      scroll.style.userSelect=''; scroll.style.webkitUserSelect='';\n      if(_docsMultiSelected.size>0) _docsShowMultiToolbar();\n    };\n    document.addEventListener('mousemove',mm);\n    document.addEventListener('mouseup',mu);\n  });\n\n  // Delete key for docs multi-select\n  document.addEventListener('keydown', e=>{\n    if(curView!=='docs') return;\n    const active=document.activeElement;\n    const inInput=active&&(active.tagName==='TEXTAREA'||active.tagName==='INPUT');\n    if(!inInput && (e.key==='Delete'||e.key==='Backspace') && _docsMultiSelected.size>0){\n      e.preventDefault();\n      docsDeleteMultiSelected();\n    }\n    if(e.key==='Escape' && _docsMultiSelected.size>0) _docsClearMultiSelect();\n  });\n}\n\nfunction _docsClearMultiSelect(){\n  document.querySelectorAll('.docs-multi-handle').forEach(h=>h.remove());\n  document.querySelectorAll('.docs-multi-sel').forEach(el=>el.classList.remove('docs-multi-sel'));\n  _docsMultiSelected.clear();\n  document.getElementById('docsMultiTb')?.remove();\n}\n\nfunction _docsShowMultiToolbar(){\n  document.getElementById('docsMultiTb')?.remove();\n  // Single drag handle on the FIRST selected block only\n  const docsArea=document.getElementById('docsBlocksArea');\n  if(docsArea){\n    const allDocsSecs=[...docsArea.querySelectorAll('.docs-block-section')];\n    const firstDocsSel=allDocsSecs.find(el=>_docsMultiSelected.has(el.dataset.bid));\n    if(firstDocsSel&&!firstDocsSel.querySelector('.docs-multi-handle')){\n      const h=document.createElement('div');\n      h.className='docs-multi-handle'; h.innerHTML='⠿';\n      h.title='Arrastrar bloques seleccionados';\n      h.addEventListener('mousedown',e=>_docsMultiDrag(e));\n      firstDocsSel.style.position='relative';\n      firstDocsSel.appendChild(h);\n    }\n  }\n  const tb=document.createElement('div');\n  tb.className='docs-multi-toolbar'; tb.id='docsMultiTb';\n  tb.innerHTML=`<span style=\"opacity:.7\">${_docsMultiSelected.size} bloque${_docsMultiSelected.size!==1?'s':''}<\u002Fspan>\n    <button class=\"danger\" onclick=\"docsDeleteMultiSelected()\">🗑 Eliminar<\u002Fbutton>\n    <button onclick=\"_docsClearMultiSelect()\">✕<\u002Fbutton>`;\n  document.body.appendChild(tb);\n}\n\nfunction docsDeleteMultiSelected(){\n  if(!_docsMultiDocId||!_docsMultiSelected.size) return;\n  const doc=docsData.find(d=>d.id===_docsMultiDocId);\n  if(!doc) return;\n  doc.blocks=(doc.blocks||[]).filter(b=>!_docsMultiSelected.has(b.id));\n  doc.updated=Date.now(); docsSave();\n  _docsMultiSelected.forEach(bid=>{\n    const el=document.getElementById(`docssec-${_docsMultiDocId}-${bid}`);\n    if(el) el.remove();\n  });\n  _docsClearMultiSelect();\n  showToast('Eliminados');\n}\n\nfunction _docsMultiDrag(e){\n  e.preventDefault();\n  if(!_docsMultiDocId) return;\n  const doc=docsData.find(d=>d.id===_docsMultiDocId);\n  if(!doc) return;\n  const bids=[..._docsMultiSelected];\n  const area=document.getElementById('docsBlocksArea');\n  if(!area) return;\n\n  const allSecs=[...area.querySelectorAll('.docs-block-section')];\n  const selEls=allSecs.filter(el=>bids.includes(el.dataset.bid));\n  if(!selEls.length) return;\n\n  const firstRect=selEls[0].getBoundingClientRect();\n  const ghost=document.createElement('div');\n  ghost.style.cssText=`position:fixed;left:${e.clientX+12}px;top:${e.clientY-14}px;\n    min-width:160px;background:var(--surface);border:.5px solid var(--b2);\n    border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.22);opacity:.9;pointer-events:none;\n    z-index:900;padding:8px 14px;font-size:12px;color:var(--tx2);font-family:var(--font);\n    display:flex;align-items:center;gap:8px`;\n  ghost.innerHTML=`<span style=\"font-size:15px;opacity:.5\">⠿<\u002Fspan><span>${selEls.length} bloque${selEls.length!==1?'s':''} seleccionado${selEls.length!==1?'s':''}<\u002Fspan>`;\n  document.body.appendChild(ghost);\n  selEls.forEach(el=>el.style.opacity='.28');\n\n  let _dropLine=null, _targetEl=null, _insertAfter=false;\n  const mm=ev=>{\n    ghost.style.top=(ev.clientY-14)+'px';\n    ghost.style.left=(ev.clientX+12)+'px';\n    if(_dropLine){_dropLine.remove();_dropLine=null;}\n    ghost.style.display='none';\n    const under=document.elementFromPoint(ev.clientX,ev.clientY);\n    ghost.style.display='';\n    const tgt=under?.closest?.('.docs-block-section');\n    if(tgt&&!bids.includes(tgt.dataset.bid)){\n      _targetEl=tgt;\n      const tr=tgt.getBoundingClientRect();\n      _insertAfter=ev.clientY>tr.top+tr.height*0.5;\n      _dropLine=document.createElement('div');\n      _dropLine.style.cssText='height:2px;border-radius:2px;background:#4757e0;margin:2px 0;pointer-events:none;';\n      if(_insertAfter) tgt.after(_dropLine); else tgt.before(_dropLine);\n    } else { _targetEl=null; }\n  };\n  const mu=()=>{\n    document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu);\n    ghost.remove(); if(_dropLine){_dropLine.remove();_dropLine=null;}\n    selEls.forEach(el=>el.style.opacity='');\n    if(_targetEl){\n      const tgtBid=_targetEl.dataset.bid;\n      const bidsSet=new Set(bids);\n      const orderedBids=allSecs.filter(el=>bidsSet.has(el.dataset.bid)).map(el=>el.dataset.bid);\n      const moved=orderedBids.map(bid=>(doc.blocks||[]).find(b=>b.id===bid)).filter(Boolean);\n      const remaining=(doc.blocks||[]).filter(b=>!bidsSet.has(b.id));\n      const tgtIdx=remaining.findIndex(b=>b.id===tgtBid);\n      const insertAt=_insertAfter?tgtIdx+1:tgtIdx;\n      remaining.splice(insertAt,0,...moved);\n      doc.blocks=remaining; doc.updated=Date.now(); docsSave();\n      // Re-render blocks area\n      area.innerHTML=_docsRenderBlocks(doc);\n      area.querySelectorAll('textarea').forEach(t=>autoR(t));\n      _docsTrackFocus();\n      _docsMultiSelected.forEach(bid=>{\n        const el=document.getElementById(`docssec-${_docsMultiDocId}-${bid}`);\n        if(el) el.classList.add('docs-multi-sel');\n      });\n      document.getElementById('docsMultiTb')?.remove();\n      _docsShowMultiToolbar();\n    }\n  };\n  document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);\n}\n\n\n// ── DOCS INLINE ADD-AFTER (mirrors vsAddAfter / vsInsertAfter) ────\nlet _docsInlinePicker = null;\nfunction _docsCloseInlinePicker(){\n  if(_docsInlinePicker){_docsInlinePicker.remove();_docsInlinePicker=null;}\n}\n\nfunction docsAddAfterInline(e, docId, afterBid){\n  e.stopPropagation();\n  _docsCloseInlinePicker();\n  const btn = e.currentTarget;\n  const rect = btn.getBoundingClientRect();\n\n  const types=[\n    {type:'text',   icon:'¶', label:'Texto'},\n    {type:'h1',     icon:'H1',label:'Título 1'},\n    {type:'h2',     icon:'H2',label:'Título 2'},\n    {type:'h3',     icon:'H3',label:'Título 3'},\n    {type:'bullets',icon:'•', label:'Lista'},\n    {type:'callout',icon:'💡',label:'Callout'},\n    {type:'quote',  icon:'❝', label:'Cita'},\n    {type:'gallery',icon:'⊞', label:'Galería'},\n    {type:'divider',icon:'—', label:'Divisor'},\n  ];\n\n  const picker = document.createElement('div');\n  picker.className = 'vs-inline-picker'; // reuse Vision CSS\n  picker.innerHTML = types.map(t=>`\n    <div class=\"vs-inline-picker-item\" onclick=\"docsInsertAfter('${docId}','${afterBid}','${t.type}')\">\n      <div class=\"vs-inline-picker-icon\">${t.icon}<\u002Fdiv>\n      <span>${t.label}<\u002Fspan>\n    <\u002Fdiv>`).join('');\n\n  picker.style.top  = (rect.bottom + 4) + 'px';\n  picker.style.left = rect.left + 'px';\n  document.body.appendChild(picker);\n  _docsInlinePicker = picker;\n\n  setTimeout(()=>{\n    const close = ev=>{\n      if(!picker.contains(ev.target)){_docsCloseInlinePicker();document.removeEventListener('mousedown',close);}\n    };\n    document.addEventListener('mousedown', close);\n  }, 0);\n}\n\nfunction docsInsertAfter(docId, afterBid, type){\n  _docsCloseInlinePicker();\n  docsAddBlockAfter(docId, afterBid, type);\n}\n\n// ── DOCS GALLERY HELPERS ─────────────────────────────────────────\nfunction docsPickGalleryMedia(docId, bid, mi){\n  document.getElementById(`dgmf-${docId}-${bid}-${mi}`)?.click();\n}\nfunction docsGalleryLoad(e, docId, bid, mi){\n  const file = e.target.files[0]; if(!file) return;\n  const isVid = file.type.startsWith('video/');\n  const reader = new FileReader();\n  reader.onload = ev=>{\n    const doc = docsData.find(d=>d.id===docId); if(!doc) return;\n    const blk = (doc.blocks||[]).find(b=>b.id===bid); if(!blk) return;\n    if(!blk.media) blk.media=[];\n    const item = {src:ev.target.result, type:isVid?'video':'image', caption:''};\n    if(mi >= blk.media.length) blk.media.push(item); else blk.media[mi]=item;\n    doc.updated=Date.now(); docsSave();\n    // Re-render just this block\n    const sec = document.getElementById(`docssec-${docId}-${bid}`);\n    if(sec){\n      const tmp=document.createElement('div');\n      tmp.innerHTML=_docsRenderBlock(docId, blk, 0);\n      sec.replaceWith(tmp.firstElementChild);\n      _docsTrackFocus();\n    }\n  };\n  reader.readAsDataURL(file); e.target.value='';\n}\nfunction docsGalleryDel(docId, bid, mi){\n  const doc=docsData.find(d=>d.id===docId); if(!doc) return;\n  const blk=(doc.blocks||[]).find(b=>b.id===bid); if(!blk||!blk.media) return;\n  blk.media.splice(mi,1); doc.updated=Date.now(); docsSave();\n  const sec=document.getElementById(`docssec-${docId}-${bid}`);\n  if(sec){const tmp=document.createElement('div');tmp.innerHTML=_docsRenderBlock(docId,blk,0);sec.replaceWith(tmp.firstElementChild);_docsTrackFocus();}\n}\nfunction docsGalleryCaption(docId, bid, mi, val){\n  const doc=docsData.find(d=>d.id===docId); if(!doc) return;\n  const blk=(doc.blocks||[]).find(b=>b.id===bid); if(!blk||!blk.media||!blk.media[mi]) return;\n  blk.media[mi].caption=val; doc.updated=Date.now(); docsSave();\n}\nfunction docsGalleryCols(docId, bid, n){\n  const doc=docsData.find(d=>d.id===docId); if(!doc) return;\n  const blk=(doc.blocks||[]).find(b=>b.id===bid); if(!blk) return;\n  blk.cols=n; doc.updated=Date.now(); docsSave();\n  const gal=document.getElementById(`dgal-${docId}-${bid}`);\n  if(gal) gal.className=`vs-gallery cols-${n}`;\n  const sec=document.getElementById(`docssec-${docId}-${bid}`);\n  if(sec) sec.querySelectorAll('.vs-col-opt').forEach(b=>b.classList.toggle('sel',+b.textContent===n));\n}\n\n// Docs gallery lightbox — reuse Vision lightbox\nlet _docsLbItems=[], _docsLbIdx=0, _docsLbDocId=null, _docsLbBid=null;\nfunction docsGalleryLbOpen(docId, bid, mi){\n  const doc=docsData.find(d=>d.id===docId); if(!doc) return;\n  const blk=(doc.blocks||[]).find(b=>b.id===bid); if(!blk||!blk.media) return;\n  _docsLbItems=blk.media; _docsLbIdx=mi; _docsLbDocId=docId; _docsLbBid=bid;\n  _docsLbShow();\n  document.getElementById('vsLightbox').classList.add('open');\n}\nfunction _docsLbShow(){\n  const m=_docsLbItems[_docsLbIdx]; if(!m) return;\n  const cont=document.getElementById('vsLbContent');\n  if(m.type==='video'){\n    cont.innerHTML=`<video src=\"${m.src}\" controls autoplay style=\"max-width:90vw;max-height:88vh;border-radius:8px\"><\u002Fvideo>`;\n  } else {\n    cont.innerHTML=`<img src=\"${m.src}\" alt=\"${esc(m.caption||'')}\">`;\n  }\n}\n\n// ── DOCS DRAG (single block) ──────────────────────────\nfunction docsStartDrag(e, docId, bid){\n  e.preventDefault();\n  const sec = document.getElementById(`docssec-${docId}-${bid}`);\n  if(!sec) return;\n  const area = document.getElementById('docsBlocksArea');\n  if(!area) return;\n  const rect = sec.getBoundingClientRect();\n  const ghost = sec.cloneNode(true);\n  ghost.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;opacity:.65;pointer-events:none;z-index:900;background:var(--surface);border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.18)`;\n  document.body.appendChild(ghost);\n  sec.style.opacity='.2';\n  _docsDrag={active:true,docId,bid,ghost,el:sec,overEl:null,isTop:false};\n\n  function clearLine(){if(_docsDragDropLine){_docsDragDropLine.remove();_docsDragDropLine=null;}}\n\n  const mm = ev=>{\n    if(!_docsDrag.active) return;\n    ghost.style.top=(ev.clientY-(rect.height/2))+'px';\n    clearLine();\n    ghost.style.display='none';\n    const under = document.elementFromPoint(ev.clientX, ev.clientY);\n    ghost.style.display='';\n    const target = under?under.closest('.docs-block-section'):null;\n    if(target && target!==sec){\n      _docsDragDropLine=document.createElement('div');\n      _docsDragDropLine.style.cssText='height:2px;border-radius:2px;background:var(--accent);margin:2px 0;pointer-events:none';\n      const tr=target.getBoundingClientRect();\n      const isTop=ev.clientY<tr.top+tr.height/2;\n      _docsDrag.overEl=target;_docsDrag.isTop=isTop;\n      if(isTop) target.before(_docsDragDropLine);\n      else target.after(_docsDragDropLine);\n    } else {\n      _docsDrag.overEl=null;\n    }\n  };\n  const mu = ev=>{\n    document.removeEventListener('mousemove',mm);\n    document.removeEventListener('mouseup',mu);\n    ghost.remove();clearLine();\n    sec.style.opacity='';\n    if(_docsDrag.overEl&&_docsDrag.overEl!==sec){\n      if(_docsDrag.isTop) _docsDrag.overEl.before(sec);\n      else _docsDrag.overEl.after(sec);\n      // Reorder blocks array\n      const doc = docsData.find(d=>d.id===docId);\n      if(doc){\n        const newOrder=[...area.querySelectorAll('.docs-block-section')].map(el=>el.dataset.bid);\n        doc.blocks=newOrder.map(id=>(doc.blocks||[]).find(b=>b.id===id)).filter(Boolean);\n        doc.updated=Date.now();\n        docsSave();\n      }\n    }\n    _docsDrag={active:false,docId:null,bid:null,ghost:null,overEl:null,isTop:false};\n  };\n  document.addEventListener('mousemove',mm);\n  document.addEventListener('mouseup',mu);\n}\n\n// ── INIT ──────────────────────────────────────────────\ndocsLoad();\nrenderSidebarFromSettings();\nrenderMc();render();initMoBg();\n// Init vsData from IndexedDB (async — needed before Vision view)\n_initVsData();\n// Init habit notes\nhtnInit();\n// Prevent context menu on planning grid days\ndocument.addEventListener('contextmenu',e=>{if(e.target.classList.contains('ap-day'))e.preventDefault();});\n// Apply sidebar state immediately (DOMContentLoaded may fire later)\nif(!sidebarOpen){const sb=document.getElementById('sidebar');if(sb)sb.classList.add('collapsed');}\n// ── LIVE NOW-BAR — actualiza cada segundo ────────────\n(function startNowClock(){\n  function tick(){\n    if(curView==='day') updateNowDay();\n    else if(curView==='wcal'){const d=getWcalDates(wcalDayOffset);updateNowWcal(d);}\n  }\n  tick(); // run immediately\n  setInterval(tick, 1000);\n})();\n// ── PWA SERVICE WORKER ────────────────────────────────\nif('serviceWorker' in navigator){\n  navigator.serviceWorker.register('sw.js').catch(()=>{});\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
