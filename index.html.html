|[]).map(_sanitizeGoal).filter(Boolean);\n    if(data.yearGoals)  yearGoals=(data.yearGoals||[]).map(_sanitizeGoal).filter(Boolean);\n    if(data.habits&&Array.isArray(data.habits)){habits=data.habits;_safeWrite(STORE_KEYS.habits,habits);}\n    if(data.apData){apData=data.apData;_safeWrite(STORE_KEYS.ap,apData);}\n    if(data.objetivos&&Array.isArray(data.objetivos)){objetivos=data.objetivos;_safeWrite(STORE_KEYS.objetivos,objetivos);}\n    if(data.vsData&&typeof data.vsData==='object'){\n      vsData=data.vsData;\n      idbWrite(VS_IDB_KEY,vsData).catch(e=>console.error('[VictorOS] Could not restore vsData',e));\n    }\n    if(data.settings){\n      if(typeof data.settings.dark==='boolean'&&data.settings.dark!==isDark)toggleDark();\n      if(data.settings.moBg)applyMoBg(data.settings.moBg);\n      if(data.settings.homeBg){homeBg=data.settings.homeBg;_safeWrite(STORE_KEYS.homebg,homeBg);}\n    }\n  }\n  nid=Math.max(...tasks.map(t=>t.id),...weekGoals.map(g=>g.id),...monthGoals.map(g=>g.id),...yearGoals.map(g=>g.id),900)+1;\n  _safeWrite(STORE_KEYS.tasks,tasks);_safeWrite(STORE_KEYS.goals,weekGoals);\n  _safeWrite(STORE_KEYS.monthGoals,monthGoals);_safeWrite(STORE_KEYS.yearGoals,yearGoals);\n  render();showToast('Importado correctamente ✓');\n}\nfunction cfgClearAll(){\n  if(!confirm('¿Seguro que quieres eliminar todos los datos? Esta acción no se puede deshacer.')) return;\n  tasks=[];weekGoals=[];monthGoals=[];yearGoals=[];habits=[];focusSessions=[];apData={};objetivos=[];\n  vsData=vsDefaultData();\n  Object.values(STORE_KEYS).forEach(k=>{try{localStorage.removeItem(k);localStorage.removeItem(k+'_bak');}catch{}});\n  // Keep the first-run flag so demo data doesn't resurface after clearing\n  localStorage.setItem('sp6_ever_opened','1');\n  // Write empty arrays so they are persisted immediately\n  _safeWrite(STORE_KEYS.tasks,[]);\n  _safeWrite(STORE_KEYS.goals,[]);\n  _safeWrite(STORE_KEYS.monthGoals,[]);\n  _safeWrite(STORE_KEYS.yearGoals,[]);\n  _safeWrite(STORE_KEYS.habits,[]);\n  idbDelete(VS_IDB_KEY);\n  saveVision();\n  render();showToast('Todos los datos eliminados');\n}\n\nfunction renderFocusView(){\n  const c=document.getElementById('mainContent');\n  const r=66;const circ=2*Math.PI*r;\n  const colors={focus:'#8b7cf6',short:'#43a873',long:'#5a93d4'};\n  const pct=FC.total>0?FC.remaining/FC.total:1;\n  const mLabel=String(Math.floor(FC.remaining/60)).padStart(2,'0')+':'+String(FC.remaining%60).padStart(2,'0');\n  const phaseLbls={focus:'Foco',short:'Descanso corto',long:'Descanso largo'};\n\n  c.innerHTML=`<div class=\"fc-wrap\">\n  <div class=\"fc-left\">\n    <div class=\"fc-timer-box\">\n      <div class=\"fc-mode-tabs\">\n        <div class=\"fc-mt${FC.mode==='focus'?' active':''}\" id=\"fcMt-focus\" onclick=\"fcSetMode('focus')\">Foco<\u002Fdiv>\n        <div class=\"fc-mt${FC.mode==='short'?' active':''}\" id=\"fcMt-short\" onclick=\"fcSetMode('short')\">Corto<\u002Fdiv>\n        <div class=\"fc-mt${FC.mode==='long'?' active':''}\" id=\"fcMt-long\" onclick=\"fcSetMode('long')\">Largo<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fc-ring-wrap\">\n        <svg class=\"fc-ring-svg\" viewBox=\"0 0 152 152\">\n          <circle class=\"fc-ring-bg\" cx=\"76\" cy=\"76\" r=\"${r}\"/>\n          <circle class=\"fc-ring-prog\" id=\"fcRingProg\" cx=\"76\" cy=\"76\" r=\"${r}\"\n            style=\"stroke-dasharray:${circ.toFixed(1)};stroke-dashoffset:${(circ*(1-pct)).toFixed(1)};stroke:${colors[FC.mode]}\"/>\n        <\u002Fsvg>\n        <div class=\"fc-ring-center\">\n          <div class=\"fc-time-display\" id=\"fcTimeDisplay\">${mLabel}<\u002Fdiv>\n          <div class=\"fc-phase-lbl\" id=\"fcPhaseLbl\">${phaseLbls[FC.mode]}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fc-timer-btns\">\n        <button class=\"fc-start-btn${FC.running?' running':''}\" id=\"fcStartBtn\" onclick=\"fcStart()\">\n          ${FC.running?'⏸ Pausar':'▶ Iniciar'}\n        <\u002Fbutton>\n        <button class=\"fc-reset-btn\" onclick=\"fcReset()\" title=\"Reiniciar\">↺<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fc-session-info\">\n      <div class=\"fc-si-row\">\n        <span class=\"fc-si-lbl\">Sesiones hoy<\u002Fspan>\n        <span class=\"fc-si-val\" id=\"fcTodayCount\">${focusSessions.filter(s=>s.dateKey===dk(today)&&s.type==='focus').length}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"fc-si-row\">\n        <span class=\"fc-si-lbl\">Tiempo hoy<\u002Fspan>\n        <span class=\"fc-si-val\" id=\"fcTodayTime\">${fcFmtHours(focusSessions.filter(s=>s.dateKey===dk(today)&&s.type==='focus').reduce((a,s)=>a+s.duration,0))}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"fc-sessions-dots\" id=\"fcDots\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fc-settings\">\n      <div class=\"fc-set-lbl\">Ajustes (min)<\u002Fdiv>\n      <div class=\"fc-set-row\"><span class=\"fc-set-name\">Foco<\u002Fspan><input class=\"fc-set-inp\" id=\"fcSetFocus\" type=\"number\" min=\"1\" max=\"120\" value=\"${FC.settings.focus}\" onchange=\"fcSaveSettings()\"/><\u002Fdiv>\n      <div class=\"fc-set-row\"><span class=\"fc-set-name\">Descanso corto<\u002Fspan><input class=\"fc-set-inp\" id=\"fcSetShort\" type=\"number\" min=\"1\" max=\"60\" value=\"${FC.settings.short}\" onchange=\"fcSaveSettings()\"/><\u002Fdiv>\n      <div class=\"fc-set-row\"><span class=\"fc-set-name\">Descanso largo<\u002Fspan><input class=\"fc-set-inp\" id=\"fcSetLong\" type=\"number\" min=\"1\" max=\"60\" value=\"${FC.settings.long}\" onchange=\"fcSaveSettings()\"/><\u002Fdiv>\n      <div class=\"fc-set-row\"><span class=\"fc-set-name\">Pomodoros/ciclo<\u002Fspan><input class=\"fc-set-inp\" id=\"fcSetLongAfter\" type=\"number\" min=\"1\" max=\"10\" value=\"${FC.settings.longAfter}\" onchange=\"fcSaveSettings()\"/><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"fc-right\" id=\"fcRight\"><\u002Fdiv>\n<\u002Fdiv>`;\n  fcUpdateDots();\n  fcRenderRight();\n}\n\nfunction fcFmtHours(secs){\n  if(!secs) return '0h 0m';\n  const h=Math.floor(secs/3600);\n  const m=Math.floor((secs%3600)/60);\n  return h>0?`${h}h ${m}m`:`${m}m`;\n}\n\nfunction fcRenderRight(){\n  const el=document.getElementById('fcRight');if(!el)return;\n  const now=new Date();\n  const yr=now.getFullYear(),mo=now.getMonth()+FC.monthOffset;\n  const refDate=new Date(yr,mo,1);\n  const displayYr=refDate.getFullYear(),displayMo=refDate.getMonth();\n  const daysInMo=new Date(displayYr,displayMo+1,0).getDate();\n  const todayKey=dk(today);\n\n  // Filter sessions for this month\n  const moSessions=focusSessions.filter(s=>{\n    const d=new Date(s.ts);\n    return d.getFullYear()===displayYr&&d.getMonth()===displayMo&&s.type==='focus';\n  });\n\n  // KPIs\n  const totalSecs=moSessions.reduce((a,s)=>a+s.duration,0);\n  const totalSessions=moSessions.length;\n  const activeDays=new Set(moSessions.map(s=>s.dateKey)).size;\n\n  // Build per-day map\n  const dayMap={};\n  moSessions.forEach(s=>{\n    dayMap[s.dateKey]=(dayMap[s.dateKey]||0)+s.duration;\n  });\n  const maxSecs=Math.max(...Object.values(dayMap),1);\n\n  // Build bars\n  let barsHtml='';\n  for(let d=1;d<=daysInMo;d++){\n    const cd=new Date(displayYr,displayMo,d);\n    const dkey=dk(cd);\n    const secs=dayMap[dkey]||0;\n    const isToday=dkey===todayKey;\n    const heightPct=secs>0?(secs/maxSecs)*100:0;\n    const heightPx=Math.max(heightPct*0.88,secs>0?4:2);\n    const tip=secs>0?fcFmtHours(secs):'—';\n    const dayNum=d;\n    const showLbl=(d===1||d%5===0||d===daysInMo||isToday);\n    barsHtml+=`<div class=\"fc-bar-col\">\n      <div class=\"fc-bar${secs>0?' has-data':''}${isToday?' today-bar':''}\"\n        style=\"height:${heightPx.toFixed(1)}px\" data-tip=\"${tip}\"><\u002Fdiv>\n      <span class=\"fc-bar-lbl${isToday?' today-lbl':''}\">${showLbl?dayNum:''}<\u002Fspan>\n    <\u002Fdiv>`;\n  }\n\n  // Log (last 20 sessions of this month, most recent first)\n  const logSessions=[...moSessions].reverse().slice(0,20);\n  const typeLabel={focus:'Foco',short:'Descanso corto',long:'Descanso largo'};\n  let logHtml=logSessions.length===0\n    ?`<div class=\"fc-log-empty\">Sin sesiones este mes<\u002Fdiv>`\n    :logSessions.map(s=>{\n      const d=new Date(s.ts);\n      const timeStr=d.getDate()+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');\n      const isBreak=s.type!=='focus';\n      return `<div class=\"fc-log-row\">\n        <div class=\"fc-log-dot${isBreak?' brk':''}\"><\u002Fdiv>\n        <span style=\"flex:1\">${typeLabel[s.type]||s.type}<\u002Fspan>\n        <span class=\"fc-log-dur\">${fcFmtHours(s.duration)}<\u002Fspan>\n        <span class=\"fc-log-time\">${timeStr}<\u002Fspan>\n      <\u002Fdiv>`;\n    }).join('');\n\n  el.innerHTML=`\n    <div class=\"fc-month-nav\">\n      <span class=\"fc-month-ttl\">${MO[displayMo]} ${displayYr}<\u002Fspan>\n      <button class=\"fc-mnav-btn\" onclick=\"FC.monthOffset--;fcRenderRight()\">&#8249;<\u002Fbutton>\n      <button class=\"fc-mnav-btn\" onclick=\"FC.monthOffset++;fcRenderRight()\">&#8250;<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"fc-kpis\">\n      <div class=\"fc-kpi\"><div class=\"fc-kpi-val\">${fcFmtHours(totalSecs)}<\u002Fdiv><div class=\"fc-kpi-lbl\">Tiempo total<\u002Fdiv><\u002Fdiv>\n      <div class=\"fc-kpi\"><div class=\"fc-kpi-val\">${totalSessions}<\u002Fdiv><div class=\"fc-kpi-lbl\">Sesiones<\u002Fdiv><\u002Fdiv>\n      <div class=\"fc-kpi\"><div class=\"fc-kpi-val\">${activeDays}<\u002Fdiv><div class=\"fc-kpi-lbl\">Días activos<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fc-chart-card\">\n      <div class=\"fc-chart-ttl\">Horas de foco por día — ${MO[displayMo]}<\u002Fdiv>\n      <div class=\"fc-bars-wrap\">${barsHtml}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fc-log-card\">\n      <div class=\"fc-log-ttl\">Registro de sesiones<\u002Fdiv>\n      ${logHtml}\n    <\u002Fdiv>`;\n}\n\n// ══════════════════════════════════════════════════════\n// ANNUAL PLANNING\n// ══════════════════════════════════════════════════════\nfunction loadAP(){return _safeRead(STORE_KEYS.ap,{});}\nfunction saveAP(){_safeWrite(STORE_KEYS.ap,apData);}\nlet apData=loadAP();\n// apData structure: { year: { days:{'YYYY-MM-DD':colorHex}, events:[{id,name,color}], objectives:{'Q1':text,'Q2':text,'Q3':text,'Q4':text} } }\nlet apYear=today.getFullYear();\nlet apSelEventId=null;\nlet apDragColor=null;\nlet apDragActive=false;\n\nfunction apYearData(){\n  if(!apData[apYear]) apData[apYear]={days:{},events:[\n    {id:'ev1',name:'Launch SSc™ 3.0',color:'#4757e0'},\n    {id:'ev2',name:'Launch SAc™ 3.0',color:'#c8383a'},\n    {id:'ev3',name:'Mastermind',color:'#b8860b'},\n  ],objectives:{Q1:'',Q2:'',Q3:'',Q4:''}};\n  return apData[apYear];\n}\nfunction apDayKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}\nconst AP_MONTHS_Q={Q1:[0,1,2],Q2:[3,4,5],Q3:[6,7,8],Q4:[9,10,11]};\nconst AP_Q_TARGETS={'Q1':'$200K','Q2':'$400K','Q3':'$500K','Q4':'$500K'};\nconst AP_DOW=['L','M','X','J','V','S','D'];\n\nfunction renderPlanning(){\n  const c=document.getElementById('mainContent');\n  const yd=apYearData();\n  const todayKey=dk(today);\n\n  // Build quarter HTML\n  let quartersHtml='';\n  ['Q1','Q2','Q3','Q4'].forEach(q=>{\n    const months=AP_MONTHS_Q[q];\n    let monthsHtml='';\n    months.forEach(mi=>{\n      const monthName=MO[mi];\n      const firstDow=new Date(apYear,mi,1).getDay(); // 0=Sun\n      const offset=firstDow===0?6:firstDow-1; // Mon=0\n      const daysInMonth=new Date(apYear,mi+1,0).getDate();\n      let gridHtml=AP_DOW.map(d=>`<div class=\"ap-dow\">${d}<\u002Fdiv>`).join('');\n      for(let i=0;i<offset;i++) gridHtml+=`<div class=\"ap-day\"><\u002Fdiv>`;\n      for(let d=1;d<=daysInMonth;d++){\n        const key=apDayKey(apYear,mi,d);\n        const col=yd.days[key];\n        const isToday=key===todayKey;\n        const style=col?`background:${col};border-radius:4px`:'';\n        gridHtml+=`<div class=\"ap-day${isToday?' today-d':''}${col?' colored':''}\" data-key=\"${key}\" style=\"${style}\"\n          onmousedown=\"apDayDown(event,'${key}')\"\n          onmouseenter=\"apDayEnter(event,'${key}')\">${d}<\u002Fdiv>`;\n      }\n      monthsHtml+=`<div class=\"ap-month-block\">\n        <div class=\"ap-month-hdr\">${monthName}<\u002Fdiv>\n        <div class=\"ap-cal-grid\">${gridHtml}<\u002Fdiv>\n      <\u002Fdiv>`;\n    });\n\n    // Count colored days per event for this Q\n    const qDays=months.flatMap(mi=>{\n      const dim=new Date(apYear,mi+1,0).getDate();\n      return Array.from({length:dim},(_,i)=>apDayKey(apYear,mi,i+1));\n    });\n    const evStats=yd.events.map(ev=>{\n      const cnt=qDays.filter(k=>yd.days[k]===ev.color).length;\n      return cnt>0?`<span style=\"display:inline-flex;align-items:center;gap:3px;margin-right:8px\"><span style=\"width:7px;height:7px;border-radius:2px;background:${ev.color};display:inline-block\"><\u002Fspan>${ev.name}: ${cnt}d<\u002Fspan>`:''\n    }).join('');\n\n    quartersHtml+=`<div class=\"ap-quarter\">\n      <div class=\"ap-q-header\">\n        <span class=\"ap-q-lbl\">${q}<\u002Fspan>\n        <span class=\"ap-q-kpi\">${evStats}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"ap-months-row\">${monthsHtml}<\u002Fdiv>\n      <div class=\"ap-q-obj\">\n        <div class=\"ap-q-obj-lbl\">Objetivos ${q}<\u002Fdiv>\n        <textarea class=\"ap-q-obj-txt\" placeholder=\"Escribe tus objetivos para ${q}...\"\n          oninput=\"apSaveObj('${q}',this.value)\"\n          >${esc(yd.objectives[q]||'')}<\u002Ftextarea>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  });\n\n  // Events sidebar\n  let evHtml=yd.events.map(ev=>`\n    <div class=\"ap-event-row${apSelEventId===ev.id?' selected':''}\" id=\"apev-${ev.id}\" onclick=\"apSelectEvent('${ev.id}')\">\n      <div class=\"ap-ev-swatch\" style=\"background:${ev.color};position:relative\">\n        <input type=\"color\" class=\"ap-color-inp\" value=\"${ev.color}\"\n          onclick=\"event.stopPropagation()\"\n          oninput=\"apChangeEvColor('${ev.id}',this.value)\"\n          onchange=\"apChangeEvColor('${ev.id}',this.value)\">\n      <\u002Fdiv>\n      <input class=\"ap-ev-name\" value=\"${esc(ev.name)}\" placeholder=\"Nombre del evento...\"\n        onclick=\"event.stopPropagation();apSelectEvent('${ev.id}')\"\n        oninput=\"apRenameEvent('${ev.id}',this.value)\"/>\n      <button class=\"ap-ev-del\" onclick=\"event.stopPropagation();apDelEvent('${ev.id}')\">✕<\u002Fbutton>\n    <\u002Fdiv>`).join('');\n\n  c.innerHTML=`<div class=\"ap-wrap\">\n    <div class=\"ap-main\">\n      <div class=\"ap-year-nav\">\n        <button class=\"ap-ynav-btn\" onclick=\"apYear--;renderPlanning()\">‹<\u002Fbutton>\n        <span class=\"ap-year-lbl\">${apYear} — Plan de acción<\u002Fspan>\n        <button class=\"ap-ynav-btn\" onclick=\"apYear++;renderPlanning()\">›<\u002Fbutton>\n      <\u002Fdiv>\n      ${quartersHtml}\n    <\u002Fdiv>\n    <div class=\"ap-sidebar\">\n      <div class=\"ap-sb-ttl\">Eventos<\u002Fdiv>\n      <div class=\"ap-event-list\" id=\"apEvList\">${evHtml}<\u002Fdiv>\n      <button class=\"ap-add-ev-btn\" onclick=\"apAddEvent()\">+ Añadir evento<\u002Fbutton>\n      <div class=\"ap-sb-ttl\" style=\"margin-top:4px\">Instrucciones<\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--tx3);line-height:1.6\">\n        1. Selecciona un evento del panel<br>\n        2. Haz click o arrastra sobre los días del calendario para colorearlos<br>\n        3. Click derecho sobre un día para borrarlo\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n\n  // Bind mouseup globally to stop drag\n  document.addEventListener('mouseup',apDragEnd,{once:true});\n}\n\nfunction apSelectEvent(id){\n  const yd=apYearData();\n  const ev=yd.events.find(e=>e.id===id);\n  if(!ev)return;\n  apSelEventId=id;\n  apDragColor=ev.color;\n  // Update selected state visually\n  document.querySelectorAll('.ap-event-row').forEach(el=>el.classList.remove('selected'));\n  document.getElementById('apev-'+id)?.classList.add('selected');\n}\nfunction apDayDown(e,key){\n  e.preventDefault();\n  if(e.button===2){apClearDay(key);return;}\n  if(!apSelEventId){showToast('Selecciona un evento primero');return;}\n  apDragActive=true;\n  apPaintDay(key);\n  // Global mouseup to always stop painting\n  const stop=()=>{apDragActive=false;document.removeEventListener('mouseup',stop);};\n  document.addEventListener('mouseup',stop);\n}\nfunction apDayEnter(e,key){\n  if(!apDragActive||!(e.buttons&1))return;\n  apPaintDay(key);\n}\nfunction apDragEnd(){apDragActive=false;}\nfunction apPaintDay(key){\n  const yd=apYearData();\n  if(!apDragColor)return;\n  yd.days[key]=apDragColor;\n  saveAP();\n  const el=document.querySelector(`[data-key=\"${key}\"]`);\n  if(el){el.style.background=apDragColor;el.style.borderRadius='4px';el.classList.add('colored');}\n}\nfunction apClearDay(key){\n  const yd=apYearData();\n  delete yd.days[key];saveAP();\n  const el=document.querySelector(`[data-key=\"${key}\"]`);\n  if(el){el.style.background='';el.style.borderRadius='';el.classList.remove('colored');}\n}\nfunction apSaveObj(q,val){\n  const yd=apYearData();yd.objectives[q]=val;saveAP();\n}\nfunction apAddEvent(){\n  const yd=apYearData();\n  const col=RAINBOW_HEX[yd.events.length%RAINBOW_HEX.length];\n  const id='ev'+Date.now();\n  yd.events.push({id,name:'Nuevo evento',color:col});\n  saveAP();renderPlanning();\n  apSelectEvent(id);\n}\nfunction apDelEvent(id){\n  const yd=apYearData();\n  yd.events=yd.events.filter(e=>e.id!==id);\n  if(apSelEventId===id){apSelEventId=null;apDragColor=null;}\n  saveAP();renderPlanning();\n}\nfunction apRenameEvent(id,val){\n  const yd=apYearData();\n  const ev=yd.events.find(e=>e.id===id);if(ev)ev.name=val;saveAP();\n}\nfunction apChangeEvColor(id,val){\n  const yd=apYearData();\n  const ev=yd.events.find(e=>e.id===id);if(!ev)return;\n  // Remap all painted days from old color to new\n  const old=ev.color;ev.color=val;\n  Object.keys(yd.days).forEach(k=>{if(yd.days[k]===old)yd.days[k]=val;});\n  saveAP();\n  if(apSelEventId===id)apDragColor=val;\n  renderPlanning();apSelectEvent(id);\n}\n\n// ══════════════════════════════════════════════════════\n// VISUALIZACIÓN — Notion-style page engine\n// ══════════════════════════════════════════════════════\n\n// ── DATA ─────────────────────────────────────────────\n// Vision data initialised async — see init at bottom\n\n// Default page pre-loaded from the PDF \"Visión\"\nfunction vsDefaultData(){\n  return {\n    title:'Visión',\n    icon:'🔴',\n    cover:'',\n    sections:[\n      {id:'vs1',type:'h1',content:'Sección 1 | Visualización Identidad'},\n      {id:'vs2',type:'callout',icon:'🧠',content:'Pensamiento + Imagen + Emoción = Creencia'},\n      {id:'vs3',type:'text',content:'Elimina tu anestesia emocional — No te engañes.\\nLuchas contra la exposición al miedo, incomodidad y pérdida de anestesia emocional.\\nEl resto es una consecuencia en base a vacíos.'},\n      {id:'vs4',type:'h2',content:'💪 1.1 Salud y Físico'},\n      {id:'vs5',type:'bullets',items:['Entrenamiento 5 veces a la semana.','Comida saludable. Calculamos los macros. No le damos importancia a la comida.','La sensación al correr, esa vitalidad.','La sensación muscular de tener fuerza y un cuerpo lleno de vitalidad.']},\n      {id:'vs6',type:'gallery',cols:3,media:[]},\n      {id:'vs7',type:'h2',content:'⏳ 1.2 Tiempo: Responsabilidad con los horarios.'},\n      {id:'vs8',type:'text',content:'Responsabilidad con los descansos (salir, tomar café, ver una película...)'},\n      {id:'vs9',type:'gallery',cols:3,media:[]},\n      {id:'vs10',type:'h2',content:'🧠 1.3 Filosofía'},\n      {id:'vs11',type:'text',content:'Tú Palabra, es tu autoestima. Porque es cuando nadie te ve, es cuando te debes empujar más.'},\n      {id:'vs12',type:'bullets',items:['\"Lo que se debe hacer, se hace. Punto. El descanso es la recompensa, no el escape.\"','\"No hay paz sin pasar por la guerra. Afrontar es crecer.\"','\"Un rechazo no define mi valor; es solo información para avanzar.\"','\"Nuestra palabra se cincela en piedra, todo lo que prometemos, ya ha pasado\"']},\n      {id:'vs13',type:'divider'},\n      {id:'vs14',type:'h2',content:'⚡ 1.4 Acción Inmediata'},\n      {id:'vs15',type:'bullets',items:['NO negociamos con la procrastinación → Afrontamos el miedo','Hazlo con miedo. El miedo nunca se irá, las oportunidades sí.','NO negociamos con la perfección → Acción imperfecta > Acción perfecta.']},\n      {id:'vs16',type:'gallery',cols:3,media:[]},\n      {id:'vs17',type:'h2',content:'🏛 1.5 Códigos de Honor de Sombra'},\n      {id:'vs18',type:'bullets',items:['No tolero mediocridad: si detecto una excusa, actúo.','No negocio con mi palabra: si lo digo, se hace.','Elijo incomodidad diaria: el dolor es la señal de crecimiento.','Rechazo ≠ fracaso: solo es información para ajustar.','El tiempo es oro: cada minuto cuenta, cada acción importa.']},\n      {id:'vs19',type:'divider'},\n      {id:'vs20',type:'h1',content:'Sección 2 | Propósito'},\n      {id:'vs21',type:'h2',content:'🔑 Identidad'},\n      {id:'vs22',type:'text',content:'¿Por qué quiero cambiar mi identidad?\\nPorque no estoy orgulloso de mi yo actual y quiero aprovechar mi vida y mi juventud sintiéndome orgulloso de mí mismo mientras disfruto del proceso.'},\n      {id:'vs23',type:'bullets',items:['Orgulloso de mis acciones.','Descubrir y usar mi verdadero potencial.','No desperdiciar juventud ni energía → vivir experiencias y mejorar cada día.']},\n      {id:'vs24',type:'h2',content:'🎯 Propósito: ¿Por qué quiero un negocio digital?'},\n      {id:'vs25',type:'text',content:'Quiero un negocio, porque me da control para conseguir mis objetivos y desarrollarme al máximo. El negocio es la palanca para desarrollarme en todas mis habilidades de dominio y también a nivel personal.'},\n      {id:'vs26',type:'bullets',items:['Me permite mantenerme incómodo.','No conformarme.','Afrontar problemas y dificultades para ser mejor.','Ayudar: inspirar y compartir conocimientos con otros.','Círculo ideal: rodearme de personas que me impulsen.','Disfrutar: tanto de lo bueno como del estrés/dolor → aprender a disfrutar del proceso.','Equilibrio: negocio + dinero + descanso → éxito sin sacrificar la vida.']},\n      {id:'vs27',type:'h3',content:'✔ Señales de que lo logré'},\n      {id:'vs28',type:'bullets',items:['Salgo cada semana a un lugar distinto.','Puedo tomar vacaciones cuando quiero.','Puedo viajar y trabajar desde cualquier lugar.','Tengo dinero para mejorar calidad de vida (comida, salud, experiencias).']},\n      {id:'vs29',type:'h2',content:'⚡ Actividades que me recargan'},\n      {id:'vs30',type:'bullets',items:['Escuchar podcasts / contenido inspirador.','Gimnasio y ejercicio.','Salidas a cafés relajantes.','Cenas y comidas tranquilas.','Compartir experiencias con mi círculo cercano.']},\n      {id:'vs31',type:'h2',content:'🚫 Lo que NO sacrifico nunca'},\n      {id:'vs32',type:'bullets',items:['Equilibrio: negocio sí, pero sin perder hábitos ni vida personal.','Salud física: siempre en forma, prioridad absoluta.','Libertad: nada puede quitarme mi movimiento ni flexibilidad.','Relaciones genuinas: priorizo las que me aportan valor y paz.','Autenticidad: nada de máscaras, farsas o engaños.']},\n      {id:'vs33',type:'divider'},\n      {id:'vs34',type:'h1',content:'Sección 3 | Suelo Intolerable'},\n      {id:'vs35',type:'callout',icon:'📉',content:'Tu vida en 10 años si no cambias: Tienes 32 años, cuerpo flojo, mente apagada, sueldo de supervivencia, cero independencia real.'},\n      {id:'vs36',type:'h3',content:'Físico destruido'},\n      {id:'vs37',type:'bullets',items:['Pasan 3, 5, 10 años y ya no tienes 22.','Con 30 sigues con barriga, energía baja, sin disciplina.','Miras al espejo y no reconoces al \"yo\" que quería ser un hombre fuerte.','Tu cuerpo se convierte en prueba viviente de tu falta de palabra.']},\n      {id:'vs38',type:'h3',content:'Identidad rota'},\n      {id:'vs39',type:'bullets',items:['Sigues con 30 pensando como un adolescente: buscando dopamina, evitando incomodidad.','Tu corteza prefrontal nunca se fortaleció → sigues siendo esclavo del impulso.','La idea de \"ser grande\" queda como una fantasía que no pasó.','Lo peor: ya no crees que sea posible cambiar.']},\n    ]\n  };\n}\n\nlet vsData=null; // loaded async — see _initVsData()\nasync function _initVsData(){\n  vsData=await loadVision()||vsDefaultData();\n}\nlet _vsAddMenu=null;\nlet _vsLbItems=[];\nlet _vsLbIdx=0;\n\n// ── RENDER ────────────────────────────────────────────\nlet _vsToolbarOpen=true;\n\nfunction renderVision(){\n  const c=document.getElementById('mainContent');\n  // If vsData not loaded yet, load it first\n  if(!vsData){\n    c.innerHTML='<div style=\"display:flex;align-items:center;justify-content:center;height:100%;color:var(--tx3);font-size:13px\">Cargando visualización…<\u002Fdiv>';\n    _initVsData().then(()=>renderVision());\n    return;\n  }\n  const d=vsData;\n  const isFullWidth=!!(vsData._fullWidth);\n  const coverPos=vsData._coverPos||50; // vertical % 0-100\n\n  // Cover HTML\n  const coverHtml=d.cover\n    ?`<div class=\"vs-cover\" id=\"vsCover\">\n        <img id=\"vsCoverImg\" src=\"${d.cover}\" style=\"object-position:center ${coverPos}%\">\n        <div class=\"vs-cover-drag-hint\">⬆⬇ Arrastra para reposicionar<\u002Fdiv>\n        <div class=\"vs-cover-controls\">\n          <button class=\"vs-cover-btn\" onclick=\"vsCoverReposition()\" id=\"vsCoverReposBtn\">✋ Reposicionar<\u002Fbutton>\n          <button class=\"vs-cover-btn\" onclick=\"vsCoverUpload()\">📷 Cambiar<\u002Fbutton>\n          <button class=\"vs-cover-btn\" onclick=\"vsCoverRemove()\" style=\"color:rgba(255,100,100,.9)\">✕ Quitar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`\n    :`<div class=\"vs-cover\" style=\"height:64px;background:var(--s2);display:flex;align-items:center;justify-content:flex-end;padding:0 14px\">\n        <button class=\"vs-cover-btn\" style=\"background:var(--surface);color:var(--tx3);border:.5px solid var(--b2)\" onclick=\"vsCoverUpload()\">📷 Añadir portada<\u002Fbutton>\n      <\u002Fdiv>`;\n\n  const defCols=vsData._defCols||3;\n  const sectionsHtml=d.sections.map((s,i)=>vsRenderSection(s,i)).join('');\n\n  c.innerHTML=`\n    <div class=\"vs-wrap\">\n      <!-- Side toolbar PANEL (slides from right) -->\n      <div class=\"vs-sidetb ${_vsToolbarOpen?'':'closed'}\" id=\"vsToolbar\">\n        <div class=\"vs-col-lbl\">Añadir bloque<\u002Fdiv>\n        <button class=\"vs-tb-btn\" onclick=\"vsAddBlock('h1')\">\n          <svg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" viewBox=\"0 0 14 14\"><path d=\"M2 3h10M2 7h6M2 11h4\"/><\u002Fsvg>Título 1\n        <\u002Fbutton>\n        <button class=\"vs-tb-btn\" onclick=\"vsAddBlock('h2')\">\n          <svg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" viewBox=\"0 0 14 14\"><path d=\"M2 3h8M2 7h5M2 11h3\"/><\u002Fsvg>Título 2\n        <\u002Fbutton>\n        <button class=\"vs-tb-btn\" onclick=\"vsAddBlock('h3')\">\n          <svg fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" viewBox=\"0 0 14 14\"><path d=\"M2 4h6M2 7.5h4M2 11h3\"/><\u002Fsvg>Título 3\n        <\u002Fbutton>\n        <button class=\"vs-tb-btn\" onclick=\"vsAddBlock('text')\">\n          <svg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" viewBox=\"0 0 14 14\"><path d=\"M2 4h10M2 7h10M2 10h7\"/><\u002Fsvg>Texto\n        <\u002Fbutton>\n        <button class=\"vs-tb-btn\" onclick=\"vsAddBlock('bullets')\">\n          <svg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" viewBox=\"0 0 14 14\"><circle cx=\"3\" cy=\"4\" r=\"1\" fill=\"currentColor\"/><circle cx=\"3\" cy=\"7.5\" r=\"1\" fill=\"currentColor\"/><circle cx=\"3\" cy=\"11\" r=\"1\" fill=\"currentColor\"/><path d=\"M6 4h6M6 7.5h6M6 11h4\"/><\u002Fsvg>Lista\n        <\u002Fbutton>\n        <button class=\"vs-tb-btn\" onclick=\"vsAddBlock('callout')\">💡 Callout<\u002Fbutton>\n        <button class=\"vs-tb-btn\" onclick=\"vsAddBlock('quote')\">❝ Cita<\u002Fbutton>\n        <button class=\"vs-tb-btn\" onclick=\"vsAddBlock('divider')\">— Divisor<\u002Fbutton>\n        <div class=\"vs-tb-sep\"><\u002Fdiv>\n        <button class=\"vs-tb-btn\" onclick=\"vsAddBlock('gallery')\" style=\"color:var(--accent)\">\n          <svg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" viewBox=\"0 0 14 14\"><rect x=\"1\" y=\"1\" width=\"5\" height=\"5\" rx=\"1\"/><rect x=\"8\" y=\"1\" width=\"5\" height=\"5\" rx=\"1\"/><rect x=\"1\" y=\"8\" width=\"5\" height=\"5\" rx=\"1\"/><rect x=\"8\" y=\"8\" width=\"5\" height=\"5\" rx=\"1\"/><\u002Fsvg>Galería\n        <\u002Fbutton>\n        <div class=\"vs-tb-sep\"><\u002Fdiv>\n        <div class=\"vs-col-lbl\">Columnas galería<\u002Fdiv>\n        <div class=\"vs-col-picker\">\n          ${[2,3,4].map(n=>`<button class=\"vs-col-opt${defCols===n?' sel':''}\" onclick=\"vsSetDefCols(${n})\">${n}<\u002Fbutton>`).join('')}\n        <\u002Fdiv>\n        <div class=\"vs-tb-sep\"><\u002Fdiv>\n        <div class=\"vs-col-lbl\">Ancho de página<\u002Fdiv>\n        <button class=\"vs-width-btn ${isFullWidth?'full':''}\" id=\"vsWidthBtn\" onclick=\"vsToggleWidth()\">\n          <svg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" viewBox=\"0 0 14 14\"><path d=\"M1 7h12M1 4h3M10 4h3M1 10h3M10 10h3\"/><\u002Fsvg>\n          ${isFullWidth?'Ancho completo ✓':'Ancho normal'}\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <!-- Tab toggle button — always on top, independent -->\n      <div class=\"vs-sidetb-tab ${_vsToolbarOpen?'open':''}\" id=\"vsToolbarTab\" onclick=\"vsToggleToolbar()\" title=\"Bloques\">\n        <svg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" viewBox=\"0 0 14 14\">\n          <polyline points=\"9,3 5,7 9,11\"/>\n        <\u002Fsvg>\n      <\u002Fdiv>\n\n      <!-- Page scroll -->\n      <div class=\"vs-scroll\" id=\"vsScroll\" onclick=\"vsDeselect(event)\">\n        <input type=\"file\" id=\"vsCoverInp\" accept=\"image/*\" style=\"display:none\" onchange=\"vsCoverLoad(event)\">\n        ${coverHtml}\n        <div class=\"vs-page${isFullWidth?' full-width':''}\" id=\"vsPage\">\n          <textarea class=\"vs-page-title\" id=\"vsTitle\" rows=\"1\"\n            placeholder=\"Título de la página…\"\n            oninput=\"autoR(this);vsData.title=this.value;saveVision()\">${esc(d.title||'')}<\u002Ftextarea>\n          <div id=\"vsSections\">${sectionsHtml}<\u002Fdiv>\n          <div class=\"vs-add-row\" onclick=\"vsAddBlock('text')\">\n            <svg width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" viewBox=\"0 0 12 12\"><line x1=\"6\" y1=\"1\" x2=\"6\" y2=\"11\"/><line x1=\"1\" y1=\"6\" x2=\"11\" y2=\"6\"/><\u002Fsvg>\n            Añadir bloque\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n\n  c.querySelectorAll('textarea').forEach(t=>autoR(t));\n  vsBindDrag();\n  vsCoverBindDrag();\n  document.addEventListener('keydown',_vsKeyHandler);\n}\n\nfunction vsToggleToolbar(){\n  _vsToolbarOpen=!_vsToolbarOpen;\n  const panel=document.getElementById('vsToolbar');\n  const tab=document.getElementById('vsToolbarTab');\n  if(panel) panel.classList.toggle('closed',!_vsToolbarOpen);\n  if(tab) tab.classList.toggle('open',!!_vsToolbarOpen);\n}\n\nfunction vsRenderSection(s,idx){\n  const secId=`vssec-${s.id}`;\n  let inner='';\n\n  if(s.type==='h1'){\n    inner=`<textarea class=\"vs-block-h1\" rows=\"1\" oninput=\"autoR(this);vsSave('${s.id}','content',this.value)\" onkeydown=\"vsBlockKey(event,'${s.id}')\" placeholder=\"\">${esc(s.content||'')}<\u002Ftextarea>`;\n  } else if(s.type==='h2'){\n    inner=`<textarea class=\"vs-block-h2\" rows=\"1\" oninput=\"autoR(this);vsSave('${s.id}','content',this.value)\" onkeydown=\"vsBlockKey(event,'${s.id}')\" placeholder=\"\">${esc(s.content||'')}<\u002Ftextarea>`;\n  } else if(s.type==='h3'){\n    inner=`<textarea class=\"vs-block-h3\" rows=\"1\" oninput=\"autoR(this);vsSave('${s.id}','content',this.value)\" onkeydown=\"vsBlockKey(event,'${s.id}')\" placeholder=\"\">${esc(s.content||'')}<\u002Ftextarea>`;\n  } else if(s.type==='text'){\n    inner=`<textarea class=\"vs-block-text\" rows=\"1\" oninput=\"autoR(this);vsSave('${s.id}','content',this.value)\" onkeydown=\"vsBlockKey(event,'${s.id}')\" placeholder=\"\">${esc(s.content||'')}<\u002Ftextarea>`;\n  } else if(s.type==='quote'){\n    inner=`<textarea class=\"vs-block-quote\" rows=\"1\" oninput=\"autoR(this);vsSave('${s.id}','content',this.value)\" onkeydown=\"vsBlockKey(event,'${s.id}')\" placeholder=\"\">${esc(s.content||'')}<\u002Ftextarea>`;\n  } else if(s.type==='callout'){\n    inner=`<div class=\"vs-block-callout\">\n      <span class=\"vs-callout-icon\" onclick=\"vsPickCalloutIcon('${s.id}')\" title=\"Cambiar icono\">${esc(s.icon||'💡')}<\u002Fspan>\n      <textarea class=\"vs-callout-text\" rows=\"1\" oninput=\"autoR(this);vsSave('${s.id}','content',this.value)\" onkeydown=\"vsBlockKey(event,'${s.id}')\" placeholder=\"\">${esc(s.content||'')}<\u002Ftextarea>\n    <\u002Fdiv>`;\n  } else if(s.type==='divider'){\n    inner=`<hr class=\"vs-block-divider\">`;\n  } else if(s.type==='bullets'){\n    const items=(s.items||[]);\n    const rows=items.map((it,bi)=>`\n      <div class=\"vs-bullet-item\">\n        <div class=\"vs-bullet-dot\"><\u002Fdiv>\n        <textarea class=\"vs-bullet-inp\" rows=\"1\" oninput=\"autoR(this);vsSaveBullet('${s.id}',${bi},this.value)\"\n          onkeydown=\"vsBulletKey(event,'${s.id}',${bi})\"\n          placeholder=\"\">${esc(it)}<\u002Ftextarea>\n        <button class=\"vs-bullet-del\" onclick=\"vsDelBullet('${s.id}',${bi})\">✕<\u002Fbutton>\n      <\u002Fdiv>`).join('');\n    inner=`<div class=\"vs-bullet-list\" id=\"vsbl-${s.id}\">${rows}<\u002Fdiv>\n      <div class=\"vs-add-bullet\" onclick=\"vsAddBullet('${s.id}')\">\n        <svg width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" viewBox=\"0 0 11 11\"><line x1=\"5.5\" y1=\"1\" x2=\"5.5\" y2=\"10\"/><line x1=\"1\" y1=\"5.5\" x2=\"10\" y2=\"5.5\"/><\u002Fsvg>\n        Añadir elemento\n      <\u002Fdiv>`;\n  } else if(s.type==='gallery'){\n    const cols=s.cols||vsData._defCols||3;\n    const media=s.media||[];\n    const slots=[...media,null];\n    const cells=slots.map((m,mi)=>{\n      if(!m) return `\n        <div class=\"vs-media-cell\" onclick=\"vsPickMedia('${s.id}',${mi})\">\n          <div class=\"vs-media-empty\">\n            <svg width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\" fill=\"currentColor\"/><path d=\"M21 15l-5-5L5 21\"/><\u002Fsvg>\n            <span>Foto / Video<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"file\" class=\"vs-file-inp\" id=\"vsmf-${s.id}-${mi}\" accept=\"image/*,video/*\" onchange=\"vsMediaLoad(event,'${s.id}',${mi})\">\n        <\u002Fdiv>`;\n      const isVid=m.type==='video';\n      return `\n        <div class=\"vs-media-cell\" onclick=\"vsLbOpen('${s.id}',${mi})\">\n          ${isVid?`<video src=\"${m.src}\" muted playsinline preload=\"metadata\"><\u002Fvideo>`:`<img src=\"${m.src}\" loading=\"lazy\" alt=\"${esc(m.caption||'')}\">`}\n          <button class=\"vs-media-del\" onclick=\"event.stopPropagation();vsDelMedia('${s.id}',${mi})\">✕<\u002Fbutton>\n          <input class=\"vs-media-caption\" placeholder=\"Descripción…\" value=\"${esc(m.caption||'')}\" onclick=\"event.stopPropagation()\" onchange=\"vsMediaCaption('${s.id}',${mi},this.value)\">\n        <\u002Fdiv>`;\n    }).join('');\n    inner=`\n      <div class=\"vs-gallery-hdr\">\n        <span class=\"vs-gallery-lbl\">Galería<\u002Fspan>\n        <div style=\"display:flex;gap:3px\">\n          ${[2,3,4].map(n=>`<button class=\"vs-col-opt${cols===n?' sel':''}\" onclick=\"vsSetGalleryCols('${s.id}',${n})\" title=\"${n} columnas\">${n}<\u002Fbutton>`).join('')}\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vs-gallery cols-${cols}\" id=\"vsgal-${s.id}\">${cells}<\u002Fdiv>`;\n  }\n\n  return `<div class=\"vs-section\" id=\"${secId}\" data-sid=\"${s.id}\">\n    <div class=\"vs-drag-handle\" title=\"Clic para seleccionar · Arrastrar para mover\" onmousedown=\"vsHandleClick(event,'${s.id}')\">⠿<\u002Fdiv>\n    <button class=\"vs-add-here\" onclick=\"vsAddAfter(event,'${s.id}')\" title=\"Añadir bloque aquí\">＋<\u002Fbutton>\n    ${inner}\n    <button class=\"vs-sec-del\" onclick=\"vsDelSection('${s.id}')\" title=\"Eliminar (o seleccionar y pulsar Delete)\">✕<\u002Fbutton>\n  <\u002Fdiv>`;\n}\n\n// ── HELPERS ───────────────────────────────────────────\nfunction vsSave(sid,field,val){\n  const s=vsData.sections.find(x=>x.id===sid);\n  if(s) s[field]=val;\n  saveVision();\n}\nfunction vsSetDefCols(n){\n  vsData._defCols=n;saveVision();\n  document.querySelectorAll('#vsToolbarPanel .vs-col-opt').forEach(b=>{\n    b.classList.toggle('sel',+b.textContent===n);\n  });\n}\nfunction vsSetGalleryCols(sid,n){\n  const s=vsData.sections.find(x=>x.id===sid);\n  if(s) s.cols=n;saveVision();\n  const gal=document.getElementById('vsgal-'+sid);\n  if(gal) gal.className=`vs-gallery cols-${n}`;\n  const sec=document.getElementById('vssec-'+sid);\n  if(sec) sec.querySelectorAll('.vs-col-opt').forEach(b=>b.classList.toggle('sel',+b.textContent===n));\n}\n// Track which block currently has focus\nlet _vsFocusedSid = null;\nfunction _vsTrackFocus(){\n  document.querySelectorAll('.vs-section textarea, .vs-section input').forEach(el=>{\n    if(el._ftracked) return;\n    el._ftracked = true;\n    el.addEventListener('focus', ()=>{\n      const sec = el.closest('.vs-section');\n      if(sec) _vsFocusedSid = sec.dataset.sid;\n    });\n  });\n}\n\nfunction vsConvertBlock(sid, newType){\n  const arr = vsData.sections;\n  const s = arr.find(x=>x.id===sid);\n  if(!s) return;\n  s.type = newType;\n  if(newType==='bullets'){ s.items = s.content?[s.content]:[''];  delete s.content; }\n  else { s.content = (s.items&&s.items[0])||s.content||''; delete s.items; }\n  if(newType==='callout') s.icon = s.icon||'💡';\n  if(newType==='gallery'){ s.media=[]; s.cols=vsData._defCols||3; delete s.content; }\n  saveVision();\n  // Re-render just this block\n  const el = document.getElementById('vssec-'+sid);\n  if(el){\n    const tmp=document.createElement('div');\n    tmp.innerHTML=vsRenderSection(s, arr.indexOf(s));\n    const newEl=tmp.firstChild;\n    el.replaceWith(newEl);\n    newEl.querySelectorAll('textarea').forEach(t=>autoR(t));\n    vsBindDrag();\n    _vsTrackFocus();\n    _vsFocusedSid = sid;\n    setTimeout(()=>{\n      const ta=newEl.querySelector('textarea');\n      if(ta){ ta.focus(); ta.selectionStart=ta.selectionEnd=(ta.value||'').length; }\n    },30);\n  }\n}\n\nfunction vsAddBlock(type){\n  const focusSid = _vsFocusedSid;\n  const arr = vsData.sections;\n  const focusIdx = focusSid ? arr.findIndex(x=>x.id===focusSid) : -1;\n\n  // If a block has focus and is EMPTY → convert it instead of adding a new one\n  if(focusIdx >= 0 && type !== 'gallery'){\n    const focSec = arr[focusIdx];\n    const isEmpty = (\n      (focSec.type!=='bullets' && !(focSec.content||'').trim()) ||\n      (focSec.type==='bullets' && focSec.items && focSec.items.length===1 && !focSec.items[0].trim())\n    );\n    if(isEmpty && focSec.type!=='divider' && focSec.type!=='gallery'){\n      vsConvertBlock(focusSid, type);\n      return;\n    }\n  }\n\n  // Has content or no focus → insert after focused block (or append)\n  const s={id:'vs'+Date.now()+Math.random().toString(36).slice(2,4),type};\n  if(type==='bullets') s.items=[''];\n  if(type==='gallery'){s.media=[];s.cols=vsData._defCols||3;}\n  if(type==='callout'){s.icon='💡';s.content='';}\n  if(['h1','h2','h3','text','quote'].includes(type)) s.content='';\n\n  const container=document.getElementById('vsSections');\n  const tmp=document.createElement('div');\n  tmp.innerHTML=vsRenderSection(s, 0);\n  const el=tmp.firstChild;\n\n  if(focusIdx >= 0){\n    arr.splice(focusIdx+1, 0, s);\n    saveVision();\n    const refEl = document.getElementById('vssec-'+focusSid);\n    if(refEl && container){ refEl.after(el); }\n    else if(container){ container.appendChild(el); }\n  } else {\n    arr.push(s);\n    saveVision();\n    if(container) container.appendChild(el);\n  }\n\n  if(container){\n    el.querySelectorAll('textarea').forEach(t=>autoR(t));\n    vsBindDrag();\n    _vsTrackFocus();\n    setTimeout(()=>{\n      el.scrollIntoView({behavior:'smooth',block:'nearest'});\n      const ta=el.querySelector('textarea');\n      if(ta){ ta.focus(); ta.selectionStart=ta.selectionEnd=0; }\n    },40);\n  }\n}\nfunction vsDelSection(sid){\n  vsData.sections=vsData.sections.filter(s=>s.id!==sid);saveVision();\n  const el=document.getElementById('vssec-'+sid);if(el)el.remove();\n  if(_vsSelectedId===sid) _vsSelectedId=null;\n  _vsCloseInlinePicker();\n}\n\n// ── INLINE + PICKER ───────────────────────────────────\nlet _vsInlinePicker=null;\nfunction _vsCloseInlinePicker(){\n  if(_vsInlinePicker){_vsInlinePicker.remove();_vsInlinePicker=null;}\n}\nfunction vsAddAfter(e,afterSid){\n  e.stopPropagation();\n  _vsCloseInlinePicker();\n\n  const btn=e.currentTarget;\n  const rect=btn.getBoundingClientRect();\n\n  const types=[\n    {type:'text',   icon:'¶',  label:'Texto'},\n    {type:'h1',     icon:'H1', label:'Título 1'},\n    {type:'h2',     icon:'H2', label:'Título 2'},\n    {type:'h3',     icon:'H3', label:'Título 3'},\n    {type:'bullets',icon:'•',  label:'Lista'},\n    {type:'callout',icon:'💡', label:'Callout'},\n    {type:'quote',  icon:'❝',  label:'Cita'},\n    {type:'divider',icon:'—',  label:'Divisor'},\n    {type:'gallery',icon:'⊞',  label:'Galería'},\n  ];\n\n  const picker=document.createElement('div');\n  picker.className='vs-inline-picker';\n  picker.innerHTML=types.map(t=>`\n    <div class=\"vs-inline-picker-item\" onclick=\"vsInsertAfter('${afterSid}','${t.type}')\">\n      <div class=\"vs-inline-picker-icon\">${t.icon}<\u002Fdiv>\n      <span>${t.label}<\u002Fspan>\n    <\u002Fdiv>`).join('');\n\n  // Position: below and to the right of the + button\n  const scrollEl=document.getElementById('vsScroll');\n  const scrollTop=scrollEl?scrollEl.scrollTop:0;\n  picker.style.top=(rect.bottom+4)+'px';\n  picker.style.left=(rect.left)+'px';\n\n  document.body.appendChild(picker);\n  _vsInlinePicker=picker;\n\n  // Close on outside click\n  setTimeout(()=>{\n    const closeOutside=(ev)=>{\n      if(!picker.contains(ev.target)){_vsCloseInlinePicker();document.removeEventListener('mousedown',closeOutside);}\n    };\n    document.addEventListener('mousedown',closeOutside);\n  },0);\n}\n\nfunction vsInsertAfter(afterSid,type){\n  _vsCloseInlinePicker();\n  const newSec={id:'vs'+Date.now(),type};\n  if(type==='bullets') newSec.items=[''];\n  if(type==='gallery'){newSec.media=[];newSec.cols=vsData._defCols||3;}\n  if(type==='callout'){newSec.icon='💡';newSec.content='';}\n  if(['h1','h2','h3','text','quote'].includes(type)) newSec.content='';\n\n  // Insert right after the reference block\n  const arr=vsData.sections;\n  const idx=arr.findIndex(s=>s.id===afterSid);\n  if(idx>=0) arr.splice(idx+1,0,newSec);\n  else arr.push(newSec);\n  saveVision();\n\n  // DOM: insert after the reference element\n  const refEl=document.getElementById('vssec-'+afterSid);\n  const container=document.getElementById('vsSections');\n  if(refEl&&container){\n    const tmp=document.createElement('div');\n    tmp.innerHTML=vsRenderSection(newSec,arr.indexOf(newSec));\n    const newEl=tmp.firstChild;\n    refEl.after(newEl);\n    newEl.querySelectorAll('textarea').forEach(t=>autoR(t));\n    vsBindDrag();\n    setTimeout(()=>{\n      newEl.scrollIntoView({behavior:'smooth',block:'nearest'});\n      const ta=newEl.querySelector('textarea');if(ta)ta.focus();\n    },60);\n  }\n}\n\n// ── SELECTION ────────────────────────────────────────\nlet _vsSelectedId=null;\nfunction vsHandleClick(e,sid){\n  e.stopPropagation();\n  vsSelectBlock(sid);\n  // Start drag immediately on mousedown\n  vsStartDrag(e,sid);\n}\nfunction vsSelectBlock(sid){\n  // Deselect previous\n  if(_vsSelectedId&&_vsSelectedId!==sid){\n    const prev=document.getElementById('vssec-'+_vsSelectedId);\n    if(prev) prev.classList.remove('vs-selected');\n  }\n  _vsSelectedId=sid;\n  const el=document.getElementById('vssec-'+sid);\n  if(el) el.classList.toggle('vs-selected');\n  if(el&&el.classList.contains('vs-selected')) _vsSelectedId=sid;\n  else _vsSelectedId=null;\n}\nfunction vsDeselect(e){\n  // Click on page bg deselects\n  if(e.target.classList.contains('vs-scroll')||e.target.classList.contains('vs-page')||e.target.id==='vsSections'){\n    if(_vsSelectedId){\n      const prev=document.getElementById('vssec-'+_vsSelectedId);\n      if(prev) prev.classList.remove('vs-selected');\n      _vsSelectedId=null;\n    }\n  }\n}\nfunction _vsKeyHandler(e){\n  if(curView!=='vision') return;\n  const active=document.activeElement;\n  const inInput=active&&(active.tagName==='TEXTAREA'||active.tagName==='INPUT');\n\n  // Ctrl+Z / Cmd+Z: native undo inside textarea — just let browser handle it\n  // We intercept only to re-sync vsData after undo\n  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&inInput&&active.tagName==='TEXTAREA'){\n    // Let browser undo happen, then sync data after a tick\n    setTimeout(()=>{\n      const sid=active.closest('.vs-section')?.dataset?.sid;\n      if(sid){\n        const s=vsData.sections.find(x=>x.id===sid);\n        if(s) s.content=active.value;\n        saveVision();\n      }\n    },0);\n    return; // don't preventDefault — let browser undo work\n  }\n\n  if(e.key==='Delete'||e.key==='Backspace'){\n    if(inInput&&active.tagName==='TEXTAREA'){\n      const start=active.selectionStart,end=active.selectionEnd;\n      if(end>start){\n        setTimeout(()=>{\n          const sid=active.closest('.vs-section')?.dataset?.sid;\n          if(sid){const s=vsData.sections.find(x=>x.id===sid);if(s)s.content=active.value;saveVision();}\n        },0);\n      }\n      return;\n    }\n    // Multi-select delete\n    if(!inInput&&_vsMultiSelected&&_vsMultiSelected.size>0){\n      e.preventDefault();\n      vsDeleteMultiSelected();\n      return;\n    }\n    // Single block delete\n    if(!inInput&&_vsSelectedId){\n      e.preventDefault();\n      vsDelSection(_vsSelectedId);\n    }\n  }\n  if(e.key==='Escape'){\n    if(_vsMultiSelected&&_vsMultiSelected.size>0){ _vsClearMultiSelect(); return; }\n    if(_vsSelectedId){\n      const el=document.getElementById('vssec-'+_vsSelectedId);\n      if(el) el.classList.remove('vs-selected');\n      _vsSelectedId=null;\n    }\n  }\n}\n\n\n// ── ENTER → CREAR BLOQUE DEBAJO (Notion-style) ────────\n// Works for Vision blocks\nfunction vsBlockKey(e, sid){\n  if(e.key === 'Enter' && !e.shiftKey){\n    e.preventDefault();\n    // Save current value first\n    const ta = e.target;\n    const s = vsData.sections.find(x=>x.id===sid);\n    if(s) { s.content = ta.value; saveVision(); }\n    // Insert new text block right after this one\n    const newSec = {id:'vs'+Date.now()+Math.random().toString(36).slice(2,4), type:'text', content:''};\n    const arr = vsData.sections;\n    const idx = arr.findIndex(x=>x.id===sid);\n    arr.splice(idx+1, 0, newSec);\n    saveVision();\n    // DOM: insert new block after the current section element\n    const refEl = document.getElementById('vssec-'+sid);\n    const container = document.getElementById('vsSections');\n    if(refEl && container){\n      const tmp = document.createElement('div');\n      tmp.innerHTML = vsRenderSection(newSec, idx+1);\n      const newEl = tmp.firstChild;\n      refEl.after(newEl);\n      newEl.querySelectorAll('textarea').forEach(t=>autoR(t));\n      vsBindDrag();\n      setTimeout(()=>{\n        const newTa = newEl.querySelector('textarea');\n        if(newTa){ newTa.focus(); newTa.selectionStart = newTa.selectionEnd = 0; }\n      }, 30);\n    }\n  }\n}\n\n// Works for Docs blocks\nfunction docsBlockKey(e, docId, bid){\n  if(e.key === 'Enter' && !e.shiftKey){\n    e.preventDefault();\n    // Save current content\n    const ta = e.target;\n    docsBlockSave(docId, bid, 'content', ta.value);\n    // Create new text block after this one\n    docsAddBlockAfter(docId, bid, 'text');\n  }\n}\n\n// Insert a block right after a specific block id (for Docs)\nfunction docsAddBlockAfter(docId, afterBid, type){\n  const doc = docsData.find(d=>d.id===docId);\n  if(!doc) return;\n  const blk = {id:'b'+Date.now()+Math.random().toString(36).slice(2,5), type, content:'',\n    items: type==='bullets'?['']:undefined,\n    icon: type==='callout'?'💡':undefined};\n  if(!doc.blocks) doc.blocks=[];\n  const idx = doc.blocks.findIndex(b=>b.id===afterBid);\n  if(idx>=0) doc.blocks.splice(idx+1, 0, blk);\n  else doc.blocks.push(blk);\n  doc.updated = Date.now();\n  docsSave();\n  // DOM: insert after current section\n  const area = document.getElementById('docsBlocksArea');\n  const refEl = document.getElementById(`docssec-${docId}-${afterBid}`);\n  if(area){\n    const tmp = document.createElement('div');\n    tmp.innerHTML = _docsRenderBlock(docId, blk, 0);\n    const newEl = tmp.firstElementChild;\n    if(refEl) refEl.after(newEl);\n    else area.appendChild(newEl);\n    _docsTrackFocus();\n    setTimeout(()=>{\n      const ta = newEl.querySelector('textarea');\n      if(ta){ autoR(ta); ta.focus(); ta.selectionStart = ta.selectionEnd = 0; }\n    }, 30);\n  }\n}\n\n// ── LASSO MULTI-SELECT for Vision ─────────────────────\n// Drag on
