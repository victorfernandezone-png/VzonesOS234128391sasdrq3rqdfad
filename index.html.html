document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ackground:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--tx3);transition:all .12s;font-family:var(--mono)}\n.vs-col-opt.sel{border-color:var(--accent);background:var(--accent);color:#fff}\n.vs-col-opt:hover:not(.sel){background:var(--s3);color:var(--tx)}\n\n/* Page scroll area */\n.vs-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-user-select:none}\n.vs-scroll::-webkit-scrollbar{width:4px}\n.vs-scroll::-webkit-scrollbar-thumb{background:var(--b2);border-radius:4px}\n.vs-page{max-width:800px;margin:0 auto;padding:52px 56px 100px 56px;transition:max-width .3s cubic-bezier(.22,1,.36,1)}\n.vs-page.full-width{max-width:100%;padding-left:32px;padding-right:32px}\n@media(max-width:900px){.vs-page{padding:32px 24px 80px 24px}}\n\n/* Cover */\n.vs-cover{width:100%;height:220px;background:linear-gradient(135deg,#1a1b2e 0%,#16213e 50%,#0f3460 100%);margin-bottom:0;position:relative;overflow:hidden;flex-shrink:0;user-select:none}\n.vs-cover img{width:100%;height:100%;object-fit:cover;object-position:center 50%;pointer-events:none;display:block}\n.vs-cover.dragging{cursor:ns-resize}\n.vs-cover.dragging img{transition:none}\n/* Cover controls on hover */\n.vs-cover-controls{position:absolute;bottom:10px;right:14px;display:flex;gap:6px;opacity:0;transition:opacity .18s}\n.vs-cover:hover .vs-cover-controls{opacity:1}\n.vs-cover-btn{padding:5px 10px;background:rgba(0,0,0,.48);border:none;border-radius:6px;color:rgba(255,255,255,.85);font-size:11px;cursor:pointer;font-family:var(--font);backdrop-filter:blur(8px);transition:all .15s;white-space:nowrap}\n.vs-cover-btn:hover{background:rgba(0,0,0,.72);color:#fff}\n.vs-cover-drag-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.42);color:rgba(255,255,255,.8);font-size:11px;padding:5px 14px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .2s;font-family:var(--font);backdrop-filter:blur(6px);white-space:nowrap}\n.vs-cover:hover .vs-cover-drag-hint{opacity:1}\n/* Width toggle in toolbar */\n.vs-width-btn{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:7px;border:none;background:none;cursor:pointer;font-size:12px;font-family:var(--font);transition:all .12s;width:100%;text-align:left}\n.vs-width-btn:hover{background:var(--s2)}\n.vs-width-btn.full{color:var(--accent)}\n.vs-width-btn:not(.full){color:var(--tx2)}\n\n/* ── VS placeholder hidden unless focused ── */\n.vs-block-h1,.vs-block-h2,.vs-block-h3,.vs-block-text,.vs-block-quote,.vs-callout-text,.vs-bullet-inp{caret-color:var(--tx)}\n/* Hide placeholder text by default, show only on focus */\n.vs-block-h1::placeholder,.vs-block-h2::placeholder,.vs-block-h3::placeholder,.vs-block-text::placeholder,.vs-block-quote::placeholder,.vs-callout-text::placeholder,.vs-bullet-inp::placeholder{color:transparent!important}\n\n/* Page title */\n.vs-page-title{font-family:var(--font);font-size:34px;font-weight:800;color:var(--tx);letter-spacing:-.6px;line-height:1.2;border:none;outline:none;background:transparent;width:100%;resize:none;overflow:hidden;margin-bottom:32px;padding:0}\n.vs-page-title::placeholder{color:var(--tx3);transition:color .15s}\n.vs-page-title:focus::placeholder{color:var(--tx3)}\n.vs-section{margin-bottom:4px;position:relative;padding-left:46px;border-radius:6px;transition:background .1s}\n.vs-section.vs-selected{background:rgba(0,0,0,.012);outline:.5px solid rgba(0,0,0,.08);outline-offset:1px}\n.vs-section.vs-drag-ghost{opacity:.35;background:var(--s3);border:1.5px dashed var(--b2)}\n.vs-drag-over-line{height:3px;border-radius:2px;background:var(--accent);margin:2px 0;pointer-events:none;display:none}\n.vs-drag-over-line.vis{display:block}\n\n/* Drag handle — always visible on hover or selected */\n.vs-drag-handle{position:absolute;left:4px;top:6px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--tx3);opacity:0;cursor:grab;transition:opacity .12s;font-size:13px;user-select:none;border-radius:3px}\n.vs-section:hover .vs-drag-handle,.vs-section.vs-selected .vs-drag-handle{opacity:.5}\n.vs-drag-handle:hover{opacity:1!important;background:var(--s3)}\n.vs-drag-handle:active{cursor:grabbing;opacity:1!important}\n/* + add block button next to drag handle */\n.vs-add-here{position:absolute;left:24px;top:6px;width:18px;height:18px;border-radius:4px;border:none;background:none;cursor:pointer;font-size:14px;color:var(--tx3);opacity:0;transition:opacity .12s,background .1s;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}\n.vs-section:hover .vs-add-here,.vs-section.vs-selected .vs-add-here{opacity:.5}\n.vs-add-here:hover{opacity:1!important;background:var(--s3);color:var(--tx)}\n/* Inline block type picker that appears after + */\n.vs-inline-picker{position:fixed;background:var(--surface);border:.5px solid var(--b2);border-radius:10px;padding:5px;z-index:600;box-shadow:var(--shadow);min-width:172px;animation:panIn .12s ease}\n.vs-inline-picker-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--tx2);font-family:var(--font);transition:background .1s;white-space:nowrap}\n.vs-inline-picker-item:hover{background:var(--s2);color:var(--tx)}\n.vs-inline-picker-icon{width:24px;height:24px;border-radius:5px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:var(--tx3)}\n\n/* Delete button — top right, shows on hover/selected */\n.vs-sec-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:5px;border:none;background:none;cursor:pointer;font-size:11px;color:var(--tx3);opacity:0;transition:all .12s;display:flex;align-items:center;justify-content:center}\n.vs-section:hover .vs-sec-del,.vs-section.vs-selected .vs-sec-del{opacity:.5}\n.vs-sec-del:hover{background:var(--red);color:#fff;opacity:1!important}\n\n/* Text blocks — all use app sans font */\n.vs-block-h1{font-family:var(--font);font-size:26px;font-weight:800;color:var(--tx);letter-spacing:-.4px;line-height:1.3;border:none;outline:none;background:transparent;width:100%;resize:none;overflow:hidden;padding:6px 0 2px;min-height:38px}\n.vs-block-h2{font-family:var(--font);font-size:19px;font-weight:700;color:var(--tx);letter-spacing:-.2px;line-height:1.4;border:none;outline:none;background:transparent;width:100%;resize:none;overflow:hidden;padding:5px 0 2px;min-height:30px}\n.vs-block-h3{font-family:var(--font);font-size:15px;font-weight:700;color:var(--tx);line-height:1.5;border:none;outline:none;background:transparent;width:100%;resize:none;overflow:hidden;padding:4px 0 2px;min-height:26px}\n.vs-block-text{font-family:var(--font);font-size:14px;font-weight:400;color:var(--tx2);line-height:1.75;border:none;outline:none;background:transparent;width:100%;resize:none;overflow:hidden;padding:3px 0;min-height:26px}\n.vs-block-quote{font-family:var(--font);font-size:14px;font-style:italic;color:var(--tx2);line-height:1.7;border:none;outline:none;background:transparent;width:100%;resize:none;overflow:hidden;padding:6px 14px;min-height:28px;border-left:3px solid var(--accent2)}\n.vs-block-callout{background:var(--s2);border-radius:8px;padding:12px 16px;border:.5px solid var(--b2);display:flex;gap:10px;align-items:flex-start}\n.vs-callout-icon{font-size:17px;flex-shrink:0;margin-top:2px;cursor:pointer}\n.vs-callout-text{font-family:var(--font);font-size:13px;color:var(--tx2);line-height:1.65;border:none;outline:none;background:transparent;flex:1;resize:none;overflow:hidden;min-height:22px}\n.vs-block-divider{border:none;border-top:.5px solid var(--b2);margin:8px 0;display:block;width:100%}\n/* Make divider section tall enough to click/grab */\n.vs-section:has(.vs-block-divider){min-height:28px}\n.vs-section:has(.vs-block-divider):hover{background:var(--s2);border-radius:6px}\ntextarea:focus{outline:none}\n\n/* Bullets */\n.vs-bullet-list{display:flex;flex-direction:column;gap:1px}\n.vs-bullet-item{display:flex;align-items:flex-start;gap:9px;padding:2px 0}\n.vs-bullet-dot{width:5px;height:5px;border-radius:50%;background:var(--tx3);flex-shrink:0;margin-top:9px}\n.vs-bullet-inp{font-family:var(--font);flex:1;font-size:13.5px;color:var(--tx);line-height:1.65;border:none;outline:none;background:transparent;resize:none;overflow:hidden;min-height:22px}\n.vs-bullet-del{width:16px;height:16px;border-radius:3px;border:none;background:none;cursor:pointer;opacity:0;font-size:10px;color:var(--tx3);transition:all .1s;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px}\n.vs-bullet-item:hover .vs-bullet-del{opacity:.5}\n.vs-bullet-del:hover{background:var(--red);color:#fff;opacity:1!important}\n.vs-add-bullet{display:flex;align-items:center;gap:6px;padding:4px 0;cursor:pointer;color:var(--tx3);font-size:11.5px;transition:color .12s;margin-top:3px;font-family:var(--font)}\n.vs-add-bullet:hover{color:var(--tx2)}\n\n/* Gallery */\n.vs-gallery{display:grid;gap:10px}\n.vs-gallery.cols-2{grid-template-columns:repeat(2,1fr)}\n.vs-gallery.cols-3{grid-template-columns:repeat(3,1fr)}\n.vs-gallery.cols-4{grid-template-columns:repeat(4,1fr)}\n.vs-gallery-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}\n.vs-gallery-lbl{font-size:10px;font-weight:600;color:var(--tx3);letter-spacing:.5px;text-transform:uppercase;font-family:var(--font)}\n.vs-media-cell{position:relative;border-radius:10px;overflow:hidden;border:.5px solid var(--b2);background:var(--s2);aspect-ratio:1;cursor:pointer;transition:all .15s}\n.vs-media-cell:hover{box-shadow:0 4px 18px rgba(0,0,0,.18)}\n.vs-media-cell img,.vs-media-cell video{width:100%;height:100%;object-fit:cover;display:block}\n.vs-media-empty{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--tx3);font-size:11px;transition:all .15s;font-family:var(--font)}\n.vs-media-cell:hover .vs-media-empty{color:var(--tx2);background:var(--s3)}\n.vs-media-empty svg{opacity:.4}\n.vs-media-del{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:5px;border:none;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:12px;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);line-height:1}\n.vs-media-cell:hover .vs-media-del{display:flex}\n.vs-media-del:hover{background:var(--red)}\n.vs-media-caption{position:absolute;bottom:0;left:0;right:0;padding:5px 8px;background:linear-gradient(transparent,rgba(0,0,0,.6));font-size:10px;color:rgba(255,255,255,.8);border:none;outline:none;font-family:var(--font);display:none}\n.vs-media-cell:has(img) .vs-media-caption,.vs-media-cell:has(video) .vs-media-caption,.vs-media-cell:hover .vs-media-caption{display:block}\n.vs-file-inp{display:none}\n\n/* Lightbox */\n.vs-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:900;display:none;align-items:center;justify-content:center;backdrop-filter:blur(12px)}\n.vs-lightbox.open{display:flex}\n.vs-lightbox-close{position:absolute;top:18px;right:22px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:background .15s}\n.vs-lightbox-close:hover{background:rgba(255,255,255,.22)}\n.vs-lightbox img,.vs-lightbox video{max-width:90vw;max-height:88vh;border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.6)}\n.vs-lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;transition:background .15s}\n.vs-lightbox-nav:hover{background:rgba(255,255,255,.22)}\n.vs-lightbox-prev{left:16px}\n.vs-lightbox-next{right:16px}\n\n/* Add block row */\n.vs-add-row{display:flex;align-items:center;gap:8px;padding:8px 0 8  onclick=\"mcPrev()\">‹<\u002Fbutton><button class=\"mc-btn\" onclick=\"mcNext()\">›<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mc-grid\" id=\"mcGrid\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"bk-row\">\n    <button class=\"bk-btn\" onclick=\"exportData()\">↓ Exportar<\u002Fbutton>\n    <button class=\"bk-btn\" onclick=\"document.getElementById('importInput').click()\">↑ Importar<\u002Fbutton>\n    <input type=\"file\" id=\"importInput\" accept=\".json,.vos\" onchange=\"importData(event)\">\n  <\u002Fdiv>\n<\u002Faside>\n<main class=\"main\">\n  <div class=\"topbar\">\n    <button class=\"sidebar-toggle\" id=\"sidebarToggle\" onclick=\"toggleSidebar()\" title=\"Ocultar/mostrar panel\">\n      <svg viewBox=\"0 0 15 15\"><rect x=\"1\" y=\"2.5\" width=\"5\" height=\"10\" rx=\"1.5\"><\u002Frect><line x1=\"9\" y1=\"4\" x2=\"14\" y2=\"4\"><\u002Fline><line x1=\"9\" y1=\"7.5\" x2=\"14\" y2=\"7.5\"><\u002Fline><line x1=\"9\" y1=\"11\" x2=\"14\" y2=\"11\"><\u002Fline><\u002Fsvg>\n    <\u002Fbutton>\n    <span class=\"tb-title\" id=\"tbTitle\"><\u002Fspan>\n    <div class=\"tb-nav\">\n      <button class=\"tb-btn\" onclick=\"navPrev()\">‹<\u002Fbutton>\n      <button class=\"tb-btn\" onclick=\"goToday()\" style=\"font-size:10px;font-weight:500\">Hoy<\u002Fbutton>\n      <button class=\"tb-btn\" onclick=\"navNext()\">›<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"view-tabs\" id=\"viewTabsBar\">\n      <div class=\"vt active\" id=\"tab-week\" onclick=\"setView('week')\">Semana<\u002Fdiv>\n      <div class=\"vt\" id=\"tab-wcal\" onclick=\"setView('wcal')\">Calendario<\u002Fdiv>\n      <div class=\"vt\" id=\"tab-month\" onclick=\"setView('month')\">Mes<\u002Fdiv>\n      <div class=\"vt\" id=\"tab-day\" onclick=\"setView('day')\">Día<\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"add-btn\" onclick=\"openModal()\">+<\u002Fbutton>\n    <span id=\"saveIndicator\" title=\"Guardado automático\" style=\"width:7px;height:7px;border-radius:50%;background:#43a873;opacity:0;transition:opacity .4s;flex-shrink:0;margin-left:2px\"><\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"content\" id=\"mainContent\"><\u002Fdiv>\n<\u002Fmain>\n<\u002Fdiv>\n<!-- COLOR POPUP -->\n<div id=\"colorPopup\" class=\"task-color-popup\" style=\"position:fixed;z-index:500\"><\u002Fdiv>\n<!-- DETAIL -->\n<div class=\"dl-ov\" id=\"dlOv\" onclick=\"if(event.target===this)closeDetail()\">\n  <div class=\"dl-panel\">\n    <div class=\"dl-top\">\n      <div class=\"dl-hdr\">\n        <div class=\"dl-chk\" id=\"dlChk\" onclick=\"dlToggle()\"><\u002Fdiv>\n        <textarea class=\"dl-titl\" id=\"dlTitl\" rows=\"1\" placeholder=\"Título\" oninput=\"autoR(this);dlAutoSaveField('text',this.value)\"><\u002Ftextarea>\n      <\u002Fdiv>\n      <div class=\"dl-meta-row\">\n        <div class=\"dl-meta-item\"><span class=\"dl-meta-lbl\">Fecha<\u002Fspan>\n          <input type=\"date\" class=\"dl-date-inp\" id=\"dlDate\"><\u002Fdiv>\n        <div class=\"dl-meta-item\"><span class=\"dl-meta-lbl\">Inicio<\u002Fspan>\n          <input type=\"text\" class=\"dl-time-inp\" id=\"dlStart\" placeholder=\"10:00\" oninput=\"dlAutoSaveField('time',this.value)\" onchange=\"dlAutoSaveField('time',this.value)\"><\u002Fdiv>\n        <span class=\"dl-tsep\">→<\u002Fspan>\n        <div class=\"dl-meta-item\" style=\"display:flex;align-items:center;gap:5px\">\n          <input type=\"text\" class=\"dl-time-inp\" id=\"dlEnd\" placeholder=\"11:00\" oninput=\"dlAutoSaveField('end',this.value)\" onchange=\"dlAutoSaveField('end',this.value)\">\n          <button id=\"dlClearTimes\" onclick=\"dlClearTimes()\" title=\"Quitar horas\" style=\"width:20px;height:20px;border-radius:4px;border:none;background:none;cursor:pointer;font-size:13px;color:var(--red);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;flex-shrink:0;line-height:1;padding:0\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"dl-meta-item\" style=\"margin-left:auto\">\n          <div class=\"dl-colors-row\" id=\"dlColors\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dl-notes-wrap\" id=\"dlNotesWrap\">\n      <!-- Simple block toolbar — same interaction model as Visualización -->\n      <div class=\"docs-blk-toolbar\" id=\"dnToolbar\" style=\"border-bottom:.5px solid var(--b1)\">\n        <button class=\"docs-tb-btn\" onclick=\"dnAddBlock('h1')\">H1<\u002Fbutton>\n        <button class=\"docs-tb-btn\" onclick=\"dnAddBlock('h2')\">H2<\u002Fbutton>\n        <button class=\"docs-tb-btn\" onclick=\"dnAddBlock('h3')\">H3<\u002Fbutton>\n        <div class=\"docs-tb-sep\"><\u002Fdiv>\n        <button class=\"docs-tb-btn\" onclick=\"dnAddBlock('text')\">¶ Texto<\u002Fbutton>\n        <button class=\"docs-tb-btn\" onclick=\"dnAddBlock('bullets')\">• Lista<\u002Fbutton>\n        <button class=\"docs-tb-btn\" onclick=\"dnAddBlock('quote')\">❝ Cita<\u002Fbutton>\n        <button class=\"docs-tb-btn\" onclick=\"dnAddBlock('callout')\">💡 Nota<\u002Fbutton>\n        <button class=\"docs-tb-btn\" onclick=\"dnAddBlock('divider')\">— Divisor<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"docs-blocks-area\" id=\"dlBlocksArea\" style=\"padding:12px 22px 8px 6px\"><\u002Fdiv>\n      <div class=\"docs-blk-add-row\" onclick=\"dnAddBlock('text')\" style=\"margin:2px 22px 16px 46px;width:auto\">\n        <span>＋<\u002Fspan> Añadir bloque\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- SUBTASKS -->\n    <div class=\"dl-subtasks\" id=\"dlSubtasks\">\n      <div class=\"dl-subtasks-hdr\">\n        <span class=\"dl-subtasks-lbl\">Subtareas<\u002Fspan>\n        <button class=\"dl-subtask-add-btn\" onclick=\"dlAddSubtask()\">+ Añadir subtarea<\u002Fbutton>\n      <\u002Fdiv>\n      <div id=\"dlSubList\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dl-recur-row\" id=\"dlRecurRow\">\n      <span class=\"dl-recur-lbl\">Repetir<\u002Fspan>\n      <div class=\"dl-recur-opts\" id=\"dlRecurOpts\">\n        <button class=\"dl-recur-opt\" data-recur=\"none\" onclick=\"dlSetRecur('none')\">No<\u002Fbutton>\n        <button class=\"dl-recur-opt\" data-recur=\"daily\" onclick=\"dlSetRecur('daily')\">Diario<\u002Fbutton>\n        <button class=\"dl-recur-opt\" data-recur=\"weekdays\" onclick=\"dlSetRecur('weekdays')\">L–V<\u002Fbutton>\n        <button class=\"dl-recur-opt\" data-recur=\"weekends\" onclick=\"dlSetRecur('weekends')\">Fin de semana<\u002Fbutton>\n        <button class=\"dl-recur-opt\" data-recur=\"weekly\" onclick=\"dlSetRecur('weekly')\">Semanal<\u002Fbutton>\n        <button class=\"dl-recur-opt\" data-recur=\"monthly\" onclick=\"dlSetRecur('monthly')\">Mensual<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dl-foot\">\n      <button class=\"dl-del\" id=\"dlDelBtn\" onclick=\"dlDelete()\">Eliminar<\u002Fbutton>\n      <div class=\"dl-foot-right\">\n<button class=\"dl-save\" onclick=\"closeDetail()\">Guardar y cerrar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<!-- SLASH POPUP -->\n<div class=\"slash-popup\" id=\"slashPopup\"><\u002Fdiv>\n<!-- ADD MODAL -->\n<div class=\"mo-ov\" id=\"moOv\" onclick=\"if(event.target===this)closeMo()\">\n  <div class=\"mo-box\">\n    <div class=\"mo-ttl\" id=\"moTitle\">Nueva tarea<\u002Fdiv>\n    <div class=\"mo-lbl\">Título<\u002Fdiv>\n    <input type=\"text\" id=\"moText\" placeholder=\"¿Qué necesitas hacer?\">\n    <div class=\"mo-lbl\">Hora inicio (opcional)<\u002Fdiv>\n    <input type=\"text\" id=\"moTime\" placeholder=\"Ej: 10:00\">\n    <div class=\"mo-lbl\">Color<\u002Fdiv>\n    <div class=\"cr-row\" id=\"crRow\"><\u002Fdiv>\n    <div class=\"mo-row\">\n      <button class=\"mo-btn sec\" onclick=\"closeMo()\">Cancelar<\u002Fbutton>\n      <button class=\"mo-btn pri\" onclick=\"addTask()\">Agregar<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"toast\" id=\"toast\"><\u002Fdiv>\n<!-- RECUR DELETE MODAL -->\n<div class=\"dl-ov\" id=\"recurDelOv\" onclick=\"if(event.target===this)closeRecurDel()\" style=\"z-index:600\">\n  <div style=\"background:var(--surface);border-radius:13px;padding:22px 24px;width:320px;box-shadow:var(--shadow);animation:panIn .18s ease\">\n    <div style=\"font-size:15px;font-weight:500;margin-bottom:8px\">Eliminar tarea recurrente<\u002Fdiv>\n    <div style=\"font-size:13px;color:var(--tx2);margin-bottom:20px\">¿Quieres eliminar solo esta aparición o todas las instancias de esta serie?<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <button onclick=\"recurDelThis()\" style=\"padding:10px;border-radius:8px;border:none;background:var(--s2);color:var(--tx);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;text-align:left;padding:10px 14px\">Eliminar solo esta<\u002Fbutton>\n      <button onclick=\"recurDelAll()\" style=\"padding:10px 14px;border-radius:8px;border:none;background:var(--red);color:#fff;font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;text-align:left\">Eliminar todas las instancias<\u002Fbutton>\n      <button onclick=\"closeRecurDel()\" style=\"padding:10px 14px;border-radius:8px;border:.5px solid var(--b2);background:none;color:var(--tx2);font-family:var(--font);font-size:13px;cursor:pointer;text-align:left\">Cancelar<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<!-- MONTH BG FAB -->\n<button class=\"fab-bg\" id=\"fabBg\" onclick=\"toggleBgPicker()\" title=\"Cambiar fondo del mes\">🌌<\u002Fbutton>\n<div class=\"bg-picker\" id=\"bgPicker\">\n  <div class=\"bg-picker-ttl\">Fondo del mes<\u002Fdiv>\n  <div class=\"bg-picker-grid\" id=\"bgSwatchGrid\"><\u002Fdiv>\n  <label class=\"bg-picker-upload\">\n    📷 Subir imagen propia\n    <input type=\"file\" accept=\"image/*\" style=\"display:none\" onchange=\"bgUpload(event)\">\n  <\u002Flabel>\n<\u002Fdiv>\n<!-- VISION LIGHTBOX -->\n<div class=\"vs-lightbox\" id=\"vsLightbox\" onclick=\"vsLbClose()\">\n  <button class=\"vs-lightbox-close\" onclick=\"vsLbClose()\">✕<\u002Fbutton>\n  <button class=\"vs-lightbox-nav vs-lightbox-prev\" onclick=\"event.stopPropagation();vsLbNav(-1)\">‹<\u002Fbutton>\n  <div id=\"vsLbContent\" onclick=\"event.stopPropagation()\"><\u002Fdiv>\n  <button class=\"vs-lightbox-nav vs-lightbox-next\" onclick=\"event.stopPropagation();vsLbNav(1)\">›<\u002Fbutton>\n<\u002Fdiv>\n<script>\n// ── AUDIO ─────────────────────────────────────────────\nconst AC=new(window.AudioContext||window.webkitAudioContext)();\n\n// ── Natural soft UI sound engine ─────────────────────\n// Combines a tiny sine body with a very short noise transient → natural, muted click\nfunction _uiClick(freq, startT, dur, vol, decay=0.85){\n  try{\n    if(AC.state==='suspended') return;\n    // Sine body\n    const o=AC.createOscillator();\n    const g=AC.createGain();\n    const lp=AC.createBiquadFilter();\n    lp.type='lowpass';lp.frequency.value=freq*2.2;lp.Q.value=0.4;\n    o.type='sine';o.frequency.setValueAtTime(freq,startT);\n    o.connect(lp);lp.connect(g);g.connect(AC.destination);\n    g.gain.setValueAtTime(vol,startT);\n    g.gain.exponentialRampToValueAtTime(0.0001,startT+dur);\n    o.start(startT);o.stop(startT+dur+0.01);\n    // Noise click transient\n    const bSz=Math.ceil(AC.sampleRate*0.018);\n    const buf=AC.createBuffer(1,bSz,AC.sampleRate);\n    const d=buf.getChannelData(0);\n    for(let i=0;i<bSz;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(bSz*0.18));\n    const ns=AC.createBufferSource();ns.buffer=buf;\n    const ng=AC.createGain();\n    const hpf=AC.createBiquadFilter();hpf.type='highpass';hpf.frequency.value=1200;\n    ns.connect(hpf);hpf.connect(ng);ng.connect(AC.destination);\n    ng.gain.setValueAtTime(vol*0.55,startT);\n    ng.gain.exponentialRampToValueAtTime(0.0001,startT+0.025);\n    ns.start(startT);ns.stop(startT+0.03);\n  }catch(e){}\n}\n\n// Check complete — two gentle rising clicks like a macOS toggle\nconst sfxCheck=()=>{\n  if(AC.state==='suspended')AC.resume();\n  const t=AC.currentTime;\n  _uiClick(880,  t,       0.09, 0.055);\n  _uiClick(1320, t+0.06,  0.07, 0.038);\n};\n\n// Drop/move — single soft low tap\nconst sfxDrop=()=>{\n  if(AC.state==='suspended')AC.resume();\n  _uiClick(520, AC.currentTime, 0.06, 0.042);\n};\n\n// Add — light double-tick\nconst sfxAdd=()=>{\n  if(AC.state==='suspended')AC.resume();\n  const t=AC.currentTime;\n  _uiClick(1100, t,       0.055, 0.048);\n  _uiClick(1540, t+0.05,  0.045, 0.032);\n};\n\n// ── CONSTANTS ─────────────────────────────────────────\n// Unified premium color system: one curated rainbow-inspired range,\n// each with a signature two-tone gradient, reused across the whole\n// app (tasks, goals, hábitos, planning, gráficos) instead of separate\n// ad-hoc palettes per section. Index 5 stays a neutral \"sin color\".\nconst C_DARK=[\n  {bg:'#472c2c',tx:'#f0a8a4',dot:'#e2585a',dtx:'#a17878',grad:'linear-gradient(135deg,#e2585a,#f0918a)'},   // 0 Coral\n  {bg:'#4a3d22',tx:'#eec17a',dot:'#e0973a',dtx:'#a08c60',grad:'linear-gradient(135deg,#e0973a,#eec073)'},   // 1 Ámbar\n  {bg:'#1a3830',tx:'#7fd6bc',dot:'#43b389',dtx:'#61867a',grad:'linear-gradient(135deg,#43b389,#7fd6ac)'},   // 2 Esmeralda\n  {bg:'#23374a',tx:'#a8c8e8',dot:'#5a93d4',dtx:'#73889d',grad:'linear-gradient(135deg,#5a93d4,#8bb8ea)'},   // 3 Azul\n  {bg:'#392d48',tx:'#c0a8e0',dot:'#8b7cf6',dtx:'#83749a',grad:'linear-gradient(135deg,#8b7cf6,#b3a5fb)'},   // 4 Violeta\n  {bg:'transparent',tx:'var(--tx)',dot:'#8a8680',dtx:'#a6a29a',grad:'linear-gradient(135deg,#8a8680,#a6a29a)'},  // 5 Gris (sin color)\n];\nconst C_LIGHT=[\n  {bg:'#fbeeee',tx:'#cf4c47',dot:'#e2585a',grad:'linear-gradient(135deg,#e2585a,#f0918a)'},  // 0 Coral\n  {bg:'#fbf1e2',tx:'#b17422',dot:'#e0973a',grad:'linear-gradient(135deg,#e0973a,#eec073)'},  // 1 Ámbar\n  {bg:'#def7f0',tx:'#2f9c76',dot:'#43b389',grad:'linear-gradient(135deg,#43b389,#7fd6ac)'},  // 2 Esmeralda\n  {bg:'#f2f3fb',tx:'#4d76c2',dot:'#5a93d4',grad:'linear-gradient(135deg,#5a93d4,#8bb8ea)'},  // 3 Azul\n  {bg:'#eddff8',tx:'#5b4aac',dot:'#8b7cf6',grad:'linear-gradient(135deg,#8b7cf6,#b3a5fb)'},  // 4 Violeta\n  {bg:'transparent',tx:'var(--tx)',dot:'#8a8680',grad:'linear-gradient(135deg,#8a8680,#a6a29a)'},// 5 Gris (sin color)\n];\nlet C=C_DARK;\nfunction updateColorPalette(){C=isDark?C_DARK:C_LIGHT;}\n// Shared rainbow hex list — single source of truth reused for habits,\n// planning events and any other place that needs a color cycle outside\n// the task/goal palette above.\nconst RAINBOW_HEX=['#e2585a','#e0973a','#cdb23a','#43b389','#3fb3ad','#5a93d4','#6c76e0','#8b7cf6','#c264b0'];\nfunction rainbowGrad(hex,deg=135){\n  const idx=RAINBOW_HEX.indexOf(hex);\n  const pairs={'#e2585a':'#f0918a','#e0973a':'#eec073','#cdb23a':'#e4d27a','#43b389':'#7fd6ac','#3fb3ad':'#7fd6d2','#5a93d4':'#8bb8ea','#6c76e0':'#9aa1ef','#8b7cf6':'#b3a5fb','#c264b0':'#dd97cf'};\n  const to=pairs[hex]||hex;\n  return `linear-gradient(${deg}deg, ${hex}, ${to})`;\n}\n\nfunction getDetArr(){\n  if(detSource==='monthGoal') return monthGoals;\n  if(detSource==='yearGoal') return yearGoals;\n  if(detSource==='weekGoal'||detIsGoal) return weekGoals;\n  return tasks;\n}\nfunction saveDetArr(){\n  if(detSource==='monthGoal'){saveMonthGoals();return;}\n  if(detSource==='yearGoal'){saveYearGoals();return;}\n  if(detSource==='weekGoal'||detIsGoal){saveGoals();return;}\n  save();\n}\nfunction getDetItem(){return getDetArr().find(x=>x.id===detId);}\n\n// ══════════════════════════════════════════════════════\n// DETAIL NOTES — simple block editor (same interaction\n// model as Visualización: one toolbar to add blocks, plus\n// drag-and-drop to reorder). Replaces the old rich-text\n// notes editor across every Tasks view (Día/Semana/\n// Calendario/Mes) and the goal detail panel, since they all\n// share this one panel.\n// ══════════════════════════════════════════════════════\nlet _dnFocusedBid=null;\nfunction dnEnsureBlocks(item){\n  if(!item) return [];\n  if(Array.isArray(item.blocks)) return item.blocks;\n  let txt='';\n  if(typeof item.notes==='string' && item.notes.trim()){\n    try{\n      const tmp=document.createElement('div');\n      tmp.innerHTML=/<[a-z][\\s\\S]*>/i.test(item.notes)?item.notes:(renderMd(item.notes)||'');\n      txt=(tmp.textContent||'').trim();\n    }catch(e){txt=item.notes.trim();}\n  }\n  item.blocks = txt ? [{id:'b'+Date.now(),type:'text',content:txt}] : [];\n  return item.blocks;\n}\nfunction dnRenderPanel(){\n  const item=getDetItem();\n  const area=document.getElementById('dlBlocksArea');\n  if(!area) return;\n  if(!item){area.innerHTML='';return;}\n  const blocks=dnEnsureBlocks(item);\n  area.innerHTML=blocks.map((b,i)=>dnRenderBlock(b,i)).join('');\n  area.querySelectorAll('textarea').forEach(t=>autoR(t));\n  _dnTrackFocus();\n}\nfunction dnRenderBlock(blk,bi){\n  const sid=`dnblk-${blk.id}`;\n  let inner='';\n  const si=`oninput=\"autoR(this);dnBlockSave('${blk.id}','content',this.value)\"`;\n  const ki=`onkeydown=\"dnBlockKey(event,'${blk.id}')\"`;\n  const ph=`placeholder=\"${bi===0?'Escribe algo o usa los botones de arriba…':''}\"`;\n  if(blk.type==='h1') inner=`<textarea class=\"docs-blk-h1\" rows=\"1\" ${si} ${ki} ${ph}>${esc(blk.content||'')}<\u002Ftextarea>`;\n  else if(blk.type==='h2') inner=`<textarea class=\"docs-blk-h2\" rows=\"1\" ${si} ${ki} ${ph}>${esc(blk.content||'')}<\u002Ftextarea>`;\n  else if(blk.type==='h3') inner=`<textarea class=\"docs-blk-h3\" rows=\"1\" ${si} ${ki} ${ph}>${esc(blk.content||'')}<\u002Ftextarea>`;\n  else if(blk.type==='quote') inner=`<textarea class=\"docs-blk-quote\" rows=\"1\" ${si} ${ki} ${ph}>${esc(blk.content||'')}<\u002Ftextarea>`;\n  else if(blk.type==='callout'){\n    inner=`<div class=\"docs-blk-callout\">\n      <span class=\"docs-blk-callout-icon\" onclick=\"dnPickCalloutIcon('${blk.id}')\">${esc(blk.icon||'💡')}<\u002Fspan>\n      <textarea class=\"docs-blk-callout-text\" rows=\"1\" ${si} ${ki} ${ph}>${esc(blk.content||'')}<\u002Ftextarea>\n    <\u002Fdiv>`;\n  }\n  else if(blk.type==='divider') inner=`<hr class=\"docs-blk-hr\">`;\n  else if(blk.type==='bullets'){\n    const items=blk.items&&blk.items.length?blk.items:[''];\n    inner=items.map((it,ii)=>`<div class=\"docs-blk-bullet-row\">\n      <div class=\"docs-blk-bullet-dot\"><\u002Fdiv>\n      <textarea class=\"docs-blk-bullet-inp\" rows=\"1\" placeholder=\"\"\n        oninput=\"autoR(this);dnBulletSave('${blk.id}',${ii},this.value)\"\n        onkeydown=\"dnBulletKey(event,'${blk.id}',${ii})\">${esc(it)}<\u002Ftextarea>\n    <\u002Fdiv>`).join('');\n  }\n  else inner=`<textarea class=\"docs-blk-text\" rows=\"1\" ${si} ${ki} ${ph}>${esc(blk.content||'')}<\u002Ftextarea>`;\n\n  return `<div class=\"docs-block-section\" id=\"${sid}\" data-bid=\"${blk.id}\">\n    <div class=\"docs-blk-handle\" onmousedown=\"dnStartDrag(event,'${blk.id}')\" title=\"Arrastrar para mover\">⠿<\u002Fdiv>\n    <button class=\"docs-blk-add-here\" onclick=\"dnAddAfterInline(event,'${blk.id}')\" title=\"Añadir bloque aquí\">＋<\u002Fbutton>\n    <div style=\"flex:1;min-width:0;position:relative\">${inner}<\u002Fdiv>\n    <button class=\"docs-blk-del\" onclick=\"dnDelBlock('${blk.id}')\">✕<\u002Fbutton>\n  <\u002Fdiv>`;\n}\nfunction _dnTrackFocus(){\n  document.querySelectorAll('#dlBlocksArea textarea').forEach(el=>{\n    if(el._dnTracked) return;\n    el._dnTracked=true;\n    el.addEventListener('focus',()=>{\n      const sec=el.closest('.docs-block-section');\n      _dnFocusedBid=sec?sec.dataset.bid:null;\n    });\n  });\n}\nfunction dnBlockSave(bid,field,val){\n  const item=getDetItem(); if(!item) return;\n  const blk=(item.blocks||[]).find(b=>b.id===bid);\n  if(blk){ blk[field]=val; saveDetArr(); }\n}\nfunction dnBulletSave(bid,ii,val){\n  const item=getDetItem(); if(!item) return;\n  const blk=(item.blocks||[]).find(b=>b.id===bid);\n  if(blk&&blk.items){ blk.items[ii]=val; saveDetArr(); }\n}\nfunction dnBlockKey(e,bid){\n  if(e.key==='Enter'&&!e.shiftKey){\n    e.preventDefault();\n    dnBlockSave(bid,'content',e.target.value);\n    dnAddBlockAfter(bid,'text');\n  } else if(e.key==='Backspace' && !e.target.value){\n    e.preventDefault();\n    dnDelBlock(bid,true);\n  }\n}\nfunction dnBulletKey(e,bid,ii){\n  const item=getDetItem(); if(!item) return;\n  const blk=(item.blocks||[]).find(b=>b.id===bid);\n  if(!blk||!blk.items) return;\n  if(e.key==='Enter'){\n    e.preventDefault();\n    blk.items.splice(ii+1,0,'');\n    saveDetArr();\n    const sec=document.getElementById(`dnblk-${bid}`);\n    if(sec){\n      const tmp=document.createElement('div');\n      tmp.innerHTML=dnRenderBlock(blk,0);\n      sec.replaceWith(tmp.firstElementChild);\n      _dnTrackFocus();\n      setTimeout(()=>{\n        const newSec=document.getElementById(`dnblk-${bid}`);\n        const rows=newSec?newSec.querySelectorAll('.docs-blk-bullet-inp'):[];\n        if(rows[ii+1]){autoR(rows[ii+1]);rows[ii+1].focus();}\n      },30);\n    }\n  } else if(e.key==='Backspace' && !blk.items[ii] && blk.items.length>1){\n    e.preventDefault();\n    blk.items.splice(ii,1);\n    saveDetArr();\n    const sec=document.getElementById(`dnblk-${bid}`);\n    if(sec){\n      const tmp=document.createElement('div');\n      tmp.innerHTML=dnRenderBlock(blk,0);\n      sec.replaceWith(tmp.firstElementChild);\n      _dnTrackFocus();\n      setTimeout(()=>{\n        const newSec=document.getElementById(`dnblk-${bid}`);\n        const rows=newSec?newSec.querySelectorAll('.docs-blk-bullet-inp'):[];\n        const t=rows[Math.max(0,ii-1)];\n        if(t){autoR(t);t.focus();t.selectionStart=t.selectionEnd=t.value.length;}\n      },30);\n    }\n  }\n}\nfunction dnPickCalloutIcon(bid){\n  const item=getDetItem(); if(!item) return;\n  const blk=(item.blocks||[]).find(b=>b.id===bid); if(!blk) return;\n  const em=prompt('Emoji:',blk.icon||'💡');\n  if(em!==null){\n    blk.icon=em||'💡'; saveDetArr();\n    const sec=document.getElementById(`dnblk-${bid}`);\n    const ic=sec&&sec.querySelector('.docs-blk-callout-icon');\n    if(ic) ic.textContent=blk.icon;\n  }\n}\nfunction dnDelBlock(bid,focusPrev){\n  const item=getDetItem(); if(!item) return;\n  const blocks=item.blocks||[];\n  const idx=blocks.findIndex(b=>b.id===bid);\n  if(idx<0) return;\n  if(blocks.length===1){\n    blocks[0].content='';\n    saveDetArr();\n    dnRenderPanel();\n    return;\n  }\n  blocks.splice(idx,1);\n  saveDetArr();\n  const el=document.getElementById(`dnblk-${bid}`);\n  if(el) el.remove();\n  if(focusPrev){\n    const area=document.getElementById('dlBlocksArea');\n    const secs=area?[...area.querySelectorAll('.docs-block-section')]:[];\n    const prev=secs[Math.max(0,idx-1)];\n    const ta=prev&&prev.querySelector('textarea');\n    if(ta){autoR(ta);ta.focus();ta.selectionStart=ta.selectionEnd=ta.value.length;}\n  }\n}\nfunction dnAddBlockAfter(afterBid,type){\n  const item=getDetItem(); if(!item) return;\n  const blocks=dnEnsureBlocks(item);\n  const blk={id:'b'+Date.now()+Math.random().toString(36).slice(2,5),type,content:'',\n    items:type==='bullets'?['']:undefined, icon:type==='callout'?'💡':undefined};\n  const idx=blocks.findIndex(b=>b.id===afterBid);\n  if(idx>=0) blocks.splice(idx+1,0,blk); else blocks.push(blk);\n  saveDetArr();\n  const area=document.getElementById('dlBlocksArea');\n  const refEl=document.getElementById(`dnblk-${afterBid}`);\n  if(area){\n    const tmp=document.createElement('div');\n    tmp.innerHTML=dnRenderBlock(blk,0);\n    const newEl=tmp.firstElementChild;\n    if(refEl) refEl.after(newEl); else area.appendChild(newEl);\n    _dnTrackFocus();\n    setTimeout(()=>{\n      const ta=newEl.querySelector('textarea');\n      if(ta){autoR(ta);ta.focus();}\n    },30);\n  }\n}\nfunction dnAddBlock(type){\n  const item=getDetItem(); if(!item) return;\n  const blocks=dnEnsureBlocks(item);\n  if(_dnFocusedBid){\n    const focBlk=blocks.find(b=>b.id===_dnFocusedBid);\n    if(focBlk){\n      const isEmpty=(focBlk.type!=='bullets'&&!(focBlk.content||'').trim())||\n        (focBlk.type==='bullets'&&focBlk.items&&focBlk.items.length===1&&!focBlk.items[0].trim());\n      if(isEmpty && focBlk.type!=='divider'){ dnConvertBlock(focBlk.id,type); return; }\n      dnAddBlockAfter(focBlk.id,type); return;\n    }\n  }\n  const blk={id:'b'+Date.now()+Math.random().toString(36).slice(2,5),type,content:'',\n    items:type==='bullets'?['']:undefined, icon:type==='callout'?'💡':undefined};\n  blocks.push(blk);\n  saveDetArr();\n  const area=document.getElementById('dlBlocksArea');\n  if(area){\n    const div=document.createElement('div');\n    div.innerHTML=dnRenderBlock(blk,blocks.length-1);\n    const newEl=div.firstElementChild;\n    area.appendChild(newEl);\n    _dnTrackFocus();\n    setTimeout(()=>{const ta=newEl.querySelector('textarea');if(ta){autoR(ta);ta.focus();}},30);\n  }\n}\nfunction dnConvertBlock(bid,newType){\n  const item=getDetItem(); if(!item) return;\n  const blk=(item.blocks||[]).find(b=>b.id===bid); if(!blk) return;\n  blk.type=newType;\n  if(newType==='bullets'){ blk.items=blk.content?[blk.content]:['']; delete blk.content; }\n  else { blk.content=(blk.items&&blk.items[0])||blk.content||''; delete blk.items; }\n  if(newType==='callout') blk.icon=blk.icon||'💡';\n  saveDetArr();\n  const sec=document.getElementById(`dnblk-${bid}`);\n  if(sec){\n    const tmp=document.createElement('div');\n    tmp.innerHTML=dnRenderBlock(blk,0);\n    sec.replaceWith(tmp.firstElementChild);\n    _dnTrackFocus();\n    setTimeout(()=>{\n      const newSec=document.getElementById(`dnblk-${bid}`);\n      const ta=newSec&&newSec.querySelector('textarea');\n      if(ta){autoR(ta);ta.focus();ta.selectionStart=ta.selectionEnd=(ta.value||'').length;}\n    },30);\n  }\n}\nlet _dnInlinePicker=null;\nfunction _dnCloseInlinePicker(){ if(_dnInlinePicker){_dnInlinePicker.remove();_dnInlinePicker=null;} }\nfunction dnAddAfterInline(e,afterBid){\n  e.stopPropagation();\n  _dnCloseInlinePicker();\n  const btn=e.currentTarget;\n  const rect=btn.getBoundingClientRect();\n  const types=[\n    {type:'text
