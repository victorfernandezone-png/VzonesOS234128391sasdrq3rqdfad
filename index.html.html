ead(HTN_IDB_KEY,{});\n  // Migrate: if habits have notes array stored inline, move them\n  habits.forEach(h=>{\n    if(Array.isArray(h.notes)&&h.notes.length&&!_htnData[h.id]){\n      _htnData[h.id]=h.notes;\n    }\n    // Clear inline notes (we store in IDB now)\n    h.notes=[];\n  });\n}\nfunction htnSave(){\n  idbWrite(HTN_IDB_KEY,_htnData).catch(e=>console.error('[VictorOS] htnSave',e));\n}\nfunction htnGetBlocks(hid){return _htnData[hid]||[];}\nfunction htnSetBlocks(hid,blocks){_htnData[hid]=blocks;htnSave();}\n\n// Render a single block\nfunction htnRenderBlock(hid,blk,bi){\n  const bid=`htnb-${hid}-${blk.id}`;\n  let inner='';\n  const sid=`htn-sec-${hid}-${blk.id}`;\n\n  if(blk.type==='h1'){\n    inner=`<textarea class=\"htn-block-h1\" rows=\"1\" placeholder=\"Título 1\"\n      oninput=\"autoR(this);htnSaveBlock(${hid},'${blk.id}','content',this.value)\">${esc(blk.content||'')}<\u002Ftextarea>`;\n  } else if(blk.type==='h2'){\n    inner=`<textarea class=\"htn-block-h2\" rows=\"1\" placeholder=\"Título 2\"\n      oninput=\"autoR(this);htnSaveBlock(${hid},'${blk.id}','content',this.value)\">${esc(blk.content||'')}<\u002Ftextarea>`;\n  } else if(blk.type==='h3'){\n    inner=`<textarea class=\"htn-block-h3\" rows=\"1\" placeholder=\"Título 3\"\n      oninput=\"autoR(this);htnSaveBlock(${hid},'${blk.id}','content',this.value)\">${esc(blk.content||'')}<\u002Ftextarea>`;\n  } else if(blk.type==='text'){\n    inner=`<textarea class=\"htn-block-text\" rows=\"1\" placeholder=\" \"\n      oninput=\"autoR(this);htnSaveBlock(${hid},'${blk.id}','content',this.value)\">${esc(blk.content||'')}<\u002Ftextarea>`;\n  } else if(blk.type==='quote'){\n    inner=`<textarea class=\"htn-block-quote\" rows=\"1\" placeholder=\" \"\n      oninput=\"autoR(this);htnSaveBlock(${hid},'${blk.id}','content',this.value)\">${esc(blk.content||'')}<\u002Ftextarea>`;\n  } else if(blk.type==='callout'){\n    inner=`<div class=\"htn-block-callout\">\n      <span class=\"htn-callout-icon\">${esc(blk.icon||'💡')}<\u002Fspan>\n      <textarea class=\"htn-callout-text\" rows=\"1\" placeholder=\" \"\n        oninput=\"autoR(this);htnSaveBlock(${hid},'${blk.id}','content',this.value)\">${esc(blk.content||'')}<\u002Ftextarea>\n    <\u002Fdiv>`;\n  } else if(blk.type==='divider'){\n    inner=`<hr class=\"htn-block-divider\">`;\n  } else if(blk.type==='bullets'){\n    const items=blk.items||[''];\n    inner=items.map((it,ii)=>`\n      <div class=\"htn-bullet-row\">\n        <div class=\"htn-bullet-dot\"><\u002Fdiv>\n        <textarea class=\"htn-bullet-inp\" rows=\"1\" placeholder=\" \"\n          oninput=\"autoR(this);htnSaveBullet(${hid},'${blk.id}',${ii},this.value)\"\n          onkeydown=\"htnBulletKey(event,${hid},'${blk.id}',${ii})\">${esc(it)}<\u002Ftextarea>\n      <\u002Fdiv>`).join('');\n  }\n\n  return `<div class=\"htn-section\" id=\"${sid}\" data-hid=\"${hid}\" data-bid=\"${blk.id}\">\n    <div class=\"htn-handle\" onmousedown=\"htnStartDrag(event,${hid},'${blk.id}')\">⠿<\u002Fdiv>\n    ${inner}\n    <button class=\"htn-del\" onclick=\"htnDelBlock(${hid},'${blk.id}')\">✕<\u002Fbutton>\n  <\u002Fdiv>`;\n}\n\nfunction htnSaveBlock(hid,bid,field,val){\n  const blocks=htnGetBlocks(hid);\n  const b=blocks.find(x=>x.id===bid);\n  if(b) b[field]=val;\n  htnSetBlocks(hid,blocks);\n}\nfunction htnSaveBullet(hid,bid,ii,val){\n  const blocks=htnGetBlocks(hid);\n  const b=blocks.find(x=>x.id===bid);\n  if(b&&b.items) b.items[ii]=val;\n  htnSetBlocks(hid,blocks);\n}\nfunction htnBulletKey(e,hid,bid,ii){\n  if(e.key==='Enter'){\n    e.preventDefault();\n    const blocks=htnGetBlocks(hid);\n    const b=blocks.find(x=>x.id===bid);\n    if(b&&b.items){b.items.splice(ii+1,0,'');htnSetBlocks(hid,blocks);htnRefreshContent(hid);\n      setTimeout(()=>{\n        const rows=document.querySelectorAll(`#htn-content-${hid} .htn-bullet-inp`);\n        if(rows[ii+1]) rows[ii+1].focus();\n      },30);\n    }\n  }\n}\n\nfunction htnToggle(e,hid){\n  e.stopPropagation();\n  const panel=document.getElementById(`htn-panel-${hid}`);\n  if(!panel) return;\n  const open=panel.classList.toggle('open');\n  if(open) _htnOpen.add(hid); else _htnOpen.delete(hid);\n  const btn=document.getElementById(`htn-btn-${hid}`);\n  if(btn) btn.classList.toggle('active',open);\n  // Init blocks if empty\n  if(open&&!_htnData[hid]) _htnData[hid]=[];\n}\n\nfunction htnAddBlock(hid,type){\n  const blocks=htnGetBlocks(hid);\n  const newBlk={id:'hb'+Date.now(),type};\n  if(type==='bullets') newBlk.items=[''];\n  if(type==='callout'){newBlk.icon='💡';newBlk.content='';}\n  if(['h1','h2','h3','text','quote'].includes(type)) newBlk.content='';\n  blocks.push(newBlk);\n  htnSetBlocks(hid,blocks);\n  htnRefreshContent(hid);\n  setTimeout(()=>{\n    const el=document.getElementById(`htn-content-${hid}`);\n    const ta=el?.querySelector('.htn-section:last-of-type textarea');\n    if(ta){ta.focus();ta.scrollIntoView({behavior:'smooth',block:'nearest'});}\n  },50);\n}\n\nfunction htnDelBlock(hid,bid){\n  const blocks=htnGetBlocks(hid).filter(b=>b.id!==bid);\n  htnSetBlocks(hid,blocks);\n  htnRefreshContent(hid);\n}\n\nfunction htnRefreshContent(hid){\n  const cont=document.getElementById(`htn-content-${hid}`);\n  if(!cont) return;\n  const blocks=htnGetBlocks(hid);\n  cont.innerHTML=blocks.map((b,i)=>htnRenderBlock(hid,b,i)).join('')+\n    `<div class=\"htn-add-row\" onclick=\"htnAddBlock(${hid},'text')\">\n      <svg width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" viewBox=\"0 0 11 11\"><line x1=\"5.5\" y1=\"1\" x2=\"5.5\" y2=\"10\"/><line x1=\"1\" y1=\"5.5\" x2=\"10\" y2=\"5.5\"/><\u002Fsvg>\n      Añadir bloque\n    <\u002Fdiv>`;\n  cont.querySelectorAll('textarea').forEach(t=>autoR(t));\n}\n\n// ── HTN Drag & Drop ────────────────────────────────────\nfunction htnStartDrag(e,hid,bid){\n  e.preventDefault();e.stopPropagation();\n  const srcEl=document.getElementById(`htn-sec-${hid}-${bid}`);\n  if(!srcEl) return;\n  const cont=document.getElementById(`htn-content-${hid}`);\n  const rect=srcEl.getBoundingClientRect();\n  const ghost=srcEl.cloneNode(true);\n  ghost.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;\n    opacity:.7;pointer-events:none;z-index:800;border-radius:7px;background:var(--surface);\n    box-shadow:0 4px 20px rgba(0,0,0,.18);border:.5px solid var(--b2)`;\n  document.body.appendChild(ghost);\n  srcEl.style.opacity='.2';\n  _htnDrag={active:true,hid,bid,ghost,srcEl,overEl:null,isTop:true};\n\n  const SCROLL_ZONE=60,SPEED=12;\n  let _af=null,_lastY=e.clientY;\n  function autoScroll(y){\n    if(!cont) return;\n    const r=cont.getBoundingClientRect();\n    const dt=y-r.top,db=r.bottom-y;\n    let d=0;\n    if(dt<SCROLL_ZONE) d=-Math.round(SPEED*(1-dt/SCROLL_ZONE));\n    else if(db<SCROLL_ZONE) d=Math.round(SPEED*(1-db/SCROLL_ZONE));\n    if(d){cont.scrollTop+=d;_af=requestAnimationFrame(()=>autoScroll(_lastY));}\n    else _af=null;\n  }\n\n  let _dropLine=null;\n  function clearLine(){if(_dropLine){_dropLine.remove();_dropLine=null;}}\n\n  const mm=ev=>{\n    _lastY=ev.clientY;\n    ghost.style.top=(ev.clientY-(e.clientY-rect.top))+'px';\n    ghost.style.left=(ev.clientX-(e.clientX-rect.left))+'px';\n    if(!_af) autoScroll(ev.clientY);\n    clearLine();\n    ghost.style.display='none';\n    const under=document.elementFromPoint(ev.clientX,ev.clientY);\n    ghost.style.display='';\n    const tgtSec=under?.closest?.('.htn-section');\n    if(tgtSec&&tgtSec!==srcEl&&tgtSec.dataset.hid==hid){\n      _htnDrag.overEl=tgtSec;\n      const tr=tgtSec.getBoundingClientRect();\n      _htnDrag.isTop=ev.clientY<tr.top+tr.height/2;\n      _dropLine=document.createElement('div');\n      _dropLine.className='htn-drop-line';\n      if(_htnDrag.isTop) tgtSec.before(_dropLine);\n      else tgtSec.after(_dropLine);\n    } else {_htnDrag.overEl=null;}\n  };\n  const mu=()=>{\n    document.removeEventListener('mousemove',mm);\n    document.removeEventListener('mouseup',mu);\n    if(_af){cancelAnimationFrame(_af);_af=null;}\n    ghost.remove();clearLine();\n    srcEl.style.opacity='';\n    if(_htnDrag.overEl){\n      const tgtBid=_htnDrag.overEl.dataset.bid;\n      const blocks=htnGetBlocks(hid);\n      const si=blocks.findIndex(b=>b.id===bid);\n      const ti=blocks.findIndex(b=>b.id===tgtBid);\n      if(si>=0&&ti>=0){\n        const[moved]=blocks.splice(si,1);\n        const newTi=blocks.findIndex(b=>b.id===tgtBid);\n        blocks.splice(_htnDrag.isTop?newTi:newTi+1,0,moved);\n        htnSetBlocks(hid,blocks);\n        htnRefreshContent(hid);\n      }\n    }\n    _htnDrag={active:false};\n  };\n  document.addEventListener('mousemove',mm);\n  document.addEventListener('mouseup',mu);\n}\n\n// Init habit notes async\nasync function htnInit(){\n  await htnLoad();\n  // Re-render open panels if any\n  _htnOpen.forEach(hid=>htnRefreshContent(hid));\n}\n\nfunction htSleepSet(key,val){\n  if(val===0){\n    delete sleepData[key];\n  } else {\n    sleepData[key]=val;\n  }\n  saveSleepData();sfxAdd();renderHabits();\n}\nfunction htToggle(id,key){\n  const h=habits.find(h=>h.id===id);if(!h)return;\n  h.checks[key]=!h.checks[key];\n  if(h.checks[key]===false) delete h.checks[key];\n  saveHabits();sfxCheck();\n  // If the home card is visible (e.g. user opened detail while on home), patch it too\n  const todayKey=dk(today);\n  if(key===todayKey) _patchHomeHabitRow(id,h,todayKey);\n  renderHabits();\n}\nfunction htRename(id,val){\n  const h=habits.find(h=>h.id===id);if(!h)return;\n  h.name=val||'Sin nombre';saveHabits();\n}\nfunction htDel(id){\n  habits=habits.filter(h=>h.id!==id);saveHabits();renderHabits();\n}\nfunction htAddHabit(){\n  const col=RAINBOW_HEX[habits.length%RAINBOW_HEX.length];\n  habits.push({id:nHid++,name:'',color:col,checks:{}});\n  saveHabits();renderHabits();\n  // Focus the new name input\n  setTimeout(()=>{\n    const inputs=document.querySelectorAll('.ht-name-input');\n    if(inputs.length) inputs[inputs.length-1].focus();\n  },50);\n}\nfunction htColorPick(id){\n  const h=habits.find(h=>h.id===id);if(!h)return;\n  const idx=RAINBOW_HEX.indexOf(h.color);\n  h.color=RAINBOW_HEX[(idx+1)%RAINBOW_HEX.length];\n  saveHabits();renderHabits();\n}\n\n// ── HABIT DRAG & DROP REORDER ────────────────────────\nlet _htDragId=null;\nfunction htDragStart(e,id){\n  _htDragId=id;\n  e.dataTransfer.effectAllowed='move';\n  e.currentTarget.classList.add('ht-dragging-src');\n}\nfunction htDragOver(e,targetId){\n  e.preventDefault();\n  if(_htDragId===null||_htDragId===targetId) return;\n  e.dataTransfer.dropEffect='move';\n  const el=e.currentTarget;\n  el.classList.remove('ht-drag-over-top','ht-drag-over-bot');\n  const rect=el.getBoundingClientRect();\n  el.classList.add(e.clientY<rect.top+rect.height/2?'ht-drag-over-top':'ht-drag-over-bot');\n}\nfunction htDragLeave(e){\n  e.currentTarget.classList.remove('ht-drag-over-top','ht-drag-over-bot');\n}\nfunction htDrop(e,targetId){\n  e.preventDefault();\n  if(_htDragId===null||_htDragId===targetId){htDragEnd(e);return;}\n  const srcIdx=habits.findIndex(h=>h.id===_htDragId);\n  const tgtIdx=habits.findIndex(h=>h.id===targetId);\n  if(srcIdx<0||tgtIdx<0){htDragEnd(e);return;}\n  const el=e.currentTarget;\n  const rect=el.getBoundingClientRect();\n  const insertBefore=e.clientY<rect.top+rect.height/2;\n  const [moved]=habits.splice(srcIdx,1);\n  const newIdx=habits.findIndex(h=>h.id===targetId);\n  habits.splice(insertBefore?newIdx:newIdx+1,0,moved);\n  saveHabits();\n  htDragEnd(e);\n  renderHabits();\n}\nfunction htDragEnd(e){\n  _htDragId=null;\n  document.querySelectorAll('.ht-row').forEach(r=>r.classList.remove('ht-dragging-src','ht-drag-over-top','ht-drag-over-bot'));\n}\n\n// ── DETAIL PANEL RICH TOOLBAR ────────────────────────\nfunction dlNtApplyColor(color){\n  document.getElementById('dlNotesLive')?.focus();\n  document.execCommand('styleWithCSS',false,true);\n  document.execCommand('foreColor',false,color);\n  // Update icon border to show current color\n  const icon=document.getElementById('dlColorIcon');\n  if(icon) icon.style.borderBottomColor=color;\n  _dlNtAutoSave();\n}\nfunction dlNtApplyHighlight(color){\n  document.getElementById('dlNotesLive')?.focus();\n  // Use custom underline via execCommand insertHTML wrapping selection\n  const sel=window.getSelection();\n  if(!sel||sel.rangeCount===0) return;\n  const range=sel.getRangeAt(0);\n  if(range.collapsed) return;\n  const selectedHtml=range.cloneContents();\n  const div=document.createElement('div');div.appendChild(selectedHtml);\n  const html=`<span style=\"text-decoration:underline;text-decoration-color:${color};text-decoration-thickness:2.5px\">${div.innerHTML}<\u002Fspan>`;\n  document.execCommand('insertHTML',false,html);\n  // Update icon\n  const icon=document.getElementById('dlHighIcon');\n  if(icon) icon.style.textDecorationColor=color;\n  _dlNtAutoSave();\n}\nfunction dlNtClearColor(){\n  document.getElementById('dlNotesLive')?.focus();\n  document.execCommand('styleWithCSS',false,true);\n  document.execCommand('removeFormat',false,null);\n  _dlNtAutoSave();\n}\nfunction _dlNtAutoSave(){\n  setTimeout(()=>{\n    const item=getDetItem();\n    const lv=document.getElementById('dlNotesLive');\n    if(item&&lv){item.notes=lv.innerHTML;saveDetArr();}\n  },200);\n}\nfunction dlNtExec(cmd){\n  document.execCommand(cmd,false,null);\n  document.getElementById('dlNotesLive')?.focus();\n  // autosave\n  setTimeout(()=>{\n    const item=getDetItem();\n    const lv=document.getElementById('dlNotesLive');\n    if(item&&lv){item.notes=lv.innerHTML;saveDetArr();}\n  },200);\n}\nfunction dlNtBlock(tag){\n  const el=document.getElementById('dlNotesLive');\n  if(!el)return;\n  el.focus();\n  if(tag==='ul') document.execCommand('insertUnorderedList',false,null);\n  else if(tag==='ol') document.execCommand('insertOrderedList',false,null);\n  else if(tag==='blockquote') document.execCommand('formatBlock',false,'blockquote');\n  else if(tag==='pre') document.execCommand('formatBlock',false,'pre');\n  else document.execCommand('formatBlock',false,tag);\n  setTimeout(()=>{\n    const item=getDetItem();\n    if(item&&el){item.notes=el.innerHTML;saveDetArr();}\n  },200);\n}\nfunction dlNtInsertCb(){\n  const el=document.getElementById('dlNotesLive');\n  if(!el)return;\n  el.focus();\n  const cbId='dlcb'+Date.now();\n  document.execCommand('insertHTML',false,\n    `<div class=\"nt-cb-wrap\" contenteditable=\"false\"><span class=\"nt-cb\" id=\"${cbId}\" onclick=\"dlNtToggleCb('${cbId}')\"><\u002Fspan><span class=\"nt-cb-text\" contenteditable=\"true\"><\u002Fspan><\u002Fdiv><p><br><\u002Fp>`\n  );\n  setTimeout(()=>{document.getElementById(cbId)?.nextElementSibling?.focus();},30);\n}\nfunction dlNtToggleCb(id){\n  const cb=document.getElementById(id);if(!cb)return;\n  cb.classList.toggle('done');\n  const txt=cb.nextElementSibling;\n  if(txt)txt.classList.toggle('done',cb.classList.contains('done'));\n  const item=getDetItem();\n  const lv=document.getElementById('dlNotesLive');\n  if(item&&lv){item.notes=lv.innerHTML;saveDetArr();}\n}\nfunction dlNtInsertCallout(){\n  const el=document.getElementById('dlNotesLive');\n  if(!el)return;\n  el.focus();\n  document.execCommand('insertHTML',false,\n    `<div class=\"nt-callout\" contenteditable=\"false\"><span class=\"nt-callout-icon\">💡<\u002Fspan><span class=\"nt-callout-text\" contenteditable=\"true\"><\u002Fspan><\u002Fdiv><p><br><\u002Fp>`\n  );\n  setTimeout(()=>{const cs=document.querySelectorAll('#dlNotesLive .nt-callout-text');if(cs.length)cs[cs.length-1].focus();},30);\n}\n\n// ── TASK NOTES BLOCK CONTROLS (drag handle + delete) ──\n// Shows a drag handle and delete button floating left of each top-level block\nlet _ntBlkToolbar=null,_ntBlkTarget=null;\nlet _ntDrag={active:false,el:null,ghost:null,startY:0,offsetY:0};\n\nfunction _ntGetTopBlock(el){\n  const live=document.getElementById('dlNotesLive');\n  if(!live||!el) return null;\n  let node=el;\n  while(node&&node.parentElement!==live) node=node.parentElement;\n  return (node&&node!==live)?node:null;\n}\n\nfunction _ntShowBlockToolbar(block){\n  _ntHideBlockToolbar();\n  if(!block) return;\n  const live=document.getElementById('dlNotesLive');\n  if(!live) return;\n  _ntBlkTarget=block;\n  const tb=document.createElement('div');\n  tb.className='nt-blk-toolbar';\n  tb.innerHTML=`<div class=\"nt-blk-handle\" title=\"Arrastrar para mover\">⠿<\u002Fdiv><button class=\"nt-blk-del\" title=\"Eliminar bloque\">✕<\u002Fbutton>`;\n  tb.querySelector('.nt-blk-del').addEventListener('mousedown',ev=>{\n    ev.preventDefault();ev.stopPropagation();\n    _ntDeleteBlock(block);\n  });\n  tb.querySelector('.nt-blk-handle').addEventListener('mousedown',ev=>{\n    ev.preventDefault();ev.stopPropagation();\n    _ntStartBlockDrag(ev,block);\n  });\n  block.style.position='relative';\n  block.appendChild(tb);\n  tb.style.display='flex';\n  _ntBlkToolbar=tb;\n}\n\nfunction _ntHideBlockToolbar(){\n  if(_ntBlkToolbar){_ntBlkToolbar.remove();_ntBlkToolbar=null;}\n  _ntBlkTarget=null;\n}\n\nfunction _ntDeleteBlock(block){\n  const live=document.getElementById('dlNotesLive');\n  block.remove();\n  _ntBlkToolbar=null;_ntBlkTarget=null;\n  const item=getDetItem();\n  if(item&&live){item.notes=live.innerHTML;saveDetArr();}\n}\n\nfunction _ntStartBlockDrag(e,block){\n  const live=document.getElementById('dlNotesLive');\n  if(!live) return;\n  const rect=block.getBoundingClientRect();\n  // Create ghost\n  const ghost=block.cloneNode(true);\n  ghost.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;\n    opacity:.7;pointer-events:none;z-index:900;border-radius:6px;background:var(--surface);\n    box-shadow:0 4px 20px rgba(0,0,0,.2);border:.5px solid var(--b2);transform:scale(1.01)`;\n  document.body.appendChild(ghost);\n  block.style.opacity='.2';\n  _ntDrag={active:true,el:block,ghost,startY:e.clientY,offsetY:e.clientY-rect.top,overLine:null};\n\n  let _dropLine=null;\n  function _clearLine(){if(_dropLine){_dropLine.remove();_dropLine=null;}}\n\n  const _mm=ev=>{\n    if(!_ntDrag.active)return;\n    ghost.style.top=(ev.clientY-_ntDrag.offsetY)+'px';\n    _clearLine();\n    // Find target block under cursor\n    ghost.style.display='none';\n    const under=document.elementFromPoint(ev.clientX,ev.clientY);\n    ghost.style.display='';\n    const target=_ntGetTopBlock(under);\n    if(target&&target!==block){\n      _dropLine=document.createElement('div');\n      _dropLine.style.cssText='height:2px;border-radius:2px;background:var(--accent);margin:2px 0;pointer-events:none;flex-shrink:0';\n      const tr=target.getBoundingClientRect();\n      const isTop=ev.clientY<tr.top+tr.height/2;\n      if(isTop) target.before(_dropLine);\n      else target.after(_dropLine);\n      _ntDrag.overEl=target;_ntDrag.isTop=isTop;\n    } else {\n      _ntDrag.overEl=null;\n    }\n  };\n  const _mu=ev=>{\n    document.removeEventListener('mousemove',_mm);\n    document.removeEventListener('mouseup',_mu);\n    ghost.remove();_clearLine();\n    block.style.opacity='';\n    if(_ntDrag.overEl&&_ntDrag.overEl!==block){\n      if(_ntDrag.isTop) _ntDrag.overEl.before(block);\n      else _ntDrag.overEl.after(block);\n      const item=getDetItem();\n      if(item&&live){item.notes=live.innerHTML;saveDetArr();}\n    }\n    _ntDrag={active:false,el:null,ghost:null,overEl:null};\n    _ntHideBlockToolbar();\n  };\n  document.addEventListener('mousemove',_mm);\n  document.addEventListener('mouseup',_mu);\n}\n\nfunction _ntBindLiveHover(){\n  const live=document.getElementById('dlNotesLive');\n  if(!live||live._ntBound) return;\n  live._ntBound=true;\n  live.addEventListener('mouseover',ev=>{\n    if(_ntDrag.active) return;\n    const block=_ntGetTopBlock(ev.target);\n    if(block&&block!==_ntBlkTarget) _ntShowBlockToolbar(block);\n  });\n  live.addEventListener('mouseleave',ev=>{\n    if(!_ntDrag.active) setTimeout(_ntHideBlockToolbar,150);\n  });\n}\n\n// Bind after detail opens\n\n\n// ── FOCUS / POMODORO ENGINE ────────────────────────────\nlet focusSessions=[];\nfunction loadFocusSessions(){return _safeRead(STORE_KEYS.focus,[]);}\nfunction saveFocusSessions(){_safeWrite(STORE_KEYS.focus,focusSessions);}\nfocusSessions=loadFocusSessions();\n\n// Timer state\nconst FC={\n  mode:'focus',     // 'focus'|'short'|'long'\n  running:false,\n  remaining:25*60,  // seconds\n  total:25*60,\n  interval:null,\n  sessionCount:0,   // pomodoros done this \"cycle\"\n  settings:{focus:25,short:5,long:15,longAfter:4},\n  monthOffset:0,\n};\n\nfunction fcDurations(){\n  return {focus:FC.settings.focus*60,short:FC.settings.short*60,long:FC.settings.long*60};\n}\nfunction fcSetMode(m){\n  if(FC.running) fcStop();\n  FC.mode=m;\n  const dur=fcDurations();\n  FC.total=dur[m];\n  FC.remaining=FC.total;\n  fcUpdateRing();\n  fcUpdateDisplay();\n  fcUpdateModeUi();\n}\n// Focus start sound — deep soft whoosh + single tone\nfunction sfxFocusStart(){\n  if(AC.state==='suspended') AC.resume();\n  try{\n    const t=AC.currentTime;\n    // Soft low thud — like pressing a heavy button\n    const o1=AC.createOscillator(),g1=AC.createGain(),f1=AC.createBiquadFilter();\n    o1.type='sine';o1.frequency.setValueAtTime(180,t);o1.frequency.exponentialRampToValueAtTime(90,t+0.18);\n    f1.type='lowpass';f1.frequency.value=600;\n    o1.connect(f1);f1.connect(g1);g1.connect(AC.destination);\n    g1.gain.setValueAtTime(0,t);g1.gain.linearRampToValueAtTime(0.09,t+0.01);\n    g1.gain.exponentialRampToValueAtTime(0.0001,t+0.22);\n    o1.start(t);o1.stop(t+0.25);\n    // Airy high tone — confirmation chime\n    const o2=AC.createOscillator(),g2=AC.createGain(),f2=AC.createBiquadFilter();\n    o2.type='sine';o2.frequency.value=698.46;\n    f2.type='lowpass';f2.frequency.value=4000;\n    o2.connect(f2);f2.connect(g2);g2.connect(AC.destination);\n    g2.gain.setValueAtTime(0,t+0.06);g2.gain.linearRampToValueAtTime(0.032,t+0.09);\n    g2.gain.exponentialRampToValueAtTime(0.0001,t+0.55);\n    o2.start(t+0.06);o2.stop(t+0.58);\n  }catch(e){}\n}\nfunction fcStart(){\n  if(FC.running){fcStop();return;}\n  FC.running=true;\n  document.getElementById('fcStartBtn')?.classList.add('running');\n  document.getElementById('fcStartBtn').textContent='⏸ Pausar';\n  FC.interval=setInterval(fcTick,1000);\n  sfxFocusStart();\n}\nfunction fcStop(){\n  FC.running=false;\n  clearInterval(FC.interval);FC.interval=null;\n  const btn=document.getElementById('fcStartBtn');\n  if(btn){btn.classList.remove('running');btn.textContent='▶ Iniciar';}\n}\nfunction fcReset(){\n  fcStop();\n  const dur=fcDurations();\n  FC.total=dur[FC.mode];\n  FC.remaining=FC.total;\n  fcUpdateRing();fcUpdateDisplay();\n}\nfunction fcTick(){\n  FC.remaining--;\n  if(FC.remaining<=0){\n    fcComplete();return;\n  }\n  fcUpdateRing();fcUpdateDisplay();\n}\nfunction sfxPomodoro(){\n  try{\n    if(AC.state==='suspended') AC.resume();\n    const bells=[\n      {freqs:[523.25,659.25,783.99,1046.50], delay:0,    vols:[.18,.14,.10,.07]},\n      {freqs:[659.25,830.61,987.77,1318.51], delay:620,  vols:[.14,.11,.08,.05]},\n      {freqs:[783.99,987.77,1174.66,1567.98],delay:1180, vols:[.12,.09,.07,.04]},\n    ];\n    bells.forEach(bell=>{\n      setTimeout(()=>{\n        const t=AC.currentTime;\n        bell.freqs.forEach((freq,i)=>{\n          const o=AC.createOscillator(),g=AC.createGain();\n          o.type='sine';o.frequency.value=freq;\n          o.connect(g);g.connect(AC.destination);\n          g.gain.setValueAtTime(0,t+i*.012);\n          g.gain.linearRampToValueAtTime(bell.vols[i],t+i*.012+.018);\n          g.gain.exponentialRampToValueAtTime(.0001,t+i*.012+1.3);\n          o.start(t+i*.012);o.stop(t+i*.012+1.4);\n        });\n      },bell.delay);\n    });\n  }catch(e){}\n}\nfunction fcComplete(){\n  fcStop();\n  sfxPomodoro();\n  // Log the session\n  const now=new Date();\n  const isBreak=FC.mode!=='focus';\n  focusSessions.push({\n    type:FC.mode,\n    duration:FC.total,\n    ts:now.toISOString(),\n    dateKey:dk(now),\n  });\n  saveFocusSessions();\n  if(!isBreak){\n    FC.sessionCount++;\n    // Auto-suggest next break\n    const nextMode=FC.sessionCount%FC.settings.longAfter===0?'long':'short';\n    showToast(`¡Pomodoro ${FC.sessionCount} completado! 🎉`);\n    setTimeout(()=>fcSetMode(nextMode),400);\n  } else {\n    showToast('¡Descanso terminado! A trabajar 💪');\n    setTimeout(()=>fcSetMode('focus'),400);\n  }\n  // Refresh chart if visible\n  if(curView==='focus') fcRenderRight();\n}\nfunction fcUpdateDisplay(){\n  const el=document.getElementById('fcTimeDisplay');\n  if(!el)return;\n  const m=Math.floor(FC.remaining/60);\n  const s=FC.remaining%60;\n  el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');\n  // Update page title while running\n  if(FC.running) document.title=el.textContent+' – Strideplan Focus';\n  else document.title='Strideplan';\n}\nfunction fcUpdateRing(){\n  const svg=document.getElementById('fcRingProg');if(!svg)return;\n  const r=66;const circ=2*Math.PI*r;\n  const pct=FC.total>0?FC.remaining/FC.total:1;\n  svg.style.strokeDasharray=circ;\n  svg.style.strokeDashoffset=circ*(1-pct);\n  const colors={focus:'#8b7cf6',short:'#43a873',long:'#5a93d4'};\n  svg.style.stroke=colors[FC.mode]||'#8b7cf6';\n}\nfunction fcUpdateModeUi(){\n  ['focus','short','long'].forEach(m=>{\n    document.getElementById('fcMt-'+m)?.classList.toggle('active',m===FC.mode);\n  });\n  const labels={focus:'Foco',short:'Descanso corto',long:'Descanso largo'};\n  const el=document.getElementById('fcPhaseLbl');\n  if(el)el.textContent=labels[FC.mode]||'';\n}\nfunction fcUpdateDots(){\n  const wrap=document.getElementById('fcDots');if(!wrap)return;\n  const total=FC.settings.longAfter;\n  wrap.innerHTML='';\n  for(let i=0;i<total;i++){\n    const d=document.createElement('div');\n    d.className='fc-dot'+(i<FC.sessionCount%total?' done':FC.running&&FC.mode==='focus'&&i===FC.sessionCount%total?' active':'');\n    wrap.appendChild(d);\n  }\n}\nfunction fcSaveSettings(){\n  FC.settings.focus=parseInt(document.getElementById('fcSetFocus')?.value||25)||25;\n  FC.settings.short=parseInt(document.getElementById('fcSetShort')?.value||5)||5;\n  FC.settings.long=parseInt(document.getElementById('fcSetLong')?.value||15)||15;\n  FC.settings.longAfter=parseInt(document.getElementById('fcSetLongAfter')?.value||4)||4;\n  // If not running, reset remaining to new duration\n  if(!FC.running) fcReset();\n  showToast('Ajustes guardados ✓');\n}\n\n// ══════════════════════════════════════════════════════\n// OBJETIVOS — Goal tracker\n// ══════════════════════════════════════════════════════\n// Data model: { id, name, desc, category, color, unit, current, target, startDate, deadline, status }\n// status: 'active'|'completed'|'paused'|'abandoned'\n\nconst OB_CATS=[\n  {id:'salud',    label:'Salud',     color:'#43b389'},\n  {id:'trabajo',  label:'Trabajo',   color:'#5a93d4'},\n  {id:'finanzas', label:'Finanzas',  color:'#e0973a'},\n  {id:'personal', label:'Personal',  color:'#8b7cf6'},\n  {id:'aprendizaje',label:'Aprendizaje',color:'#3fb3ad'},\n  {id:'otros',    label:'Otros',     color:'#8a8680'},\n];\n\nfunction _obCat(id){return OB_CATS.find(c=>c.id===id)||OB_CATS[OB_CATS.length-1];}\n\nfunction loadObjetivos(){return _safeRead(STORE_KEYS.objetivos,[]);}\nfunction saveObjetivos(){_safeWrite(STORE_KEYS.objetivos,objetivos);}\nlet objetivos=loadObjetivos();\n\n// Sample data on first run\nif(!objetivos.length){\n  const ds=n=>{const d=new Date(today);d.setDate(d.getDate()+n);return dk(d);};\n  const ds2=n=>{const d=new Date(today);d.setMonth(d.getMonth()+n);return dk(d);};\n  objetivos=[\n    {id:3001,name:'Correr 100km este mes',desc:'Objetivo de running mensual',category:'salud',color:'#43a873',unit:'km',current:38,target:100,startDate:dk(today),deadline:ds2(1),status:'active'},\n    {id:3002,name:'Ahorrar €10.000',desc:'Fondo de emergencia',category:'finanzas',color:'#c2a23a',unit:'€',current:6200,target:10000,startDate:dk(today),deadline:ds2(8),status:'active'},\n    {id:3003,name:'Leer 24 libros',desc:'2 libros al mes',category:'aprendizaje',color:'#4fb0ac',unit:'libros',current:9,target:24,startDate:dk(today),deadline:ds2(6),status:'active'},\n    {id:3004,name:'Facturar €50K',desc:'Objetivo de ingresos anuales',category:'trabajo',color:'#5b6ef0',unit:'€',current:31000,target:50000,startDate:dk(today),deadline:ds2(7),status:'active'},\n    {id:3005,name:'Meditación 30 días seguidos',desc:'Práctica diaria',category:'personal',color:'#8b7cf6',unit:'días',current:12,target:30,startDate:dk(today),deadline:ds(25),status:'active'},\n  ];saveObjetivos();\n}\nlet obNid=Math.max(...objetivos.map(o=>o.id),3000)+1;\nlet obView='dashboard'; // 'dashboard'|'list'\nlet obFilter='all';    // 'all' | category id | 'completed'\nlet obEditId=null;\n\n// ── DAYS REMAINING ─────────────────────────────────────\nfunction obDaysLeft(deadline){\n  if(!deadline) return null;\n  const d=dkToDate(deadline),now=new Date();\n  return Math.ceil((d-now)/86400000);\n}\nfunction obPct(ob){\n  if(!ob.target||ob.target===0) return 0;\n  return Math.min(100,Math.round(ob.current/ob.target*100));\n}\nfunction obStatusLabel(ob){\n  if(ob.status==='completed') return {label:'Completado',bg:'#e2f3ea',tx:'#1f7a4d'};\n  if(ob.status==='paused')    return {label:'Pausado',   bg:'#faf1de',tx:'#8a6a1f'};\n  if(ob.status==='abandoned') return {label:'Abandonado',bg:'#fbe9e7',tx:'#a33f36'};\n  const pct=obPct(ob);\n  const days=obDaysLeft(ob.deadline);\n  if(pct>=100) return {label:'Completado',bg:'#e2f3ea',tx:'#1f7a4d'};\n  if(days!==null&&days<0) return {label:'Vencido',bg:'#fbe9e7',tx:'#a33f36'};\n  if(days!==null&&days<=7) return {label:'Urgente',bg:'#faf1de',tx:'#8a6a1f'};\n  return {label:'En curso',bg:'#eef0fd',tx:'#3c46c9'};\n}\n\n// ── RING SVG with gradient ─────────────────────────────\nfunction obRingSvg(pct, color, size=56){\n  const r=22,stroke=4,circ=2*Math.PI*r;\n  const offset=circ*(1-Math.min(1,pct/100));\n  const overflowColor='var(--red)';\n  const trackColor=isDark?'rgba(255,255,255,.08)':'rgba(0,0,0,.07)';\n  const fillColor=pct>100?overflowColor:color;\n  // Derive a lighter/darker shade for gradient\n  const gradId='obg'+Math.abs(pct)+'_'+fillColor.replace('#','');\n  return `<svg width=\"${size}\" height=\"${size}\" viewBox=\"0 0 52 52\" style=\"flex-shrink:0\">\n    <defs>\n      <linearGradient id=\"${gradId}\" x1=\"1\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0%\" stop-color=\"${fillColor}\" stop-opacity=\"1\"/>\n        <stop offset=\"100%\" stop-color=\"${fillColor}\" stop-opacity=\".55\"/>\n      <\u002FlinearGradient>\n    <\u002Fdefs>\n    <circle cx=\"26\" cy=\"26\" r=\"${r}\" fill=\"none\" stroke=\"${trackColor}\" stroke-width=\"${stroke}\"/>\n    <circle cx=\"26\" cy=\"26\" r=\"${r}\" fill=\"none\" stroke=\"url(#${gradId})\" stroke-width=\"${stroke}\"\n      stroke-linecap=\"round\" stroke-dasharray=\"${circ.toFixed(1)}\"\n      stroke-dashoffset=\"${offset.toFixed(1)}\" transform=\"rotate(-90 26 26)\"\n      style=\"transition:stroke-dashoffset .6s cubic-bezier(.22,1,.36,1)\"/>\n    <text x=\"26\" y=\"30\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"${isDark?'var(--tx)':'#141210'}\" font-family=\"Plus Jakarta Sans,sans-serif\">${pct}%<\u002Ftext>\n  <\u002Fsvg>`;\n}\n\n// ── GRADIENT BAR helper ───────────────────────────────\nfunction obBarGrad(color,pct,overflow=false){\n  const c=overflow?'var(--red)':color;\n  return `linear-gradient(90deg,${c} 0%,${c}cc ${Math.min(100,pct)}%)`;\n}\nfunction obFmt(n,unit){\n  if(unit==='€'||unit==='$'||unit==='£') return unit+n.toLocaleString('es-ES');\n  if(n>=1000) return (n/1000).toFixed(1).replace('.0','')+'K '+unit;\n  return n+' '+unit;\n}\n\n// ── RENDER OBJETIVOS ───────────────────────────────────\nfunction renderObjetivos(){\n  const c=document.getElementById('mainContent');\n  c.innerHTML=`<div class=\"ob-wrap\" id=\"obWrap\">\n    <div class=\"ob-topbar\">\n      <div class=\"ob-tabs\">\n        <div class=\"ob-tab${obView==='dashboard'?' active':''}\" onclick=\"obSetView('dashboard')\">Dashboard<\u002Fdiv>\n        <div class=\"ob-tab${obView==='list'?' active':''}\" onclick=\"obSetView('list')\">Lista<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ob-filters\" id=\"obFilters\"><\u002Fdiv>\n      <button class=\"ob-add-btn\" onclick=\"obOpenModal(null)\">\n        <svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><line x1=\"6\" y1=\"1\" x2=\"6\" y2=\"11\"/><line x1=\"1\" y1=\"6\" x2=\"11\" y2=\"6\"/><\u002Fsvg>\n        Nuevo objetivo\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"ob-scroll\" id=\"obScroll\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ob-modal-ov\" id=\"obModalOv\" onclick=\"if(event.target===this)obCloseModal()\">\n    <div class=\"ob-modal\">\n      <div class=\"ob-modal-hdr\">\n        <span class=\"ob-modal-ttl\" id=\"obModalTtl\">Nuevo objetivo<\u002Fspan>\n        <button class=\"ob-modal-close\" onclick=\"obCloseModal()\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"ob-modal-body\" id=\"obModalBody\"><\u002Fdiv>\n      <div class=\"ob-modal-foot\">\n        <button class=\"ob-modal-del\" id=\"obModalDel\" onclick=\"obDelete()\" style=\"display:none\">Eliminar objetivo<\u002Fbutton>\n        <div class=\"ob-modal-btns\">\n          <button class=\"ob-btn-sec\" onclick=\"obCloseModal()\">Cancelar<\u002Fbutton>\n          <button class=\"ob-btn-pri\" onclick=\"obSave()\">Guardar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n  obRenderFilters();\n  obRenderContent();\n}\n\nfunction obSetView(v){obView=v;renderObjetivos();}\nfunction obSetFilter(f){obFilter=f;obRenderFilters();obRenderContent();}\n\nfunction obGetFiltered(){\n  let list=objetivos;\n  if(obFilter==='completed') return list.filter(o=>obPct(o)>=100||o.status==='completed');\n  if(obFilter!=='all') list=list.filter(o=>o.category===obFilter);\n  return list.filter(o=>o.status!=='abandoned');\n}\n\nfunction obRenderFilters(){\n  const el=document.getElementById('obFilters');if(!el) return;\n  const chips=[\n    {id:'all',label:'Todos',color:null},\n    ...OB_CATS,\n    {id:'completed',label:'Completados',color:'#43a873'},\n  ];\n  el.innerHTML=chips.map(ch=>{\n    const active=obFilter===ch.id;\n    const style=active&&ch.color?`background:${ch.color};color:#fff;border-color:transparent`\n      :active?`background:var(--tx);color:var(--surface);border-color:transparent`:'';\n    return `<div class=\"ob-cat-chip${active?' active':''}\" style=\"${style}\" onclick=\"obSetFilter('${ch.id}')\">${ch.label}<\u002Fdiv>`;\n  }).join('');\n}\n\nfunction obRenderContent(){\n  const scroll=document.getElementById('obScroll');if(!scroll) return;\n  const list=obGetFiltered();\n  if(obView==='dashboard') obRenderDashboard(scroll,list);\n  else obRenderList(scroll,list);\n}\n\n// ── DASHBOARD ──────────────────────────────────────────\nfunction obRenderDashboard(el,list){\n  const total=objetivos.filter(o=>o.status!=='abandoned').length;\n  const completed=objetivos.filter(o=>obPct(o)>=100||o.status==='completed').length;\n  const urgent=objetivos.filter(o=>{const d=obDaysLeft(o.deadline);return d!==null&&d<=7&&d>=0&&o.status==='active';}).length;\n  const avgPct=total>0?Math.round(objetivos.filter(o=>o.status!=='abandoned').reduce((a,o)=>a+obPct(o),0)/total):0;\n\n  // KPIs\n  let html=`<div class=\"ob-kpis\">\n    <div class=\"ob-kpi\">\n      <div class=\"ob-kpi-val\">${total}<\u002Fdiv>\n      <div class=\"ob-kpi-lbl\">Objetivos activos<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ob-kpi\">\n      <div class=\"ob-kpi-val\" style=\"color:#43a873\">${completed}<\u002Fdiv>\n      <div class=\"ob-kpi-lbl\">Completados<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ob-kpi\">\n      <div class=\"ob-kpi-val\">${avgPct}%<\u002Fdiv>\n      <div class=\"ob-kpi-lbl\">Progreso medio<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ob-kpi\">\n      <div class=\"ob-kpi-val\" style=\"color:${urgent>0?'var(--red)':'var(--tx)'}\">${urgent}<\u002Fdiv>\n      <div class=\"ob-kpi-lbl\">Urgentes<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n\n  if(list.length===0){\n    html+=`<div class=\"ob-empty\">\n      <div class=\"ob-empty-icon\"><svg width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" viewBox=\"0 0 24 24\"><path d=\"M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 5v5l3 3\"/><\u002Fsvg><\u002Fdiv>\n      <div class=\"ob-empty-ttl\">Sin objetivos en esta categoría<\u002Fdiv>\n      <div class=\"ob-empty-sub\">Pulsa \"+ Nuevo objetivo\" para empezar a hacer seguimiento<\u002Fdiv>\n    <\u002Fdiv>`;\n    el.innerHTML=html;return;\n  }\n\n  // Cards\n  html+=`<div class=\"ob-section-ttl\">Mis objetivos<\u002Fdiv><div class=\"ob-cards\">`;\n  list.forEach(ob=>{\n    const cat=_obCat(ob.category);\n    const pct=obPct(ob);\n    const days=obDaysLeft(ob.deadline);\n    const st=obStatusLabel(ob);\n    let deadlineHtml='';\n    if(ob.deadline){\n      const cls=days<0?'urgent':days<=7?'soon':'';\n      const daysTxt=days<0?`Venció hace ${Math.abs(days)}d`:days===0?'Vence hoy':`${days}d restantes`;\n      deadlineHtml=`<span class=\"ob-card-deadline ${cls}\">\n        <svg width=\"10\" height=\"10\" viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"6\" cy=\"6\" r=\"5\"/><path d=\"M6 3v3l2 1.5\"/><\u002Fsvg>\n        ${daysTxt}\n      <\u002Fspan>`;\n    }\n    html+=`<div class=\"ob-card\" onclick=\"obOpenModal(${ob.id})\">\n      <div class=\"ob-card-accent\" style=\"background:${ob.color||cat.color}\"><\u002Fdiv>\n      <div class=\"ob-card-top\">\n        <span class=\"ob-card-cat\" style=\"color:${ob.color||cat.color}\">${cat.label}<\u002Fspan>\n        <button class=\"ob-card-menu\" onclick=\"event.stopPropagation();obOpenModal(${ob.id})\">···<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"ob-card-name\">${esc(ob.name)}<\u002Fdiv>\n      ${ob.desc?`<div class=\"ob-card-desc\">${esc(ob.desc)}<\u002Fdiv>`:''}\n      <div class=\"ob-ring-row\">\n        ${obRingSvg(pct,ob.color||cat.color)}\n        <div class=\"ob-ring-info\">\n          <div class=\"ob-ring-nums\">${obFmt(ob.current,ob.unit||'')} <span>/ ${obFmt(ob.target,ob.unit||'')}<\u002Fspan><\u002Fdiv>\n          <div class=\"ob-ring-pct\">${pct}% completado<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ob-bar-track\"><div class=\"ob-bar-fill${pct>100?' ob-bar-overflow':''}\" style=\"width:${Math.min(100,pct)}%;background:${obBarGrad(ob.color||cat.color,pct,pct>100)}\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"ob-card-foot\">\n        ${deadlineHtml}\n        <span class=\"ob-card-status\" style=\"background:${st.bg};color:${st.tx}\">${st.label}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  });\n  html+='<\u002Fdiv>';\n\n  // Progress chart — category breakdown bar chart\n  const catStats=OB_CATS.map(cat=>{\n    const catObs=objetivos.filter(o=>o.category===cat.id&&o.status!=='abandoned');\n    if(!catObs.length) return null;\n    const avg=Math.round(catObs.reduce((a,o)=>a+obPct(o),0)/catObs.length);\n    return {cat,avg,count:catObs.length};\n  }).filter(Boolean);\n\n  if(catStats.length>0){\n    html+=`<div class=\"ob-section-ttl\" style=\"margin-top:8px\">Progreso por categoría<\u002Fdiv>\n    <div class=\"ob-timeline-card\">`;\n    catStats.forEach(({cat,avg,count})=>{\n      html+=`<div style=\"margin-bottom:14px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:5px\">\n          <div style=\"display:flex;align-items:center;gap:7px\">\n            <div style=\"width:9px;height:9px;border-radius:50%;background:${cat.color};flex-shrink:0\"><\u002Fdiv>\n            <span style=\"font-size:12.5px;font-weight:500;color:var(--tx)\">${cat.label}<\u002Fspan>\n            <span style=\"font-size:11px;color:var(--tx3)\">${count} objetivo${count!==1?'s':''}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-size:12px;font-weight:700;color:var(--tx)\">${avg}%<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ob-bar-track\" style=\"height:7px\">\n          <div class=\"ob-bar-fill\" style=\"width:${avg}%;background:${obBarGrad(cat.color,avg)};transition:width .6s cubic-bezier(.22,1,.36,1)\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    });\n    html+=`<\u002Fdiv>`;\n  }\n\n  // Timeline — deadlines upcoming\n  const upcoming=objetivos.filter(o=>o.deadline&&obDaysLeft(o.deadline)>=0&&o.status==='active'&&obPct(o)<100)\n    .sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,5);\n  if(upcoming.length>0){\n    html+=`<div class=\"ob-section-ttl\" style=\"margin-top:8px\">Próximos vencimientos<\u002Fdiv>\n    <div class=\"ob-timeline-card\">`;\n    upcoming.forEach((ob,i)=>{\n      const cat=_obCat(ob.category);\n      const days=obDaysLeft(ob.deadline);\n      const pct=obPct(ob);\n      const urgClass=days<=7?'color:var(--red)':days<=30?'color:var(--gold)':'color:var(--tx3)';\n      html+=`<div style=\"display:flex;align-items:center;gap:12px;padding:8px 0;${i>0?'border-top:.5px solid var(--b1)':''}\">\n        <div style=\"width:36px;height:36px;border-radius:8px;background:${ob.color||cat.color}1a;display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n          ${obRingSvg(pct,ob.color||cat.color,36)}\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-size:13px;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">${esc(ob.name)}<\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--tx2);margin-top:1px\">${obFmt(ob.current,ob.unit||'')} de ${obFmt(ob.target,ob.unit||'')}<\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size:11px;font-weight:500;${urgClass};white-space:nowrap\">${days===0?'Hoy':days+'d'}<\u002Fspan>\n      <\u002Fdiv>`;\n    });\n    html+=`<\u002Fdiv>`;\n  }\n\n  el.innerHTML=html;\n}\n\n// ── LIST VIEW ──────────────────────────────────────────\nfunction obRenderList(el,list){\n  const cols='2fr 1fr 140px 90px 70px 32px';\n  let html=`<div style=\"background:var(--surface);border-radius:10px;border:.5px solid var(--b2);overflow:hidden\">\n    <div class=\"ob-list-hdr\" style=\"grid-template-columns:${cols}\">\n      <span>Objetivo<\u002Fspan>\n      <span>Categoría<\u002Fspan>\n      <span>Progreso<\u002Fspan>\n      <span>Meta<\u002Fspan>\n      <span>Vence<\u002Fspan>\n      <span><\u002Fspan>\n    <\u002Fdiv>`;\n\n  if(list.length===0){\n    html+=`<div class=\"ob-empty\" style=\"padding:40px 24px\">\n      <div class=\"ob-empty-ttl\">Sin objetivos<\u002Fdiv>\n      <div class=\"ob-empty-sub\">Pulsa \"+ Nuevo objetivo\" para añadir el primero<\u002Fdiv>\n    <\u002Fdiv>`;\n  } else {\n    list.forEach(ob=>{\n      const cat=_obCat(ob.category);\n      const pct=obPct(ob);\n      const days=obDaysLeft(ob.deadline);\n      const daysTxt=!ob.deadline?'—':days<0?`-${Math.abs(days)}d`:days===0?'Hoy':`${days}d`;\n      const daysColor=days!==null&&days<=0?'color:var(--red)':days!==null&&days<=7?'color:var(--gold)':'';\n      html+=`<div class=\"ob-list-row\" style=\"grid-template-columns:${cols}\" onclick=\"obOpenModal(${ob.id})\">\n        <span class=\"ob-list-name\">${esc(ob.name)}<\u002Fspan>\n        <span><span class=\"ob-list-cat\" style=\"background:${cat.color}22;color:${cat.color}\">${cat.label}<\u002Fspan><\u002Fspan>\n        <div class=\"ob-list-prog\">\n          <div class=\"ob-list-bar\"><div class=\"ob-list-bar-fill\" style=\"width:${Math.min(100,pct)}%;background:${obBarGrad(ob.color||cat.color,pct)}\"><\u002Fdiv><\u002Fdiv>\n          <span class=\"ob-list-pct\">${pct}%<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;color:var(--tx2)\">${obFmt(ob.target,ob.unit||'')}<\u002Fspan>\n        <span class=\"ob-list-deadline\" style=\"${daysColor}\">${daysTxt}<\u002Fspan>\n        <button class=\"ob-list-del\" onclick=\"event.stopPropagation();obDeleteDirect(${ob.id})\">✕<\u002Fbutton>\n      <\u002Fdiv>`;\n    });\n  }\n  html+=`<\u002Fdiv>`;\n  el.innerHTML=html;\n}\n\n// ── COLOR SWATCHES for objectives (task palette + custom) ──\nconst OB_PRESET_COLORS=[\n  {hex:'#e2585a',label:'Coral'},\n  {hex:'#e0973a',label:'Ámbar'},\n  {hex:'#cdb23a',label:'Oro'},\n  {hex:'#43b389',label:'Esmeralda'},\n  {hex:'#3fb3ad',label:'Turquesa'},\n  {hex:'#5a93d4',label:'Azul'},\n  {hex:'#6c76e0',label:'Índigo'},\n  {hex:'#8b7cf6',label:'Violeta'},\n  {hex:'#c264b0',label:'Magenta'},\n  {hex:'#8a8680',label:'Gris'},\n];\nlet _obColorSel='#5a93d4';\n\nfunction obColorSwatchesHtml(current){\n  _obColorSel=current||'#5a93d4';\n  const presetMatch=OB_PRESET_COLORS.find(c=>c.hex===_obColorSel);\n  return OB_PRESET_COLORS.map(c=>`\n    <div class=\"ob-csw${_obColorSel===c.hex?' sel':''}\" id=\"obcsw-${c.hex.replace('#','')}\"\n      style=\"background-image:${c.hex==='#8a8680'?'none':rainbowGrad(c.hex)};background-color:${c.hex};${_obColorSel===c.hex?'border-color:var(--tx)':''}\"\n      title=\"${c.label}\" onclick=\"obPickColor('${c.hex}')\"><\u002Fdiv>`).join('')+\n    `<div class=\"ob-csw-custom${!presetMatch?' sel':''}\" id=\"obcswCustom\" title=\"Color personalizado\"\n      style=\"${!presetMatch?`border-color:var(--tx);background:${_obColorSel}`:''}\">\n      ${!presetMatch?`<svg viewBox=\"0 0 10 10\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" stroke-linecap=\"round\" width=\"10\" height=\"10\"><line x1=\"5\" y1=\"1\" x2=\"5\" y2=\"9\"/><line x1=\"1\" y1=\"5\" x2=\"9\" y2=\"5\"/><\u002Fsvg>`:`<svg viewBox=\"0 0 10 10\" fill=\"none\" stroke=\"var(--tx3)\" stroke-width=\"1.5\" stroke-linecap=\"round\" width=\"10\" height=\"10\"><line x1=\"5\" y1=\"1\" x2=\"5\" y2=\"9\"/><line x1=\"1\" y1=\"5\" x2=\"9\" y2=\"5\"/><\u002Fsvg>`}\n      <input type=\"color\" value=\"${!presetMatch?_obColorSel:'#ff6b6b'}\" style=\"position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0\"\n        oninput=\"obPickColor(this.value,true)\" onchange=\"obPickColor(this.value,true)\">\n    <\u002Fdiv>`;\n}\n\nfunction obPickColor(hex, isCustom=false){\n  _obColorSel=hex;\n  // Update all preset swatches\n  OB_PRESET_COLORS.forEach(c=>{\n    const el=document.getElementById('obcsw-'+c.hex.replace('#',''));\n    if(el){el.classList.toggle('sel',c.hex===hex&&!isCustom);el.style.borderColor=c.hex===hex&&!isCustom?'var(--tx)':'transparent';}\n  });\n  // Update custom swatch\n  const cust=document.getElementById('obcswCustom');\n  if(cust){\n    cust.classList.toggle('sel',isCustom);\n    cust.style.borderColor=isCustom?'var(--tx)':'';\n    cust.style.background=isCustom?hex:'';\n    const icon=cust.querySelector('svg');\n    if(icon) icon.setAttribute('stroke',isCustom?'#fff':'var(--tx3)');\n  }\n  // Update card accent preview if visible\n  const prev=document.getElementById('obColorPreview');\n  if(prev) prev.style.background=`linear-gradient(90deg,${hex},${hex}88)`;\n}\n\n// ── MODAL ──────────────────────────────────────────────\nfunction obOpenModal(id){\n  obEditId=id;\n  const ob=id?objetivos.find(o=>o.id===id):null;\n  document.getElementById('obModalTtl').textContent=ob?'Editar objetivo':'Nuevo objetivo';\n  const delBtn=document.getElementById('obModalDel');\n  if(delBtn) delBtn.style.display=ob?'':'none';\n\n  const currentColor=ob?.color||OB_PRESET_COLORS[0].hex;\n  const catPickerHtml=OB_CATS.map(cat=>{\n    const sel=(ob?.category||'trabajo')===cat.id;\n    return `<div class=\"ob-cat-pick-chip${sel?' sel':''}\" id=\"obcp-${cat.id}\"\n      style=\"${sel?`background:${cat.color};border-color:${cat.color};color:#fff`:''}\"\n      onclick=\"obPickCat('${cat.id}')\">${cat.label}<\u002Fdiv>`;\n  }).join('');\n\n  document.getElementById('obModalBody').innerHTML=`\n    <div class=\"ob-field\">\n      <div class=\"ob-label\">Nombre del objetivo<\u002Fdiv>\n      <input class=\"ob-inp\" id=\"obInpName\" placeholder=\"Ej. Correr 100km este mes…\" value=\"${esc(ob?.name||'')}\">\n    <\u002Fdiv>\n    <div class=\"ob-field\">\n      <div class=\"ob-label\">Descripción (opcional)<\u002Fdiv>\n      <textarea class=\"ob-textarea\" id=\"obInpDesc\" placeholder=\"Añade contexto o motivación…\">${esc(ob?.desc||'')}<\u002Ftextarea>\n    <\u002Fdiv>\n    <div class=\"ob-field\">\n      <div class=\"ob-label\">Categoría<\u002Fdiv>\n      <input type=\"hidden\" id=\"obInpCat\" value=\"${ob?.category||'trabajo'}\">\n      <div class=\"ob-cat-picker\">${catPickerHtml}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ob-field\">\n      <div class=\"ob-label\">Color<\u002Fdiv>\n      <div id=\"obColorPreview\" style=\"height:3px;border-radius:2px;margin-bottom:8px;background:linear-gradient(90deg,${currentColor},${currentColor}88)\"><\u002Fdiv>\n      <div class=\"ob-color-row\">${obColorSwatchesHtml(currentColor)}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ob-inp-row\">\n      <div class=\"ob-field\">\n        <div class=\"ob-label\">Valor actual<\u002Fdiv>\n        <input class=\"ob-inp\" id=\"obInpCurrent\" type=\"number\" min=\"0\" value=\"${ob?.current||0}\">\n      <\u002Fdiv>\n      <div class=\"ob-field\">\n        <div class=\"ob-label\">Valor objetivo<\u002Fdiv>\n        <input class=\"ob-inp\" id=\"obInpTarget\" type=\"number\" min=\"1\" value=\"${ob?.target||100}\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ob-inp-row\">\n      <div class=\"ob-field\">\n        <div class=\"ob-label\">Unidad (km, €, libros…)<\u002Fdiv>\n        <input class=\"ob-inp\" id=\"obInpUnit\" placeholder=\"km\" value=\"${esc(ob?.unit||'')}\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ob-inp-row\">\n      <div class=\"ob-field\">\n        <div class=\"ob-label\">Fecha inicio<\u002Fdiv>\n        <input class=\"ob-inp\" id=\"obInpStart\" type=\"date\" value=\"${ob?.startDate||dk(today)}\" style=\"font-family:var(--font);font-size:13px\">\n      <\u002Fdiv>\n      <div class=\"ob-field\">\n        <div class=\"ob-label\">Fecha límite<\u002Fdiv>\n        <input class=\"ob-inp\" id=\"obInpDeadline\" type=\"date\" value=\"${ob?.deadline||''}\" style=\"font-family:var(--font);font-size:13px\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ob-field\">\n      <div class=\"ob-label\">Estado<\u002Fdiv>\n      <select class=\"ob-inp\" id=\"obInpStatus\">\n        <option value=\"active\"   ${(ob?.status||'active')==='active'   ?'selected':''}>En curso<\u002Foption>\n        <option value=\"completed\"${ob?.status==='completed'?'selected':''}>Completado<\u002Foption>\n        <option value=\"paused\"   ${ob?.status==='paused'   ?'selected':''}>Pausado<\u002Foption>\n        <option value=\"abandoned\"${ob?.status==='abandoned'?'selected':''}>Abandonado<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>`;\n  document.getElementById('obModalOv').classList.add('open');\n  setTimeout(()=>document.getElementById('obInpName')?.focus(),80);\n}\n\nfunction obPickCat(id){\n  document.getElementById('obInpCat').value=id;\n  OB_CATS.forEach(cat=>{\n    const el=document.getElementById('obcp-'+cat.id);\n    if(!el) return;\n    if(cat.id===id){el.classList.add('sel');el.style.background=cat.color;el.style.borderColor=cat.color;el.style.color='#fff';}\n    else{el.classList.remove('sel');el.style.background='';el.style.borderColor='';el.style.color='';}\n  });\n  // Auto-update color to category color\n  const colInp=document.getElementById('obInpColor');\n  if(colInp) colInp.value=_obCat(id).color;\n}\n\nfunction obCloseModal(){document.getElementById('obModalOv')?.classList.remove('open');obEditId=null;}\n\nfunction obSave(){\n  const name=document.getElementById('obInpName')?.value.trim();\n  if(!name){document.getElementById('obInpName')?.focus();return;}\n  const cat=document.getElementById('obInpCat')?.value||'otros';\n  const current=parseFloat(document.getElementById('obInpCurrent')?.value)||0;\n  const target=parseFloat(document.getElementById('obInpTarget')?.value)||100;\n  const unit=document.getElementById('obInpUnit')?.value.trim()||'';\n  const color=_obColorSel||OB_PRESET_COLORS[0].hex;\n  const startDate=document.getElementById('obInpStart')?.value||dk(today);\n  const deadline=document.getElementById('obInpDeadline')?.value||'';\n  const desc=document.getElementById('obInpDesc')?.value.trim()||'';\n  const status=document.getElementById('obInpStatus')?.value||'active';\n\n  if(obEditId){\n    const ob=objetivos.find(o=>o.id===obEditId);\n    if(ob) Object.assign(ob,{name,desc,category:cat,color,unit,current,target,startDate,deadline,status});\n  } else {\n    objetivos.push({id:obNid++,name,desc,category:cat,color,unit,current,target,startDate,deadline,status});\n  }\n  saveObjetivos();sfxAdd();obCloseModal();renderObjetivos();\n}\n\nfunction obDelete(){\n  if(!obEditId) return;\n  objetivos=objetivos.filter(o=>o.id!==obEditId);\n  saveObjetivos();obCloseModal();renderObjetivos();showToast('Objetivo eliminado');\n}\n\nfunction obDeleteDirect(id){\n  objetivos=objetivos.filter(o=>o.id!==id);\n  saveObjetivos();renderObjetivos();showToast('Objetivo eliminado');\n}\n\n// ══════════════════════════════════════════════════════\n// SETTINGS — Sidebar customization + Encrypted backup\n// ══════════════════════════════════════════════════════\n\n// ── SETTINGS STORAGE ──────────────────────────────────\n// SETTINGS_KEY defined above\nfunction loadSettings(){return _safeRead(SETTINGS_KEY,null);}\nfunction saveSettings(){_safeWrite(SETTINGS_KEY,appSettings);}\n\n// Default sidebar layout\nconst DEFAULT_SIDEBAR=[\n  {id:'sec-inicio',label:'',items:[\n    {id:'home',label:'Inicio',view:'home',icon:'home'}\n  ]},\n  {id:'sec-vistas',label:'Vistas',items:[\n    {id:'tasks',label:'Tareas',view:'tasks',icon:'tasks'},\n    {id:'planning',label:'Planning Anual',view:'planning',icon:'calendar'},\n  ]},\n  {id:'sec-herramientas',label:'Herramientas',items:[\n    {id:'habits',label:'Hábitos',view:'habits',icon:'clock'},\n    {id:'objetivos',label:'Objetivos',view:'objetivos',icon:'target'},\n    {id:'vision',label:'Visualización',view:'vision',icon:'eye'},\n  ]},\n];\n\nlet appSettings=loadSettings()||{sidebar:JSON.parse(JSON.stringify(DEFAULT_SIDEBAR))};\nif(!appSettings.sidebar) appSettings.sidebar=JSON.parse(JSON.stringify(DEFAULT_SIDEBAR));\n// ── MIGRATE: remove 'docs' and 'focus' items ──\n(function _migrateSidebar(){\n  let changed=false;\n  // Remove focus and docs items\n  appSettings.sidebar.forEach(sec=>{\n    const before=sec.items.length;\n    sec.items=sec.items.filter(it=>it.view!=='focus'&&it.view!=='docs');\n    if(sec.items.length!==before) changed=true;\n  });\n  if(changed) saveSettings();\n})();\n\n// ── ICON LIBRARY ──────────────────────────────────────\nconst ICON_LIB={\n  home:      '<path d=\"M1.5 6L7 1.5 12.5 6V12.5H8.5V9H5.5V12.5H1.5Z\"/>',\n  tasks:     '<rect x=\"1.5\" y=\"1.5\" width=\"5\" height=\"5\" rx=\"1\"/><rect x=\"7.5\" y=\"1.5\" width=\"5\" height=\"5\" rx=\"1\"/><rect x=\"1.5\" y=\"7.5\" width=\"5\" height=\"5\" rx=\"1\"/><rect x=\"7.5\" y=\"7.5\" width=\"5\" height=\"5\" rx=\"1\"/>',\n  calendar:  '<rect x=\"1.5\" y=\"1.5\" width=\"11\" height=\"11\" rx=\"2\"/><path d=\"M1.5 5.5h11\"/><path d=\"M5 1.5v4\"/><path d=\"M9 1.5v4\"/>',\n  clock:     '<circle cx=\"7\" cy=\"7\" r=\"5.5\"/><path d=\"M7 4v3l2 1.2\"/>',\n  target:    '<circle cx=\"7\" cy=\"7\" r=\"5.5\"/><circle cx=\"7\" cy=\"7\" r=\"2.5\"/>',\n  focus:     '<circle cx=\"7\" cy=\"7\" r=\"5.5\"/><circle cx=\"7\" cy=\"7\" r=\"2\"/>',\n  eye:       '<path d=\"M1.5 7s2-4 5.5-4 5.5 4 5.5 4-2 4-5.5 4-5.5-4-5.5-4z\"/><circle cx=\"7\" cy=\"7\" r=\"1.5\"/>',\n  star:      '<polygon points=\"7,1.5 8.7,5.2 12.8,5.7 9.9,8.4 10.7,12.5 7,10.4 3.3,12.5 4.1,8.4 1.2,5.7 5.3,5.2\"/>',\n  bolt:      '<path d=\"M8.5 1.5L4 8h4l-2.5 4.5 6-7H8.5z\"/>',\n  chart:     '<path d=\"M1.5 12.5V9.5l2.5-3 3 2 3-5 2.5 2V12.5z\"/>',\n  flag:      '<path d=\"M3 1.5v11M3 1.5l8 2.5-8 2.5\"/>',\n  bell:      '<path d=\"M7 1.5A3.5 3.5 0 0 0 3.5 5v3l-1 1.5h9L10.5 8V5A3.5 3.5 0 0 0 7 1.5zM5.5 11.5a1.5 1.5 0 0 0 3 0\"/>',\n  heart:     '<path d=\"M7 12S1.5 8 1.5 4.5A2.75 2.75 0 0 1 7 3a2.75 2.75 0 0 1 5.5 1.5C12.5 8 7 12 7 12z\"/>',\n  book:      '<rect x=\"2\" y=\"1.5\" width=\"10\" height=\"11\" rx=\"1.5\"/><line x1=\"5\" y1=\"1.5\" x2=\"5\" y2=\"12.5\"/>',\n  leaf:      '<path d=\"M12 2c0 5.5-4 9-9 10l-1-1C4 9 6 6 12 2z\"/><path d=\"M3 11c2-2 4-3 6-6\"/>',\n  run:       '<circle cx=\"10\" cy=\"2.5\" r=\"1.2\"/><path d=\"M8 5l-3 2.5 2 2L5.5 12M8 5l2 1.5v2.5h2\"/>',\n  briefcase: '<rect x=\"2\" y=\"4.5\" width=\"10\" height=\"8\" rx=\"1.5\"/><path d=\"M5 4.5V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5\"/><line x1=\"2\" y1=\"8.5\" x2=\"12\" y2=\"8.5\"/>',\n  settings:  '<circle cx=\"7\" cy=\"7\" r=\"2\"/><path d=\"M7 1v1.5M7 11.5V13M1 7h1.5M11.5 7H13M2.6 2.6l1.1 1.1M10.3 10.3l1.1 1.1M2.6 11.4l1.1-1.1M10.3 3.7l1.1-1.1\"/>',\n  puzzle:    '<path d=\"M9 2.5V5h1.5a1 1 0 1 1 0 2H9v1.5H11.5a1 1 0 1 1 0 2H9V13H2V2.5h7z\"/>',\n  map:       '<polygon points=\"1.5,2.5 5,1.5 9,2.5 12.5,1.5 12.5,11.5 9,12.5 5,11.5 1.5,12.5\"/><line x1=\"5\" y1=\"1.5\" x2=\"5\" y2=\"11.5\"/><line x1=\"9\" y1=\"2.5\" x2=\"9\" y2=\"12.5\"/>',\n  grid:      '<rect x=\"1.5\" y=\"1.5\" width=\"4\" height=\"4\" rx=\".5\"/><rect x=\"8.5\" y=\"1.5\" width=\"4\" height=\"4\" rx=\".5\"/><rect x=\"1.5\" y=\"8.5\" width=\"4\" height=\"4\" rx=\".5\"/><rect x=\"8.5\" y=\"8.5\" width=\"4\" height=\"4\" rx=\".5\"/>',\n  list:      '<line x1=\"1.5\" y1=\"4\" x2=\"12.5\" y2=\"4\"/><line x1=\"1.5\" y1=\"7\" x2=\"12.5\" y2=\"7\"/><line x1=\"1.5\" y1=\"10\" x2=\"12.5\" y2=\"10\"/>',\n  check:     '<polyline points=\"1.5,7 5,10.5 12.5,3.5\"/>',\n  fire:      '<path d=\"M7 13C4 13 2 10.5 2 8c0-2 1-3.5 2.5-4.5.5 1.5 1 2 1 2S6 4 6 2c0 0 4 2 4 6a3 3 0 0 1-3 3z\"/>',\n  moon:      '<path d=\"M12 8A5 5 0 1 1 6 2a4 4 0 1 0 6 6z\"/>',\n  sun:       '<circle cx=\"7\" cy=\"7\" r=\"2.5\"/><line x1=\"7\" y1=\"1\" x2=\"7\" y2=\"2.5\"/><line x1=\"7\" y1=\"11.5\" x2=\"7\" y2=\"13\"/><line x1=\"1\" y1=\"7\" x2=\"2.5\" y2=\"7\"/><line x1=\"11.5\" y1=\"7\" x2=\"13\" y2=\"7\"/>',\n  music:     '<path d=\"M10 1.5v8.5\"/><path d=\"M6 3v8.5\"/><circle cx=\"4\" cy=\"11.5\" r=\"1.5\"/><circle cx=\"8\" cy=\"10\" r=\"1.5\"/>',\n  camera:    '<rect x=\"1.5\" y=\"4\" width=\"11\" height=\"8\" rx=\"1.5\"/><circle cx=\"7\" cy=\"8\" r=\"2.2\"/><path d=\"M5 4l1-2h2l1 2\"/>',\n  lock:      '<rect x=\"3.5\" y=\"6\" width=\"7\" height=\"6.5\" rx=\"1.2\"/><path d=\"M5 6V4.5a2 2 0 0 1 4 0V6\"/>',\n};\n\nfunction iconSvg(name,size=13){\n  const d=ICON_LIB[name]||ICON_LIB.star;\n  return `<svg width=\"${size}\" height=\"${size}\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${d}<\u002Fsvg>`;\n}\n\n// ── RENDER SIDEBAR from settings ──────────────────────\nfunction renderSidebarFromSettings(){\n  const scroll=document.getElementById('sidebarScrollInner');\n  if(!scroll) return;\n  const sections=appSettings.sidebar||DEFAULT_SIDEBAR;\n  let html='';\n  sections.forEach(sec=>{\n    if(sec.id==='sec-inicio'){\n      html+=`<div class=\"nav-sec\" style=\"margin-bottom:8px\">`;\n    } else {\n      html+=`<div class=\"nav-sec\"><div class=\"nav-lbl\">${esc(sec.label)}<\u002Fdiv>`;\n    }\n    sec.items.forEach(item=>{\n      const isCurrent=curView===item.view||(item.view==='tasks'&&['week','wcal','month','day'].includes(curView));\n      html+=`<div class=\"nav-item${isCurrent?' active':''}\" id=\"nav-${item.id}\"\n        onclick=\"${item.view==='tasks'?'setViewTasks()':item.view==='settings'?`setView('settings')`:`setView('${item.view}')`}\">\n        ${iconSvg(item.icon||'star')}${esc(item.label)}\n      <\u002Fdiv>`;\n    });\n    html+='<\u002Fdiv>';\n  });\n  scroll.innerHTML=html;\n}\n\n// ── SETTINGS PANEL ────────────────────────────────────\nlet cfgTab='sidebar'; // 'sidebar'|'backup'|'appearance'\nlet _iconPickerTarget=null; // {secIdx,itemIdx}\n\nfunction renderSettings(){\n  const c=document.getElementById('mainContent');\n  c.innerHTML=`<div class=\"cfg-wrap\">\n    <div class=\"cfg-nav\">\n      <div class=\"cfg-nav-item${cfgTab==='sidebar'?' active':''}\" onclick=\"cfgSetTab('sidebar')\">\n        ${iconSvg('list',13)}&nbsp;Barra lateral\n      <\u002Fdiv>\n      <div class=\"cfg-nav-item${cfgTab==='backup'?' active':''}\" onclick=\"cfgSetTab('backup')\">\n        ${iconSvg('lock',13)}&nbsp;Copia de seguridad\n      <\u002Fdiv>\n      <div class=\"cfg-nav-item${cfgTab==='appearance'?' active':''}\" onclick=\"cfgSetTab('appearance')\">\n        ${iconSvg('moon',13)}&nbsp;Apariencia\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cfg-body\" id=\"cfgBody\"><\u002Fdiv>\n  <\u002Fdiv>`;\n  cfgRenderTab();\n}\n\nfunction cfgSetTab(t){cfgTab=t;cfgRenderTab();}\n\nfunction cfgRenderTab(){\n  const body=document.getElementById('cfgBody');if(!body) return;\n  if(cfgTab==='sidebar') cfgRenderSidebar(body);\n  else if(cfgTab==='backup') cfgRenderBackup(body);\n  else cfgRenderAppearance(body);\n}\n\n// ── SIDEBAR EDITOR ─────────────────────────────────────\nfunction cfgRenderSidebar(el){\n  const sections=appSettings.sidebar;\n  let html=`<div class=\"cfg-card\">\n    <div class=\"cfg-section-ttl\">Organizar barra lateral<\u002Fdiv>\n    <div style=\"font-size:12px;color:var(--tx3);margin-bottom:14px;line-height:1.6\">Arrastra las secciones y elementos para reordenarlos. Haz clic en el icono para cambiarlo. Edita el nombre directamente.<\u002Fdiv>\n    <div class=\"sb-editor\" id=\"sbEditor\">`;\n\n  sections.forEach((sec,si)=>{\n    html+=`<div class=\"sb-section-block\" id=\"sbsec-${si}\" draggable=\"true\"\n      ondragstart=\"cfgSecDragStart(event,${si})\" ondragover=\"cfgSecDragOver(event,${si})\"\n      ondrop=\"cfgSecDrop(event,${si})\" ondragleave=\"cfgSecDragLeave(event,${si})\">\n      <div class=\"sb-sec-header\">\n        <span class=\"sb-sec-grip\" title=\"Mover sección\">⠿<\u002Fspan>\n        <input class=\"sb-sec-lbl-inp\" value=\"${esc(sec.label)}\" placeholder=\"Nombre de sección…\"\n          oninput=\"appSettings.sidebar[${si}].label=this.value;saveSettings();renderSidebarFromSettings()\">\n        <div class=\"sb-sec-controls\">\n          <button class=\"sb-sec-btn\" onclick=\"cfgAddItem(${si})\" title=\"Añadir elemento\">+<\u002Fbutton>\n          ${si>0?`<button class=\"sb-sec-btn del\" onclick=\"cfgDelSection(${si})\" title=\"Eliminar sección\">✕<\u002Fbutton>`:''}\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sb-items-list\" id=\"sbitems-${si}\">`;\n\n    sec.items.forEach((item,ii)=>{\n      html+=`<div class=\"sb-item\" id=\"sbitem-${si}-${ii}\" draggable=\"true\"\n        ondragstart=\"cfgItemDragStart(event,${si},${ii})\"\n        ondragover=\"cfgItemDragOver(event,${si},${ii})\"\n        ondrop=\"cfgItemDrop(event,${si},${ii})\"\n        ondragleave=\"cfgItemDragLeave(event,${si},${ii})\">\n        <span class=\"sb-item-grip\">⠿<\u002Fspan>\n        <div class=\"sb-item-icon-wrap\" title=\"Cambiar icono\" onclick=\"cfgOpenIconPicker(${si},${ii},this)\">\n          ${iconSvg(item.icon||'star',13)}\n        <\u002Fdiv>\n        <input class=\"sb-item-lbl\" value=\"${esc(item.label)}\"\n          oninput=\"appSettings.sidebar[${si}].items[${ii}].label=this.value;saveSettings();renderSidebarFromSettings()\">\n        <button class=\"sb-item-del\" onclick=\"cfgDelItem(${si},${ii})\" title=\"Eliminar\">✕<\u002Fbutton>\n      <\u002Fdiv>`;\n    });\n\n    html+=`<\u002Fdiv><\u002Fdiv>`;\n  });\n\n  html+=`<\u002Fdiv>\n    <div style=\"margin-top:14px;display:flex;gap:8px;flex-wrap:wrap\">\n      <button class=\"cfg-bk-btn\" onclick=\"cfgAddSection()\">+ Añadir sección<\u002Fbutton>\n      <button class=\"cfg-bk-btn danger\" onclick=\"cfgResetSidebar()\">↺ Restaurar por defecto<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n  el.innerHTML=html;\n}\n\n// Sidebar section drag\nlet _cfgSecDrag=null;\nfunction cfgSecDragStart(e,si){_cfgSecDrag=si;e.dataTransfer.effectAllowed='move';}\nfunction cfgSecDragOver(e,si){e.preventDefault();if(_cfgSecDrag===null||_cfgSecDrag===si)return;document.getElementById('sbsec-'+si)?.classList.add('vs-drag-ghost');}\nfunction cfgSecDragLeave(e,si){document.getElementById('sbsec-'+si)?.classList.remove('vs-drag-ghost');}\nfunction cfgSecDrop(e,si){\n  e.preventDefault();document.getElementById('sbsec-'+si)?.classList.remove('vs-drag-ghost');\n  if(_cfgSecDrag===null||_cfgSecDrag===si){_cfgSecDrag=null;return;}\n  const arr=appSettings.sidebar;\n  const [moved]=arr.splice(_cfgSecDrag,1);arr.splice(si,0,moved);\n  _cfgSecDrag=null;saveSettings();renderSidebarFromSettings();cfgRenderSidebar(document.getElementById('cfgBody'));\n}\n\n// Sidebar item drag\nlet _cfgItemDrag=null;\nfunction cfgItemDragStart(e,si,ii){_cfgItemDrag={si,ii};e.dataTransfer.effectAllowed='move';e.stopPropagation();}\nfunction cfgItemDragOver(e,si,ii){e.preventDefault();e.stopPropagation();}\nfunction cfgItemDragLeave(e,si,ii){}\nfunction cfgItemDrop(e,si,ii){\n  e.preventDefault();e.stopPropagation();\n  if(!_cfgItemDrag) return;\n  const {si:fromSi,ii:fromIi}=_cfgItemDrag;_cfgItemDrag=null;\n  const fromArr=appSettings.sidebar[fromSi].items;\n  const toArr=appSettings.sidebar[si].items;\n  const [moved]=fromArr.splice(fromIi,1);\n  toArr.splice(ii,0,moved);\n  saveSettings();renderSidebarFromSettings();cfgRenderSidebar(document.getElementById('cfgBody'));\n}\n\nfunction cfgAddSection(){\n  appSettings.sidebar.push({id:'sec-custom-'+Date.now(),label:'Nueva sección',items:[]});\n  saveSettings();cfgRenderSidebar(document.getElementById('cfgBody'));\n}\nfunction cfgDelSection(si){\n  appSettings.sidebar.splice(si,1);saveSettings();renderSidebarFromSettings();cfgRenderSidebar(document.getElementById('cfgBody'));\n}\nfunction cfgAddItem(si){\n  const views=['home','tasks','planning','habits','objetivos','vision','settings'];\n  const used=appSettings.sidebar.flatMap(s=>s.items.map(i=>i.view));\n  const avail=views.find(v=>!used.includes(v))||'home';\n  const labels={home:'Inicio',tasks:'Tareas',planning:'Planning',habits:'Hábitos',objetivos:'Objetivos',vision:'Visualización',settings:'Ajustes'};\n  const icons={home:'home',tasks:'tasks',planning:'calendar',habits:'clock',objetivos:'target',vision:'eye',settings:'settings'};\n  appSettings.sidebar[si].items.push({id:avail+'-'+Date.now(),label:labels[avail]||'Nuevo',view:avail,icon:icons[avail]||'star'});\n  saveSettings();renderSidebarFromSettings();cfgRenderSidebar(document.getElementById('cfgBody'));\n}\nfunction cfgDelItem(si,ii){\n  appSettings.sidebar[si].items.splice(ii,1);saveSettings();renderSidebarFromSettings();cfgRenderSidebar(document.getElementById('cfgBody'));\n}\nfunction cfgResetSidebar(){\n  appSettings.sidebar=JSON.parse(JSON.stringify(DEFAULT_SIDEBAR));\n  saveSettings();renderSidebarFromSettings();cfgRenderSidebar(document.getElementById('cfgBody'));\n  showToast('Barra lateral restaurada ✓');\n}\n\n// ── ICON PICKER ────────────────────────────────────────\nlet _iconPickerEl=null;\nfunction cfgOpenIconPicker(si,ii,anchorEl){\n  cfgCloseIconPicker();\n  _iconPickerTarget={si,ii};\n  const picker=document.createElement('div');\n  picker.className='icon-picker';\n  picker.id='iconPicker';\n  const icons=Object.keys(ICON_LIB);\n  picker.innerHTML=`<input class=\"icon-picker-search\" placeholder=\"Buscar icono…\" oninput=\"cfgFilterIcons(this.value)\" autofocus>\n    <div class=\"icon-picker-grid\" id=\"iconPickerGrid\">\n      ${icons.map(name=>`<button class=\"icon-pick-btn\" title=\"${name}\" onclick=\"cfgSelectIcon('${name}')\">${iconSvg(name,13)}<\u002Fbutton>`).join('')}\n    <\u002Fdiv>`;\n  document.body.appendChild(picker);\n  _iconPickerEl=picker;\n  const rect=anchorEl.getBoundingClientRect();\n  const top=rect.bottom+6;const left=rect.left;\n  picker.style.top=Math.min(top,window.innerHeight-220)+'px';\n  picker.style.left=Math.min(left,window.innerWidth-300)+'px';\n  setTimeout(()=>{\n    picker.querySelector('.icon-picker-search')?.focus();\n    document.addEventListener('mousedown',cfgIconPickerOutside,{once:true});\n  },0);\n}\nfunction cfgCloseIconPicker(){if(_iconPickerEl){_iconPickerEl.remove();_iconPickerEl=null;}document.removeEventListener('mousedown',cfgIconPickerOutside);}\nfunction cfgIconPickerOutside(e){if(!document.getElementById('iconPicker')?.contains(e.target))cfgCloseIconPicker();}\nfunction cfgFilterIcons(q){\n  const grid=document.getElementById('iconPickerGrid');if(!grid)return;\n  const icons=Object.keys(ICON_LIB).filter(n=>n.includes(q.toLowerCase()));\n  grid.innerHTML=icons.map(name=>`<button class=\"icon-pick-btn\" title=\"${name}\" onclick=\"cfgSelectIcon('${name}')\">${iconSvg(name,13)}<\u002Fbutton>`).join('');\n}\nfunction cfgSelectIcon(name){\n  if(!_iconPickerTarget) return;\n  const {si,ii}=_iconPickerTarget;\n  appSettings.sidebar[si].items[ii].icon=name;\n  saveSettings();renderSidebarFromSettings();cfgRenderSidebar(document.getElementById('cfgBody'));\n  cfgCloseIconPicker();\n}\n\n// ── APPEARANCE SETTINGS ────────────────────────────────\nfunction cfgRenderAppearance(el){\n  el.innerHTML=`<div class=\"cfg-card\">\n    <div class=\"cfg-section-ttl\">Apariencia<\u002Fdiv>\n    <div class=\"cfg-row\">\n      <div><div class=\"cfg-row-lbl\">Modo oscuro<\u002Fdiv><div class=\"cfg-row-sub\">Activa el tema oscuro de la app<\u002Fdiv><\u002Fdiv>\n      <div class=\"toggle-track${isDark?' on':''}\" style=\"cursor:pointer\" onclick=\"toggleDark()\"><div class=\"toggle-thumb\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\n// ── BACKUP WITH ENCRYPTION ─────────────────────────────\n// Uses Web Crypto API (AES-GCM 256) — no external libraries needed\n// The encrypted backup is a JSON with {encrypted:true,salt,iv,data}\n\nasync function _deriveKey(password,salt){\n  const enc=new TextEncoder();\n  const keyMat=await crypto.subtle.importKey('raw',enc.encode(password),{name:'PBKDF2'},false,['deriveKey']);\n  return crypto.subtle.deriveKey(\n    {name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},\n    keyMat,{name:'AES-GCM',length:256},false,['encrypt','decrypt']\n  );\n}\nfunction _buf2b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)));}\nfunction _b642buf(b64){const bin=atob(b64);const buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);return buf.buffer;}\n\nasync function exportEncrypted(password){\n  const payload=await _buildExportPayload();\n  const json=JSON.stringify(payload);\n  const enc=new TextEncoder();\n  const salt=crypto.getRandomValues(new Uint8Array(16));\n  const iv=crypto.getRandomValues(new Uint8Array(12));\n  const key=await _deriveKey(password,salt);\n  const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(json));\n  const out={encrypted:true,v:2,salt:_buf2b64(salt.buffer),iv:_buf2b64(iv.buffer),data:_buf2b64(encrypted)};\n  _downloadJson(JSON.stringify(out),`victor-os-encrypted-${dk(today)}.vos`);\n  showToast('Copia cifrada guardada ↓');\n}\n\nasync function importEncrypted(jsonStr,password){\n  const parsed=JSON.parse(jsonStr);\n  if(!parsed.encrypted) throw new Error('not_encrypted');\n  const salt=_b642buf(parsed.salt);const iv=_b642buf(parsed.iv);const data=_b642buf(parsed.data);\n  const key=await _deriveKey(password,new Uint8Array(salt));\n  const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(iv)},key,data);\n  return JSON.parse(new TextDecoder().decode(dec));\n}\n\nasync function _buildExportPayload(){\n  await _flushAll();\n  const vd=vsData||await loadVision()||vsDefaultData();\n  return {v:STORE_VERSION,exported:new Date().toISOString(),tasks,weekGoals,monthGoals,yearGoals,habits,focusSessions,apData,objetivos,vsData:vd,settings:{dark:isDark,moBg,homeBg}};\n}\nfunction _downloadJson(content,filename){\n  const blob=new Blob([content],{type:'application/json'});\n  const url=URL.createObjectURL(blob);const a=document.createElement('a');\n  a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);\n}\n\nfunction cfgRenderBackup(el){\n  // Calculate localStorage usage\n  let lsUsed=0;\n  try{for(let k in localStorage){if(localStorage.hasOwnProperty(k))lsUsed+=localStorage[k].length*2;}}catch{}\n  const lsUsedKB=(lsUsed/1024).toFixed(0);\n  const lsUsedMB=(lsUsed/1024/1024).toFixed(2);\n  const pct=Math.min(100,Math.round(lsUsed/1024/1024/5*100));\n  const barColor=pct>80?'var(--red)':pct>50?'var(--gold)':'#43a873';\n\n  el.innerHTML=`\n  <div class=\"cfg-card\">\n    <div class=\"cfg-section-ttl\">Uso de almacenamiento<\u002Fdiv>\n    <div style=\"margin-bottom:10px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px\">\n        <span style=\"font-size:12px;color:var(--tx2)\">localStorage: ${lsUsedKB} KB (${lsUsedMB} MB)<\u002Fspan>\n        <span style=\"font-size:11px;color:var(--tx3)\">límite ~5MB<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:6px;background:var(--s3);border-radius:3px;overflow:hidden\">\n        <div style=\"height:100%;width:${pct}%;background:${barColor};border-radius:3px;transition:width .3s\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--tx3);margin-top:4px\">Los vídeos e imágenes de Visualización se guardan en IndexedDB (sin límite práctico)<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"cfg-card\">\n    <div class=\"cfg-section-ttl\">Exportar copia de seguridad<\u002Fdiv>\n    <div style=\"font-size:12.5px;color:var(--tx2);margin-bottom:14px;line-height:1.7\">Guarda todos tus datos (tareas, hábitos, objetivos, planning, visualización con imágenes y vídeos…) en un archivo JSON. Puedes cifrarla con contraseña usando AES-256.<\u002Fdiv>\n    <div class=\"cfg-backup-area\">\n      <div class=\"cfg-backup-row\">\n        <button class=\"cfg-bk-btn primary\" onclick=\"exportData()\">\n          <svg width=\"13\" height=\"13\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M7 1v9M4 7l3 3 3-3\"/><path d=\"M1.5 11v1.5h11V11\"/><\u002Fsvg>\n          Exportar sin cifrar\n        <\u002Fbutton>\n        <button class=\"cfg-bk-btn\" onclick=\"cfgShowEncryptExport()\">\n          <svg width=\"13\" height=\"13\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><rect x=\"3.5\" y=\"6\" width=\"7\" height=\"6.5\" rx=\"1.2\"/><path d=\"M5 6V4.5a2 2 0 0 1 4 0V6\"/><\u002Fsvg>\n          Exportar cifrada\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div id=\"cfgEncryptExport\" style=\"display:none\">\n        <div style=\"font-size:12px;color:var(--tx3);margin-bottom:6px\">Contraseña de cifrado (AES-256-GCM)<\u002Fdiv>\n        <div class=\"cfg-pwd-row\">\n          <input class=\"cfg-pwd-inp\" type=\"password\" id=\"cfgExportPwd\" placeholder=\"Contraseña segura…\" onkeydown=\"if(event.key==='Enter')cfgDoExportEncrypted()\">\n          <button class=\"cfg-bk-btn primary\" onclick=\"cfgDoExportEncrypted()\">Cifrar y exportar<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"cfg-encrypt-info\">\n          <svg width=\"12\" height=\"12\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"#43a873\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M7 1L2 3.5V8c0 3 5 5 5 5s5-2 5-5V3.5z\"/><polyline points=\"5,7 6.5,8.5 9,5.5\"/><\u002Fsvg>\n          <span>Cifrado con AES-256-GCM y PBKDF2 (200.000 iteraciones). Sin contraseña, los datos son ilegibles.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"cfg-card\">\n    <div class=\"cfg-section-ttl\">Importar copia de seguridad<\u002Fdiv>\n    <div style=\"font-size:12.5px;color:var(--tx2);margin-bottom:14px;line-height:1.7\">Selecciona un archivo de copia de seguridad (.json o .vos). Si está cifrado, introduce la contraseña.<\u002Fdiv>\n    <div class=\"cfg-backup-area\">\n      <div class=\"cfg-backup-row\">\n        <button class=\"cfg-bk-btn\" onclick=\"document.getElementById('cfgImportFile').click()\">\n          <svg width=\"13\" height=\"13\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M7 13V4M4 7l3-3 3 3\"/><path d=\"M1.5 11v1.5h11V11\"/><\u002Fsvg>\n          Seleccionar archivo\n        <\u002Fbutton>\n        <input type=\"file\" id=\"cfgImportFile\" accept=\".json,.vos\" style=\"display:none\" onchange=\"cfgHandleImport(event)\">\n      <\u002Fdiv>\n      <div id=\"cfgDecryptRow\" style=\"display:none\">\n        <div style=\"font-size:12px;color:var(--tx3);margin-bottom:6px\">Este archivo está cifrado. Introduce la contraseña:<\u002Fdiv>\n        <div class=\"cfg-pwd-row\">\n          <input class=\"cfg-pwd-inp\" type=\"password\" id=\"cfgImportPwd\" placeholder=\"Contraseña…\" onkeydown=\"if(event.key==='Enter')cfgDoImportEncrypted()\">\n          <button class=\"cfg-bk-btn primary\" onclick=\"cfgDoImportEncrypted()\">Descifrar e importar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"cfgImportStatus\" style=\"font-size:12px;color:var(--tx3);margin-top:6px\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"cfg-card\">\n    <div class=\"cfg-section-ttl\" style=\"color:var(--red)\">Zona de peligro<\u002Fdiv>\n    <div class=\"cfg-row\">\n      <div><div class=\"cfg-row-lbl\">Borrar todos los datos<\u002Fdiv><div class=\"cfg-row-sub\">Elimina permanentemente todas las tareas, hábitos y objetivos del dispositivo<\u002Fdiv><\u002Fdiv>\n      <button class=\"cfg-bk-btn danger\" onclick=\"cfgClearAll()\">Borrar todo<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction cfgShowEncryptExport(){\n  const d=document.getElementById('cfgEncryptExport');\n  if(d){d.style.display=d.style.display==='none'?'':'none';if(d.style.display!=='none')document.getElementById('cfgExportPwd')?.focus();}\n}\nasync function cfgDoExportEncrypted(){\n  const pwd=document.getElementById('cfgExportPwd')?.value;\n  if(!pwd||pwd.length<4){showToast('La contraseña debe tener al menos 4 caracteres');return;}\n  try{await exportEncrypted(pwd);}catch(e){showToast('Error al cifrar: '+e.message);}\n}\n\nlet _cfgImportRaw=null;\nfunction cfgHandleImport(e){\n  const file=e.target.files[0];if(!file)return;\n  const reader=new FileReader();\n  reader.onload=ev=>{\n    _cfgImportRaw=ev.target.result;\n    e.target.value='';\n    try{\n      const parsed=JSON.parse(_cfgImportRaw);\n      if(parsed.encrypted){\n        document.getElementById('cfgDecryptRow').style.display='';\n        document.getElementById('cfgImportStatus').textContent='Archivo cifrado detectado. Introduce la contraseña.';\n        document.getElementById('cfgImportPwd')?.focus();\n      } else {\n        _applyImportData(parsed);\n      }\n    }catch(err){showToast('Archivo no válido');}\n  };\n  reader.readAsText(file);\n}\nasync function cfgDoImportEncrypted(){\n  const pwd=document.getElementById('cfgImportPwd')?.value;\n  if(!pwd){return;}\n  const statusEl=document.getElementById('cfgImportStatus');\n  if(statusEl) statusEl.textContent='Descifrando…';\n  try{\n    const data=await importEncrypted(_cfgImportRaw,pwd);\n    _applyImportData(data);\n    document.getElementById('cfgDecryptRow').style.display='none';\n    if(statusEl) statusEl.textContent='';\n  }catch(e){\n    if(statusEl) statusEl.textContent='Contraseña incorrecta o archivo dañado.';\n    showToast('Error: contraseña incorrecta');\n  }\n}\nfunction _applyImportData(data){\n  if(Array.isArray(data)){tasks=(data).map(t=>({notes:'',color:0,end:'',...t}));weekGoals=[];}\n  else{\n    tasks=(data.tasks||[]).map(_sanitizeTask).filter(Boolean);\n    weekGoals=(data.weekGoals||[]).map(_sanitizeGoal).filter(Boolean);\n    if(data.monthGoals) monthGoals=(data.monthGoals|
