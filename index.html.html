>{\n    if(!_dnDrag.active) return;\n    ghost.style.top=(ev.clientY-(rect.height/2))+'px';\n    clearLine();\n    ghost.style.display='none';\n    const under=document.elementFromPoint(ev.clientX,ev.clientY);\n    ghost.style.display='';\n    const target=under?under.closest('.docs-block-section'):null;\n    if(target&&target!==sec&&area.contains(target)){\n      _dnDragDropLine=document.createElement('div');\n      _dnDragDropLine.style.cssText='height:2px;border-radius:2px;background:var(--accent);margin:2px 0;pointer-events:none';\n      const tr=target.getBoundingClientRect();\n      const isTop=ev.clientY<tr.top+tr.height/2;\n      _dnDrag.overEl=target;_dnDrag.isTop=isTop;\n      if(isTop) target.before(_dnDragDropLine); else target.after(_dnDragDropLine);\n    } else { _dnDrag.overEl=null; }\n  };\n  const mu=()=>{\n    document.removeEventListener('mousemove',mm);\n    document.removeEventListener('mouseup',mu);\n    ghost.remove(); clearLine();\n    sec.style.opacity='';\n    if(_dnDrag.overEl&&_dnDrag.overEl!==sec){\n      if(_dnDrag.isTop) _dnDrag.overEl.before(sec); else _dnDrag.overEl.after(sec);\n      const item=getDetItem();\n      if(item){\n        const newOrder=[...area.querySelectorAll('.docs-block-section')].map(el=>el.dataset.bid);\n        item.blocks=newOrder.map(id=>(item.blocks||[]).find(b=>b.id===id)).filter(Boolean);\n        saveDetArr();\n      }\n    }\n    _dnDrag={active:false,bid:null,ghost:null,el:null,overEl:null,isTop:false};\n  };\n  document.addEventListener('mousemove',mm);\n  document.addEventListener('mouseup',mu);\n}\nfunction tickColor(col){\n  // Light mode: white tick; Dark mode: dark tick #252526\n  return isDark ? '#252526' : '#ffffff';\n}\nconst DS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];\nconst DL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];\nconst MO=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];\nconst HR=60;\n\n// ── STATE ─────────────────────────────────────────────\nconst today=new Date();\nlet viewOffset=0,curView='home',selColor=0;\nlet wcalDayOffset=0; // day-based offset for calendario view (independent of week offset)\nlet moTarget=null,moIsGoal=false;\nlet mcOffset=0,expDay=null,detId=null,detIsGoal=false,detSource='task';\nlet dragId=null,isDark=false,dlEditMode=true;\nlet colorPopupId=null;\n\n// ══════════════════════════════════════════════════════\n// STORAGE — versioned, validated, with auto-backup\n// ══════════════════════════════════════════════════════\nconst STORE_VERSION = 4;\nconst STORE_KEYS = {\n  tasks:      'sp6',\n  goals:      'sp6g',\n  monthGoals: 'sp6mg',\n  yearGoals:  'sp6yg',\n  habits:     'sp6habits',\n  focus:      'sp6fc',\n  ap:         'sp6ap',\n  objetivos:  'sp6ob',\n  dark:       'sp6dark',\n  sidebar:    'sp6sb',\n  mobg:       'sp6mobg',\n  homebg:     'sp6homebg',\n  meta:       'sp6_meta',\n  sleep:      'sp6sleep',\n  focus:      'sp6focus'\n};\nconst SETTINGS_KEY='sp6_settings'; // defined early so flush functions can reference it\n\n// Sanitise a task/goal object — fills missing fields with safe defaults\nfunction _sanitizeTask(t){\n  if(!t||typeof t!=='object') return null;\n  const id=parseInt(t.id);\n  if(!id||isNaN(id)) return null;\n  return {\n    id,\n    text:   String(t.text||'').slice(0,2000),\n    date:   typeof t.date==='string'&&/^\\d{4}-\\d{2}-\\d{2}$/.test(t.date) ? t.date : '',\n    time:   typeof t.time==='string' ? t.time.slice(0,5) : '',\n    end:    typeof t.end==='string'  ? t.end.slice(0,5)  : '',\n    color:  Number.isInteger(t.color)&&t.color>=0&&t.color<=5 ? t.color : 0,\n    done:   !!t.done,\n    notes:  typeof t.notes==='string' ? t.notes.slice(0,50000) : '',\n    type:   t.type==='divider' ? 'divider' : undefined,\n    recur:  t.recur||undefined,\n    recurId:t.recurId||undefined,\n    subtasks: Array.isArray(t.subtasks) ? t.subtasks.map(s=>({\n      text: String(s.text||'').slice(0,500),\n      done: !!s.done\n    })) : undefined,\n    _subExpanded: undefined  // never persist UI state\n  };\n}\n\nfunction _sanitizeGoal(g){\n  if(!g||typeof g!=='object') return null;\n  const id=parseInt(g.id);\n  if(!id||isNaN(id)) return null;\n  return {\n    id,\n    text:    String(g.text||'').slice(0,2000),\n    color:   Number.isInteger(g.color)&&g.color>=0&&g.color<=5 ? g.color : 0,\n    done:    !!g.done,\n    notes:   typeof g.notes==='string' ? g.notes.slice(0,50000) : '',\n    weekKey: g.weekKey||'',\n    key:     g.key||undefined,\n    subtasks:Array.isArray(g.subtasks) ? g.subtasks.map(s=>({\n      text:String(s.text||'').slice(0,500),done:!!s.done\n    })) : undefined\n  };\n}\n\n// ══════════════════════════════════════════════════════\n// INDEXED DB — for large Vision data (images/videos in base64)\n// Falls back to localStorage if IDB unavailable\n// ══════════════════════════════════════════════════════\nconst IDB_NAME='victoros_v1';\nconst IDB_STORE='blobs';\nlet _idb=null;\n\nfunction _idbOpen(){\n  return new Promise((res,rej)=>{\n    if(_idb){res(_idb);return;}\n    const req=indexedDB.open(IDB_NAME,1);\n    req.onupgradeneeded=e=>{\n      const db=e.target.result;\n      if(!db.objectStoreNames.contains(IDB_STORE))\n        db.createObjectStore(IDB_STORE);\n    };\n    req.onsuccess=e=>{_idb=e.target.result;res(_idb);};\n    req.onerror=e=>rej(e.target.error);\n  });\n}\n\nasync function idbWrite(key,data){\n  try{\n    const db=await _idbOpen();\n    return new Promise((res,rej)=>{\n      const tx=db.transaction(IDB_STORE,'readwrite');\n      tx.objectStore(IDB_STORE).put(JSON.stringify(data),key);\n      tx.oncomplete=()=>res(true);\n      tx.onerror=e=>rej(e.target.error);\n    });\n  }catch(e){\n    // Fallback: try localStorage (may fail for large data)\n    return _safeWrite(key,data);\n  }\n}\n\nasync function idbRead(key,fallback=null){\n  try{\n    const db=await _idbOpen();\n    return new Promise((res)=>{\n      const tx=db.transaction(IDB_STORE,'readonly');\n      const req=tx.objectStore(IDB_STORE).get(key);\n      req.onsuccess=()=>{\n        if(req.result!==undefined){try{res(JSON.parse(req.result));}catch{res(fallback);}}\n        else res(fallback);\n      };\n      req.onerror=()=>res(fallback);\n    });\n  }catch(e){\n    // Fallback to localStorage\n    return _safeRead(key,fallback);\n  }\n}\n\nasync function idbDelete(key){\n  try{\n    const db=await _idbOpen();\n    return new Promise(res=>{\n      const tx=db.transaction(IDB_STORE,'readwrite');\n      tx.objectStore(IDB_STORE).delete(key);\n      tx.oncomplete=()=>res(true);\n      tx.onerror=()=>res(false);\n    });\n  }catch{return false;}\n}\n\n// ── VISION SAVE/LOAD via IndexedDB ────────────────────\nconst VS_IDB_KEY='sp6vision';\nlet _vsSavePending=false;\nlet _vsSaveTimer=null;\n\nfunction saveVision(){\n  // Immediate flag so beforeunload/visibilitychange can flush\n  _vsSavePending=true;\n  clearTimeout(_vsSaveTimer);\n  _vsSaveTimer=setTimeout(()=>{\n    idbWrite(VS_IDB_KEY,vsData).then(()=>{\n      _vsSavePending=false;\n      // Flash save indicator\n      const ind=document.getElementById('saveIndicator');\n      if(ind){ind.style.opacity='1';clearTimeout(ind._t);ind._t=setTimeout(()=>ind.style.opacity='0',900);}\n    }).catch(e=>{\n      console.error('[VictorOS] saveVision error',e);\n      _showQuotaWarning();\n    });\n  },400);\n}\n\nasync function _flushVisionNow(){\n  if(!vsData) return; // not loaded yet, nothing to save\n  if(!_vsSavePending&&!_vsSaveTimer) return;\n  clearTimeout(_vsSaveTimer);_vsSaveTimer=null;\n  try{await idbWrite(VS_IDB_KEY,vsData);_vsSavePending=false;}catch(e){console.error('[VictorOS] flush vision',e);}\n}\n\nasync function loadVision(){\n  // Try IDB first, then localStorage fallback\n  let d=await idbRead(VS_IDB_KEY,null);\n  if(!d) d=_safeRead('sp6vision',null); // migrate from old key\n  return d;\n}\n\nfunction _showQuotaWarning(){\n  showToast('⚠ Espacio de almacenamiento lleno. Exporta una copia y libera espacio.');\n}\n\nfunction _safeRead(key, fallback=[]){\n  try{\n    const raw=localStorage.getItem(key);\n    if(raw===null||raw===undefined) return fallback;\n    const parsed=JSON.parse(raw);\n    if(parsed===null||parsed===undefined) return fallback;\n    return parsed;\n  }catch(err){\n    console.warn('[VictorOS] read error',key,err);\n    try{\n      const bak=localStorage.getItem(key+'_bak');\n      if(bak){\n        const p=JSON.parse(bak);\n        console.info('[VictorOS] restored from backup:',key);\n        return p;\n      }\n    }catch{}\n    return fallback;\n  }\n}\n\nfunction _safeWrite(key, data){\n  if(data===undefined||data===null) return false;\n  try{\n    const serialized=JSON.stringify(data);\n    // Keep backup of previous value before overwriting\n    const prev=localStorage.getItem(key);\n    if(prev && prev!==serialized) localStorage.setItem(key+'_bak', prev);\n    localStorage.setItem(key, serialized);\n    localStorage.setItem(STORE_KEYS.meta, JSON.stringify({v:STORE_VERSION,saved:Date.now()}));\n    const ind=document.getElementById('saveIndicator');\n    if(ind){ind.style.opacity='1';clearTimeout(ind._t);ind._t=setTimeout(()=>ind.style.opacity='0',600);}\n    return true;\n  }catch(err){\n    if(err.name==='QuotaExceededError'){\n      console.error('[VictorOS] quota exceeded — purging backups');\n      try{\n        Object.values(STORE_KEYS).forEach(k=>{\n          try{localStorage.removeItem(k+'_bak');}catch{}\n        });\n        localStorage.setItem(key, JSON.stringify(data));\n        return true;\n      }catch{\n        _showQuotaWarning();\n      }\n    }\n    console.error('[VictorOS] write error',key,err);\n    return false;\n  }\n}\n\n// Debounced save — coalesces rapid saves into one write per 300ms\nconst _saveTimers={};\nfunction _debouncedSave(key, getFn, delay=300){\n  clearTimeout(_saveTimers[key]);\n  _saveTimers[key]=setTimeout(()=>_safeWrite(key, getFn()), delay);\n}\n\n// ── FLUSH ALL — writes every data store synchronously ──────────\nfunction _flushAllSync(){\n  // Cancel any pending debounce timers\n  Object.values(_saveTimers).forEach(t=>clearTimeout(t));\n  // Write all critical data stores\n  _safeWrite(STORE_KEYS.tasks,        tasks);\n  _safeWrite(STORE_KEYS.goals,        weekGoals);\n  _safeWrite(STORE_KEYS.monthGoals,   monthGoals);\n  _safeWrite(STORE_KEYS.yearGoals,    yearGoals);\n  if(typeof habits!=='undefined')       _safeWrite(STORE_KEYS.habits,   habits);\n  if(typeof sleepData!=='undefined')    _safeWrite(STORE_KEYS.sleep,    sleepData);\n  if(typeof focusSessions!=='undefined')_safeWrite(STORE_KEYS.focus,    focusSessions);\n  if(typeof objetivos!=='undefined')    _safeWrite(STORE_KEYS.objetivos,objetivos);\n  if(typeof appSettings!=='undefined')  _safeWrite(SETTINGS_KEY,        appSettings);\n  if(typeof apData!=='undefined')       _safeWrite(STORE_KEYS.ap,       apData);\n}\n\nasync function _flushAll(){\n  _flushAllSync();\n  if(typeof _htnData!=='undefined') idbWrite('sp6_htn',_htnData).catch(()=>{});\n  await _flushVisionNow();\n}\n\n// ── PAGE-CLOSE HANDLERS — three complementary events for full coverage ──\nwindow.addEventListener('beforeunload',()=>{\n  _flushAllSync();\n  // Also attempt sync IDB write for Vision data\n  if(vsData) try{\n    const req=indexedDB.open(IDB_NAME,1);\n    req.onsuccess=e=>{\n      const db=e.target.result;\n      const tx=db.transaction(IDB_STORE,'readwrite');\n      tx.objectStore(IDB_STORE).put(JSON.stringify(vsData),VS_IDB_KEY);\n    };\n  }catch{}\n});\n\ndocument.addEventListener('visibilitychange',()=>{\n  if(document.visibilityState==='hidden') _flushAll();\n});\n\nwindow.addEventListener('pagehide',()=>{\n  _flushAllSync();\n  _flushAll().catch(()=>{});\n});\n\n// ── PERIODIC SAFETY SAVE every 5s ────────────────────\nsetInterval(()=>_flushAllSync(), 5000);\n\nfunction load(){\n  const raw=_safeRead(STORE_KEYS.tasks,[]);\n  return (Array.isArray(raw)?raw:[]).map(_sanitizeTask).filter(Boolean);\n}\nfunction save(){_safeWrite(STORE_KEYS.tasks,tasks);}\nfunction _saveNow(){_safeWrite(STORE_KEYS.tasks,tasks);}\n\nfunction loadGoals(){\n  const raw=_safeRead(STORE_KEYS.goals,[]);\n  return (Array.isArray(raw)?raw:[]).map(_sanitizeGoal).filter(Boolean);\n}\nfunction saveGoals(){_safeWrite(STORE_KEYS.goals,weekGoals);}\n\nfunction loadMonthGoals(){\n  const raw=_safeRead(STORE_KEYS.monthGoals,[]);\n  return (Array.isArray(raw)?raw:[]).map(_sanitizeGoal).filter(Boolean);\n}\nfunction saveMonthGoals(){_safeWrite(STORE_KEYS.monthGoals,monthGoals);}\n\nfunction loadYearGoals(){\n  const raw=_safeRead(STORE_KEYS.yearGoals,[]);\n  return (Array.isArray(raw)?raw:[]).map(_sanitizeGoal).filter(Boolean);\n}\nfunction saveYearGoals(){_safeWrite(STORE_KEYS.yearGoals,yearGoals);}\n\n// Save everything immediately before the window closes\nlet tasks=load(), weekGoals=loadGoals();\nlet monthGoals=loadMonthGoals(), yearGoals=loadYearGoals();\n// Migrate colors to 6-color scheme: old 3(red-alias)→2, 4(yellow)→3, 5(purple)→4, 6(gray)→5, 7(green-alias)→1, 8→4\nfunction _migrateColor(c){if(c===3)return 2;if(c===4)return 3;if(c===5)return 4;if(c===6)return 5;if(c===7)return 1;if(c>=8)return 4;return Math.min(c,5);}\ntasks.forEach(t=>{if(t.color>5)t.color=_migrateColor(t.color);});\nweekGoals.forEach(g=>{if(g.color>5)g.color=_migrateColor(g.color);});\nmonthGoals.forEach(g=>{if(g.color>5)g.color=_migrateColor(g.color);});\nyearGoals.forEach(g=>{if(g.color>5)g.color=_migrateColor(g.color);});\nsave();saveGoals();saveMonthGoals();saveYearGoals();\n// ── FIRST-RUN SEED: only runs once, never overwrites real data ──\n// Uses a persistent flag so deleting all tasks doesn't re-seed demo data\nconst _isFirstRun = !localStorage.getItem('sp6_ever_opened');\nif(_isFirstRun){\n  localStorage.setItem('sp6_ever_opened','1');\n  if(!tasks.length){\n    const ds=n=>{const d=new Date(today);d.setDate(d.getDate()+n);return dk(d);};\n    tasks=[\n      {id:1,text:'Revisar informe Q1',date:ds(0),time:'09:00',end:'10:00',color:0,done:false,notes:''},\n      {id:2,text:'Call equipo',date:ds(0),time:'11:00',end:'12:00',color:1,done:false,notes:''},\n      {id:3,text:'Enviar propuesta',date:ds(1),time:'14:00',end:'',color:2,done:false,notes:''},\n      {id:4,text:'Diseño mockups',date:ds(2),time:'10:00',end:'12:00',color:5,done:false,notes:''},\n      {id:5,text:'Gym',date:ds(3),time:'07:00',end:'08:00',color:1,done:true,notes:''},\n      {id:6,text:'Reunión cliente',date:ds(4),time:'15:00',end:'16:30',color:3,done:false,notes:''},\n      {id:7,text:'Compras',date:ds(5),time:'18:00',end:'',color:4,done:false,notes:''},\n      {id:8,text:'Lectura',date:ds(6),time:'21:00',end:'22:00',color:5,done:false,notes:''},\n    ];save();\n  }\n  if(!weekGoals.length){\n    const wk=getWkKey(today);\n    weekGoals=[\n      {id:901,text:'Cerrar propuesta cliente A',color:0,done:false,weekKey:wk,notes:''},\n      {id:902,text:'Publicar 3 contenidos',color:3,done:false,weekKey:wk,notes:''},\n    ];saveGoals();\n  }\n}\nlet nid=Math.max(...tasks.map(t=>t.id),...weekGoals.map(g=>g.id),...monthGoals.map(g=>g.id),...yearGoals.map(g=>g.id),900)+1;\n\n// ── DATE UTILS ─────────────────────────────────────────\n// All date logic is based on ISO dateKey strings \"YYYY-MM-DD\"\nfunction dk(d){\n  // Accepts Date or string\n  if(typeof d==='string') return d;\n  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');\n  return `${y}-${m}-${dd}`;\n}\nfunction dkToDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}\nfunction addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}\nfunction isToday(d){return dk(d)===dk(today);}\nconst t2m=s=>{if(!s)return null;const[h,m]=(s||'').split(':').map(Number);return h*60+(m||0);};\nconst m2t=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;\n\n// getWkDates always returns Mon–Sun for the week offset from today's week\nfunction getWkDates(off=0){\n  const d=new Date(today);\n  const dow=d.getDay(); // 0=Sun\n  // Monday of current week\n  d.setDate(d.getDate()-(dow===0?6:dow-1)+off*7);\n  d.setHours(0,0,0,0);\n  return Array.from({length:7},(_,i)=>addD(d,i));\n}\n// getWcalDates: returns 7 consecutive days starting from today + wcalDayOffset\nfunction getWcalDates(off=0){\n  const d=new Date(today);\n  d.setDate(d.getDate()+off);\n  d.setHours(0,0,0,0);\n  return Array.from({length:7},(_,i)=>addD(d,i));\n}\nfunction getWkKey(d){\n  const s=new Date(d.getFullYear(),0,1);\n  const wn=Math.ceil(((d-s)/86400000+s.getDay()+1)/7);\n  return `${d.getFullYear()}-W${wn}`;\n}\nfunction wkNum(d){const s=new Date(d.getFullYear(),0,1);return Math.ceil(((d-s)/86400000+s.getDay()+1)/7);}\nconst getCurMo=()=>new Date(today.getFullYear(),today.getMonth()+viewOffset,1);\n// getCurDay: for day view, navigate day by day using viewOffset\nfunction getCurDay(){\n  const d=new Date(today);d.setDate(d.getDate()+viewOffset);return d;\n}\n\n// ── DARK MODE ─────────────────────────────────────────\nfunction toggleDark(){\n  isDark=!isDark;\n  document.documentElement.setAttribute('data-theme',isDark?'dark':'light');\n  document.getElementById('toggleTrack')?.classList.toggle('on',isDark);\n  document.getElementById('darkLabel').textContent=isDark?'Modo claro':'Modo oscuro';\n  localStorage.setItem(STORE_KEYS.dark,isDark?'1':'0');\n  updateColorPalette();render();\n}\nif(localStorage.getItem(STORE_KEYS.dark)==='1'){isDark=true;document.documentElement.setAttribute('data-theme','dark');}updateColorPalette();\n\n// ── SIDEBAR COLLAPSE ──────────────────────────────────\nlet sidebarOpen=true;\nfunction toggleSidebar(){\n  sidebarOpen=!sidebarOpen;\n  const sb=document.getElementById('sidebar');\n  if(sb) sb.classList.toggle('collapsed',!sidebarOpen);\n  localStorage.setItem(STORE_KEYS.sidebar,sidebarOpen?'1':'0');\n}\n// restore sidebar state\nif(localStorage.getItem(STORE_KEYS.sidebar)==='0'){sidebarOpen=false;}\n\n// ── NAV ───────────────────────────────────────────────\nfunction navPrev(){\n  // In week view: scroll one column left first; only flip week if at start\n  if(curView==='week'){\n    const sc=document.getElementById('wkScroll');\n    if(sc&&sc.scrollLeft>10){\n      const cols=sc.querySelectorAll('.wk-col');\n      const colW=cols[0]?.offsetWidth||260;\n      sc.scrollBy({left:-colW,behavior:'smooth'});\n      return;\n    }\n  }\n  if(curView==='wcal'){wcalDayOffset--;expDay=null;render();return;}\n  viewOffset--;expDay=null;render();\n}\nfunction navNext(){\n  // In week view: scroll one column right; only flip week if at end\n  if(curView==='week'){\n    const sc=document.getElementById('wkScroll');\n    if(sc){\n      const maxScroll=sc.scrollWidth-sc.clientWidth;\n      if(sc.scrollLeft<maxScroll-10){\n        const cols=sc.querySelectorAll('.wk-col');\n        const colW=cols[0]?.offsetWidth||260;\n        sc.scrollBy({left:colW,behavior:'smooth'});\n        return;\n      }\n    }\n  }\n  if(curView==='wcal'){wcalDayOffset++;expDay=null;render();return;}\n  viewOffset++;expDay=null;render();\n}\nfunction goToday(){viewOffset=0;wcalDayOffset=0;expDay=null;render();}\nfunction setViewTasks(){\n  const taskViews=['week','wcal','month','day'];\n  if(!taskViews.includes(curView)) setView('week');\n  else{\n    document.getElementById('nav-tasks')?.classList.add('active');\n    document.getElementById('nav-habits')?.classList.remove('active');\n  }\n}\nfunction setView(v){\n  curView=v;viewOffset=0;wcalDayOffset=0;expDay=null;\n  if(v==='habits') htWeekOffset=0;\n  ['week','wcal','month','day','habits'].forEach(t=>{\n    document.getElementById('tab-'+t)?.classList.toggle('active',t===v);\n  });\n  // Close doc page if navigating away\n  if(v!=='docs') _docsPageId=null;\n  if(v!=='vision') _vsFocusedSid=null;\n  const taskViews=['week','wcal','month','day'];\n  // Dynamic sidebar renders active states\n  renderSidebarFromSettings();\n  document.getElementById('nav-settings')?.classList.toggle('active',v==='settings');\n  const isTasksOrCalendar=taskViews.includes(v);\n  const showTopControls=isTasksOrCalendar&&v!=='home';\n  const tabsEl=document.getElementById('viewTabsBar');\n  if(tabsEl) tabsEl.style.display=isTasksOrCalendar?'flex':'none';\n  const navEl=document.querySelector('.tb-nav');\n  if(navEl) navEl.style.display=showTopControls?'flex':'none';\n  const addBtn=document.querySelector('.add-btn');\n  if(addBtn) addBtn.style.display=showTopControls?'':'none';\n  const _fab=document.getElementById('fabBg');\n  if(_fab) _fab.style.display=v==='month'?'flex':'none';\n  // Title\n  if(v==='home') document.getElementById('tbTitle').textContent='Inicio';\n  _pendingViewEnter=true;\n  render();\n}\n\n// ── MAIN RENDER ────────────────────────────────────────\nlet _lastView=null;\nlet _pendingViewEnter=false;\nfunction triggerViewEnter(){\n  const c=document.getElementById('mainContent');\n  if(!c) return;\n  c.classList.remove('view-enter');\n  void c.offsetWidth;\n  c.classList.add('view-enter');\n}\nfunction render(){\n  closeColorPopup();\n  const c=document.getElementById('mainContent');\n  // Capture scroll BEFORE destroying DOM\n  let savedScroll=null;\n  if(curView==='week'){\n    const sc=document.getElementById('wkScroll');\n    if(sc) savedScroll=sc.scrollLeft;  // save horizontal position\n  } else if(curView==='wcal'){\n    const sc=document.getElementById('wcalScroll');if(sc)savedScroll=sc.scrollTop;\n  } else if(curView==='day'){\n    const sc=document.getElementById('dvScroll');if(sc)savedScroll=sc.scrollTop;\n  }\n  c.style.cssText='';\n  if(_pendingViewEnter){_pendingViewEnter=false;triggerViewEnter();}\n\n  if(curView==='week'){\n    const dates=getWkDates(viewOffset);\n    const s=dates[0],e=dates[6];\n    document.getElementById('tbTitle').textContent=s.getDate()+' '+MO[s.getMonth()].slice(0,3)+' – '+e.getDate()+' '+MO[e.getMonth()]+' '+e.getFullYear();\n    c.style.cssText='padding:0;overflow:hidden;height:calc(100vh - 50px)';\n    c.innerHTML=renderWeek(dates);\n    bindWeekDrag();\n    const bgL=document.getElementById('moBgLayer');if(bgL)bgL.style.display='none';\n    if(savedScroll!==null){\n      const sc=document.getElementById('wkScroll');\n      if(sc) sc.scrollLeft=savedScroll;\n    } else {\n      scrollWeekToToday(dates);\n    }\n  } else if(curView==='wcal'){\n    const dates=getWcalDates(wcalDayOffset);\n    const s=dates[0],e=dates[6];\n    document.getElementById('tbTitle').textContent=s.getDate()+' '+MO[s.getMonth()].slice(0,3)+' – '+e.getDate()+' '+MO[e.getMonth()]+' '+e.getFullYear();\n    c.style.cssText='padding:0;overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 50px)';\n    const bgL=document.getElementById('moBgLayer');if(bgL)bgL.style.display='none';\n    c.innerHTML=renderWcal(dates);bindWcalEvents(dates);updateNowWcal(dates);\n    const sc=document.getElementById('wcalScroll');\n    if(sc){if(savedScroll!==null)sc.scrollTop=savedScroll;else scrollNowWcal();}\n  } else if(curView==='month'){\n    const m=getCurMo();\n    document.getElementById('tbTitle').textContent=MO[m.getMonth()]+' '+m.getFullYear();\n    c.style.cssText='padding:0;overflow-y:auto;overflow-x:hidden;height:calc(100vh - 52px);position:relative;z-index:1';\n    c.innerHTML='<div class=\"mo-outer\">'+renderMonthPanels(m)+renderMonth(m)+'<\u002Fdiv>';\n    bindMonthDrag();bindPanelInputs();\n    // Restore bg if set — re-apply position:relative since cssText overwrites it\n    if(moBg&&moBg!=='none'){\n      const l=document.getElementById('moBgLayer');if(l){l.style.display='';}\n      c.style.position='relative';c.style.zIndex='1';\n    }\n  } else if(curView==='home'){\n    document.getElementById('tbTitle').textContent='Inicio';\n    const bgL=document.getElementById('moBgLayer');if(bgL)bgL.style.display='none';\n    renderHomeView();\n    return;\n  } else if(curView==='habits'){\n    document.getElementById('tbTitle').textContent='Seguimiento de hábitos';\n    c.style.cssText='padding:0;overflow-y:auto;overflow-x:hidden;width:100%;height:calc(100vh - 52px)';\n    const bgL=document.getElementById('moBgLayer');if(bgL)bgL.style.display='none';\n    renderHabits();\n  } else if(curView==='objetivos'){\n    document.getElementById('tbTitle').textContent='Objetivos';\n    c.style.cssText='padding:0;overflow:hidden;height:calc(100vh - 52px)';\n    const bgL=document.getElementById('moBgLayer');if(bgL)bgL.style.display='none';\n    renderObjetivos();\n  } else if(curView==='planning'){\n    document.getElementById('tbTitle').textContent='Planning Anual';\n    c.style.cssText='padding:0;overflow:hidden;height:calc(100vh - 52px)';\n    const bgL=document.getElementById('moBgLayer');if(bgL)bgL.style.display='none';\n    renderPlanning();\n  } else if(curView==='vision'){\n    document.getElementById('tbTitle').textContent='Visualización';\n    c.style.cssText='padding:0;overflow-y:auto;overflow-x:hidden;width:100%;height:calc(100vh - 52px)';\n    const bgL=document.getElementById('moBgLayer');if(bgL)bgL.style.display='none';\n    renderVision();\n  } else if(curView==='settings'){\n    document.getElementById('tbTitle').textContent='Ajustes';\n    c.style.cssText='padding:0;overflow:hidden;height:calc(100vh - 52px)';\n    const bgL=document.getElementById('moBgLayer');if(bgL)bgL.style.display='none';\n    renderSettings();\n  } else if(curView==='docs'){\n    document.getElementById('tbTitle').textContent='Documentos';\n    c.style.cssText='padding:0;overflow:hidden;height:calc(100vh - 52px)';\n    const bgL=document.getElementById('moBgLayer');if(bgL)bgL.style.display='none';\n    renderDocsView();\n  } else {\n    const day=getCurDay();\n    document.getElementById('tbTitle').textContent=DL[day.getDay()]+', '+day.getDate()+' de '+MO[day.getMonth()]+' '+day.getFullYear();\n    c.style.cssText='padding:0;overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 50px)';\n    const bgL=document.getElementById('moBgLayer');if(bgL)bgL.style.display='none';\n    c.innerHTML=renderDay(day);bindDayEvents(day);updateNowDay();\n    const sc=document.getElementById('dvScroll');\n    if(sc){if(savedScroll!==null)sc.scrollTop=savedScroll;else scrollNowDay();}\n  }\n  renderMc();\n  document.getElementById('toggleTrack')?.classList.toggle('on',isDark);\n  document.getElementById('darkLabel').textContent=isDark?'Modo claro':'Modo oscuro';\n}\n\n// ── COLOR POPUP ───────────────────────────────────────\nfunction openColorPopup(id,anchorEl,e){\n  e.stopPropagation();\n  if(colorPopupId===id){closeColorPopup();return;}\n  colorPopupId=id;\n  const popup=document.getElementById('colorPopup');\n  const item=tasks.find(t=>t.id===id)||weekGoals.find(g=>g.id===id);\n  const selC=item?item.color:0;\n  popup.innerHTML='<div style=\"font-size:9px;color:var(--tx3);width:100%;margin-bottom:3px;letter-spacing:.5px;text-transform:uppercase\">Color<\u002Fdiv>';\n  C.forEach((_,i)=>{\n    const d=document.createElement('div');\n    d.className='tcp-dot'+(i===selC?' sel':'');\n    if(i===5){\n      d.style.background='transparent';\n      d.style.border='2px solid var(--tx2)';\n    } else {\n      d.style.backgroundImage=C[i].grad||'';\n      d.style.background=C[i].grad?'':C[i].bg;\n    }\n    d.onclick=ev=>{ev.stopPropagation();setTaskColor(colorPopupId,i);closeColorPopup();};\n    popup.appendChild(d);\n  });\n  popup.classList.add('open');\n  const rect=anchorEl.getBoundingClientRect();\n  popup.style.top=(rect.bottom+4)+'px';\n  popup.style.left=Math.min(rect.right-128,window.innerWidth-140)+'px';\n}\nfunction closeColorPopup(){colorPopupId=null;document.getElementById('colorPopup').classList.remove('open');}\nfunction setTaskColor(id,ci){\n  let t=tasks.find(t=>t.id===id);if(t){t.color=ci;save();}\n  let g=weekGoals.find(g=>g.id===id);if(g){g.color=ci;saveGoals();}\n  render();\n}\ndocument.addEventListener('click',e=>{\n  if(!e.target.closest('#colorPopup')&&!e.target.classList.contains('wt-dot-btn'))closeColorPopup();\n});\n\nfunction actionsHtml(id){\n  return `<div class=\"wt-actions\">\n    <button class=\"wt-act-btn wt-del-btn\" onclick=\"event.stopPropagation();delTask(${id})\">&#215;<\u002Fbutton>\n    <button class=\"wt-act-btn wt-dot-btn\" onclick=\"openColorPopup(${id},this,event)\" title=\"Color\">&#8943;<\u002Fbutton>\n  <\u002Fdiv>`;\n}\nfunction goalActionsHtml(id){\n  return `<div class=\"wt-actions\">\n    <button class=\"wt-act-btn wt-del-btn\" onclick=\"event.stopPropagation();delGoal(${id})\">&#215;<\u002Fbutton>\n    <button class=\"wt-act-btn wt-dot-btn\" onclick=\"openColorPopup(${id},this,event)\" title=\"Color\">&#8943;<\u002Fbutton>\n  <\u002Fdiv>`;\n}\n\n// ── HOME VIEW ─────────────────────────────────────────\nlet homeBg=localStorage.getItem(STORE_KEYS.homebg)||'';\nconst HOME_BG_PRESETS=[\n  {v:'none',label:'Ninguno'},\n  {v:'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1400&q=80'},\n  {v:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1400&q=80'},\n  {v:'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1400&q=80'},\n  {v:'https://images.unsplash.com/photo-1476673160081-cf065607f449?w=1400&q=80'},\n  {v:'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1400&q=80'},\n  {v:'https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?w=1400&q=80'},\n  {v:'https://images.unsplash.com/photo-1418065460487-3e41a6c84dc5?w=1400&q=80'},\n];\n\nfunction renderHomeView(){\n  const c=document.getElementById('mainContent');\n  const todayKey=dk(today);\n  // Tasks % today\n  const todayTasks=tasks.filter(t=>t.date===todayKey&&t.type!=='divider'&&!t.recur);\n  const taskTotal=todayTasks.length;\n  const taskDone=todayTasks.filter(t=>t.done).length;\n  const taskPct=taskTotal>0?Math.round(taskDone/taskTotal*100):0;\n  // Habits % today\n  const habitTotal=habits.length;\n  const habitDone=habits.filter(h=>h.checks[todayKey]).length;\n  const habitPct=habitTotal>0?Math.round(habitDone/habitTotal*100):0;\n\n  // Ring SVG builder — premium gradient stroke drawn from the unified palette\n  function ring(pct,colorFrom,colorTo,size=72,ringId=''){\n    const r=28,stroke=5,circ=2*Math.PI*r;\n    const offset=circ*(1-pct/100);\n    const gid='homeRingGrad-'+ringId;\n    return `<svg width=\"${size}\" height=\"${size}\" viewBox=\"0 0 64 64\" class=\"home-ring-svg\">\n      <defs><linearGradient id=\"${gid}\" x1=\"1\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0%\" stop-color=\"${colorFrom}\"/>\n        <stop offset=\"100%\" stop-color=\"${colorTo}\"/>\n      <\u002FlinearGradient><\u002Fdefs>\n      <circle cx=\"32\" cy=\"32\" r=\"${r}\" fill=\"none\" stroke=\"rgba(255,255,255,.1)\" stroke-width=\"${stroke}\"/>\n      <circle id=\"${ringId}\" cx=\"32\" cy=\"32\" r=\"${r}\" fill=\"none\" stroke=\"url(#${gid})\" stroke-width=\"${stroke}\"\n        stroke-linecap=\"round\" stroke-dasharray=\"${circ.toFixed(1)}\" stroke-dashoffset=\"${offset.toFixed(1)}\"\n        transform=\"rotate(-90 32 32)\"\n        style=\"--ring-full:${circ.toFixed(1)};--ring-offset:${offset.toFixed(1)};animation:ringDraw .9s .3s cubic-bezier(.22,1,.36,1) both\"/>\n    <\u002Fsvg>`;\n  }\n\n  const h=today.getHours();\n  const greet=h<6?'Buenas noches':h<13?'Buenos días':h<20?'Buenas tardes':'Buenas noches';\n  const formulaLine=`${taskDone} de ${taskTotal} tareas · ${habitDone} de ${habitTotal} hábitos completados hoy`;\n  const bgStyle=homeBg&&homeBg!=='none'?`background-image:url('${homeBg}')`:isDark?'background:#0a0a0b':'background:linear-gradient(135deg,#e8e6f0 0%,#dde8f0 100%)';\n\n  // Build habits quick-check rows\n  let habitsHtml='';\n  if(habits.length===0){\n    habitsHtml=`<div class=\"home-habits-empty\">Sin hábitos — añade uno en la sección Hábitos<\u002Fdiv>`;\n  } else {\n    habitsHtml=habits.map(hb=>{\n      const done=!!hb.checks[todayKey];\n      // Streak for this habit\n      let str=0;\n      for(let i=0;i<365;i++){const d=new Date(today);d.setDate(d.getDate()-i);if(hb.checks[dk(d)])str++;else break;}\n      const chkStyle=done\n        ?`background-image:${rainbowGrad(hb.color)};background-color:${hb.color};border-color:${hb.color}`\n        :`border-color:${hb.color}`;\n      return `<div class=\"home-habit-row\" data-hid=\"${hb.id}\" onclick=\"homeToggleHabit(${hb.id})\">\n        <div class=\"home-habit-chk${done?' done':''}\" style=\"${chkStyle}\"><\u002Fdiv>\n        <span class=\"home-habit-name${done?' done':''}\">${esc(hb.name)}<\u002Fspan>\n        ${str>1?`<span class=\"home-habit-streak\">🔥 ${str}<\u002Fspan>`:''}\n      <\u002Fdiv>`;\n    }).join('');\n  }\n\n  c.style.cssText='padding:0;overflow:hidden;height:calc(100vh - 52px);position:relative';\n  if(_pendingViewEnter){_pendingViewEnter=false;triggerViewEnter();}\n  c.innerHTML=`<div class=\"home-wrap\">\n    <div class=\"home-bg\" id=\"homeBgEl\" style=\"${bgStyle}\"><\u002Fdiv>\n    <div class=\"home-scroll\">\n      <div class=\"home-card\">\n        <div class=\"home-greeting\">¡${greet}, Víctor! 👋🏻<\u002Fdiv>\n        <div class=\"home-subline\">${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}<\u002Fdiv>\n        <div class=\"home-rings\">\n          <div class=\"home-ring-block\">\n            ${ring(taskPct,'#8b7cf6','#b3a5fb',72,'homeRingTasks')}\n            <div class=\"home-ring-info\">\n              <div class=\"home-ring-pct\" id=\"homeRingTasksPct\">${taskPct}%<\u002Fdiv>\n              <div class=\"home-ring-lbl\">Tareas hoy<\u002Fdiv>\n              <div class=\"home-ring-desc\" id=\"homeRingTasksDesc\">${taskDone} / ${taskTotal} completadas<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"home-ring-block\">\n            ${ring(habitPct,'#43b389','#7fd6ac',72,'homeRingHabits')}\n            <div class=\"home-ring-info\">\n              <div class=\"home-ring-pct\" id=\"homeRingHabitsPct\">${habitPct}%<\u002Fdiv>\n              <div class=\"home-ring-lbl\">Hábitos hoy<\u002Fdiv>\n              <div class=\"home-ring-desc\" id=\"homeRingHabitsDesc\">${habitDone} / ${habitTotal} completados<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"home-divider\"><\u002Fdiv>\n        <div class=\"home-formula\">${formulaLine}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"home-habits-card\">\n        <div class=\"home-habits-ttl\">\n          <span>Hábitos de hoy<\u002Fspan>\n          <span class=\"home-habits-ttl-pct\">${habitDone}/${habitTotal}<\u002Fspan>\n        <\u002Fdiv>\n        ${habitsHtml}\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"home-bg-btn\" onclick=\"toggleHomeBgPicker()\" title=\"Cambiar fondo\">🌄<\u002Fbutton>\n    <div class=\"home-bg-picker\" id=\"homeBgPicker\">\n      <div class=\"home-bg-picker-ttl\">Fondo<\u002Fdiv>\n      <div class=\"home-bg-grid\" id=\"homeBgGrid\"><\u002Fdiv>\n      <label class=\"home-bg-upload\">📷 Subir imagen\n        <input type=\"file\" accept=\"image/*\" style=\"display:none\" onchange=\"homeBgUpload(event)\">\n      <\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n  renderHomeBgSwatches();\n  document.addEventListener('click', closeHomeBgPickerOutside, {once:true});\n}\n\n// Toggle habit from home screen — shared logic with htToggle\nfunction homeToggleHabit(id){\n  const hb=habits.find(h=>h.id===id);\n  if(!hb) return;\n  const todayKey=dk(today);\n  hb.checks[todayKey]=!hb.checks[todayKey];\n  if(hb.checks[todayKey]===false) delete hb.checks[todayKey]; // clean up falsy keys\n  saveHabits();\n  sfxCheck();\n  _patchHomeHabitRow(id, hb, todayKey);\n}\n\n// Patch a single habit row in the home card — no full re-render needed\nfunction _patchHomeHabitRow(id, hb, todayKey){\n  const done=!!hb.checks[todayKey];\n  // Update the row visuals\n  const row=document.querySelector(`.home-habit-row[data-hid=\"${id}\"]`);\n  if(row){\n    const chk=row.querySelector('.home-habit-chk');\n    const name=row.querySelector('.home-habit-name');\n    if(chk){\n      chk.className='home-habit-chk'+(done?' done':'');\n      chk.style.cssText=done\n        ?`background-image:${rainbowGrad(hb.color)};background-color:${hb.color};border-color:${hb.color}`\n        :`border-color:${hb.color}`;\n    }\n    if(name) name.className='home-habit-name'+(done?' done':'');\n  }\n  // Recompute totals\n  const habitDone=habits.filter(h=>!!h.checks[todayKey]).length;\n  const habitTotal=habits.length;\n  const habitPct=habitTotal>0?Math.round(habitDone/habitTotal*100):0;\n  // Update counter badge\n  const pctEl=document.querySelector('.home-habits-ttl-pct');\n  if(pctEl) pctEl.textContent=`${habitDone}/${habitTotal}`;\n  // Update ring text\n  const rp=document.getElementById('homeRingHabitsPct');\n  const rd=document.getElementById('homeRingHabitsDesc');\n  if(rp) rp.textContent=`${habitPct}%`;\n  if(rd) rd.textContent=`${habitDone} / ${habitTotal} completados`;\n  // Update ring SVG arc (stroke-dashoffset)\n  const ringCircle=document.getElementById('homeRingHabits');\n  if(ringCircle){\n    const r=28, circ=2*Math.PI*r;\n    const offset=circ*(1-habitPct/100);\n    ringCircle.setAttribute('stroke-dashoffset', offset.toFixed(1));\n    // Smooth CSS transition on the arc\n    ringCircle.style.transition='stroke-dashoffset .4s cubic-bezier(.22,1,.36,1)';\n    // Remove the one-shot animation so transition takes over\n    ringCircle.style.animation='none';\n  }\n  // Update formula line\n  const todayTasks=tasks.filter(t=>t.date===todayKey&&t.type!=='divider');\n  const taskDone=todayTasks.filter(t=>t.done).length;\n  const taskTotal=todayTasks.length;\n  const fml=document.querySelector('.home-formula');\n  if(fml) fml.textContent=`${taskDone} de ${taskTotal} tareas · ${habitDone} de ${habitTotal} hábitos completados hoy`;\n}\nfunction toggleHomeBgPicker(){\n  const p=document.getElementById('homeBgPicker');\n  if(!p) return;\n  const isOpen=p.classList.contains('open');\n  p.classList.toggle('open');\n  if(!isOpen) setTimeout(()=>document.addEventListener('click',closeHomeBgPickerOutside,{once:true}),0);\n}\nfunction closeHomeBgPickerOutside(e){\n  const p=document.getElementById('homeBgPicker');\n  const b=document.querySelector('.home-bg-btn');\n  if(p&&b&&!p.contains(e.target)&&!b.contains(e.target)) p.classList.remove('open');\n}\nfunction setHomeBg(val){\n  homeBg=val;localStorage.setItem(STORE_KEYS.homebg,val);\n  const el=document.getElementById('homeBgEl');\n  if(el) el.style.cssText=val&&val!=='none'?`background-image:url('${val}');background-size:cover;background-position:center`:'background:#0a0a0b';\n  renderHomeBgSwatches();\n}\nfunction renderHomeBgSwatches(){\n  const g=document.getElementById('homeBgGrid');if(!g) return;\n  g.innerHTML=HOME_BG_PRESETS.map(bg=>{\n    const sel=homeBg===bg.v||((!homeBg||homeBg==='none')&&bg.v==='none');\n    if(bg.v==='none') return `<div class=\"home-bg-swatch none${sel?' sel':''}\" onclick=\"setHomeBg('none');document.getElementById('homeBgPicker').classList.remove('open')\">⊘<\u002Fdiv>`;\n    return `<div class=\"home-bg-swatch${sel?' sel':''}\" style=\"background-image:url('${bg.v}')\" onclick=\"setHomeBg('${bg.v}');document.getElementById('homeBgPicker').classList.remove('open')\"><\u002Fdiv>`;\n  }).join('');\n}\nfunction homeBgUpload(e){\n  const f=e.target.files[0];if(!f) return;\n  const r=new FileReader();r.onload=ev=>{setHomeBg(ev.target.result);document.getElementById('homeBgPicker')?.classList.remove('open');};r.readAsDataURL(f);\n}\n\n// ── RECURRENCE ENGINE ────────────────────────────────\n// ── RECURRENCE ENGINE ────────────────────────────────\n// Each recurring series has a recurId. Each date gets its own independent\n// task instance with its own done/notes/subtasks. Instances are created\n// lazily (on first view) and persisted independently.\n\nfunction recurMatchesDate(baseDate, recur, dkey){\n  const b=dkToDate(baseDate), t=dkToDate(dkey);\n  if(t<b) return false;\n  // Don't match origin date (it's already in tasks as itself)\n  if(dkey===baseDate) return false;\n  const dow=t.getDay();\n  if(recur==='daily') return true;\n  if(recur==='weekdays') return dow>=1&&dow<=5;\n  if(recur==='weekends') return dow===0||dow===6;\n  if(recur==='weekly') return Math.round((t-b)/86400000)%7===0;\n  if(recur==='monthly') return t.getDate()===b.getDate();\n  return false;\n}\n\n// Get (or lazily create) an independent instance for a recurring task on a specific date\nfunction getOrCreateRecurInstance(template, dkey){\n  let inst=tasks.find(t=>t.recurId===template.recurId&&t.date===dkey);\n  if(inst) return inst;\n  // Create independent instance — own done/notes/subtasks, independent from template\n  inst={\n    id:nid++,\n    date:dkey,\n    text:template.text,           // copied at creation; subsequent changes are independent\n    color:template.color,\n    recur:template.recur,\n    recurId:template.recurId,\n    done:false,                   // always starts undone\n    notes:'',                     // independent notes\n    subtasks:[],                  // independent subtasks\n    time:template.time,\n    end:template.end\n  };\n  tasks.push(inst);\n  save();\n  return inst;\n}\n\n// Get the origin (template) task for a recurId — earliest date in the series\nfunction getRecurTemplate(recurId){\n  const series=tasks.filter(t=>t.recurId===recurId&&t.recur&&t.recur!=='none');\n  if(!series.length) return null;\n  return series.reduce((a,b)=>dkToDate(a.date)<=dkToDate(b.date)?a:b);\n}\n\nfunction getTasksForDate(dkey){\n  // Start with tasks explicitly assigned to this date\n  const own=tasks.filter(t=>t.date===dkey);\n  // Find all recurIds already covered by own tasks (avoid duplicates)\n  const ownRecurIds=new Set(own.filter(t=>t.recurId).map(t=>t.recurId));\n  // Find all series templates whose recurrence covers this date\n  const seen=new Set();\n  tasks.forEach(t=>{\n    if(!t.recur||t.recur==='none'||!t.recurId) return;\n    if(ownRecurIds.has(t.recurId)) return; // already have an instance for this date\n    if(seen.has(t.recurId)) return;\n    seen.add(t.recurId);\n    // Use the earliest instance as the template for metadata\n    const tmpl=getRecurTemplate(t.recurId);\n    if(tmpl&&recurMatchesDate(tmpl.date, tmpl.recur, dkey)){\n      getOrCreateRecurInstance(tmpl, dkey);\n      ownRecurIds.add(t.recurId); // mark as handled\n    }\n  });\n  // Return fresh list after possible creation\n  return tasks.filter(t=>t.date===dkey);\n}\n\nfunction recurBadge(recur){\n  const map={daily:'↺',weekdays:'↺L–V',weekends:'↺Fin',weekly:'↺Sem',monthly:'↺Mes'};\n  return map[recur]||'';\n}\n\n// ── DIVIDER HELPERS ──────────────────────────────────\nfunction addDivider(date){\n  tasks.push({id:nid++,type:'divider',date,done:false,color:5,text:'',notes:''});\n  save();render();\n}\nfunction delDivider(id){tasks=tasks.filter(t=>t.id!==id);_saveNow();render();}\n\n// ── INLINE ADD (week view) ────────────────────────────\n// Called from the \"+ Añadir...\" button at the bottom of each day column\nfunction inlineAddWeek(date, addBtnEl){\n  // If already adding in this column, commit/cancel first\n  const existing=document.getElementById('wt-inline-'+date);\n  if(existing){existing.querySelector('.wt-inline-add-inp')?.focus();return;}\n\n  const body=document.getElementById('wkb-'+date);\n  if(!body) return;\n\n  // Create inline input card\n  const card=document.createElement('div');\n  card.className='wt-inline-add';\n  card.id='wt-inline-'+date;\n  card.innerHTML=`<div class=\"wt-inline-add-chk\"><\u002Fdiv><input class=\"wt-inline-add-inp\" placeholder=\"Nueva tarea...\" autocomplete=\"off\" spellcheck=\"false\">`;\n\n  // Insert before the drop-zone and add button\n  const dropZone=body.querySelector('.wt-drop');\n  if(dropZone) body.insertBefore(card,dropZone);\n  else body.insertBefore(card,addBtnEl);\n\n  const inp=card.querySelector('.wt-inline-add-inp');\n  inp.focus();\n\n  function commit(){\n    const text=inp.value.trim();\n    if(text){\n      tasks.push({id:nid++,text,date,time:'',end:'',color:5,done:false,notes:''});\n      save();sfxAdd();showToast('Añadido ✓');\n    }\n    card.remove();\n    if(text) render(); // re-render only if we actually added something\n  }\n\n  inp.addEventListener('keydown',e=>{\n    if(e.key==='Enter'){e.preventDefault();commit();}\n    else if(e.key==='Escape'){card.remove();}\n  });\n  inp.addEventListener('blur',()=>setTimeout(()=>{if(document.contains(card))commit();},120));\n}\n\n// ── CONTEXT MENU (Add task / Add divider) ─────────────\n// Used for month cell clicks and right-click on week\nlet _ctxDate=null;\nfunction openAddCtx(date,anchorEl,e){\n  e.stopPropagation();\n  // In week view the \"+ Añadir...\" button calls inlineAddWeek directly\n  // This function is now only used for month cell clicks\n  _ctxDate=date;\n  closeAddCtx();\n  const menu=document.createElement('div');\n  menu.id='addCtxMenu';\n  menu.className='add-ctx-menu';\n  menu.innerHTML=`\n    <div class=\"add-ctx-item\" onclick=\"closeAddCtx();inlineAddMonth('${date}')\">\n      <span class=\"add-ctx-icon\">+<\u002Fspan>Nueva tarea\n    <\u002Fdiv>\n    <div class=\"add-ctx-item\" onclick=\"closeAddCtx();addDivider('${date}')\">\n      <span class=\"add-ctx-icon\" style=\"font-size:11px\">—<\u002Fspan>Añadir divisor\n    <\u002Fdiv>`;\n  document.body.appendChild(menu);\n  const rect=anchorEl.getBoundingClientRect();\n  menu.style.top=(rect.bottom+4)+'px';\n  menu.style.left=rect.left+'px';\n  setTimeout(()=>document.addEventListener('click',closeAddCtxOutside,{once:true}),0);\n}\nfunction closeAddCtx(){const m=document.getElementById('addCtxMenu');if(m)m.remove();}\nfunction closeAddCtxOutside(e){if(!document.getElementById('addCtxMenu')?.contains(e.target))closeAddCtx();}\n\n// ── INLINE ADD (month view) ───────────────────────────\nfunction inlineAddMonth(date,e){\n  // Don't trigger when clicking on existing tasks, checkboxes, or action buttons\n  if(e&&(e.target.closest('.mo-pill')||e.target.closest('.mo-pill-divider')||e.target.closest('.mo-more')||e.target.closest('.mo-cell-hd')||e.target.closest('.mo-inline-add'))) return;\n  const cell=document.getElementById('mc-'+date);\n  if(!cell) return;\n\n  // Remove any existing inline input in this cell\n  cell.querySelectorAll('.mo-inline-add').forEach(el=>el.remove());\n\n  const row=document.createElement('div');\n  row.className='mo-inline-add';\n  row.style.cssText='display:flex;align-items:center;gap:4px;padding:2px 4px;margin-bottom:2px;border-radius:4px;background:var(--s2);border:.5px solid var(--b2)';\n  row.innerHTML=`<div style=\"width:1.35em;height:1.35em;border-radius:2px;border:.8px solid var(--tx3);flex-shrink:0;opacity:.4\"><\u002Fdiv><input style=\"flex:1;border:none;outline:none;background:transparent;font-family:var(--font);font-size:12px;color:var(--tx);font-weight:500;min-width:0\" placeholder=\"Nueva tarea...\" autocomplete=\"off\" spellcheck=\"false\">`;\n  cell.appendChild(row);\n\n  const inp=row.querySelector('input');\n  inp.focus();\n\n  function commit(){\n    const text=inp.value.trim();\n    if(text){\n      tasks.push({id:nid++,text,date,time:'',end:'',color:5,done:false,notes:''});\n      save();sfxAdd();showToast('Añadido ✓');\n    }\n    row.remove();\n    if(text) render();\n  }\n\n  inp.addEventListener('keydown',e=>{\n    if(e.key==='Enter'){e.preventDefault();commit();}\n    else if(e.key==='Escape'){row.remove();}\n  });\n  inp.addEventListener('blur',()=>setTimeout(()=>{if(document.contains(row))commit();},120));\n  inp.addEventListener('click',e=>e.stopPropagation());\n}\n\n// ── MONTH CELL DRAG-TO-REORDER ────────────────────────\nlet _moDragLineEl=null;\nfunction _clearMoDragLine(){if(_moDragLineEl){_moDragLineEl.remove();_moDragLineEl=null;}}\nfunction _placeMoDragLine(targetEl,isTop){\n  _clearMoDragLine();\n  _moDragLineEl=document.createElement('div');\n  _moDragLineEl.className='wt-drop-line vis';\n  _moDragLineEl.style.cssText='height:2px;border-radius:2px;background:var(--tx);margin:1px 3px;pointer-events:none;';\n  if(isTop) targetEl.before(_moDragLineEl);\n  else targetEl.after(_moDragLineEl);\n}\nfunction onMoPillOver(e,targetId){\n  e.preventDefault();e.stopPropagation();\n  if(dragId===null||dragId===targetId) return;\n  const el=document.querySelector(`.mo-cell [data-id=\"${targetId}\"]`);\n  if(!el) return;\n  const rect=el.getBoundingClientRect();\n  _placeMoDragLine(el, e.clientY < rect.top + rect.height*0.45);\n}\nfunction onMoPillLeave(e,targetId){\n  if(e.relatedTarget&&e.relatedTarget.style?.pointerEvents==='none') return;\n  const el=document.querySelector(`.mo-cell [data-id=\"${targetId}\"]`);\n  if(el&&!el.contains(e.relatedTarget)) _clearMoDragLine();\n}\nfunction onMoPillDrop(e,targetId){\n  e.preventDefault();e.stopPropagation();\n  _clearMoDragLine();\n  if(dragId===null||dragId===targetId) return;\n  const srcTask=tasks.find(t=>t.id===dragId);\n  if(!srcTask) return;\n  const targetEl=document.querySelector(`.mo-cell [data-id=\"${targetId}\"]`);\n  if(!targetEl) return;\n  const cellEl=targetEl.closest('.mo-cell');\n  const targetDate=cellEl?.dataset.date;\n  // Don't move recurring instances to a new date — each date is its own instance\n  if(targetDate&&!srcTask.recurId) srcTask.date=targetDate;\n  // Reorder within date\n  const pills=[...cellEl.querySelectorAll('.mo-pill[data-id],.mo-pill-divider[data-id]')];\n  const pillIds=pills.map(p=>parseInt(p.dataset.id)).filter(id=>id!==dragId);\n  const tgtIdx=pillIds.indexOf(targetId);\n  const rect=targetEl.getBoundingClientRect();\n  const insertBefore=e.clientY < rect.top+rect.height*0.45;\n  const insertIdx=insertBefore?tgtIdx:tgtIdx+1;\n  pillIds.splice(insertIdx,0,dragId);\n  // Rebuild order in tasks array for this date\n  const dateTasks=tasks.filter(t=>t.date===srcTask.date);\n  const otherTasks=tasks.filter(t=>t.date!==srcTask.date);\n  const ordered=pillIds.map(id=>dateTasks.find(t=>t.id===id)||tasks.find(t=>t.id===id)).filter(Boolean);\n  // Merge back — keep original items not in pillIds (safety)\n  const missing=dateTasks.filter(t=>!pillIds.includes(t.id));\n  tasks=[...otherTasks,...ordered,...missing];\n  save();sfxDrop();dragId=null;\n  document.querySelectorAll('.drag-g').forEach(el=>el.classList.remove('drag-g'));\n  render();\n}\n\n// ══════════════════════════════════════════════════════\n// WEEK VIEW\n// ══════════════════════════════════════════════════════\nfunction renderWeek(dates){\n  const wdks=dates.map(d=>dk(d));\n  const wkKey=getWkKey(dates[0]);\n  const goals=weekGoals.filter(g=>g.weekKey===wkKey);\n  const wn=wkNum(dates[0]);\n  const yr=dates[6].getFullYear();\n  const rng=dates[0].getDate()+' '+MO[dates[0].getMonth()].slice(0,3)+' – '+dates[6].getDate()+' '+MO[dates[6].getMonth()];\n\n  let h='<div class=\"wk-outer\"><div class=\"wk-scroll\" id=\"wkScroll\">';\n\n  dates.forEach(date=>{\n    const d=dk(date);const isTd=isToday(date);\n    const dt=getTasksForDate(d);\n    // Full date label e.g. \"1 Abr\"\n    const dateLabel=date.getDate()+' '+MO[date.getMonth()].slice(0,3);\n    const isFirstOfMonth=date.getDate()===1;\n    h+=`<div class=\"wk-col${isTd?' today-col':''}\" id=\"wkc-${d}\">\n      <div class=\"wk-head${isTd?' today':''}\">\n        ${isFirstOfMonth?`<span class=\"wdh-name\">${MO[date.getMonth()].slice(0,3)}<\u002Fspan>`:''}\n        <span class=\"wdh-name\">${DS[date.getDay()]}<\u002Fspan>\n        <div class=\"wdh-num\">${date.getDate()}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"wk-body\" id=\"wkb-${d}\" data-date=\"${d}\"\n        ondragover=\"onWkOver(event,'${d}')\" ondrop=\"onWkDrop(event,'${d}')\" ondragleave=\"onWkLeave(event,'${d}')\">`;\n    dt.forEach(t=>h+=wtCard(t));\n    h+=`<div class=\"wt-drop\" id=\"wdp-${d}\">Soltar aquí<\u002Fdiv>\n      <div class=\"wk-add\" onclick=\"inlineAddWeek('${d}',this)\"><span style=\"font-size:16px;line-height:1\">+<\u002Fspan> Añadir...<\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>`;\n  });\n\n  // Goals / summary column (always last, pinned-looking)\n  const done=goals.filter(g=>g.done).length;\n  h+=`<div class=\"wk-col\" id=\"wkc-goals\" style=\"min-width:240px\">\n    <div class=\"wk-head wk-sum-head\" style=\"justify-content:flex-start;gap:6px;padding:10px 12px 6px\">\n      <span style=\"font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.5px;text-transform:uppercase\">W${wn}<\u002Fspan>\n      <span style=\"font-size:11px;color:var(--tx3);opacity:.6\">${rng}<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"wk-body wk-sum-body\">\n      <div style=\"font-size:11px;color:var(--tx3);margin-bottom:8px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:0 4px\">\n        Objetivos <span style=\"font-weight:400;opacity:.7\">${done}/${goals.length}<\u002Fspan>\n      <\u002Fdiv>`;\n  goals.forEach(g=>{\n    const col=C[g.color]||C[0];\n    const subs=g.subtasks||[];\n    const subDone=subs.filter(s=>s.done).length;\n    const isGray=g.color===5;\n    const gBg=isGray?'transparent':col.bg;\n    const gTx=isGray?'var(--tx)':col.tx;\n    const gDot=isGray?'var(--tx2)':col.dot;\n    const subHtml=subs.length>0?`<div style=\"font-size:10px;opacity:.55;padding-left:24px;margin-top:2px;color:${gTx}\">${subDone}/${subs.length} subtareas<\u002Fdiv>`:'';\n    h+=`<div class=\"wk-goal-item\" data-gid=\"${g.id}\" draggable=\"true\" style=\"background:${gBg};border-radius:8px;margin:3px 0;cursor:grab\" onclick=\"openDetail(${g.id},event,true)\"\n      ondragstart=\"onGoalDragStart(event,${g.id})\"\n      ondragover=\"onGoalDragOver(event,${g.id})\"\n      ondragleave=\"onGoalDragLeave(event,${g.id})\"\n      ondrop=\"onGoalDrop(event,${g.id})\">\n      <div class=\"wg-chk${g.done?' done':''}\"\n        style=\"color:${gDot};border-color:${gDot};background:${g.done?gDot:'transparent'}${g.done?`;--tick-color:${tickColor(col)}`:''}\"\n        onclick=\"event.stopPropagation();toggleGoal(${g.id})\"><\u002Fdiv>\n      <div class=\"wg-dot\" style=\"background:${gDot}\"><\u002Fdiv>\n      <div style=\"flex:1;min-width:0\">\n        <span class=\"wg-name${g.done?' done':''}\" style=\"color:${gTx}\">${esc(g.text)}<\u002Fspan>\n        ${subHtml}\n      <\u002Fdiv>\n      ${goalActionsHtml(g.id)}<\u002Fdiv>`;\n  });\n  h+=`<div class=\"wg-add\" onclick=\"openGoalModal('${wkKey}')\"><span style=\"font-size:16px;line-height:1\">+<\u002Fspan> Objetivo...<\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>`;\n\n  h+='<\u002Fdiv><\u002Fdiv>';\n  return h;\n}\n\nfunction scrollWeekToToday(dates){\n  setTimeout(()=>{\n    const scroll=document.getElementById('wkScroll');\n    if(!scroll) return;\n    // Find today's column and scroll to it (or close to it)\n    const todayIdx=dates.findIndex(d=>isToday(d));\n    if(todayIdx<0){scroll.scrollLeft=0;return;}\n    const cols=scroll.querySelectorAll('.wk-col');\n    if(!cols[todayIdx]) return;\n    const colLeft=cols[todayIdx].offsetLeft;\n    // Show today as the first or second visible column\n    const offset=Math.max(0,colLeft-0);\n    scroll.scrollTo({left:offset,behavior:'instant'});\n  },30);\n}\nfunction wtCard(t){\n  if(t.type==='divider'){\n    return `<div class=\"wt-divider\" data-id=\"${t.id}\" draggable=\"true\"\n      ondragstart=\"onWkDragStart(event,${t.id})\"\n      ondragover=\"onWkCardOver(event,${t.id})\"\n      ondragleave=\"onWkCardLeave(event,${t.id})\"\n      ondrop=\"onWkCardDrop(event,${t.id})\">\n      <div class=\"wt-divider-line\"><\u002Fdiv>\n      <button class=\"wt-divider-del\" onclick=\"event.stopPropagation();delDivider(${t.id})\">&#215;<\u002Fbutton>\n    <\u002Fdiv>`;\n  }\n  const col=C[t.color]||C[0];\n  const subs=t.subtasks||[];\n  const hasSubs=subs.length>0;\n  const expanded=t._subExpanded;\n  const doneCount=subs.filter(s=>s.done).length;\n  let subHtml='';\n  if(hasSubs){\n    subHtml+=`<div class=\"wt-sub-ind\">\n      <span class=\"wt-sub-arrow${expanded?' open':''}\" onclick=\"event.stopPropagation();toggleSubExpand(${t.id})\" style=\"color:${col.tx}\">&#9654;<\u002Fspan>\n      <span style=\"color:${col.tx};opacity:.5\">${doneCount}/${subs.length}<\u002Fspan>\n    <\u002Fdiv>`;\n    if(expanded){\n      subHtml+='<div class=\"wt-sub-list\">';\n      subs.forEach((s,i)=>{\n        subHtml+=`<div class=\"wt-st-row\">\n          <div class=\"wt-st-chk${s.done?' done':''}\" style=\"border-color:${col.dot};color:${col.dot};${s.done?`background:${col.dot};--tick-color:${tickColor(col)}`:''}\"\n            onclick=\"event.stopPropagation();toggleSubtask(${t.id},${i})\"><\u002Fdiv>\n          <span class=\"wt-st-nm${s.done?' done':''}\" style=\"color:${col.tx}\">${esc(s.text)}<\u002Fspan>\n        <\u002Fdiv>`;\n      });\n      subHtml+='<\u002Fdiv>';\n    }\n  }\n  const isGray=t.color===5;\n  const borderColor=isGray?'var(--tx2)':col.dot;\n  const bgColor=isGray?'transparent':col.bg;\n  const txColor=isGray?'var(--tx)':col.tx;\n  const doneChkColor=isGray?'#aaaaaa':borderColor;\n  const doneTxColor=isGray?'#aaaaaa':txColor;\n  return `<div class=\"wt\" draggable=\"true\" data-id=\"${t.id}\"\n    style=\"background:${bgColor};color:${txColor};\"\n    ondragover=\"onWkCardOver(event,${t.id})\"\n    ondragleave=\"onWkCardLeave(event,${t.id})\"\n    ondrop=\"onWkCardDrop(event,${t.id})\"\n    ondragstart=\"onWkDragStart(event,${t.id})\"\n    onclick=\"openDetail(${t.id},event)\">\n    <div class=\"wt-row\">\n      <div class=\"wt-chk${t.done?' done':''}\"\n        style=\"color:${t.done?doneChkColor:borderColor};border-color:${t.done?doneChkColor:borderColor};${t.done?`background:${doneChkColor};--tick-color:#252526`:'background:transparent'}\"\n        onclick=\"event.stopPropagation();toggleTask(${t.id})\"><\u002Fdiv>\n      <div style=\"flex:1;min-width:0\">\n        <div class=\"wt-txt${t.done?' done':''}\" style=\"color:${t.done?doneTxColor:txColor}\">${esc(t.text)}<\u002Fdiv>\n        ${t.recur&&t.recur!=='none'?`<div class=\"recur-badge\" style=\"color:${txColor}\">↺ ${({daily:'Diario',weekdays:'L–V',weekends:'Fin de semana',weekly:'Semanal',monthly:'Mensual'})[t.recur]||''}<\u002Fdiv>`:''}\n      <\u002Fdiv>\n    <\u002Fdiv>\n    ${subHtml}\n    ${actionsHtml(t.id)}<\u002Fdiv>`;\n}\nfunction onWkDragStart(e,id){\n  dragId=id;if(AC.state==='suspended')AC.resume();\n  e.dataTransfer.effectAllowed='move';\n  e.dataTransfer.setData('text/plain',String(id));\n  setTimeout(()=>{\n    document.querySelector(`[data-id=\"${id}\"]`)?.classList.add('drag-ghost');\n    document.querySelectorAll('.wt-drop').forEach(z=>z.classList.add('vis'));\n  },0);\n}\n\n// Drop-line indicator: a thin line appears exactly where the card will be inserted\n// We insert a `.wt-drop-line` div before or after the target card.\nlet _dropLineEl=null;\nfunction _clearDropLine(){\n  if(_dropLineEl){_dropLineEl.remove();_dropLineEl=null;}\n}\nfunction _placeDropLine(targetEl,isTop){\n  _clearDropLine();\n  _dropLineEl=document.createElement('div');\n  _dropLineEl.className='wt-drop-line vis';\n  if(isTop) targetEl.before(_dropLineEl);\n  else targetEl.after(_dropLineEl);\n}\nfunction onWkCardOver(e,targetId){\n  e.preventDefault();e.stopPropagation();\n  if(dragId===null||dragId===targetId) return;\n  const el=document.querySelector(`.wk-body [data-id=\"${targetId}\"]`);\n  if(!el) return;\n  const rect=el.getBoundingClientRect();\n  // Use 40% threshold from top for \"insert before\" — feels more natural\n  const isTop=e.clientY<rect.top+rect.height*0.4;\n  _placeDropLine(el,isTop);\n}\nfunction onWkCardLeave(e,targetId){\n  // Only clear if truly leaving this card (not entering the drop line)\n  if(e.relatedTarget&&(e.relatedTarget.classList?.contains('wt-drop-line'))) return;\n  const el=document.querySelector(`.wk-body [data-id=\"${targetId}\"]`);\n  if(el&&!el.contains(e.relatedTarget)) _clearDropLine();\n}\nfunction onWkCardDrop(e,targetId){\n  e.preventDefault();e.stopPropagation();\n  _clearDropLine();\n  if(dragId===null||dragId===targetId) return;\n\n  const srcTask=tasks.find(t
