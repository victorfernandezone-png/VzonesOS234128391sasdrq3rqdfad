rn;\n    }\n    if(WD.id===null)return;\n    const wasDragging=WD.dragging;\n    if(wasDragging){\n      const el=document.getElementById('wcev-'+WD.id);\n      const topPx=el?parseFloat(el.style.top)||0:0;\n      const newMin=Math.max(0,Math.min(23*60,Math.round((topPx/HR*60)/15)*15));\n      const relX=e.clientX-WD.gLeft;let newCol=WD.srcCol;\n      for(let i=WD.cols-1;i>=0;i--){if(relX>=WD.colBounds[i]){newCol=i;break;}}\n      const t=tasks.find(t=>t.id===WD.id);\n      if(t){\n        const dur=t.end?(t2m(t.end)-(t2m(t.time)||0)):60;\n        t.time=m2t(newMin);t.end=m2t(newMin+Math.max(dur,30));\n        t.date=dk(WD.dates[newCol]); // always commit target day\n        save();sfxDrop();\n      }\n      document.querySelectorAll('.drag-ev').forEach(el=>el.classList.remove('drag-ev'));\n    }\n    WD.id=null;WD.dragging=false;WD.colBounds=[];\n    if(wasDragging)render();\n  };\n  document.addEventListener('mousemove',_wcalMM);\n  document.addEventListener('mouseup',_wcalMU);\n\n  // ── Swipe to advance/go back days ──\n  const wcalScrollEl=document.getElementById('wcalScroll');\n  if(wcalScrollEl){\n    let swipeStartX=0,swipeStartY=0,swipeActive=false;\n    const SWIPE_THRESHOLD=60;\n    wcalScrollEl.addEventListener('touchstart',e=>{\n      swipeStartX=e.touches[0].clientX;\n      swipeStartY=e.touches[0].clientY;\n      swipeActive=true;\n    },{passive:true});\n    wcalScrollEl.addEventListener('touchmove',e=>{\n      if(!swipeActive)return;\n      const dx=e.touches[0].clientX-swipeStartX;\n      const dy=e.touches[0].clientY-swipeStartY;\n      // Only horizontal swipes (dx > dy in magnitude)\n      if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>SWIPE_THRESHOLD){\n        swipeActive=false;\n        if(dx<0){wcalDayOffset++;expDay=null;render();}\n        else{wcalDayOffset--;expDay=null;render();}\n      }\n    },{passive:true});\n    wcalScrollEl.addEventListener('touchend',()=>{swipeActive=false;},{passive:true});\n\n    // Mouse swipe support (trackpad horizontal scroll / drag on edges)\n    let mswipeStartX=0,mswipeDown=false;\n    wcalScrollEl.addEventListener('mousedown',e=>{\n      // Only start swipe if clicking on background (not on an event)\n      if(e.target.closest('.wcev')||e.target.closest('.wcev-resize'))return;\n      mswipeStartX=e.clientX;mswipeDown=true;\n    });\n    wcalScrollEl.addEventListener('mousemove',e=>{\n      if(!mswipeDown)return;\n      const dx=e.clientX-mswipeStartX;\n      if(Math.abs(dx)>SWIPE_THRESHOLD){\n        mswipeDown=false;\n        if(dx<0){wcalDayOffset++;expDay=null;render();}\n        else{wcalDayOffset--;expDay=null;render();}\n      }\n    });\n    wcalScrollEl.addEventListener('mouseup',()=>{mswipeDown=false;});\n    wcalScrollEl.addEventListener('mouseleave',()=>{mswipeDown=false;});\n  }\n}\nfunction toggleWcalUnsched(){\n  wcalUnschedOpen=!wcalUnschedOpen;\n  const p=document.getElementById('unschedPanel');\n  if(p) p.classList.toggle('collapsed',!wcalUnschedOpen);\n}\n\nfunction renderWcalHabits(){}\n\nfunction htToggleDay(hid,dateKey,el){\n  const hb=habits.find(h=>h.id===hid);if(!hb)return;\n  const done=!hb.checks[dateKey];\n  if(done)hb.checks[dateKey]=true;else delete hb.checks[dateKey];\n  saveHabits();sfxCheck();\n  el.className='unsched-habit-chk'+(done?' done':'');\n  el.style.cssText=done?'background-image:'+rainbowGrad(hb.color)+';background-color:'+hb.color+';border-color:'+hb.color+';color:#fff':'border-color:'+hb.color;\n  const nm=el.closest('.unsched-habit-row')?.querySelector('.unsched-habit-name');\n  if(nm){nm.className='unsched-habit-name'+(done?' done':'');nm.style.cssText=done?'text-decoration:line-through;opacity:.45':'';}\n}\n\nfunction _wcQuickAdd(cx,cy,newId,dateKey,sm,em){\n  document.getElementById('wcQuickAdd')?.remove();\n  nid=Math.max(nid,newId+1);\n  const popup=document.createElement('div');\n  popup.id='wcQuickAdd';popup.className='wc-quick-add';\n  popup.innerHTML='<div class=\"wc-qa-lbl\">'+m2t(sm)+' \\u2013 '+m2t(em)+'<\u002Fdiv>'\n    +'<input class=\"wc-qa-inp\" id=\"wcQaInp\" placeholder=\"Nombre de la tarea\\u2026\" autocomplete=\"off\" spellcheck=\"false\">'\n    +'<div class=\"wc-qa-btns\">'\n      +'<button class=\"wc-qa-save\" id=\"wcQaSave\">A\\u00f1adir<\u002Fbutton>'\n      +'<button class=\"wc-qa-more\" id=\"wcQaMore\">M\\u00e1s opciones<\u002Fbutton>'\n      +'<button class=\"wc-qa-cancel\" id=\"wcQaCancel\">\\u2715<\u002Fbutton>'\n    +'<\u002Fdiv>';\n  document.body.appendChild(popup);\n  popup.style.left=Math.min(cx+8,window.innerWidth-232)+'px';\n  popup.style.top=Math.min(cy-20,window.innerHeight-120)+'px';\n  const inp=document.getElementById('wcQaInp');\n  setTimeout(()=>inp&&inp.focus(),40);\n  function commit(full){\n    const text=(inp?inp.value.trim():'')||'Nueva tarea';\n    tasks.push({id:newId,text,date:dateKey,time:m2t(sm),end:m2t(em),color:selColor,done:false,notes:''});\n    save();sfxAdd();close();\n    if(full){render();setTimeout(()=>openDetail(newId,null),50);}else render();\n  }\n  function close(){popup.remove();document.removeEventListener('mousedown',outside);}\n  function outside(e){if(!popup.contains(e.target))close();}\n  document.getElementById('wcQaSave').onclick=()=>commit(false);\n  document.getElementById('wcQaMore').onclick=()=>commit(true);\n  document.getElementById('wcQaCancel').onclick=close;\n  if(inp)inp.addEventListener('keydown',e=>{\n    if(e.key==='Enter'){e.preventDefault();commit(false);}\n    else if(e.key==='Escape')close();\n  });\n  setTimeout(()=>document.addEventListener('mousedown',outside),200);\n}\n\n// Drag habit from unsched panel onto wcal grid to create a time-blocked task\nlet _unschedHabitDragId=null;\nfunction onUnschedHabitDragStart(e,hid){\n  _unschedHabitDragId=hid;\n  e.dataTransfer.effectAllowed='copy';\n  e.dataTransfer.setData('text/plain','habit:'+hid);\n  dragId=null; // don't interfere with task drag\n}\nfunction onUnschedHabitDragEnd(e){\n  _unschedHabitDragId=null;\n}\n// habit drops handled inside onWcalDrop below\n\nlet unschedDragId=null;\nlet _unschedDropLine=null;\nfunction _clearUnschedDropLine(){if(_unschedDropLine){_unschedDropLine.remove();_unschedDropLine=null;}}\nfunction deleteUnschedTask(id){\n  const t=tasks.find(t=>t.id===id);\n  if(!t) return;\n  if(t.recurId && tasks.filter(x=>x.recurId===t.recurId).length>1){\n    detId=id; detSource='task';\n    document.getElementById('recurDelOv').classList.add('open');\n    return;\n  }\n  tasks=tasks.filter(x=>x.id!==id);\n  save(); render(); showToast('Eliminado');\n}\nfunction onUnschedDragStart(e,id){\n  unschedDragId=id;dragId=id;\n  if(AC.state==='suspended') AC.resume();\n  e.dataTransfer.effectAllowed='move';\n  e.dataTransfer.setData('text/plain',String(id));\n  setTimeout(()=>document.querySelectorAll(`[data-id=\"${id}\"].unsched-pill`).forEach(el=>el.classList.add('drag-ghost-u')),0);\n}\nfunction onUnschedDragEnd(e,id){\n  document.querySelectorAll('.unsched-pill.drag-ghost-u').forEach(el=>el.classList.remove('drag-ghost-u'));\n  _clearUnschedDropLine();\n  unschedDragId=null;dragId=null;\n}\n// Drop on column background (empty area)\nfunction onUnschedColOver(e,d){\n  e.preventDefault();\n  const col=document.querySelector(`.unsched-col[data-date=\"${d}\"]`);\n  if(col) col.style.background='var(--s2)';\n}\nfunction onUnschedColLeave(e,d){\n  const col=document.querySelector(`.unsched-col[data-date=\"${d}\"]`);\n  if(col) col.style.background='';\n}\nfunction onUnschedColDrop(e,d){\n  e.preventDefault();\n  const col=document.querySelector(`.unsched-col[data-date=\"${d}\"]`);\n  if(col) col.style.background='';\n  _clearUnschedDropLine();\n  if(unschedDragId===null)return;\n  const t=tasks.find(t=>t.id===unschedDragId);\n  if(t&&t.date!==d){\n    t.date=d;save();sfxDrop();\n    unschedDragId=null;dragId=null;render();\n  }\n}\n// Drop on another pill (reorder within column or move + reorder)\nlet _unschedPillDropLine=null;\nfunction _clearUnschedPillDropLine(){if(_unschedPillDropLine){_unschedPillDropLine.remove();_unschedPillDropLine=null;}}\nfunction onUnschedPillOver(e,targetId){\n  e.preventDefault();e.stopPropagation();\n  if(unschedDragId===null||unschedDragId===targetId)return;\n  const el=document.querySelector(`.unsched-pill[data-id=\"${targetId}\"]`);\n  if(!el)return;\n  _clearUnschedPillDropLine();\n  _unschedPillDropLine=document.createElement('div');\n  _unschedPillDropLine.style.cssText='height:2px;border-radius:2px;background:var(--tx);margin:1px 2px;pointer-events:none;flex-shrink:0;';\n  const rect=el.getBoundingClientRect();\n  if(e.clientY<rect.top+rect.height*0.45) el.before(_unschedPillDropLine);\n  else el.after(_unschedPillDropLine);\n  // Clear col highlight\n  document.querySelectorAll('.unsched-col').forEach(c=>c.style.background='');\n}\nfunction onUnschedPillLeave(e,targetId){\n  const el=document.querySelector(`.unsched-pill[data-id=\"${targetId}\"]`);\n  if(el&&!el.contains(e.relatedTarget))_clearUnschedPillDropLine();\n}\nfunction onUnschedPillDrop(e,targetId,targetDate){\n  e.preventDefault();e.stopPropagation();\n  _clearUnschedPillDropLine();\n  document.querySelectorAll('.unsched-col').forEach(c=>c.style.background='');\n  if(unschedDragId===null||unschedDragId===targetId)return;\n  const srcId=unschedDragId;\n  const t=tasks.find(t=>t.id===srcId);\n  if(!t)return;\n  // Move to target date if different\n  const oldDate=t.date;\n  t.date=targetDate;\n  // Reorder: insert before or after target within date tasks\n  const targetEl=document.querySelector(`.unsched-pill[data-id=\"${targetId}\"]`);\n  const rect=targetEl?.getBoundingClientRect();\n  const insertBefore=rect&&e.clientY<rect.top+rect.height*0.45;\n  const dateTasks=tasks.filter(x=>x.date===targetDate&&x.id!==srcId);\n  const tgtIdx=dateTasks.findIndex(x=>x.id===targetId);\n  if(tgtIdx>=0){\n    const reordered=[...dateTasks];\n    reordered.splice(insertBefore?tgtIdx:tgtIdx+1,0,t);\n    const otherTasks=tasks.filter(x=>x.date!==targetDate&&x.id!==srcId);\n    tasks=[...otherTasks,...reordered];\n  }\n  save();sfxDrop();\n  unschedDragId=null;dragId=null;render();\n}\n\nfunction onWcalOver(e){\n  e.preventDefault();\n  e.dataTransfer.dropEffect='move';\n}\nfunction onWcalDrop(e,d,hr){\n  e.preventDefault();\n  // ── Habit drop from mini-zone ──────────────────────\n  const raw=e.dataTransfer.getData('text/plain');\n  if(raw&&raw.startsWith('habit:')){\n    const hid=parseInt(raw.split(':')[1]);\n    const hb=habits.find(h=>h.id===hid);\n    if(hb){\n      const rect=e.currentTarget.getBoundingClientRect();\n      const fracMin=Math.round(((e.clientY-rect.top)/HR*60)/15)*15;\n      const totalMin=hr*60+Math.max(0,Math.min(59,fracMin));\n      let ci=5; C.forEach((col,i)=>{if(col.dot===hb.color)ci=i;});\n      tasks.push({id:nid++,text:hb.name,date:d,time:m2t(totalMin),end:m2t(totalMin+60),\n        color:ci,done:false,notes:'',_habitRef:hb.id});\n      save();sfxAdd();render();\n    }\n    _unschedHabitDragId=null;\n    return;\n  }\n  // ── Regular task drop ──────────────────────────────\n  if(dragId===null)return;\n  const t=tasks.find(t=>t.id===dragId);\n  if(t){\n    const rect=e.currentTarget.getBoundingClientRect();\n    const fracMin=Math.round(((e.clientY-rect.top)/HR*60)/15)*15;\n    const totalMin=hr*60+Math.max(0,Math.min(59,fracMin));\n    t.date=d;t.time=m2t(totalMin);\n    if(!t.end||unschedDragId===t.id) t.end=m2t(totalMin+60);\n    else{const dur=t2m(t.end)-(t2m(t.time)||0);t.end=m2t(totalMin+(dur>0?dur:60));}\n    save();sfxDrop();\n  }\n  dragId=null;unschedDragId=null;render();\n}\nfunction updateNowWcal(dates){\n  const grid=document.getElementById('wcalGrid');if(!grid)return;\n  const now=new Date();\n  const nowMin=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;\n  const top=(nowMin/60*HR);\n  let nl=document.getElementById('wcalNow');\n  if(!nl){nl=document.createElement('div');nl.id='wcalNow';nl.className='wcal-now';\n    nl.innerHTML='<div class=\"wcal-now-dot\"><\u002Fdiv><div class=\"wcal-now-bar\"><\u002Fdiv>';grid.appendChild(nl);}\n  nl.style.top=top.toFixed(2)+'px';\n}\nfunction scrollNowWcal(){setTimeout(()=>{const sc=document.getElementById('wcalScroll');if(sc){const n=today.getHours()*60+today.getMinutes();sc.scrollTop=Math.max(0,n/60*HR-80);}},50);}\n\n// ══════════════════════════════════════════════════════\n// MONTH VIEW\n// ══════════════════════════════════════════════════════\n\n// ── MONTH & YEAR PANELS ───────────────────────────────\nfunction getMgKey(yr,mo){return yr+'-'+(mo+1).toString().padStart(2,'0');}\nfunction getYgKey(yr){return String(yr);}\n\nfunction panelActionsHtml(key,idx,isYear){\n  return `<div class=\"mp-pill-actions\">\n    <button class=\"mp-pill-act mp-pill-dot\" onclick=\"event.stopPropagation();openPanelColorPopup('${key}',${idx},${isYear?1:0},this,event)\" title=\"Color\">&#8943;<\u002Fbutton>\n    <button class=\"mp-pill-act mp-pill-del\" onclick=\"event.stopPropagation();delPanelItem('${key}',${idx},${isYear?1:0})\" title=\"Eliminar\">&#215;<\u002Fbutton>\n  <\u002Fdiv>`;\n}\n\nfunction renderPanelPills(items,key,isYear){\n  if(!items||!items.length) return '';\n  return items.map((it,i)=>{\n    const col=C[it.color]||C[0];\n    const isGray=it.color===5;\n    const pillBg=isGray?'transparent':col.bg;\n    const pillTx=isGray?(isDark?'var(--tx)':'var(--tx)'):col.tx;\n    const chkColor=isGray?'var(--tx2)':col.dot;\n    const doneChkColor=isDark?(isGray?'#a6a29a':col.dot):(isGray?'#aaaaaa':chkColor);\n    const doneTxColor=isDark?(isGray?'#a6a29a':(col.dtx||col.tx)):(isGray?'#aaaaaa':'var(--tx3)');\n    return `<div class=\"mp-pill${it.done?' done':''}\" style=\"background:${it.done&&isDark?pillBg:pillBg};${it.done&&isDark?'opacity:1':''}\" onclick=\"openPanelDetail(${it.id},${isYear?1:0},event)\">\n      <div class=\"mp-pill-chk${it.done?' done':''}\"\n        style=\"color:${it.done?doneChkColor:chkColor};border-color:${it.done?doneChkColor:chkColor};${it.done?`background:${doneChkColor};--tick-color:${tickColor(col)}`:''}\"\n        onclick=\"event.stopPropagation();togglePanelItem('${key}',${i},${isYear?1:0})\"><\u002Fdiv>\n      <span class=\"mp-pill-txt${it.done?' done':''}\" style=\"color:${it.done?doneTxColor:pillTx};${it.done&&isDark?'text-decoration:line-through':''}\">${esc(it.text)}<\u002Fspan>\n      ${panelActionsHtml(key,i,isYear)}\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction renderMonthPanels(md){\n  const yr=md.getFullYear(), mo=md.getMonth();\n  const mgKey=getMgKey(yr,mo);\n  const mgItems=monthGoals.filter(g=>g.key===mgKey);\n  const mgLabel=MO[mo]+' '+yr;\n  const ygKey=getYgKey(yr);\n  const ygItems=yearGoals.filter(g=>g.key===ygKey);\n\n  const plusSvg=`<svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" width=\"11\" height=\"11\"><line x1=\"6\" y1=\"1\" x2=\"6\" y2=\"11\"/><line x1=\"1\" y1=\"6\" x2=\"11\" y2=\"6\"/><\u002Fsvg>`;\n\n  return `<div class=\"mo-panels-col\">\n    <div class=\"mo-year-panel\">\n      <div class=\"mo-year-panel-hdr\">\n        <span class=\"mo-year-panel-title\">${yr}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"mo-year-panel-body\" id=\"ygBody\">\n        ${renderPanelPills(ygItems,ygKey,true)}\n        <div class=\"mp-add-row\" onclick=\"focusPanelAdd('ygAddInp',event)\">\n          ${plusSvg}<span>Añadir...<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"mp-add-form\" id=\"ygAddForm\" style=\"display:none\">\n          <input class=\"mp-add-inp\" id=\"ygAddInp\" placeholder=\"Nueva tarea del año…\" onkeydown=\"onPanelKey(event,'${ygKey}',1)\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mo-month-panel\">\n      <div class=\"mo-month-panel-hdr\">\n        <span class=\"mo-month-panel-title\">${mgLabel}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"mo-month-panel-body\" id=\"mgBody\">\n        ${renderPanelPills(mgItems,mgKey,false)}\n        <div class=\"mp-add-row\" onclick=\"focusPanelAdd('mgAddInp',event)\">\n          ${plusSvg}<span>Añadir...<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"mp-add-form\" id=\"mgAddForm\" style=\"display:none\">\n          <input class=\"mp-add-inp\" id=\"mgAddInp\" placeholder=\"Nueva tarea del mes…\" onkeydown=\"onPanelKey(event,'${mgKey}',0)\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction focusPanelAdd(inputId,e){\n  if(e)e.stopPropagation();\n  const formId=inputId==='mgAddInp'?'mgAddForm':'ygAddForm';\n  const form=document.getElementById(formId);\n  const addRow=form?form.previousElementSibling:null;\n  if(form){form.style.display='flex';}\n  if(addRow){addRow.style.display='none';}\n  const inp=document.getElementById(inputId);\n  if(inp){inp.focus();}\n}\n\nfunction onPanelKey(e,key,isYear){\n  if(e.key==='Enter'){\n    const text=e.target.value.trim();\n    if(text){\n      const item={id:nid++,text,key,color:selColor,done:false};\n      if(isYear){yearGoals.push(item);saveYearGoals();}\n      else{monthGoals.push(item);saveMonthGoals();}\n      sfxAdd();\n    }\n    render();\n  } else if(e.key==='Escape'){render();}\n}\n\nfunction togglePanelItem(key,idx,isYear){\n  const arr=isYear?yearGoals:monthGoals;\n  const items=arr.filter(g=>g.key===key);\n  if(items[idx]){items[idx].done=!items[idx].done;}\n  if(isYear)saveYearGoals();else saveMonthGoals();\n  sfxCheck();render();\n}\n\nfunction delPanelItem(key,idx,isYear){\n  const arr=isYear?yearGoals:monthGoals;\n  const items=arr.filter(g=>g.key===key);\n  if(items[idx]){\n    const gi=arr.indexOf(items[idx]);\n    if(gi>=0)arr.splice(gi,1);\n  }\n  if(isYear)saveYearGoals();else saveMonthGoals();\n  showToast('Eliminado');render();\n}\n\nlet panelColorPopupState=null;\nfunction openPanelColorPopup(key,idx,isYear,anchorEl,e){\n  e.stopPropagation();\n  const popup=document.getElementById('colorPopup');\n  if(panelColorPopupState&&panelColorPopupState.key===key&&panelColorPopupState.idx===idx){\n    closeColorPopup();panelColorPopupState=null;return;\n  }\n  panelColorPopupState={key,idx,isYear};\n  colorPopupId=null; // clear task popup\n  const arr=isYear?yearGoals:monthGoals;\n  const items=arr.filter(g=>g.key===key);\n  const selC=items[idx]?items[idx].color:0;\n  popup.innerHTML='<div style=\"font-size:9px;color:var(--tx3);width:100%;margin-bottom:3px;letter-spacing:.5px;text-transform:uppercase\">Color<\u002Fdiv>';\n  C.forEach((_,i)=>{\n    const d=document.createElement('div');\n    d.className='tcp-dot'+(i===selC?' sel':'');\n    if(i===6){d.style.background='transparent';d.style.border='2px solid var(--tx2)';}\n    else{d.style.background=C[i].bg;}\n    d.onclick=ev=>{\n      ev.stopPropagation();\n      if(items[idx]){items[idx].color=i;}\n      if(isYear)saveYearGoals();else saveMonthGoals();\n      closeColorPopup();panelColorPopupState=null;render();\n    };\n    popup.appendChild(d);\n  });\n  popup.classList.add('open');\n  const rect=anchorEl.getBoundingClientRect();\n  popup.style.top=(rect.bottom+4)+'px';\n  popup.style.left=Math.min(rect.right-128,window.innerWidth-140)+'px';\n}\n\nfunction bindPanelInputs(){\n  // nothing extra needed\n}\nfunction openPanelDetail(id,isYear,e){\n  if(e)e.stopPropagation();\n  closeColorPopup();\n  const arr=isYear?yearGoals:monthGoals;\n  const item=arr.find(x=>x.id===id);\n  if(!item)return;\n  detId=id;detIsGoal=false;detSource=isYear?'yearGoal':'monthGoal';dlEditMode=true;\n  const col=C[item.color]||C[0];\n  const chk=document.getElementById('dlChk');\n  chk.className='dl-chk'+(item.done?' done':'');\n  chk.style.borderColor=col.dot;chk.style.color=col.dot;\n  if(item.done){chk.style.background=col.dot;chk.style.setProperty('--tick-color',tickColor(col));}\n  else{chk.style.background='transparent';chk.style.removeProperty('--tick-color');}\n  const ti=document.getElementById('dlTitl');\n  ti.value=item.text;ti.className='dl-titl'+(item.done?' done':'');\n  setTimeout(()=>autoR(ti),0);\n  document.getElementById('dlDate').closest('.dl-meta-item').style.display='none';\n  document.getElementById('dlStart').value='';\n  document.getElementById('dlEnd').value='';\n  renderDlColors(item.color);\n  dnRenderPanel();\n  const recurRow2=document.getElementById('dlRecurRow');\n  if(recurRow2) recurRow2.style.display='';\n  renderDlRecur(item.recur||null);\n  document.getElementById('dlSubtasks').style.display='';\n  renderDlSubtasks(item);\n  document.getElementById('dlOv').classList.add('open');\n}\n\nfunction renderMonth(md){\n  const yr=md.getFullYear(),mo=md.getMonth();\n  const fdow=new Date(yr,mo,1).getDay();\n  const dim=new Date(yr,mo+1,0).getDate();\n  const pd=new Date(yr,mo,0).getDate();\n  const off=fdow===0?6:fdow-1; // offset: how many cells before day 1 (Mon=0)\n  const rows=Math.ceil((off+dim)/7);\n  const totalCells=rows*7;\n\n  // Determine which columns (0-6) are fully \"other\" (no current-month day in that col)\n  const otherCols=new Set([0,1,2,3,4,5,6]);\n  for(let i=0;i<totalCells;i++){\n    const dn=i-off+1;\n    if(dn>=1&&dn<=dim) otherCols.delete(i%7);\n  }\n\n  let h='<div class=\"mo-wrap\"><div class=\"mo-grid\">';\n  // No header row — day names appear inside first-row cells\n\n  // Body cells — continue in same grid\n  for(let row=0;row<rows;row++){\n    for(let col=0;col<7;col++){\n      const idx=row*7+col;const dn=idx-off+1;\n      const isFirstRow=row===0;\n      if(dn<1){\n        // Prev-month cell: show day name on row 0\n        const prevDn=pd-off+idx+1;\n        const prevDate=new Date(yr,mo-1,prevDn);\n        const dayLabel=isFirstRow?`<div class=\"mo-dayname\">${DS[prevDate.getDay()]}<\u002Fdiv>`:'';\n        h+=`<div class=\"mo-cell other\"><div class=\"mo-cell-hd\">${dayLabel}<div class=\"mo-num\">${prevDn}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;continue;\n      }\n      if(dn>dim){\n        const nextDate=new Date(yr,mo+1,dn-dim);\n        const dayLabel=isFirstRow?`<div class=\"mo-dayname\">${DS[nextDate.getDay()]}<\u002Fdiv>`:'';\n        h+=`<div class=\"mo-cell other\"><div class=\"mo-cell-hd\">${dayLabel}<div class=\"mo-num\">${dn-dim}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;continue;\n      }\n      const cd=new Date(yr,mo,dn);const dkey=dk(cd);\n      const isTd=isToday(cd);\n      const dt=getTasksForDate(dkey);\n      const isFirstOfMonth=dn===1;\n      const dayLabel=isFirstRow?`<div class=\"mo-dayname\">${DS[cd.getDay()]}<\u002Fdiv>`:'';\n      const monthLabel=isFirstOfMonth&&!isFirstRow?`<div class=\"mo-monthname\">${MO[mo].slice(0,3)}<\u002Fdiv>`:'';\n      const firstRowMonthLabel=isFirstRow&&isFirstOfMonth?`<div class=\"mo-monthname\">${MO[mo].slice(0,3)}<\u002Fdiv>`:'';\n      h+=`<div class=\"mo-cell${isTd?' today':''}\" id=\"mc-${dkey}\" data-date=\"${dkey}\"\n        ondragover=\"onMoOver(event,'${dkey}')\" ondrop=\"onMoDrop(event,'${dkey}')\" ondragleave=\"onMoLeave(event,'${dkey}')\"\n        oncontextmenu=\"event.preventDefault();openAddCtx('${dkey}',this,event)\"\n        onclick=\"inlineAddMonth('${dkey}',event)\"><div class=\"mo-cell-hd\">${firstRowMonthLabel}${monthLabel}${dayLabel}<div class=\"mo-num\">${dn}<\u002Fdiv><\u002Fdiv>`;\n      dt.forEach(t=>{\n        if(t.type==='divider'){\n          h+=`<div class=\"mo-pill-divider\" data-id=\"${t.id}\" draggable=\"true\"\n            ondragstart=\"onMoPillStart(event,${t.id})\"\n            ondragover=\"onMoPillOver(event,${t.id})\"\n            ondragleave=\"onMoPillLeave(event,${t.id})\"\n            ondrop=\"onMoPillDrop(event,${t.id})\">\n            <div class=\"mo-pill-divider-line\"><\u002Fdiv>\n            <button class=\"mo-div-del\" onclick=\"event.stopPropagation();delDivider(${t.id})\">&#215;<\u002Fbutton>\n          <\u002Fdiv>`;\n          return;\n        }\n        const col=C[t.color]||C[0];\n        const isGray=t.color===5;\n        const pillBg=isGray?'transparent':col.bg;\n        const pillTx=isGray?(isDark?'var(--tx)':'var(--tx)'):col.tx;\n        const chkColor=isGray?'var(--tx2)':col.dot;\n        // Dark mode: keep pill bg \"Añadir objetivo\">+<\u002Fbutton>\n      <\u002Fdiv>`;\n    wgoals.forEach(g=>{\n      const col=C[g.color]||C[0];\n      const subs=g.subtasks||[];\n      const subDone=subs.filter(s=>s.done).length;\n      const isGray=g.color===5;\n      const pillBg=isGray?'transparent':col.bg;\n      const pillTx=isGray?(isDark?'var(--tx)':'var(--tx)'):col.tx;\n      const chkColor=isGray?'var(--tx2)':col.dot;\n      // Dark: keep bg, only dim text; Light: old fade behavior\n      const doneChkColor=isDark?(isGray?'#a6a29a':col.dot):(isGray?'#aaaaaa':chkColor);\n      const doneTxColor=isDark?(isGray?'#a6a29a':(col.dtx||col.tx)):(isGray?'#aaaaaa':'var(--tx3)');\n      h+=`<div class=\"mo-wg-pill${g.done?' done':''}\"\n        style=\"background:${pillBg};border-radius:8px;margin:2px 0;position:relative;${g.done&&isDark?'opacity:1':''}\"\n        onclick=\"openDetail(${g.id},event,true)\">\n        <div class=\"mchk${g.done?' done':''}\"\n          style=\"color:${g.done?doneChkColor:chkColor};border-color:${g.done?doneChkColor:chkColor};${g.done?`background:${doneChkColor};border-color:${doneChkColor};--tick-color:${tickColor(col)}`:''}\"\n          onclick=\"event.stopPropagation();toggleGoal(${g.id})\"><\u002Fdiv>\n        <div class=\"wg-dot\" style=\"background:${g.done?doneChkColor:(isGray?'var(--tx2)':col.dot)}\"><\u002Fdiv>\n        <div style=\"flex:1;min-width:0;padding-right:16px\">\n          <span style=\"color:${g.done?doneTxColor:pillTx};${g.done&&isDark?'text-decoration:line-through':''}\">${esc(g.text)}<\u002Fspan>\n          ${subs.length>0?`<div style=\"font-size:.82em;opacity:.55;color:${g.done?doneTxColor:pillTx}\">${subDone}/${subs.length}<\u002Fdiv>`:''}\n        <\u002Fdiv>\n        <button class=\"mp-pill-act mp-pill-del\" style=\"position:absolute;top:2px;right:2px;display:none\" onclick=\"event.stopPropagation();delGoal(${g.id})\">&#215;<\u002Fbutton>\n        <\u002Fdiv>`;\n    });\n    h+='<\u002Fdiv>';\n  }\n  h+='<\u002Fdiv><\u002Fdiv>';\n  return h;\n}\nfunction expD(d){expDay=d;render();}\nfunction onMoPillStart(e,id){dragId=id;if(AC.state==='suspended')AC.resume();e.dataTransfer.effectAllowed='move';e.stopPropagation();setTimeout(()=>document.querySelectorAll(`[data-id=\"${id}\"]`).forEach(el=>el.classList.add('drag-g')),0);}\nfunction onMoOver(e,d){e.preventDefault();e.stopPropagation();document.getElementById('mc-'+d)?.classList.add('dov');}\nfunction onMoLeave(e,d){document.getElementById('mc-'+d)?.classList.remove('dov');}\nfunction onMoDrop(e,d){\n  e.preventDefault();e.stopPropagation();\n  _clearMoDragLine();\n  document.querySelectorAll('.mo-cell').forEach(c=>c.classList.remove('dov'));\n  document.querySelectorAll('.drag-g').forEach(el=>el.classList.remove('drag-g'));\n  if(dragId===null)return;\n  const t=tasks.find(t=>t.id===dragId);\n  if(t&&!t.recurId){t.date=d;save();sfxDrop();}\n  dragId=null;render();\n}\nfunction bindMonthDrag(){\n  document.querySelectorAll('.mo-pill[draggable],.mo-pill-divider[draggable]').forEach(el=>{\n    el.addEventListener('dragend',()=>{\n      _clearMoDragLine();\n      document.querySelectorAll('.mo-cell').forEach(c=>c.classList.remove('dov'));\n      document.querySelectorAll('.drag-g').forEach(el=>el.classList.remove('drag-g'));\n      dragId=null;\n    });\n  });\n}\n\n// ══════════════════════════════════════════════════════\n// DAY VIEW\n// ══════════════════════════════════════════════════════\nfunction renderDay(day){\n  const dkey=dk(day);\n  let h=`<div class=\"dv-wrap\"><div class=\"dv-hdr\">\n    <div class=\"dv-big\">${day.getDate()}<\u002Fdiv>\n    <div class=\"dv-info\"><div class=\"dv-name\">${DL[day.getDay()]}<\u002Fdiv>\n    <div class=\"dv-mo\">${MO[day.getMonth()]} ${day.getFullYear()}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv><div class=\"dv-scroll\" id=\"dvScroll\"><div class=\"dv-tgrid\" id=\"dvGrid\">`;\n  for(let hr=0;hr<24;hr++){\n    h+=`<div class=\"dv-hrow\" style=\"height:${HR}px\" ondragover=\"event.preventDefault()\" ondrop=\"onDvDrop(event,'${dkey}',${hr})\">\n      <div class=\"dv-lbl\">${hr<10?'0'+hr:hr}:00<\u002Fdiv><div class=\"dv-col\"><\u002Fdiv><\u002Fdiv>`;\n  }\n  // Overlap-aware layout: stagger overlapping events\n  const dayTasks=getTasksForDate(dkey).filter(t=>t.time)\n    .map(t=>({...t,sm:t2m(t.time)||0,em:t.end?t2m(t.end):(t2m(t.time)||0)+60}))\n    .sort((a,b)=>a.sm-b.sm||b.em-a.em);\n  const slots=[];\n  dayTasks.forEach(t=>{let c=0;while(slots[c]!==undefined&&slots[c]>t.sm)c++;t._col=c;slots[c]=t.em;});\n  const tc=slots.length||1;\n  dayTasks.forEach(t=>{\n    const top=(t.sm/60)*HR,ht=Math.max((Math.max(t.em-t.sm,30)/60)*HR,24);\n    const col=C[t.color]||C[0];\n    const isGray=t.color===5;\n    const evBg=isGray?'transparent':col.bg;\n    const evTx=isGray?'var(--tx)':col.tx;\n    const evDot=isGray?'var(--tx2)':col.dot;\n    const leftPx=62+t._col*14,rightPx=8+t._col*14;\n    h+=`<div class=\"dev\" data-id=\"${t.id}\" id=\"dev-${t.id}\"\n      style=\"top:${top.toFixed(1)}px;height:${ht.toFixed(1)}px;background:${evBg};left:${leftPx}px;right:${rightPx}px;z-index:${2+t._col};--ev-accent:${evDot};${isGray?'border:.5px solid var(--b2);':''}\"\n      onclick=\"openDetail(${t.id},event)\">\n      <span class=\"dev-chk${t.done?' done':''}\" style=\"border-color:${evDot};color:${evDot};${t.done?`background:${evDot};--tick-color:${tickColor(col)}`:''}\"\n        onclick=\"event.stopPropagation();toggleTask(${t.id})\"><\u002Fspan>\n      <span class=\"dev-title${t.done?' done':''}\" style=\"color:${evTx}\">${esc(t.text)}<\u002Fspan>\n      <div class=\"dev-tr\" style=\"color:${evTx}\">${t.time}${t.end?' – '+t.end:''}<\u002Fdiv>\n      ${t.notes?`<div class=\"dev-note\" style=\"color:${evTx}\">${esc(t.notes.slice(0,60))}<\u002Fdiv>`:''}\n      <button class=\"dev-del\" onclick=\"event.stopPropagation();delTask(${t.id})\">&#215;<\u002Fbutton>\n      <div class=\"dev-resize\" data-id=\"${t.id}\"><\u002Fdiv><\u002Fdiv>`;\n  });\n  h+='<\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n  return h;\n}\nfunction updateNowDay(){\n  if(!isToday(getCurDay()))return;\n  const grid=document.getElementById('dvGrid');if(!grid)return;\n  const now=new Date();\n  const nowMin=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;\n  let nl=document.getElementById('dvNow');\n  if(!nl){nl=document.createElement('div');nl.id='dvNow';nl.className='dv-now';\n    nl.innerHTML='<div class=\"dv-now-dot\"><\u002Fdiv><div class=\"dv-now-bar\"><\u002Fdiv>';grid.appendChild(nl);}\n  nl.style.top=(nowMin/60*HR).toFixed(2)+'px';\n}\nfunction scrollNowDay(){setTimeout(()=>{const sc=document.getElementById('dvScroll');if(sc){const n=today.getHours()*60+today.getMinutes();sc.scrollTop=Math.max(0,n/60*HR-80);}},50);}\n\n// Day drag state\nlet dayDragId=null,dayDragOY=0,dayDragSY=0,resId=null,resSY=0,resDur=0;\n// Drag-to-create state for day view\nlet _dvCreate={active:false,startMin:0,curMin:0,ghost:null};\nfunction bindDayEvents(day){\n  const dkey=dk(day);const grid=document.getElementById('dvGrid');if(!grid)return;\n  const scroll=document.getElementById('dvScroll');\n  document.querySelectorAll('.dev').forEach(el=>{\n    const id=parseInt(el.dataset.id);\n    el.addEventListener('mousedown',e=>{\n      if(e.target.classList.contains('dev-resize')||e.target.closest('.dev-resize'))return;\n      if(e.target.classList.contains('dev-chk')||e.target.closest('.dev-del'))return;\n      e.preventDefault();\n      const gRect=grid.getBoundingClientRect();const snapST=scroll.scrollTop;\n      const t=tasks.find(t=>t.id===id);\n      const taskTopPx=(t?t2m(t.time)||0:0)/60*HR;\n      const clickYInGrid=e.clientY-gRect.top+snapST;\n      dayDragOY=clickYInGrid-taskTopPx;dayDragSY=e.clientY;dayDragId=id;\n      el._snapScroll=snapST;el._snapGTop=gRect.top;el._dragging=false;\n      if(AC.state==='suspended')AC.resume();\n    });\n  });\n  // Drag-to-create: mousedown on empty grid area\n  grid.addEventListener('mousedown',e=>{\n    if(e.target.closest('.dev'))return;\n    if(e.target.closest('.dev-resize'))return;\n    e.preventDefault();\n    const scrollRect=scroll.getBoundingClientRect();\n    const relY=e.clientY-scrollRect.top+scroll.scrollTop;\n    const startMin=Math.max(0,Math.min(23*60,Math.round((relY/HR*60)/15)*15));\n    _dvCreate.active=false;_dvCreate.startMin=startMin;_dvCreate.curMin=startMin+60;\n    let g=document.getElementById('dvCreateGhost');\n    if(!g){g=document.createElement('div');g.id='dvCreateGhost';g.className='dv-create-ghost';grid.appendChild(g);}\n    g.style.display='none';_dvCreate.ghost=g;\n    const _mm=ev=>{\n      const rY=ev.clientY-scrollRect.top+scroll.scrollTop;\n      const curMin=Math.max(0,Math.min(24*60,Math.round((rY/HR*60)/15)*15));\n      if(Math.abs(curMin-_dvCreate.startMin)>=15){\n        _dvCreate.active=true;_dvCreate.curMin=Math.max(_dvCreate.startMin+15,curMin);\n        const topPx=(_dvCreate.startMin/60*HR);\n        const htPx=((_dvCreate.curMin-_dvCreate.startMin)/60*HR);\n        g.style.display='block';g.style.top=topPx.toFixed(1)+'px';g.style.height=Math.max(htPx,HR/4).toFixed(1)+'px';\n      }\n    };\n    const _mu=ev=>{\n      document.removeEventListener('mousemove',_mm);document.removeEventListener('mouseup',_mu);\n      g.style.display='none';\n      const sm=_dvCreate.startMin;\n      const em=_dvCreate.active?Math.max(sm+30,_dvCreate.curMin):sm+60;\n      const _qid=nid++;\n      _wcQuickAdd(ev.clientX,ev.clientY,_qid,dkey,sm,em);\n      _dvCreate.active=false;\n    };\n    document.addEventListener('mousemove',_mm);document.addEventListener('mouseup',_mu);\n  });\n  document.querySelectorAll('.dev-resize').forEach(rh=>{\n    const id=parseInt(rh.dataset.id);\n    rh.addEventListener('mousedown',e=>{\n      e.preventDefault();e.stopPropagation();\n      const t=tasks.find(t=>t.id===id);if(!t)return;\n      resId=id;resSY=e.clientY;const sm=t2m(t.time)||0;const em=t.end?t2m(t.end):sm+60;resDur=em-sm;\n    });\n  });\n  const mm=e=>{\n    if(dayDragId!==null){\n      const el=document.getElementById('dev-'+dayDragId);if(!el)return;\n      const moved=Math.abs(e.clientY-dayDragSY);\n      if(!el._dragging){if(moved<6)return;el._dragging=true;el.classList.add('drag-ev');}\n      const snapST=el._snapScroll||0;const snapGTop=el._snapGTop||0;\n      const relY=e.clientY-snapGTop-dayDragOY+snapST;\n      el.style.top=(Math.max(0,Math.min(23*60,Math.round((relY/HR*60)/15)*15))/60*HR).toFixed(1)+'px';\n    }\n    if(resId!==null){\n      const dy=e.clientY-resSY;const am=Math.round(dy/HR*60/15)*15;\n      const el=document.getElementById('dev-'+resId);\n      if(el)el.style.height=(Math.max(30,resDur+am)/60*HR).toFixed(1)+'px';\n    }\n  };\n  const mu=e=>{\n    if(dayDragId!==null){\n      const el=document.getElementById('dev-'+dayDragId);\n      const wasDragging=el?el._dragging:false;\n      if(wasDragging){\n        const topPx=parseFloat(el?el.style.top:0)||0;\n        const cl=Math.max(0,Math.min(23*60,Math.round((topPx/HR*60)/15)*15));\n        const t=tasks.find(t=>t.id===dayDragId);\n        if(t){const dur=t.end?(t2m(t.end)-(t2m(t.time)||0)):60;t.time=m2t(cl);if(t.end)t.end=m2t(cl+dur);save();sfxDrop();}\n      }\n      document.querySelectorAll('.drag-ev').forEach(el=>{el.classList.remove('drag-ev');el._dragging=false;});\n      dayDragId=null;if(wasDragging)render();\n    }\n    if(resId!==null){\n      const t=tasks.find(t=>t.id===resId);\n      if(t){const dy=e.clientY-resSY;const am=Math.round(dy/HR*60/15)*15;\n        const nd=Math.max(30,resDur+am);const sm=t2m(t.time)||0;t.end=m2t(sm+nd);save();sfxDrop();}\n      document.querySelectorAll('.dev').forEach(el=>el.style.height='');\n      resId=null;render();\n    }\n  };\n  document.addEventListener('mousemove',mm);\n  document.addEventListener('mouseup',mu);\n}\nfunction onDvDrop(e,dkey,hr){\n  e.preventDefault();if(dragId===null)return;\n  const t=tasks.find(t=>t.id===dragId);\n  if(t){t.date=dkey;t.time=m2t(hr*60);if(t.end){const dur=t2m(t.end)-(t2m(t.time)||0);if(dur>0)t.end=m2t(hr*60+dur);}save();sfxDrop();}\n  dragId=null;render();\n}\n\n// ── TASK/GOAL ACTIONS ─────────────────────────────────\nfunction toggleTask(id){\n  const t=tasks.find(t=>t.id===id);\n  if(!t||t.type==='divider') return;\n  t.done=!t.done;\n  save();sfxCheck();\n  // In week view: patch DOM in-place to avoid scroll flash\n  if(curView==='week'){\n    _patchWtCard(t);\n    renderMc();\n  } else {\n    render();\n  }\n}\nfunction toggleGoal(id){\n  const g=weekGoals.find(g=>g.id===id);\n  if(!g) return;\n  g.done=!g.done;\n  saveGoals();sfxCheck();\n  if(curView==='week'){\n    _patchGoalItem(g);\n    renderMc();\n  } else {\n    render();\n  }\n}\n\n// Patch a single task card in-place inside its week column body\nfunction _patchWtCard(t){\n  const el=document.querySelector(`.wk-body [data-id=\"${t.id}\"]`);\n  if(!el) return;\n  const col=C[t.color]||C[0];\n  const isGray=t.color===5;\n  const chk=el.querySelector('.wt-chk');\n  if(chk){\n    chk.className='wt-chk'+(t.done?' done':'');\n    chk.style.cssText=t.done\n      ? (isGray?`color:var(--tx2);border-color:var(--tx2);background:var(--tx2)`:`color:${col.dot};border-color:${col.dot};background:${col.dot}`)\n      : (isGray?`color:var(--tx2);border-color:var(--tx2);background:transparent`:`color:${col.dot};border-color:${col.dot};background:transparent`);\n  }\n  const txt=el.querySelector('.wt-txt');\n  if(txt) txt.className='wt-txt'+(t.done?' done':'');\n}\n\n// Patch a single goal item in-place inside the goals column\nfunction _patchGoalItem(g){\n  // Goal items are in the goals column, identified by onclick containing the id\n  const items=document.querySelectorAll('.wk-goal-item');\n  let el=null;\n  items.forEach(item=>{\n    if(item.getAttribute('onclick')&&item.getAttribute('onclick').includes(`openDetail(${g.id},`)) el=item;\n  });\n  if(!el) return;\n  const col=C[g.color]||C[0];\n  const chk=el.querySelector('.wg-chk');\n  if(chk){\n    chk.className='wg-chk'+(g.done?' done':'');\n    chk.style.cssText=`color:${col.dot};border-color:${col.dot};background:${g.done?col.dot:'transparent'}`;\n  }\n  const nm=el.querySelector('.wg-name');\n  if(nm) nm.className='wg-name'+(g.done?' done':'');\n}\nfunction delTask(id){\n  const t=tasks.find(x=>x.id===id);\n  if(t&&t.recurId&&tasks.filter(x=>x.recurId===t.recurId).length>1){\n    // Open detail first so dlDelete can handle the modal\n    detId=id;detIsGoal=false;detSource='task';\n    dlDelete();\n    return;\n  }\n  tasks=tasks.filter(t=>t.id!==id);_saveNow();\n  if(curView==='week'){\n    // Remove card in-place without rebuilding DOM\n    const card=document.querySelector(`.wk-body [data-id=\"${id}\"]`);\n    if(card){card.remove();renderMc();return;}\n  }\n  render();\n}\nfunction delGoal(id){\n  weekGoals=weekGoals.filter(g=>g.id!==id);saveGoals();\n  if(curView==='week'){\n    const items=document.querySelectorAll('.wk-goal-item');\n    items.forEach(item=>{\n      if(item.getAttribute('onclick')&&item.getAttribute('onclick').includes(`openDetail(${id},`)) item.remove();\n    });\n    renderMc();return;\n  }\n  render();\n}\n\n// ══════════════════════════════════════════════════════\n// DETAIL PANEL + RICH NOTES\n// ══════════════════════════════════════════════════════\nfunction openDetail(id,e,isGoal=false){\n  if(e)e.stopPropagation();closeColorPopup();\n  const item=isGoal?weekGoals.find(g=>g.id===id):tasks.find(t=>t.id===id);\n  if(!item||item.type==='divider')return;\n  detId=id;detIsGoal=isGoal;detSource=isGoal?'weekGoal':'task';dlEditMode=true;\n  const col=C[item.color]||C[0];\n  const chk=document.getElementById('dlChk');\n  chk.className='dl-chk'+(item.done?' done':'');\n  chk.style.borderColor=item.done?col.dot:col.dot;chk.style.color=col.dot;\n  if(item.done){chk.style.background=col.dot;chk.style.setProperty('--tick-color',tickColor(col));}\n  else{chk.style.background='transparent';chk.style.removeProperty('--tick-color');}\n  const ti=document.getElementById('dlTitl');\n  ti.value=item.text;ti.className='dl-titl'+(item.done?' done':'');\n  setTimeout(()=>autoR(ti),0);\n  // Date & times\n  const dateSec=document.getElementById('dlDate');\n  if(detSource==='task'){dateSec.value=item.date||'';dateSec.closest('.dl-meta-item').style.display='';}\n  else{dateSec.closest('.dl-meta-item').style.display='none';}\n  document.getElementById('dlStart').value=item.time||'';\n  document.getElementById('dlEnd').value=item.end||'';\n  setTimeout(_dlUpdateClearBtn,0);\n  // Color swatches\n  renderDlColors(item.color);\n  // Notes — now a simple block editor (same as Visualización)\n  dnRenderPanel();\n  // Recurrence\n  const recurRow=document.getElementById('dlRecurRow');\n  if(recurRow) recurRow.style.display=(item.type==='divider')?'none':'';\n  renderDlRecur(item.recur||null);\n  // Subtasks — shown for both tasks and goals\n  const subSec=document.getElementById('dlSubtasks');\n  subSec.style.display='';\n  renderDlSubtasks(item);\n  // Del button hide for goals — no, show always\n  document.getElementById('dlOv').classList.add('open');\n}\nfunction dlSetRecur(val){\n  const item=getDetItem();\n  if(!item||item.type==='divider')return;\n  if(val==='none'){\n    // Remove recurrence from this instance and all others in the series\n    if(item.recurId){\n      tasks.filter(t=>t.recurId===item.recurId).forEach(t=>{t.recur=null;t.recurId=null;});\n    } else {\n      item.recur=null;\n    }\n  } else {\n    // Assign recurId if first time setting recurrence on this task\n    if(!item.recurId){\n      item.recurId='r'+Date.now()+Math.random().toString(36).slice(2,6);\n    }\n    item.recur=val;\n    // Sync recur type to existing instances (but NOT done/notes/subtasks — those stay independent)\n    tasks.filter(t=>t.recurId===item.recurId&&t.id!==item.id).forEach(t=>{t.recur=val;t.recurId=item.recurId;});\n  }\n  save();\n  renderDlRecur(val==='none'?null:val);\n}\nfunction renderDlRecur(recur){\n  document.querySelectorAll('.dl-recur-opt').forEach(btn=>{\n    const v=btn.dataset.recur;\n    btn.classList.toggle('sel', (!recur&&v==='none')||(recur&&v===recur));\n  });\n}\nfunction renderDlColors(sel){\n  document.getElementById('dlColors').innerHTML=C.map((c,i)=>{\n    const isGray=i===5;\n    const bgStyle=isGray?'background:transparent;border:2.5px solid var(--tx2)':`background-image:${c.grad||'none'};background-color:${c.dot}`;\n    return `<div class=\"dl-sw${i===sel?' sel':''}\" style=\"${bgStyle};\" onclick=\"dlSetColor(${i})\"><\u002Fdiv>`;\n  }).join('');\n}\nfunction dlSetColor(i){\n  const item=getDetItem();\n  if(!item)return;item.color=i;saveDetArr();\n  renderDlColors(i);\n  const col=C[i];const chk=document.getElementById('dlChk');\n  chk.style.borderColor=col.dot;chk.style.color=col.dot;\n  if(item.done){chk.style.background=col.dot;chk.style.setProperty('--tick-color',tickColor(col));}\n  else{chk.style.background='transparent';chk.style.removeProperty('--tick-color');}\n}\nfunction dlToggle(){\n  const item=getDetItem();\n  if(!item)return;item.done=!item.done;saveDetArr();sfxCheck();\n  const col=C[item.color]||C[0];\n  const chk=document.getElementById('dlChk');\n  chk.className='dl-chk'+(item.done?' done':'');\n  chk.style.borderColor=col.dot;chk.style.color=col.dot;\n  if(item.done){chk.style.background=col.dot;chk.style.setProperty('--tick-color',tickColor(col));}\n  else{chk.style.background='transparent';chk.style.removeProperty('--tick-color');}\n  document.getElementById('dlTitl').className='dl-titl'+(item.done?' done':'');\n}\nfunction dlAutoSaveField(field, val){\n  if(detId===null) return;\n  const item=getDetItem();\n  if(!item) return;\n  if(field==='text'){ if(val.trim()) item.text=val.trim(); }\n  else if(field==='time'){ item.time=val.trim(); _dlUpdateClearBtn(); }\n  else if(field==='end'){ item.end=val.trim(); _dlUpdateClearBtn(); }\n  saveDetArr();\n}\nfunction _dlUpdateClearBtn(){\n  const btn=document.getElementById('dlClearTimes');\n  if(!btn) return;\n  const s=document.getElementById('dlStart')?.value||'';\n  const e=document.getElementById('dlEnd')?.value||'';\n  btn.style.opacity=(s||e)?'0.75':'0';\n  btn.style.pointerEvents=(s||e)?'auto':'none';\n}\nfunction dlClearTimes(){\n  const item=getDetItem();\n  if(!item) return;\n  item.time=''; item.end='';\n  document.getElementById('dlStart').value='';\n  document.getElementById('dlEnd').value='';\n  saveDetArr();\n  _dlUpdateClearBtn();\n  showToast('Horas eliminadas');\n}\nfunction dlToggleMode(){/* removed — live render */}\nfunction saveDl(){\n  const item=getDetItem();\n  if(!item)return;\n  const txt=document.getElementById('dlTitl').value.trim();\n  if(txt) item.text=txt;\n  // Notes are now block-based and auto-save as you type — nothing to sync here.\n  if(detSource==='task'){\n    const nd=document.getElementById('dlDate').value;if(nd)item.date=nd;\n    item.time=document.getElementById('dlStart').value.trim();\n    item.end=document.getElementById('dlEnd').value.trim();\n  }\n  saveDetArr();\n}\nfunction closeDetail(){\n  try{saveDl();}catch(e){}\n  const ov=document.getElementById('dlOv');\n  if(ov) ov.classList.remove('open');\n  detId=null;\n  render();\n}\nfunction dlDelete(){\n  const item=getDetItem();\n  if(!item) return;\n  if(item.recurId && tasks.filter(t=>t.recurId===item.recurId).length>1){\n    // Show recur delete modal\n    document.getElementById('recurDelOv').classList.add('open');\n    return;\n  }\n  // Normal single delete\n  const _da=getDetArr();\n  const _di=_da.indexOf(item);\n  if(_di>=0)_da.splice(_di,1);\n  // Immediate save for deletes\n  if(detSource==='monthGoal'){_safeWrite(STORE_KEYS.monthGoals,monthGoals);}\n  else if(detSource==='yearGoal'){_safeWrite(STORE_KEYS.yearGoals,yearGoals);}\n  else if(detSource==='weekGoal'||detIsGoal){_safeWrite(STORE_KEYS.goals,weekGoals);}\n  else{_saveNow();}\n  document.getElementById('dlOv').classList.remove('open');detId=null;render();showToast('Eliminado');\n}\nfunction closeRecurDel(){document.getElementById('recurDelOv').classList.remove('open');}\nfunction recurDelThis(){\n  // Delete only this instance\n  const item=getDetItem();\n  if(!item) return;\n  tasks=tasks.filter(t=>t.id!==item.id);\n  _saveNow();\n  closeRecurDel();\n  document.getElementById('dlOv').classList.remove('open');detId=null;render();showToast('Eliminado');\n}\nfunction recurDelAll(){\n  // Delete all instances of this series\n  const item=getDetItem();\n  if(!item) return;\n  const rid=item.recurId;\n  tasks=tasks.filter(t=>t.recurId!==rid);\n  _saveNow();\n  closeRecurDel();\n  document.getElementById('dlOv').classList.remove('open');detId=null;render();showToast('Serie eliminada');\n}\nfunction autoR(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}\n\n// ── SUBTASK MANAGEMENT ────────────────────────────────\nfunction renderDlSubtasks(item){\n  const list=document.getElementById('dlSubList');if(!list)return;\n  const subs=item.subtasks||[];\n  const col=C[item.color]||C[0];\n  list.innerHTML=subs.map((s,i)=>`\n    <div class=\"dl-subtask-item\">\n      <div class=\"dl-stchk${s.done?' done':''}\"\n        style=\"border-color:${col.dot};color:${col.dot};${s.done?`background:${col.dot};--tick-color:${tickColor(col)}`:'background:transparent'}\"\n        onclick=\"dlToggleSubtask(${i})\"><\u002Fdiv>\n      <input class=\"dl-st-txt${s.done?' done':''}\" value=\"${esc(s.text)}\" placeholder=\"Subtarea...\"\n        oninput=\"dlRenameSubtask(${i},this.value)\"\n        onkeydown=\"dlSubtaskKeyDown(event,${i})\"/>\n      <button class=\"dl-st-del\" onclick=\"dlDeleteSubtask(${i})\">&#215;<\u002Fbutton>\n    <\u002Fdiv>`).join('');\n}\nfunction dlAddSubtask(){\n  const item=getDetItem();\n  if(!item)return;\n  if(!item.subtasks)item.subtasks=[];\n  item.subtasks.push({text:'',done:false});\n  saveDetArr();\n  renderDlSubtasks(item);\n  const inputs=document.querySelectorAll('#dlSubList .dl-st-txt');\n  if(inputs.length) inputs[inputs.length-1].focus();\n}\nfunction dlSubtaskKeyDown(e,idx){\n  if(e.key==='Enter'){\n    e.preventDefault();\n    const item=getDetItem();\n    if(!item||!item.subtasks) return;\n    // Save current value first (oninput may not have fired for last char yet)\n    item.subtasks[idx].text=e.target.value;\n    // Insert new empty subtask right after this one\n    item.subtasks.splice(idx+1,0,{text:'',done:false});\n    saveDetArr();\n    renderDlSubtasks(item);\n    const inputs=document.querySelectorAll('#dlSubList .dl-st-txt');\n    if(inputs[idx+1]) inputs[idx+1].focus();\n  }\n}\nfunction dlToggleSubtask(idx){\n  const item=getDetItem();\n  if(!item||!item.subtasks)return;\n  item.subtasks[idx].done=!item.subtasks[idx].done;\n  saveDetArr();sfxCheck();renderDlSubtasks(item);\n}\nfunction dlDeleteSubtask(idx){\n  const item=getDetItem();\n  if(!item||!item.subtasks)return;\n  item.subtasks.splice(idx,1);saveDetArr();renderDlSubtasks(item);\n}\nfunction dlRenameSubtask(idx,val){\n  const item=getDetItem();\n  if(!item||!item.subtasks)return;\n  item.subtasks[idx].text=val;saveDetArr();\n}\nfunction toggleSubExpand(id){\n  const t=tasks.find(t=>t.id===id);if(!t)return;\n  t._subExpanded=!t._subExpanded;\n  // Don't save _subExpanded (UI state only) — just re-render\n  render();\n}\nfunction toggleSubtask(tid,idx){\n  const t=tasks.find(t=>t.id===tid);if(!t||!t.subtasks)return;\n  t.subtasks[idx].done=!t.subtasks[idx].done;\n  save();sfxCheck();render();\n}\n\n// ── MARKDOWN RENDER ───────────────────────────────────\nfunction renderMd(raw){\n  if(!raw) return '';\n  const lines=raw.split('\\n');\n  let out='',inUl=false,inOl=false;\n  const closeList=()=>{if(inUl){out+='<\u002Ful>';inUl=false;}if(inOl){out+='<\u002Fol>';inOl=false;}};\n  lines.forEach(line=>{\n    if(/^### /.test(line)){closeList();out+=`<h3>${esc(line.slice(4))}<\u002Fh3>`;return;}\n    if(/^## /.test(line)){closeList();out+=`<h2>${esc(line.slice(3))}<\u002Fh2>`;return;}\n    if(/^# /.test(line)){closeList();out+=`<h1>${esc(line.slice(2))}<\u002Fh1>`;return;}\n    if(/^\\- \\[(x| )\\] /.test(line)){\n      closeList();\n      const checked=line[3]==='x';\n      const text=esc(line.slice(6));\n      out+=`<div class=\"cb-item\"><div class=\"cb-box${checked?' chk':''}\">${checked?'✓':''}<\u002Fdiv><span class=\"${checked?'cb-done':''}\">${text}<\u002Fspan><\u002Fdiv>`;\n      return;\n    }\n    if(/^- /.test(line)||/^\\* /.test(line)){if(!inUl){if(inOl){out+='<\u002Fol>';inOl=false;}out+='<ul>';inUl=true;}out+=`<li>${esc(line.slice(2))}<\u002Fli>`;return;}\n    if(/^\\d+\\. /.test(line)){if(!inOl){if(inUl){out+='<\u002Ful>';inUl=false;}out+='<ol>';inOl=true;}out+=`<li>${esc(line.replace(/^\\d+\\. /,''))}<\u002Fli>`;return;}\n    closeList();\n    if(line.trim()===''){out+='<br>';return;}\n    out+=`<p style=\"margin:0\">${esc(line)}<\u002Fp>`;\n  });\n  closeList();\n  return out;\n}\n\n// ── SLASH COMMAND ─────────────────────────────────────\nconst SLASH_CMDS=[\n  {icon:'H1',label:'Título 1',hint:'#',insert:'# '},\n  {icon:'H2',label:'Título 2',hint:'##',insert:'## '},\n  {icon:'H3',label:'Título 3',hint:'###',insert:'### '},\n  {icon:'—',label:'Lista',hint:'-',insert:'- '},\n  {icon:'1.',label:'Lista numerada',hint:'1.',insert:'1. '},\n  {icon:'☐',label:'Subtarea',hint:'- [ ]',insert:'- [ ] '},\n  {icon:'☑',label:'Subtarea marcada',hint:'- [x]',insert:'- [x] '},\n];\nlet slashSelIdx=0;\nfunction openSlash(ta){\n  const popup=document.getElementById('slashPopup');\n  popup.innerHTML=SLASH_CMDS.map((c,i)=>`\n    <div class=\"slash-item${i===slashSelIdx?' sel':''}\" onmousedown=\"insertSlash(${i})\">\n      <div class=\"slash-icon\">${c.icon}<\u002Fdiv>\n      <span class=\"slash-label\">${c.label}<\u002Fspan>\n      <span class=\"slash-hint\">${c.hint}<\u002Fspan>\n    <\u002Fdiv>`).join('');\n  const rect=ta.getBoundingClientRect();\n  popup.style.top=(rect.top-4-Math.min(SLASH_CMDS.length,5)*44)+'px';\n  popup.style.left=rect.left+'px';\n  popup.classList.add('open');\n}\nfunction closeSlash(){document.getElementById('slashPopup').classList.remove('open');slashSelIdx=0;}\nfunction insertSlashLive(idx){\n  const live=document.getElementById('dlNotesLive');\n  if(!live) return;\n  const cmd=SLASH_CMDS[idx];\n  // Remove the trailing slash\n  const sel=window.getSelection();\n  if(sel&&sel.rangeCount){\n    const range=sel.getRangeAt(0);\n    const node=range.startContainer;\n    const text=node.textContent||'';\n    const pos=range.startOffset;\n    const slashIdx=text.lastIndexOf('/',pos);\n    if(slashIdx>=0){\n      const r2=document.createRange();\n      r2.setStart(node,slashIdx);r2.setEnd(node,pos);\n      r2.deleteContents();\n      sel.removeAllRanges();sel.addRange(r2);\n    }\n  }\n  const c=cmd.icon;\n  if(c==='H1') dlNtBlock('h1');\n  else if(c==='H2') dlNtBlock('h2');\n  else if(c==='H3') dlNtBlock('h3');\n  else if(c==='—') dlNtBlock('ul');\n  else if(c==='1.') dlNtBlock('ol');\n  else if(c==='☐'||c==='☑') dlNtInsertCb();\n  else document.execCommand('insertText',false,cmd.insert);\n  closeSlash();_slashOpen=false;\n  setTimeout(()=>{const item=getDetItem();if(item&&live){item.notes=live.innerHTML;saveDetArr();}},200);\n}\nfunction insertSlash(idx){\n  // Use live div if available\n  const live=document.getElementById('dlNotesLive');\n  if(live&&document.activeElement!==live){live.focus();}\n  if(live) {insertSlashLive(idx);return;}\n  const ta=document.getElementById('dlNotesEditor');\n  const cmd=SLASH_CMDS[idx];\n  const pos=ta.selectionStart;\n  const val=ta.value;\n  const before=val.slice(0,pos).replace(/\\/[^\\n]*$/,'');\n  const after=val.slice(pos);\n  ta.value=before+cmd.insert+after;\n  const newPos=before.length+cmd.insert.length;\n  ta.selectionStart=ta.selectionEnd=newPos;\n  ta.focus();closeSlash();\n}\nlet _slashOpen=false;\ndocument.addEventListener('DOMContentLoaded',()=>{\n  // Restore sidebar state\n  const sb=document.getElementById('sidebar');\n  if(sb&&!sidebarOpen) sb.classList.add('collapsed');\n  // Close the detail panel with Escape, regardless of which block is focused\n  document.getElementById('dlOv')?.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});\n});\ndocument.addEventListener('click',e=>{if(!e.target.closest('#slashPopup')&&!e.target.closest('#dlNotesLive')){closeSlash();_slashOpen=false;}});\n\n// ── ADD MODAL ─────────────────────────────────────────\nfunction openGoalModal(wkKey){\n  moIsGoal=true;moTarget=wkKey;\n  document.getElementById('moTitle').textContent='Nuevo objetivo';\n  document.getElementById('moText').value='';document.getElementById('moTime').value='';\n  renderCrRow();document.getElementById('moOv').classList.add('open');\n  setTimeout(()=>document.getElementById('moText').focus(),80);\n}\nfunction openModal(dateStr=null){\n  moIsGoal=false;\n  if(!dateStr){\n    if(curView==='week'){const d=getWkDates(viewOffset);dateStr=dk(d[0]);}\n    else if(curView==='wcal'){const d=getWcalDates(wcalDayOffset);dateStr=dk(d[0]);}\n    else if(curView==='day'){dateStr=dk(getCurDay());}\n    else{dateStr=dk(today);}\n  }\n  moTarget=dateStr;\n  document.getElementById('moTitle').textContent='Nueva tarea';\n  document.getElementById('moText').value='';document.getElementById('moTime').value='';\n  renderCrRow();document.getElementById('moOv').classList.add('open');\n  setTimeout(()=>document.getElementById('moText').focus(),80);\n}\nfunction closeMo(){document.getElementById('moOv').classList.remove('open');}\nfunction renderCrRow(){\n  document.getElementById('crRow').innerHTML=C.map((c,i)=>{\n    const isGray=i===5;\n    const bgStyle=isGray?'background:transparent;border:2.5px solid var(--tx2)':`background-image:${c.grad||'none'};background-color:${c.dot}`;\n    return `<div class=\"cr-sw${i===selColor?' sel':''}\" style=\"${bgStyle};\" onclick=\"pickC(${i})\"><\u002Fdiv>`;\n  }).join('');\n}\nfunction pickC(i){selColor=i;renderCrRow();}\nfunction addTask(){\n  const text=document.getElementById('moText').value.trim();if(!text){document.getElementById('moText').focus();return;}\n  const time=document.getElementById('moTime').value.trim();\n  const end=time?m2t((t2m(time)||0)+60):'';\n  if(moIsGoal){\n    weekGoals.push({id:nid++,text,color:selColor,done:false,weekKey:moTarget,notes:''});saveGoals();\n  } else {\n    tasks.push({id:nid++,text,date:moTarget,time,end,color:selColor,done:false,notes:''});save();\n  }\n  closeMo();render();sfxAdd();showToast('Añadido ✓');\n}\n\n// ── MINI CAL ──────────────────────────────────────────\nfunction renderMc(){\n  const d=new Date(today.getFullYear(),today.getMonth()+mcOffset,1);\n  document.getElementById('mcTitle').textContent=MO[d.getMonth()].slice(0,3)+' '+d.getFullYear();\n  const first=d.getDay()===0?6:d.getDay()-1;\n  const days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();\n  const tDates=new Set(tasks.map(t=>t.date));\n  let h=DS.map(dd=>`<div class=\"mc-dn\">${dd[0]}<\u002Fdiv>`).join('');\n  for(let i=0;i<first;i++)h+=`<div class=\"mc-d\"><\u002Fdiv>`;\n  for(let dd=1;dd<=days;dd++){\n    const cd=new Date(d.getFullYear(),d.getMonth(),dd);const dkey=dk(cd);\n    const isTd=dd===today.getDate()&&d.getMonth()===today.getMonth()&&mcOffset===0;\n    h+=`<div class=\"mc-d${isTd?' today':''}${tDates.has(dkey)?' has-t':''}\" onclick=\"jumpToDay('${dkey}')\">${dd}<\u002Fdiv>`;\n  }\n  document.getElementById('mcGrid').innerHTML=h;\n}\nfunction mcPrev(){mcOffset--;renderMc();}\nfunction mcNext(){mcOffset++;renderMc();}\nfunction jumpToDay(dkey){\n  setView('day');\n  const d=dkToDate(dkey);\n  const diffMs=d-new Date(today.getFullYear(),today.getMonth(),today.getDate());\n  viewOffset=Math.round(diffMs/86400000);\n  render();\n}\n\n// ── BACKUP ────────────────────────────────────────────\nasync function exportData(){\n  await _flushAll();\n  const vd=vsData||await loadVision()||vsDefaultData();\n  const payload={\n    v:STORE_VERSION,\n    exported:new Date().toISOString(),\n    tasks,\n    weekGoals,\n    monthGoals,\n    yearGoals,\n    habits,\n    focusSessions,\n    apData,\n    objetivos,\n    vsData:vd,\n    settings:{\n      dark:isDark,\n      moBg,\n      homeBg\n    }\n  };\n  showToast('Preparando descarga…');\n  setTimeout(()=>{\n    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});\n    const url=URL.createObjectURL(blob);const a=document.createElement('a');\n    const filename=`victor-os-backup-${dk(today)}.json`;\n    a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);\n    showToast('Copia de seguridad guardada ↓');\n  },100);\n}\nfunction importData(e){\n  const file=e.target.files[0];if(!file)return;\n  const reader=new FileReader();\n  reader.onload=ev=>{\n    try{\n      const raw=ev.target.result;\n      const parsed=JSON.parse(raw);\n      if(parsed.encrypted){\n        // Can't handle encrypted from old import button — redirect to settings\n        showToast('Archivo cifrado: usa Ajustes → Copia de seguridad');\n      } else {\n        _applyImportData(parsed);\n      }\n    }catch(err){showToast('Error al importar — archivo no válido');}\n    e.target.value='';\n  };\n  reader.readAsText(file);\n}\n\n// ── UTILS ─────────────────────────────────────────────\nfunction showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}\nfunction esc(s){return String(s).replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;');}\n\n// ── KEYBOARD ──────────────────────────────────────────\ndocument.addEventListener('keydown',e=>{\n  if(e.key==='Escape'){if(document.getElementById('dlOv').classList.contains('open'))closeDetail();else closeMo();}\n  if((e.ctrlKey||e.metaKey)&&e.key==='n'){e.preventDefault();openModal();}\n  if((e.ctrlKey||e.metaKey)&&e.key==='d'){e.preventDefault();toggleDark();}\n});\ndocument.getElementById('moText').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});\n\n\n// ── BACKGROUND PICKER ─────────────────────────────────\n\n\n// ── BACKGROUND PICKER (month only) ────────────────────────────\nconst BG_PRESETS=[\n  {v:'none'},\n  {v:'https://images.unsplash.com/photo-1448375240586-882707db888b?w=1400&q=80'},\n  {v:'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1400&q=80'},\n  {v:'https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?w=1400&q=80'},\n  {v:'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1400&q=80'},\n  {v:'https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=1400&q=80'},\n  {v:'https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=1400&q=80'},\n  {v:'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=1400&q=80'},\n];\nlet moBg=localStorage.getItem(STORE_KEYS.mobg)||'none';\n\nfunction applyMoBg(val){\n  moBg=val;localStorage.setItem(STORE_KEYS.mobg,val);\n  // Use a persistent fixed layer attached to .main (never destroyed on render)\n  let layer=document.getElementById('moBgLayer');\n  if(!layer){\n    layer=document.createElement('div');\n    layer.id='moBgLayer';\n    layer.style.cssText='position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none;';\n    const mainEl=document.querySelector('.main');\n    if(mainEl){mainEl.style.position='relative';mainEl.insertBefore(layer,mainEl.firstChild);}\n  }\n  if(!val||val==='none'){\n    layer.style.backgroundImage='none';\n    layer.style.display='none';\n  } else {\n    layer.style.backgroundImage=`url('${val}')`;\n    layer.style.display='';\n  }\n  // Make mainContent sit above the bg layer\n  const contentDiv=document.getElementById('mainContent');\n  if(contentDiv) contentDiv.style.position='relative';\n  // Also ensure the topbar sits above\n  const topbar=document.querySelector('.topbar');\n  if(topbar) topbar.style.position='relative';\n  renderBgSwatches();\n}\nfunction toggleBgPicker(){document.getElementById('bgPicker')?.classList.toggle('open');}\nfunction renderBgSwatches(){\n  const grid=document.getElementById('bgSwatchGrid');if(!grid)return;\n  grid.innerHTML=BG_PRESETS.map(bg=>{\n    const sel=moBg===bg.v;\n    if(bg.v==='none') return `<div class=\"bg-swatch none${sel?' sel':''}\" onclick=\"applyMoBg('none');toggleBgPicker()\">&#8709;<\u002Fdiv>`;\n    return `<div class=\"bg-swatch${sel?' sel':''}\" style=\"background-image:url('${bg.v}')\" onclick=\"applyMoBg('${bg.v}');toggleBgPicker()\"><\u002Fdiv>`;\n  }).join('');\n}\nfunction bgUpload(e){\n  const f=e.target.files[0];if(!f)return;\n  const r=new FileReader();r.onload=ev=>{applyMoBg(ev.target.result);toggleBgPicker();};r.readAsDataURL(f);\n}\nfunction initMoBg(){\n  renderBgSwatches();\n  if(moBg&&moBg!=='none') setTimeout(()=>applyMoBg(moBg),50);\n}\ndocument.addEventListener('click',e=>{\n  const p=document.getElementById('bgPicker'),f=document.getElementById('fabBg');\n  if(p&&f&&!p.contains(e.target)&&!f.contains(e.target)) p.classList.remove('open');\n});\n\n\n// ══════════════════════════════════════════════════════\n// HABIT TRACKER\n// ══════════════════════════════════════════════════════\nfunction loadHabits(){return _safeRead(STORE_KEYS.habits,[]);}\nfunction saveHabits(){_safeWrite(STORE_KEYS.habits,habits);}\nfunction loadSleepData(){return _safeRead(STORE_KEYS.sleep,{});}\nfunction saveSleepData(){_safeWrite(STORE_KEYS.sleep,sleepData);}\nlet habits=loadHabits();\nif(!habits.length){\n  habits=[\n    {id:2001,name:'Ejercicio',color:'#8b7cf6',checks:{}},\n    {id:2002,name:'Leer',color:'#5a93d4',checks:{}},\n    {id:2003,name:'Meditación',color:'#43a873',checks:{}},\n  ];saveHabits();\n}\nlet nHid=Math.max(...habits.map(hb=>hb.id),2000)+1;\nlet sleepData=loadSleepData(); // {dateKey: hours} e.g. {'2026-04-12': 7}\n\n// ── HABITS WEEK OFFSET ────────────────────────────────\nlet htWeekOffset=0;\nlet wcalUnschedOpen=true;\n\nfunction renderHabits(){\n  const c=document.getElementById('mainContent');\n  const wkDates=getWkDates(htWeekOffset);\n  const todayKey=dk(today);\n  const isCurrentWk=htWeekOffset===0;\n  const wkSt  const isTd=key===todayKey;\n    const ideal=val&&+val>=7&&+val<=9;\n    const outRng=val&&(+val<7||+val>9);\n    html+=`<div class=\"ht-sleep-cell${isTd?' ht-today':''}\">\n      <select class=\"ht-sleep-sel\" onchange=\"htSleepSet('${key}',this.value)\">\n        ${sleepOptions.map(o=>`<option value=\"${o}\"${o==val?' selected':''}>${o?o+'h':'–'}<\u002Foption>`).join('')}\n      <\u002Fselect>\n    <\u002Fdiv>`;\n  });\n  html+=`<div class=\"ht-sleep-cell\"><\u002Fdiv><\u002Fdiv>`;\n\n  html+=`<\u002Fdiv>`;\n\n  // ── ANALYTICS SECTION ──────────────────────────────────\n  // Build data for charts\n  const today2=new Date(); today2.setHours(0,0,0,0);\n  // Last 14 days for line chart\n  const last14=[]; for(let i=13;i>=0;i--){const d=new Date(today2);d.setDate(d.getDate()-i);last14.push(d);}\n  const lineData=last14.map(d=>{\n    const key=dk(d);\n    const total=habits.length; if(!total) return {date:d,pct:0,key};\n    const done=habits.filter(h=>!!h.checks[key]).length;\n    return {date:d,pct:Math.round(done/total*100),key};\n  });\n  // Stats\n  const todayPct=lineData[lineData.length-1].pct;\n  const avg14=lineData.length?Math.round(lineData.reduce((a,b)=>a+b.pct,0)/lineData.length):0;\n  const bestDay=lineData.reduce((a,b)=>b.pct>a.pct?b:a,lineData[0]||{pct:0});\n  const streak7=lineData.slice(-7).filter(d=>d.pct>=50).length;\n  // Consistency grid: last 10 weeks (70 days)\n  const cgDays=70; const cgArr=[];\n  for(let i=cgDays-1;i>=0;i--){const d=new Date(today2);d.setDate(d.getDate()-i);const key=dk(d);const total=habits.length;const done=habits.filter(h=>!!h.checks[key]).length;cgArr.push({pct:total?Math.round(done/total*100):0,key,d});}\n  // Radar: % per habit last 14 days — use lineData which has .key\n  const radarAxes=habits.slice(0,6).map(h=>{const done=lineData.filter(d=>!!h.checks[d.key]).length;return{name:h.name,color:h.color,pct:Math.round(done/lineData.length*100)};});\n  // Week progress\n  const wkDates2=getWkDates(0); // current week\n  const wkProgress=wkDates2.map(d=>{const key=dk(d);const total=habits.length;const done=habits.filter(h=>!!h.checks[key]).length;return{d,pct:total?Math.round(done/total*100):0,done,total};});\n  // Sleep last 14 days\n  const sleepArr=last14.map(d=>{const key=dk(d);return{d,h:sleepData[key]||null};});\n  const sleepFilled=sleepArr.filter(s=>s.h!==null);\n  const sleepAvg=sleepFilled.length?Math.round(sleepFilled.reduce((a,b)=>a+b.h,0)/sleepFilled.length*10)/10:0;\n  const sleepMax=sleepFilled.length?Math.max(...sleepFilled.map(s=>s.h)):8;\n\n  // ── LINE CHART SVG ──\n  const lcW=500,lcH=90;\n  const pts=lineData.map((d,i)=>({x:i/(lineData.length-1||1)*lcW,y:lcH-(d.pct/100)*lcH}));\n  const linePathD=pts.map((p,i)=>i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`).join(' ');\n  const areaPathD=pts.map((p,i)=>i===0?`M${p.x},${lcH}`:`L${p.x-1},${pts[i-1].y} L${p.x},${p.y}`).join(' ')+` L${pts[pts.length-1]?.x||0},${lcH} Z`;\n  const areaD=`M${pts[0]?.x||0},${lcH} `+pts.map(p=>`L${p.x},${p.y}`).join(' ')+` L${pts[pts.length-1]?.x||0},${lcH} Z`;\n  // ── WEEK BAR CHART ──\n  const wkBarW=360,wkBarH=80;\n  const wkDayLabels=['L','M','X','J','V','S','D'];\n  const wkBars=wkProgress.map((w,i)=>{\n    const bW=36,bGap=10,bX=i*(bW+bGap);\n    const dayIdx=w.d.getDay()===0?6:w.d.getDay()-1;\n    const isToday=dk(w.d)===todayKey;\n    const barH=Math.max(4,Math.round(w.pct/100*wkBarH));\n    const barY=wkBarH-barH;\n    return `<g>\n      <rect x=\"${bX}\" y=\"0\" width=\"${bW}\" height=\"${wkBarH}\" rx=\"6\" fill=\"var(--s2)\" opacity=\".5\"/>\n      <rect x=\"${bX}\" y=\"${barY}\" width=\"${bW}\" height=\"${barH}\" rx=\"6\" fill=\"${isToday?'var(--red)':'#497faa'}\" opacity=\"${isToday?'1':'0.85'}\"/>\n      <text x=\"${bX+bW/2}\" y=\"${wkBarH+13}\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--tx3)\" font-family=\"var(--font)\" font-weight=\"${isToday?'700':'400'}\">${wkDayLabels[dayIdx]}<\u002Ftext>\n      <text x=\"${bX+bW/2}\" y=\"${barY-4}\" text-anchor=\"middle\" font-size=\"8\" fill=\"var(--tx2)\" font-family=\"var(--font)\">${w.pct?w.pct+'%':''}<\u002Ftext>\n    <\u002Fg>`;\n  }).join('');\n  const wkTotalW=(36+10)*7-10;\n  // ── SLEEP BAR CHART ──\n  const slW=500,slH=80;\n  const slMax=Math.max(sleepMax,10);\n  const slBW=Math.floor(slW/14)-3;\n  const slBars=sleepArr.map((s,i)=>{\n    const x=i*(slBW+3);\n    const barH=s.h!==null?Math.max(4,Math.round((s.h/slMax)*slH)):0;\n    const barY=slH-barH;\n    const ideal=s.h!==null&&s.h>=7&&s.h<=9;\n    const col=s.h===null?'var(--s2)':ideal?'#497faa':'var(--red)';\n    return `<g>\n      <rect x=\"${x}\" y=\"${slH-2}\" width=\"${slBW}\" height=\"2\" rx=\"1\" fill=\"var(--s3)\" opacity=\".5\"/>\n      ${s.h!==null?`<rect x=\"${x}\" y=\"${barY}\" width=\"${slBW}\" height=\"${barH}\" rx=\"3\" fill=\"${col}\" opacity=\".85\"/>`:''}\n      ${i%2===0?`<text x=\"${x+slBW/2}\" y=\"${slH+12}\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--tx3)\" font-family=\"var(--font)\">${s.d.getDate()}<\u002Ftext>`:''}\n      ${s.h!==null?`<text x=\"${x+slBW/2}\" y=\"${Math.max(barY-3,8)}\" text-anchor=\"middle\" font-size=\"8\" fill=\"var(--tx2)\" font-family=\"var(--font)\">${s.h}h<\u002Ftext>`:''}\n    <\u002Fg>`;\n  }).join('');\n  // ── RADAR SVG ──\n  function buildRadar(axes){\n    if(!axes.length) return '<text x=\"100\" y=\"100\" text-anchor=\"middle\" fill=\"var(--tx3)\" font-size=\"12\" font-family=\"var(--font)\">Sin hábitos<\u002Ftext>';\n    const cx=100,cy=100,r=72,n=axes.length;\n    const rings=[0.25,0.5,0.75,1];\n    let out='';\n    rings.forEach(function(f){\n      const ringPts=axes.map(function(_,i){const a=Math.PI*2*i/n-Math.PI/2;return (cx+r*f*Math.cos(a)).toFixed(2)+','+(cy+r*f*Math.sin(a)).toFixed(2);}).join(' ');\n      out+=`<polygon points=\"${ringPts}\" fill=\"none\" stroke=\"var(--b2)\" stroke-width=\"${f===1?1:.5}\"/>`;\n    });\n    axes.forEach(function(_,i){const a=Math.PI*2*i/n-Math.PI/2;out+=`<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${(cx+r*Math.cos(a)).toFixed(2)}\" y2=\"${(cy+r*Math.sin(a)).toFixed(2)}\" stroke=\"var(--b2)\" stroke-width=\".5\"/>`;});\n    const dataPts=axes.map(function(ax,i){const a=Math.PI*2*i/n-Math.PI/2;const f=Math.max(0.01,ax.pct/100);return (cx+r*f*Math.cos(a)).toFixed(2)+','+(cy+r*f*Math.sin(a)).toFixed(2);}).join(' ');\n    out+=`<polygon points=\"${dataPts}\" fill=\"var(--red)\" fill-opacity=\".18\" stroke=\"var(--red)\" stroke-width=\"1.5\"/>`;\n    axes.forEach(function(ax,i){const a=Math.PI*2*i/n-Math.PI/2;const f=Math.max(0.01,ax.pct/100);out+=`<circle cx=\"${(cx+r*f*Math.cos(a)).toFixed(2)}\" cy=\"${(cy+r*f*Math.sin(a)).toFixed(2)}\" r=\"3.5\" fill=\"var(--red)\"/>`;});\n    axes.forEach(function(ax,i){\n      const a=Math.PI*2*i/n-Math.PI/2;\n      const lx=cx+(r+20)*Math.cos(a), ly=cy+(r+20)*Math.sin(a);\n      const anchor=lx<cx-5?'end':lx>cx+5?'start':'middle';\n      const nm=ax.name.length>9?ax.name.slice(0,9)+'…':ax.name;\n      out+=`<text x=\"${lx.toFixed(2)}\" y=\"${(ly+4).toFixed(2)}\" text-anchor=\"${anchor}\" font-size=\"10\" fill=\"var(--tx2)\" font-family=\"var(--font)\">${nm}<\u002Ftext>`;\n    });\n    return out;\n  }\n\n  // Color for consistency cell\n  function cgColor(pct){\n    if(pct===0) return 'var(--s3)';\n    if(pct<40) return 'rgba(91,110,240,.2)';\n    if(pct<70) return 'rgba(91,110,240,.5)';\n    return 'var(--accent)';\n  }\n  const cgCells=cgArr.map(c=>`<div class=\"ht-cg-cell\" style=\"background:${cgColor(c.pct)}\" title=\"${c.key}: ${c.pct}%\"><\u002Fdiv>`).join('');\n\n  html+=`\n  <div class=\"ht-analytics-wrap\">\n    <!-- KPI NUMBERS ROW -->\n    <div class=\"ht-kpi-row\">\n      <div class=\"ht-kpi\">\n        <div class=\"ht-kpi-val\" style=\"color:var(--red)\">${todayPct}<span class=\"ht-kpi-unit\">%<\u002Fspan><\u002Fdiv>\n        <div class=\"ht-kpi-lbl\">hoy<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ht-kpi-sep\"><\u002Fdiv>\n      <div class=\"ht-kpi\">\n        <div class=\"ht-kpi-val\">${avg14}<span class=\"ht-kpi-unit\">%<\u002Fspan><\u002Fdiv>\n        <div class=\"ht-kpi-lbl\">media 14d<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ht-kpi-sep\"><\u002Fdiv>\n      <div class=\"ht-kpi\">\n        <div class=\"ht-kpi-val\">${bestDay.pct}<span class=\"ht-kpi-unit\">%<\u002Fspan><\u002Fdiv>\n        <div class=\"ht-kpi-lbl\">mejor día<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ht-kpi-sep\"><\u002Fdiv>\n      <div class=\"ht-kpi\">\n        <div class=\"ht-kpi-val\">${streak7}<span class=\"ht-kpi-unit\">/7<\u002Fspan><\u002Fdiv>\n        <div class=\"ht-kpi-lbl\">días ≥50% esta sem.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ht-kpi-sep\"><\u002Fdiv>\n      <div class=\"ht-kpi\">\n        <div class=\"ht-kpi-val\">${habits.length}<\u002Fdiv>\n        <div class=\"ht-kpi-lbl\">hábitos activos<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ht-kpi-sep\"><\u002Fdiv>\n      <div class=\"ht-kpi\">\n        <div class=\"ht-kpi-val\">${sleepAvg||'–'}<span class=\"ht-kpi-unit\">${sleepAvg?'h':''}<\u002Fspan><\u002Fdiv>\n        <div class=\"ht-kpi-lbl\">sueño media<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- CHARTS GRID -->\n    <div class=\"ht-adv-grid\">\n      <!-- LINE CHART — full width -->\n      <div class=\"ht-adv-card full\">\n        <div class=\"ht-adv-ttl\">% Hábitos completados<\u002Fdiv>\n        <div class=\"ht-adv-sub\">Últimos 14 días<\u002Fdiv>\n        <div class=\"ht-chart-inner\" style=\"min-height:90px;overflow:visible\">\n          <svg viewBox=\"-32 -8 ${lcW+40} ${lcH+28}\" width=\"100%\" preserveAspectRatio=\"none\" style=\"overflow:visible\">\n            <defs>\n              <linearGradient id=\"lcGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                <stop offset=\"0%\" stop-color=\"var(--red)\" stop-opacity=\"0.12\"/>\n                <stop offset=\"100%\" stop-color=\"var(--red)\" stop-opacity=\"0.0\"/>\n              <\u002FlinearGradient>\n            <\u002Fdefs>\n            <!-- Grid lines -->\n            ${[25,50,75,100].map(v=>{const y=lcH-(v/100)*lcH;return `<line x1=\"0\" y1=\"${y}\" x2=\"${lcW}\" y2=\"${y}\" stroke=\"var(--b1)\" stroke-width=\".5\" stroke-dasharray=\"3 5\"/><text x=\"-8\" y=\"${y+3.5}\" text-anchor=\"end\" font-size=\"7.5\" fill=\"var(--tx3)\" font-family=\"var(--font)\" opacity=\".65\">${v}%<\u002Ftext>`;}).join('')}\n            <!-- Area fill -->\n            <path d=\"${areaD}\" fill=\"url(#lcGrad)\"/>\n            <!-- Line — thinner, 1px -->\n            <path d=\"${linePathD}\" fill=\"none\" stroke=\"var(--red)\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" opacity=\".85\"/>\n            <!-- Dots — smaller -->\n            ${pts.map((p,i)=>{const d=lineData[i];const isToday=i===lineData.length-1;return `<circle cx=\"${p.x}\" cy=\"${p.y}\" r=\"${isToday?3:1.5}\" fill=\"${isToday?'var(--red)':'var(--surface)'}\" stroke=\"var(--red)\" stroke-width=\"1\"/>${isToday?`<text x=\"${p.x}\" y=\"${p.y-7}\" text-anchor=\"middle\" font-size=\"7.5\" font-weight=\"600\" fill=\"var(--red)\" font-family=\"var(--font)\">${d.pct}%<\u002Ftext>`:''}`;}).join('')}\n            <!-- X-axis date labels -->\n            ${lineData.map((d,i)=>{if(i%2!==0&&i!==lineData.length-1)return '';const x=i/(lineData.length-1||1)*lcW;return `<text x=\"${x}\" y=\"${lcH+13}\" text-anchor=\"middle\" font-size=\"7.5\" fill=\"var(--tx3)\" font-family=\"var(--font)\" opacity=\".7\">${d.date.getDate()}<\u002Ftext>`;}).join('')}\n          <\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- CONSISTENCY HEATMAP — 1/3 -->\n      <div class=\"ht-adv-card\">\n        <div class=\"ht-adv-ttl\">Mapa de consistencia<\u002Fdiv>\n        <div class=\"ht-adv-sub\">Últimas 10 semanas<\u002Fdiv>\n        <div class=\"ht-consistency-grid\" style=\"grid-template-columns:repeat(${cgDays/7},1fr);margin-bottom:6px\">\n          ${cgCells}\n        <\u002Fdiv>\n        <div class=\"ht-cg-legend\">\n          <div class=\"ht-cg-swatch\" style=\"background:var(--s3)\"><\u002Fdiv><span>0%<\u002Fspan>\n          <div class=\"ht-cg-swatch\" style=\"background:rgba(91,110,240,.25)\"><\u002Fdiv><span>&lt;40<\u002Fspan>\n          <div class=\"ht-cg-swatch\" style=\"background:rgba(91,110,240,.55)\"><\u002Fdiv><span>&lt;70<\u002Fspan>\n          <div class=\"ht-cg-swatch\" style=\"background:var(--accent)\"><\u002Fdiv><span>100%<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- RADAR — 1/3 -->\n      <div class=\"ht-adv-card\">\n        <div class=\"ht-adv-ttl\">Balance de áreas vitales<\u002Fdiv>\n        <div class=\"ht-adv-sub\">Radar · últimos 14 días<\u002Fdiv>\n        <div style=\"display:flex;justify-content:center;align-items:center;flex:1;padding:4px 0\">\n          <svg viewBox=\"0 0 200 200\" width=\"160\" height=\"160\" xmlns=\"http://www.w3.org/2000/svg\">\n            ${buildRadar(radarAxes)}\n          <\u002Fsvg>\n        <\u002Fdiv>\n        ${radarAxes.length===0?`<div style=\"font-size:11px;color:var(--tx3);text-align:center;padding:6px\">Añade hábitos para ver el radar<\u002Fdiv>`:''}\n      <\u002Fdiv>\n\n      <!-- WEEK PROGRESS BAR CHART — 1/3 -->\n      <div class=\"ht-adv-card\">\n        <div class=\"ht-adv-ttl\">Progreso de la semana<\u002Fdiv>\n        <div class=\"ht-adv-sub\">% completado · semana actual<\u002Fdiv>\n        <div class=\"ht-chart-inner\" style=\"min-height:100px;justify-content:center;overflow:visible\">\n          <svg viewBox=\"0 0 ${wkTotalW} ${wkBarH+20}\" width=\"100%\" preserveAspectRatio=\"xMidYMid meet\" style=\"overflow:visible\">\n            ${wkBars}\n          <\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SLEEP CHART — full width -->\n      <div class=\"ht-adv-card full\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px\">\n          <div class=\"ht-adv-ttl\">Registro del sueño<\u002Fdiv>\n          ${sleepAvg?`<span style=\"font-size:11px;color:var(--tx2);font-family:var(--mono)\">${sleepAvg}h media<\u002Fspan>`:''}\n        <\u002Fdiv>\n        <div class=\"ht-adv-sub\">Últimas 2 semanas · azul = ideal (7-9h) · rojo = fuera de rango · registra horas en la tabla de abajo<\u002Fdiv>\n        <div class=\"ht-chart-inner\" style=\"min-height:100px;overflow:visible\">\n          <svg viewBox=\"0 0 ${slW} ${slH+16}\" width=\"100%\" preserveAspectRatio=\"none\" style=\"overflow:visible\">\n            <defs>\n              <linearGradient id=\"slIdealGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                <stop offset=\"0%\" stop-color=\"#497faa\" stop-opacity=\"0.15\"/>\n                <stop offset=\"100%\" stop-color=\"#497faa\" stop-opacity=\"0.03\"/>\n              <\u002FlinearGradient>\n            <\u002Fdefs>\n            <rect x=\"0\" y=\"${slH-(9/slMax)*slH}\" width=\"${slW}\" height=\"${((9-7)/slMax)*slH}\" fill=\"url(#slIdealGrad)\" rx=\"2\"/>\n            ${slBars}\n            <text x=\"${slW}\" y=\"${slH-(7/slMax)*slH}\" text-anchor=\"end\" font-size=\"8\" fill=\"#497faa\" opacity=\".7\" font-family=\"var(--font)\">7h<\u002Ftext>\n            <text x=\"${slW}\" y=\"${slH-(9/slMax)*slH-2}\" text-anchor=\"end\" font-size=\"8\" fill=\"#497faa\" opacity=\".7\" font-family=\"var(--font)\">9h<\u002Ftext>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        ${sleepFilled.length===0?`<div style=\"font-size:11px;color:var(--tx3);text-align:center;margin-top:6px\">Sin datos de sueño — usa los selectores de horas en la tabla de abajo<\u002Fdiv>`:''}\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n\n  html+=`<\u002Fdiv>`;\n  c.innerHTML=html;\n}\n\n\n// ══════════════════════════════════════════════════════\n// HABIT NOTES — Block editor per habit (Vision-style)\n// ══════════════════════════════════════════════════════\nconst HTN_IDB_KEY='sp6_htn'; // {habitId: [{id,type,content/items/icon}]}\nlet _htnData={}; // loaded async\nlet _htnOpen=new Set();\nlet _htnDrag={active:false};\n\n// Load / save via IndexedDB\nasync function htnLoad(){\n  _htnData=await idbR
